[package]
name = "michiclaude"
version = "0.1.2"
description = "Widget de bandeja para Windows: cuota real de Claude (5h/semanal), coste por proyecto y modelo más usado."
authors = ["Oscar Orozco"]
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
name = "michiclaude_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
# "Copiar comando" de la tarjeta de intención (docs/remediacion.md etapa 1c):
# escribe al portapapeles SOLO al clic del usuario. Sin wrapper npm — el
# panel lo invoca directo (plugin:clipboard-manager|write_text).
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chrono = "0.4"
dirs = "5"
# Avisos al celular (ntfy): el topic es una contraseña → CSPRNG del sistema,
# y el QR se genera como matriz (sin features = sin dependencia de imagen;
# el panel lo pinta en un canvas).
getrandom = "0.2"
qrcode = { version = "0.14", default-features = false }

# Solo Windows: rectángulo real de la barra de tareas + estilo no-activable de la franja.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
