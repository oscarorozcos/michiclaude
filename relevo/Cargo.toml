[package]
name = "michi"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Relevo de MichiClaude: envuelve Claude Code en una ConPTY para poder aplicar /compact y /clear sin teclear encima del usuario."

[[bin]]
name = "michi"
path = "src/main.rs"

[dependencies]
# ConPTY. Es la ÚNICA dependencia de peso y vive SOLO en este crate: la app
# de Tauri no gana nada (invariante #4). Se escribe contra la abstracción
# portable a propósito — en Mac/Linux la PTY es nativa y el relevo portaría
# casi gratis (docs/remediacion.md, "El relevo").
portable-pty = { version = "0.8", default-features = false }
serde_json = "1"

# Modo crudo de la consola y tamaño de la ventana. Mismas features mínimas
# que ya usa la app: no descarga nada nuevo.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
