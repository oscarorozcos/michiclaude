<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Claude Code Meter — card</title>
<style>
  /* Globo de diálogo del gatito — construido con la retícula medida por
     Oscar sobre su maqueta (lienzo 474x438, globo 310x195, ritmo vertical
     55px, padding 20/23), escalada x0.948 a esta ventana de 294x218.
     Ventana FIJA (nunca se redimensiona; el resize rompía el pintado). */
  :root{
    --font:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
    --mono:"Cascadia Code",ui-monospace,"Consolas",monospace;
    --ink:#111; --paper:#FDFCF9; --mut:#5c5a53;
    --accent:#C15F3C; --wk:rgba(193,95,60,.55); --track:rgba(0,0,0,.1);
    --ok:#40b869; --warn:#e6a417; --bad:#f05a41;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:transparent;overflow:hidden}
  body{font-family:var(--font);color:var(--ink);user-select:none;-webkit-user-select:none;cursor:pointer}
  .bubble{position:absolute;left:0;top:0;width:294px;height:185px;
    background:var(--paper);border:3px solid var(--ink);border-radius:21px}
  /* cola: base x36-69 sobre el borde inferior, vértice hacia (58,218) */
  .tail-b{position:absolute;left:36px;top:180px;width:0;height:0;
    border-style:solid;border-width:38px 12px 0 21px;
    border-color:var(--ink) transparent transparent transparent}
  .tail-w{position:absolute;left:40px;top:177px;width:0;height:0;
    border-style:solid;border-width:30px 8px 0 15px;
    border-color:var(--paper) transparent transparent transparent}
  /* contenido: columna útil x19→275 (256px), posiciones de la retícula */
  .mk{position:absolute;left:20px;top:21px;width:15px;height:15px}
  .title{position:absolute;left:47px;top:19px;font-size:13px;font-weight:800}
  .dot{position:absolute;left:265px;top:23px;width:9px;height:9px;border-radius:50%;
    background:var(--mut);box-shadow:0 0 0 1.5px var(--ink)}
  .lab{position:absolute;left:19px;font-size:11px;font-weight:700;color:var(--ink)}
  .pct{position:absolute;right:19px;font-family:var(--mono);font-size:12px;font-weight:800}
  .track{position:absolute;left:19px;width:256px;height:6px;border-radius:3px;
    background:var(--track);overflow:hidden}
  .fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:3px;
    background:var(--accent);transition:width .4s}
  .fill.wk{background:var(--wk)}
  .rst{position:absolute;left:19px;font-family:var(--mono);font-size:10px;color:var(--accent)}
  /* retícula vertical (escala 0.948 de la maqueta): sesión y49/67/79,
     semanal y101/119/132 — ritmo de 52px entre bloques */
  #sLab{top:47px} #sPct{top:46px} #sTrack{top:67px} #sRst{top:79px}
  #wLab{top:99px} #wPct{top:98px} #wTrack{top:119px} #wRst{top:132px}
</style>
</head>
<body>
<div class="tail-b"></div><div class="tail-w"></div>
<div class="bubble"></div>
<span class="mk" id="mk"></span>
<span class="title">Claude Code</span>
<span class="dot" id="dot"></span>
<span class="lab" id="sLab">Session</span><b class="pct" id="sPct">—</b>
<div class="track" id="sTrack"><i class="fill" id="sFill"></i></div>
<span class="rst" id="sRst"></span>
<span class="lab" id="wLab">Weekly</span><b class="pct" id="wPct">—</b>
<div class="track" id="wTrack"><i class="fill wk" id="wFill"></i></div>
<span class="rst" id="wRst"></span>

<script>
const $=id=>document.getElementById(id);
const TAURI=window.__TAURI__;
const invoke=TAURI?.core?.invoke;
const EVENT=TAURI?.event;

// marca (mini sunburst) — mismo centro vertical que el punto de estado
(function(){
  const S=64,cx=32,cy=32,rays=11;let p=`<svg width="15" height="15" viewBox="0 0 ${S} ${S}">`;
  for(let i=0;i<rays;i++){const a=Math.PI*2*i/rays-Math.PI/2;
    const ux=Math.cos(a),uy=Math.sin(a),px=-uy,py=ux;
    const base=S*.04,tip=S*.46,mid=S*.26,hw=S*.055;
    const pts=[[cx+ux*base,cy+uy*base],[cx+ux*mid+px*hw,cy+uy*mid+py*hw],
      [cx+ux*tip,cy+uy*tip],[cx+ux*mid-px*hw,cy+uy*mid-py*hw]]
      .map(q=>q.map(n=>n.toFixed(2)).join(",")).join(" ");
    p+=`<polygon points="${pts}" fill="var(--accent)"/>`}
  $("mk").innerHTML=p+`<circle cx="${cx}" cy="${cy}" r="${S*.07}" fill="var(--accent)"/></svg>`;
})();

// mismo código de color de estado que el panel (solo para el punto)
function col(p,pace){ if(p>=95) return "var(--bad)";
  if(pace!=null && p>pace+8) return p>85?"var(--bad)":"var(--warn)";
  if(p>=80) return "var(--warn)"; return "var(--ok)"; }

// Pinta desde el resumen del panel (nunca llama al endpoint). % SIEMPRE enteros.
function render(d){
  if(!d || d.ok===false) return;           // conserva el último dato bueno
  if(d.labels){ $("sLab").textContent=d.labels.cardSes||"Session";
    $("wLab").textContent=d.labels.cardWeek||"Weekly"; }
  const s=d.session, w=d.weekly;
  $("sPct").textContent = s ? Math.round(s.pct)+"%" : "—";
  $("sFill").style.width = s ? Math.min(100,Math.round(s.pct))+"%" : "0";
  $("sRst").textContent = d.sesReset||"";
  $("wPct").textContent = w ? Math.round(w.pct)+"%" : "—";
  $("wFill").style.width = w ? Math.min(100,Math.round(w.pct))+"%" : "0";
  $("wRst").textContent = d.wkReset||"";
  $("dot").style.background = s ? col(Math.round(s.pct), s.pace) : "var(--mut)";
}

if(EVENT){
  EVENT.listen("quota:update", e=>render(e.payload));
  EVENT.emit("pill:ready");   // pide el último dato conocido al panel
}else{
  render({ok:true, session:{pct:39,pace:30}, weekly:{pct:25},
    sesReset:"reset en 1 h 31 min", wkReset:"reset en 31 h 1 min",
    labels:{cardSes:"Sesión",cardWeek:"Semanal"}});  // preview en navegador
}

// si el mouse entra al globo y sale, también se pliega
document.body.addEventListener("mouseleave",()=>invoke?.("hover_card",{hovering:false}));
// clic abre el panel; clic derecho oculta el widget
document.body.addEventListener("click",()=>invoke?.("show_panel"));
window.addEventListener("contextmenu",e=>{
  e.preventDefault(); invoke?.("set_pill_visible",{visible:false});
});
</script>
</body>
</html>
