<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MichiClaude — card</title>
<style>
  /* Globo de diálogo del gatito — retícula de la maqueta de Oscar (globo
     294x185, borde 3, radio 21, cola en x36 con vértice abajo). La caja se
     ANCLA ABAJO (junto a la cola) y crece hacia arriba para acomodar los
     buckets semanales extra (Fable, futuros…) que reporte el endpoint —
     filas dinámicas, nunca nombres hardcodeados. Ventana FIJA de 294x322
     (hueco de sobra arriba); nunca se redimensiona (rompía el pintado). */
  :root{
    --font:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
    --mono:"Cascadia Code",ui-monospace,"Consolas",monospace;
    --ink:#111; --paper:#FDFCF9; --mut:#5c5a53;
    --accent:#C15F3C; --wk:rgba(193,95,60,.55); --track:rgba(0,0,0,.1);
    --ok:#40b869; --warn:#e6a417; --bad:#f05a41;
  }
  /* Tema oscuro: el cómic se invierte —relleno oscuro, trazo y texto claros—
     en vez de quedarse en papel blanco, que era lo único del widget que no
     seguía al tema. Mismos tonos que el panel para que se lean como la misma
     app; el coral sube a #d97757 porque el #C15F3C se apaga sobre oscuro. */
  body.dark{--ink:#e9ebef; --paper:#20242c; --mut:#969ba6; --accent:#d97757;
    --wk:rgba(217,119,87,.5); --track:rgba(255,255,255,.1)}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:transparent;overflow:hidden}
  body{font-family:var(--font);color:var(--ink);user-select:none;-webkit-user-select:none;cursor:pointer;
    --tailx:57px}  /* la cola sigue a la cabeza del gato (evento balloon:pose) */
  .box{position:absolute;left:0;right:0;bottom:33px;background:var(--paper);
    border:3px solid var(--ink);border-radius:21px;padding:15px 19px 13px;
    display:flex;flex-direction:column;gap:9px}
  /* pose "down": el gato está pegado al borde superior — el globo va DEBAJO
     y la cola se voltea hacia arriba */
  body.down .box{bottom:auto;top:33px}
  .head{display:flex;align-items:center;gap:9px}
  .mk{width:15px;height:15px;flex:0 0 auto}
  .title{font-size:13px;font-weight:800;flex:1 1 auto;white-space:nowrap}
  .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;
    background:var(--mut);box-shadow:0 0 0 1.5px var(--ink)}
  .blk{display:flex;flex-direction:column;gap:4px}
  /* sin esta regla, display:flex anula al atributo hidden (misma trampa
     que el 10bis del panel) */
  .blk[hidden]{display:none}
  .r{display:flex;justify-content:space-between;align-items:baseline}
  .lab{font-size:11.5px;font-weight:700}
  .pct{font-family:var(--mono);font-size:12.5px;font-weight:800}
  .track{position:relative;height:6px;border-radius:3px;background:var(--track);overflow:hidden}
  .fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:3px;
    background:var(--accent);transition:width .4s}
  .fill.wk{background:var(--wk)}
  .rst{font-family:var(--mono);font-size:10px;color:var(--accent)}
  /* motivo del "sin datos": qué pasa y qué hacer, en vez de un — mudo */
  #why{font-size:10.5px;color:var(--mut);margin-top:6px;line-height:1.35}
  #extras{display:flex;flex-direction:column;gap:9px}
  #extras:empty{display:none}
  /* cola: vértice en var(--tailx), apuntando al gato (abajo por defecto) */
  .tail-b{position:absolute;left:calc(var(--tailx) - 21px);bottom:0;width:0;height:0;
    border-style:solid;border-width:38px 12px 0 21px;
    border-color:var(--ink) transparent transparent transparent}
  .tail-w{position:absolute;left:calc(var(--tailx) - 17px);bottom:6px;width:0;height:0;
    border-style:solid;border-width:30px 8px 0 15px;
    border-color:var(--paper) transparent transparent transparent}
  body.down .tail-b{bottom:auto;top:0;border-width:0 12px 38px 21px;
    border-color:transparent transparent var(--ink) transparent}
  body.down .tail-w{bottom:auto;top:6px;border-width:0 8px 30px 15px;
    border-color:transparent transparent var(--paper) transparent}
</style>
</head>
<body>
<div class="box">
  <div class="head">
    <span class="mk" id="mk"></span>
    <span class="title">MichiClaude</span>
    <span class="dot" id="dot"></span>
  </div>
  <div class="blk">
    <div class="r"><span class="lab" id="sLab">Session</span><b class="pct" id="sPct">—</b></div>
    <div class="track"><i class="fill" id="sFill"></i></div>
    <div class="rst" id="sRst"></div>
  </div>
  <!-- presión de contexto de la sesión activa (docs/remediacion.md etapa 1):
       el número del manómetro de la cápsula, con barra y proyecto. Solo
       aparece con una sesión de Claude Code trabajando. -->
  <div class="blk" id="pBlk" hidden>
    <div class="r"><span class="lab" id="pLab">Context pressure</span><b class="pct" id="pPct">—</b></div>
    <div class="track"><i class="fill" id="pFill"></i></div>
    <div class="rst" id="pProj"></div>
  </div>
  <div class="blk">
    <div class="r"><span class="lab" id="wLab">Weekly</span><b class="pct" id="wPct">—</b></div>
    <div class="track"><i class="fill wk" id="wFill"></i></div>
    <div class="rst" id="wRst"></div>
  </div>
  <div id="extras"></div>
  <div id="why" hidden></div>
</div>
<div class="tail-b"></div><div class="tail-w"></div>

<script>
const $=id=>document.getElementById(id);
const TAURI=window.__TAURI__;
const invoke=TAURI?.core?.invoke;
const EVENT=TAURI?.event;

// marca (mini sunburst) — mismo centro vertical que el punto de estado
(function(){
  const S=64,cx=32,cy=32,rays=11;let p=`<svg width="15" height="15" viewBox="0 0 ${S} ${S}">`;
  for(let i=0;i<rays;i++){const a=Math.PI*2*i/rays-Math.PI/2;
    const ux=Math.cos(a),uy=Math.sin(a),px=-uy,py=ux;
    const base=S*.04,tip=S*.46,mid=S*.26,hw=S*.055;
    const pts=[[cx+ux*base,cy+uy*base],[cx+ux*mid+px*hw,cy+uy*mid+py*hw],
      [cx+ux*tip,cy+uy*tip],[cx+ux*mid-px*hw,cy+uy*mid-py*hw]]
      .map(q=>q.map(n=>n.toFixed(2)).join(",")).join(" ");
    p+=`<polygon points="${pts}" fill="var(--accent)"/>`}
  $("mk").innerHTML=p+`<circle cx="${cx}" cy="${cy}" r="${S*.07}" fill="var(--accent)"/></svg>`;
})();

// mismo código de color de estado que el panel (solo para el punto)
function col(p,pace){ if(p>=95) return "var(--bad)";
  if(pace!=null && p>pace+8) return p>85?"var(--bad)":"var(--warn)";
  if(p>=80) return "var(--warn)"; return "var(--ok)"; }

// Pinta desde el resumen del panel (nunca llama al endpoint). % SIEMPRE enteros.
function render(d){
  if(!d) return;
  // el tema se aplica SIEMPRE, incluso con la lectura en error: el globo debe
  // seguir al panel aunque conserve el último dato bueno
  const skin=d.skinTheme||d.theme;   // el usuario puede soltarlo del panel
  if(skin) document.body.classList.toggle("dark", skin!=="light");
  if(d.ok===false){
    // conserva el último dato bueno, pero DICE por qué no hay uno fresco
    if(d.reason){ $("why").textContent=d.reason; $("why").hidden=false; }
    return;
  }
  $("why").hidden=true;
  if(d.labels){ $("sLab").textContent=d.labels.cardSes||"Session";
    $("wLab").textContent=d.labels.cardWeek||"Weekly"; }
  const s=d.session, w=d.weekly;
  $("sPct").textContent = s ? Math.round(s.pct)+"%" : "—";
  $("sFill").style.width = s ? Math.min(100,Math.round(s.pct))+"%" : "0";
  $("sRst").textContent = d.sesReset||"";
  $("wPct").textContent = w ? Math.round(w.pct)+"%" : "—";
  $("wFill").style.width = w ? Math.min(100,Math.round(w.pct))+"%" : "0";
  $("wRst").textContent = d.wkReset||"";
  // presión de contexto: umbrales propios 60/85 (no son los de ritmo)
  const pr=d.press;
  $("pBlk").hidden=!pr;
  if(pr){
    if(d.labels&&d.labels.press) $("pLab").textContent=d.labels.press;
    $("pPct").textContent=pr.pct+"%";
    $("pFill").style.width=Math.min(100,pr.pct)+"%";
    $("pFill").style.background=pr.pct>=85?"var(--bad)":pr.pct>=60?"var(--warn)":"var(--ok)";
    $("pProj").textContent=pr.proj||"";
  }
  $("dot").style.background = s ? col(Math.round(s.pct), s.pace) : "var(--mut)";
  // buckets semanales extra (Fable, futuros…): filas dinámicas con la
  // etiqueta tal cual la reporta el endpoint (textContent = sin HTML)
  const ex=$("extras"); ex.innerHTML="";
  (d.extras||[]).slice(0,2).forEach(e=>{
    const pct=Math.round(e.pct);
    const div=document.createElement("div"); div.className="blk";
    div.innerHTML=`<div class="r"><span class="lab"></span><b class="pct">${pct}%</b></div>
      <div class="track"><i class="fill wk" style="width:${Math.min(100,pct)}%"></i></div>
      <div class="rst"></div>`;
    div.querySelector(".lab").textContent=e.label||"";
    div.querySelector(".rst").textContent=e.resets||"";
    ex.appendChild(div);
  });
}

if(EVENT){
  EVENT.listen("quota:update", e=>render(e.payload));
  // el backend avisa la pose (arriba/abajo) y dónde debe caer la cola
  EVENT.listen("balloon:pose", e=>{
    const p=e.payload||{};
    document.body.classList.toggle("down", p.pose==="down");
    if(p.tailx!=null) document.body.style.setProperty("--tailx", p.tailx+"px");
  });
  EVENT.emit("pill:ready");   // pide el último dato conocido al panel
}else{
  render({ok:true, session:{pct:51,pace:30}, weekly:{pct:26},
    sesReset:"reset en 19 min", wkReset:"reset en 29 h 49 min",
    press:{pct:64, proj:"demo"},
    extras:[{label:"Semanal · Fable", pct:23, resets:"reset en 29 h 49 min"}],
    labels:{cardSes:"Sesión",cardWeek:"Semanal",press:"Presión de contexto"}});  // preview en navegador
}

// si el mouse entra al globo y sale, también se pliega
document.body.addEventListener("mouseleave",()=>invoke?.("hover_card",{hovering:false}));
// clic abre el panel (y este globo se pliega); clic derecho oculta el widget
document.body.addEventListener("click",()=>{
  invoke?.("hover_card",{hovering:false});
  invoke?.("show_panel");
});
window.addEventListener("contextmenu",e=>{
  e.preventDefault(); invoke?.("set_pill_visible",{visible:false});
});
</script>
</body>
</html>
