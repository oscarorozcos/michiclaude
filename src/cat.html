<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MichiClaude — cat</title>
<style>
  /* Widget mascota: el gatito SUSTITUYE a la pastilla. Una zona invisible
     sobre la cabeza abre el panel; la laptop solo arrastra.
     Hover → globo de diálogo (ventana 'card').
     Estética cómic a juego con el gato: papel y trazo se invierten con el
     tema (claro = blanco/negro, oscuro = oscuro/claro).

     COLUMNA (de abajo arriba, 2026-08-11): gato → BOMBILLA de presión de
     contexto → cápsula del % de sesión. Antes la presión era un manómetro de
     arco de 13 px metido en la cápsula: se veía, pero no se LEÍA de un
     vistazo. La primera versión traía globo de pensamiento y una franja de
     48 px de ventana extra; se devolvieron el mismo día (bombilla pequeña y
     suelta): cabía todo, y esa franja transparente se tragaba clics. */
  :root{
    --font:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
    --mono:"Cascadia Code",ui-monospace,"Consolas",monospace;
    --ink:#111; --paper:#FDFCF9; --brand:#d97757;
    --ok:#40b869; --warn:#e6a417; --bad:#f05a41;
    /* turquesa del post-it de consejos, PROFUNDO a propósito: con el
       #2ea3b4 anterior el número blanco daba ~2.7:1 de contraste y no se
       leía (lo notó Oscar 2026-08-04); este da ~4.7:1. */
    --acc:#128097;
    /* paleta de la bombilla: el filamento se apaga de ámbar a gris y el
       vidrio se agrisa. Son tonos PROPIOS (no --warn/--bad) a propósito: aquí
       el ámbar significa ENCENDIDA, no alarma; la alarma la da la forma
       —garabato roto, grieta— y la grieta sí usa --bad. */
    --idea:#e08a3c; --idea-dim:#cf8a3e; --idea-dark:#a98330; --idea-dead:#8a929a;
    /* el VIDRIO se enfría de cálido a gris. A este tamaño es lo que más se
       lee: los rayitos y el filamento son detalle, la temperatura del cristal
       se ve de reojo. */
    --glass:#ffeed4; --glass1:#f7ecdd; --glass2:#eeece8; --glass3:#e2e4e8;
    --base:#d8ccae; --base-off:#b3b9bf;
    /* zona de clic sobre la CABEZA del gato (abre el panel). Rectángulo
       invisible; el resto de la ventana —laptop y márgenes— solo arrastra.
       Para calibrarla: pinta .head con background:rgba(255,0,0,.25).
       RECALIBRADA 2026-08-04 midiendo los píxeles blancos del gif (la
       original se pasaba 6% por la derecha y por arriba sobre el teclado
       y el vacío, y dejaba fuera cachete izquierdo y barbilla — lo notó
       Oscar). Cabeza medida: x[50%,86.5%] y[53%,87.5%] del ESCENARIO. */
    --hx:50%; --hy:52%; --hw:37%; --hh:36%;
    /* post-it de hallazgos nuevos pegado en la tapa de la laptop, lado
       izquierdo (iterado con Oscar en capturas, 2026-07-29). Variables
       para recalibrar sin tocar nada más, como la zona de la cabeza. */
    --bx:11%; --by:50%; --bs:20px;
  }
  /* Tema oscuro: el cómic se invierte —relleno oscuro, trazo y texto claros—
     en vez de quedarse en papel blanco, que era lo único del widget que no
     seguía al tema. Mismos tonos que el panel para que se lean como la misma
     app; el coral sube a #d97757 porque el #C15F3C se apaga sobre oscuro. */
  body.dark{--paper:#20242c; --ink:#e9ebef;
    --idea:#f5b942; --idea-dim:#d9a04a; --idea-dark:#a8823a; --idea-dead:#79828c;
    /* en oscuro el vidrio se oscurece con el tema, pero SIEMPRE separado del
       trazo: lo que la hace legible sobre cualquier escritorio es la tinta
       gruesa y la sombra, como en el gato */
    --glass:#4d3f27; --glass1:#443a29; --glass2:#3a4049; --glass3:#30353e;
    --base:#5a6373; --base-off:#434a56}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:transparent;overflow:hidden}
  body{font-family:var(--font);cursor:grab;user-select:none;-webkit-user-select:none}
  body:active{cursor:grabbing}
  /* EL ESCENARIO DEL GATO: 210x157 pegado al fondo, o sea la ventana entera
     hoy. Existe para que el gato quede ANCLADO ABAJO — de él cuelga todo lo
     calibrado en porcentajes (el recorte de los gifs, la zona de la cabeza,
     los post-its), así que si la ventana vuelve a crecer por arriba ninguno
     de esos números cambia de significado. Se ganó el sitio el día que creció
     y volvió a encoger; sale gratis y ahorra esa recalibración. */
  .stage{position:absolute;left:0;right:0;bottom:0;height:157px}
  /* RECORTE por CSS del margen transparente de los gifs (medido con
     gifbbox: unión visible de los 3 estados = x[19,374] y[0,265] de 400².
     El ESCENARIO es 210x157 (proporción 710x531); el img se escala y desplaza
     para que esa caja llene el escenario — así el globo/chip/logo quedan
     pegados al gato y los 3 gifs no saltan entre sí. NO editar los gifs.
     El recorte va en PORCENTAJES a propósito: por eso sobrevivió intacto
     cuando el arte se reescaló de 800² a 400² el 2026-07-29 (medían 19 veces
     los píxeles que se ven en pantalla y costaban ~90 MB de RAM). Si algún
     día se vuelve a reescalar, estos números no se tocan. */
  .cat{position:absolute;width:112.7%;height:150.7%;left:-5.5%;top:0;
    display:block;-webkit-user-drag:none;filter:drop-shadow(0 3px 6px rgba(0,0,0,.22))}
  /* EXCEPCIÓN: cat-break-black.gif se exportó en un lienzo distinto al de los
     otros siete (era 1411x860; tras el reescalado del 2026-07-29 es 706x430,
     frente a los 400² de los demás). Es el MISMO dibujo a otra escala (la
     proporción de su caja visible coincide con la del cat-break-white al
     0.11%), así que se recoloca por CSS para que el gato caiga donde cae en
     los demás estados; nada de editar el gif. Medido: visible x[8,691]
     y[37,401] de 706x430. Si algún día se reexporta alineado con los demás,
     BORRAR esta regla. */
  .cat.odd-canvas{width:86.89%;height:70.84%;left:0.50%;top:33.47%}
  /* Retícula de la maqueta 304x219 de Oscar, escalada x0.691 a 210x157. */
  /* zona invisible sobre la cabeza del gato: es el "botón" que abre el
     panel (sustituye al sticker). Todo lo demás de la ventana arrastra. */
  .head{position:absolute;left:var(--hx);top:var(--hy);width:var(--hw);height:var(--hh);
    border:0;background:transparent;padding:0;cursor:pointer;z-index:3}
  /* cápsula "Sesión 39%": stadium (radio = altura/2) posada sobre la cabeza
     del gato y ladeada +15.5° para seguir la tapa de la laptop — su sitio de
     siempre. Con la bombilla en pantalla sube (`body.hasidea`) para hacerle
     hueco, y vuelve sola cuando no hay sesión que medir: el widget no debe
     dejar un agujero donde había algo. Se oculta mientras está desplegado el
     globo del hover o la ficha de contexto. */
  .plabel{position:absolute;left:72.4%;top:37.9%;
    transform:translate(-50%,-50%) rotate(15.5deg);
    display:flex;align-items:baseline;gap:4px;white-space:nowrap;
    background:var(--paper);border:1.5px solid var(--ink);border-radius:999px;
    padding:2px 10px;z-index:3;transition:opacity .15s,top .18s ease-out;
    box-shadow:0 1px 3px rgba(0,0,0,.25)}
  body.hasidea .plabel{top:20%}
  .plabel .lab{font-size:10.5px;font-weight:600;color:var(--ink)}
  .plabel b{font-family:var(--mono);font-size:13px;font-weight:800;color:var(--ink)}
  /* BOMBILLA DE PRESIÓN DE CONTEXTO (docs/remediacion.md etapa 1). Sustituye
     al manómetro de arco de 13 px que vivía dentro de la cápsula: la misma
     cifra, contada como dibujo que se degrada. Cuatro niveles por `data-lvl`
     con los MISMOS umbrales que tenía el arco (60 ámbar, 85 rojo) más un paso
     en 40 para que el cambio se vea ANTES de que importe, y CADA nivel con su
     propio movimiento: respira, titila, tiembla, se apaga humeando.
     Va sobre el eje de la CABEZA (68%, no el 72.4% de la cápsula) y casi
     posada en ella: repartida por el hueco se leía como tres cosas sueltas;
     pegada al gato se lee como suya (calibrado con Oscar 2026-08-11).
     Solo aparece con
     sesión activa (hit `press`); sin ella, el gatito queda como siempre.
     Sin globo de pensamiento y sin fondo: flota sobre el escritorio, así que
     lo que la hace legible sobre cualquier fondo es lo mismo que al gato —
     trazo grueso de tinta y sombra propia. */
  .idea{position:absolute;left:68%;top:47px;transform:translateX(-50%);
    width:34px;height:44px;z-index:3;transition:opacity .15s;cursor:default;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
  .idea svg{display:block;width:100%;height:100%}
  /* piezas de la bombilla; las que son de un nivel concreto llevan .lv */
  .idea .lv{display:none}
  .idea[data-lvl="0"] .l0,
  .idea[data-lvl="1"] .l1,
  .idea[data-lvl="2"] .l2,
  .idea[data-lvl="3"] .l3{display:block}
  .glow{fill:var(--idea);opacity:.2;transform-box:fill-box;transform-origin:center;
    animation:breathe 3.4s ease-in-out infinite}
  .rays{fill:none;stroke:var(--idea);stroke-width:2;stroke-linecap:round;
    transform-box:fill-box;transform-origin:center;
    animation:breathe 3.4s ease-in-out infinite}
  .rays.dim{stroke:var(--idea-dim);opacity:.75;animation:none}
  .glass{fill:var(--glass);stroke:var(--ink);stroke-width:2.6}
  .base{fill:var(--base);stroke:var(--ink);stroke-width:2.2}
  .baseln{stroke:var(--ink);stroke-width:1.3}
  /* el vidrio se enfría y el casquillo se apaga al degradarse la idea */
  .idea[data-lvl="1"] .glass{fill:var(--glass1)}
  .idea[data-lvl="2"] .glass{fill:var(--glass2)}
  .idea[data-lvl="3"] .glass{fill:var(--glass3)}
  .idea[data-lvl="2"] .base,.idea[data-lvl="3"] .base{fill:var(--base-off)}
  /* punto en el casquillo = esta sesión tiene RELEVO (lo mismo que el punto
     del manómetro de la pastilla; ver pill.html) */
  .rly{fill:var(--ink)}
  .fil{fill:none;stroke-linecap:round;stroke-width:2.4}
  .f0{stroke:var(--idea)}
  .f1{stroke:var(--idea-dim);animation:flick 2.6s infinite}
  .f2{stroke:var(--idea-dark);stroke-width:2.2}
  .f3{stroke:var(--idea-dead);stroke-width:2.2}
  .crack{fill:none;stroke:var(--bad);stroke-width:1.8;stroke-linecap:round;
    animation:alarm 1.6s ease-in-out infinite}
  .smoke{fill:none;stroke:var(--idea-dead);stroke-width:2;stroke-linecap:round;
    opacity:.6;transform-box:fill-box;transform-origin:center;
    animation:smoke 2.8s ease-out infinite}
  /* temblor del filamento cuando la idea ya no se sostiene (niveles 2 y 3) */
  .jit{transform-box:fill-box;transform-origin:center;animation:jit .45s steps(2) infinite}
  @keyframes jit{0%{transform:translate(0,0) rotate(0)}
    25%{transform:translate(.5px,-.5px) rotate(3deg)}
    50%{transform:translate(-.5px,.5px) rotate(-2deg)}
    75%{transform:translate(.5px,.5px) rotate(1.5deg)}
    100%{transform:translate(0,0)}}
  @keyframes breathe{0%,100%{opacity:.2;transform:scale(1)}
    50%{opacity:.34;transform:scale(1.06)}}
  @keyframes flick{0%,42%,52%,78%,88%,100%{opacity:1}46%{opacity:.3}82%{opacity:.45}}
  @keyframes alarm{0%,100%{opacity:1}55%{opacity:.4}}
  @keyframes smoke{0%{opacity:0;transform:translateY(3px) scale(.9)}
    35%{opacity:.6}100%{opacity:0;transform:translateY(-4px) scale(1.1)}}
  /* FICHA DE CONTEXTO: al pasar el mouse por la bombilla. Vive aquí y no en el
     globo del resumen porque son dos cosas distintas —aquello es la CUOTA del
     plan, esto la sesión que tienes abierta— y mezclarlas obligaba a abrir el
     resumen entero para mirar un número. Ocupa la banda de la cápsula, que se
     aparta mientras tanto: en 210 px no caben las dos. */
  .ptip{display:none;position:absolute;left:50%;top:4px;transform:translateX(-50%);
    max-width:198px;background:var(--paper);border:1.5px solid var(--ink);
    border-radius:9px;padding:3px 8px 4px;z-index:5;
    box-shadow:0 2px 4px rgba(0,0,0,.3)}
  .ptip .pl{display:flex;align-items:baseline;gap:4px;white-space:nowrap}
  .ptip b{font-family:var(--mono);font-size:12px;font-weight:800;color:var(--ink)}
  .ptip .lab{font-size:10px;font-weight:600;color:var(--ink)}
  .ptip i{display:block;font-style:normal;font-size:9.5px;color:var(--ink);
    opacity:.75;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* el :not() evita depender del ORDEN de las reglas: con el globo del
     resumen abierto la ficha no sale aunque el mouse esté sobre la bombilla.
     Y la clase del BODY se llama distinto que la del elemento a propósito: con
     las dos como `ptip`, el selector `.ptip{display:none}` casaba también con
     el <body> y apagaba el widget ENTERO al pasar el mouse. */
  body.showtip:not(.hovering) .ptip{display:block}
  /* INVARIANTE 10bis, ahora también aquí: cualquier regla con `display`
     anula a [hidden] en silencio. Pasó el 2026-08-08 — la cuenta atrás del
     automático (.m.auto / .pauto) traía display propio, escrito DESPUÉS de
     las reglas por clase de abajo, y se quedaba pegada como un círculo
     ámbar vacío en la cápsula. Con la global no puede repetirse. */
  [hidden]{display:none !important}
  /* con el globo del resumen desplegado se apartan las dos: baja justo
     encima de la cabeza y las taparía a medias (y el % de sesión ya va
     dentro). Con la ficha de contexto abierta se aparta solo la cápsula:
     comparten banda, y la bombilla es justo lo que estás señalando. */
  body.hovering .plabel,body.hovering .idea,body.showtip .plabel{opacity:0}
  /* invisible NO es inerte: sin esto, el hover seguía cazando la bombilla
     transparente por debajo del globo y abría la ficha detrás de él */
  body.hovering .idea{pointer-events:none}
  /* Al arrancar (o sin token) todavía no hay % que enseñar. Mejor que el
     gatito salga solo a que enseñe una cápsula vacía, que parece un error. */
  body.nodata .plabel{display:none}
  /* POST-IT cómic de hallazgos NUEVOS pegado en la tapa: una PILITA — dos
     notas asoman por detrás (ámbar y papel, cada una con su giro) y encima
     el post-it rojo ladeado con su cinta adhesiva, número blanco y
     translúcido (iterado con Oscar 2026-07-29: rojo fijo, sin tinte por
     severidad — esa vive en las tarjetas y en el contador de la pestaña).
     Solo aparece cuando el panel avisa (hasfnd); clic = panel en Hallazgos. */
  .fstack{position:absolute;left:var(--bx);top:var(--by);width:var(--bs);height:var(--bs);
    display:none;opacity:.78;transition:opacity .15s;cursor:pointer;z-index:4}
  .fstack:hover{opacity:1}
  body.hasfnd .fstack{display:block}
  /* las orillas de los otros post-its, encimados por detrás */
  .fstack i{position:absolute;inset:0;border:1.6px solid var(--ink);
    border-radius:2px}
  .fn1{background:var(--warn);transform:translate(3.5px,2.5px) rotate(7deg)}
  .fn2{background:var(--paper);transform:translate(-2.5px,3.5px) rotate(-15deg)}
  .fbadge{position:absolute;inset:0;border:1.6px solid var(--ink);
    border-radius:2px;background:var(--bad);color:#fff;
    font-family:var(--mono);font-weight:800;font-size:10.5px;
    display:flex;align-items:center;justify-content:center;padding:0;
    transform:rotate(-6deg);cursor:pointer;
    box-shadow:0 2px 3px rgba(0,0,0,.3)}
  /* la cinta adhesiva: tirita clara cruzando el borde de arriba */
  .fbadge::after{content:"";position:absolute;top:-3.5px;left:50%;
    width:11px;height:5px;transform:translateX(-50%) rotate(3deg);
    background:rgba(255,255,255,.6);border:1px solid var(--ink);
    border-radius:1px}
  /* post-it ACENTO de consejos, asomado junto a la pilita roja: consejo,
     no alarma (rojo = hallazgos). Solo con aviso del coach (hastip);
     clic = panel directo en Consejos. */
  /* tamaño y separación subidos el 2026-08-04 (Oscar: se veía chiquito y
     muy pegado a la pilita roja cuando salen los dos juntos) */
  .tstack{position:absolute;left:calc(var(--bx) + var(--bs)*1.8);
    top:calc(var(--by) + var(--bs)*0.5);width:calc(var(--bs)*.95);
    height:calc(var(--bs)*.95);display:none;opacity:.78;
    transition:opacity .15s;cursor:pointer;z-index:4}
  .tstack:hover{opacity:1}
  body.hastip .tstack{display:block}
  /* pilita también aquí (Oscar 2026-08-04): dos orillas asoman por detrás,
     como en la de hallazgos — una sola nota se leía como cuadrito */
  .tstack i{position:absolute;inset:0;border:1.6px solid var(--ink);
    border-radius:2px}
  .tn1{background:var(--warn);transform:translate(2.5px,2px) rotate(-8deg)}
  .tn2{background:var(--paper);transform:translate(-2px,2.5px) rotate(14deg)}
  .tbadge{position:absolute;inset:0;border:1.6px solid var(--ink);
    border-radius:2px;background:var(--acc);color:#fff;
    font-family:var(--mono);font-weight:800;font-size:10.5px;
    display:flex;align-items:center;justify-content:center;padding:0;
    transform:rotate(9deg);cursor:pointer;
    box-shadow:0 2px 3px rgba(0,0,0,.3)}
  /* su cinta adhesiva, como la del post-it rojo (pedida por Oscar
     2026-07-31: sin ella parecía un cuadrito, no una nota) */
  .tbadge::after{content:"";position:absolute;top:-3.5px;left:50%;
    width:9px;height:4.5px;transform:translateX(-50%) rotate(-4deg);
    background:rgba(255,255,255,.6);border:1px solid var(--ink);
    border-radius:1px}
  .pauto{display:inline-flex;align-items:center;justify-content:center;
    min-width:20px;height:16px;padding:0 5px;margin-left:4px;border-radius:999px;
    background:var(--warn);color:#1a1206;font-weight:700;font-size:10.5px;
    font-variant-numeric:tabular-nums}
  .pauto.bad{background:var(--bad);color:#fff}
  .pauto.good{background:var(--ok);color:#04231a}
</style>
</head>
<body class="nodata">
<!-- el gato y todo lo calibrado sobre él, en su escenario de 210x157 -->
<div class="stage">
  <img class="cat" id="cat" src="cat-black.gif" alt="" draggable="false">
  <button class="head" id="head" aria-label="MichiClaude"></button>
  <div class="fstack" id="fstack"><i class="fn2"></i><i class="fn1"></i><button class="fbadge" id="fbadge">!</button></div>
  <div class="tstack" id="tstack"><i class="tn2"></i><i class="tn1"></i><button class="tbadge" id="tbadge">!</button></div>
</div>
<!-- BOMBILLA: la presión de contexto. Va suelta sobre el escritorio (sin
     globo de pensamiento), entre la cápsula y la cabeza del gato. El hueco de
     la izquierda queda libre para las llamas del estado 'fire' y el de la
     derecha para las Z del 'zzz'. -->
<div class="idea" id="idea" data-lvl="0" hidden>
  <svg viewBox="0 0 40 52">
    <circle class="lv l0 glow" cx="20" cy="19" r="17"/>
    <g class="lv l0 rays"><line x1="20" y1="3.5" x2="20" y2="0.5"/><line x1="9" y1="8" x2="6.9" y2="5.9"/><line x1="31" y1="8" x2="33.1" y2="5.9"/><line x1="4.5" y1="19" x2="1.5" y2="19"/><line x1="35.5" y1="19" x2="38.5" y2="19"/></g>
    <g class="lv l1 rays dim"><line x1="20" y1="3.5" x2="20" y2="1.5"/><line x1="9" y1="8" x2="7.3" y2="6.3"/><line x1="31" y1="8" x2="32.7" y2="6.3"/></g>
    <circle class="glass" cx="20" cy="19" r="13"/>
    <rect class="base" x="14" y="30" width="12" height="9" rx="2"/>
    <line class="baseln" x1="15" y1="33" x2="25" y2="33"/>
    <circle class="rly" id="ideaRly" cx="20" cy="36.3" r="1.9" hidden/>
    <!-- el filamento: bucle limpio → onda → maraña → dos trozos sueltos -->
    <path class="lv l0 fil f0" d="M13,20 C13,11 27,11 27,20 C27,25 20,25 20,20"/>
    <path class="lv l1 fil f1" d="M13,21 q3,-9 7,-4 q4,5 7,-5"/>
    <path class="lv l2 fil f2 jit" d="M12,22 q5,-10 9,-3 q-5,3 -1,7 q6,1 3,-6 q-3,-5 -8,1"/>
    <path class="lv l3 fil f3 jit" d="M13,17 l4,4 l-3,3 l5,3 M22,16 l-2,8"/>
    <path class="lv l3 crack" d="M20,7 l-3,6 l4,3 l-3,6"/>
    <path class="lv l3 smoke" d="M28,11 q4,-2 3,-6"/>
  </svg>
</div>
<!-- ficha de contexto: sale al pasar el mouse por la bombilla -->
<div class="ptip" id="ptip" aria-hidden="true">
  <span class="pl"><b id="ptipPct">—</b><span class="lab" id="ptipLab"></span></span>
  <i id="ptipProj"></i>
</div>
<div class="plabel"><span class="lab" id="chipLab"></span><b id="chipPct"></b>
  <span class="pauto" id="cAuto" hidden><b id="cNum"></b></span>
</div>
<script>
// Nunca llama al endpoint: escucha el resumen que emite el panel.
const $=id=>document.getElementById(id);
const TAURI=window.__TAURI__;
const invoke=TAURI?.core?.invoke;
const EVENT=TAURI?.event;
const APPWIN=TAURI?.window?TAURI.window.getCurrentWindow():null;
// Dos temas independientes (los elige el usuario en Preferencias):
//   curArt  → qué gif se usa (oscuro *-black / claro *-white)
//   curSkin → color de la cápsula del %, que va con los globos
// Si el panel es viejo y solo manda `theme`, ambos caen a ese valor.
let curArt="dark", curSkin="dark", curMascot="normal";
function catSrc(){
  const base = curMascot==="fire"  ? "cat-fire"
             : curMascot==="break" ? "cat-break"
             : curMascot==="zzz"   ? "cat-zzz" : "cat";
  return base + (curArt==="light" ? "-white.gif" : "-black.gif");
}
function syncArt(){
  const g=catSrc(); if($("cat").getAttribute("src")!==g) $("cat").setAttribute("src",g);
  $("cat").classList.toggle("odd-canvas", g==="cat-break-black.gif");  // ver CSS
}
// si falta el arte de un estado, el gato vuelve al normal en vez de quedarse
// invisible (una ventana transparente sin imagen no se ve por ningún lado)
$("cat").addEventListener("error",()=>{
  const fb = curArt==="light" ? "cat-white.gif" : "cat-black.gif";
  $("cat").classList.remove("odd-canvas");
  if($("cat").getAttribute("src")!==fb) $("cat").setAttribute("src",fb);
});

// mismo código de color de estado que el panel (para el % del chip)
function col(p,pace){ if(p>=95) return "var(--bad)";
  if(pace!=null && p>pace+8) return p>85?"var(--bad)":"var(--warn)";
  if(p>=80) return "var(--warn)"; return "var(--ink)"; }

function apply(d){
  if(!d) return;
  // "Sesión" con mayúscula en la cápsula (misma etiqueta que el globo)
  if(d.labels) $("chipLab").textContent=d.labels.cardSes||d.labels.ses||"Session";
  // sin title/tooltip nativo: la info completa vive en el globo del hover
  const art=d.artTheme||d.theme, skin=d.skinTheme||d.theme;
  if(art)  curArt  = art==="light"  ? "light" : "dark";
  if(skin) curSkin = skin==="light" ? "light" : "dark";
  document.body.classList.toggle("dark", curSkin!=="light");   // cápsula
  if(d.mascot) curMascot = d.mascot;
  syncArt();
  // sticker de hallazgos: va ANTES del early-return de ok:false — un fallo
  // pasajero de la cuota no debe apagar un aviso que sigue pendiente
  const f=d.fnd;
  document.body.classList.toggle("hasfnd", !!f);
  if(f){
    $("fbadge").textContent = f.n>9 ? "9+" : String(f.n);
    $("fbadge").title = f.tip||"";
  }
  // post-it acento del coach: mismo trato que el de hallazgos
  const tc=d.coach;
  document.body.classList.toggle("hastip", !!tc);
  if(tc){
    $("tbadge").textContent = tc.n>9 ? "9+" : String(tc.n);
    $("tbadge").title = tc.tip||"";
  }
  // bombilla de contexto: también antes del early-return (la presión sale de
  // los logs, no del endpoint — un fallo de la cuota no debe apagarla).
  // Umbrales: los MISMOS 60/85 que usaba el manómetro de arco, con un paso
  // extra en 40 que solo cambia el dibujo. Sin hit `press` no hay sesión
  // activa que medir y el globo entero desaparece.
  const pr=d.press;
  $("idea").hidden=!pr;
  // la cápsula baja a su sitio de siempre cuando no hay bombilla que alojar
  document.body.classList.toggle("hasidea", !!pr);
  if(!pr) document.body.classList.remove("showtip");
  if(pr){
    const p=Math.round(pr.pct);
    $("idea").dataset.lvl = p>=85?"3":p>=60?"2":p>=40?"1":"0";
    // ficha del hover: el número y el proyecto que antes iban en el globo del
    // resumen. Con relevo se DICE (el punto del casquillo solo insinúa).
    $("ptipPct").textContent=p+"%";
    if(d.labels&&d.labels.press) $("ptipLab").textContent=d.labels.press;
    $("ptipProj").textContent=(pr.proj||"")+(pr.relay?" · "+(d.labels?.relay||"relay"):"");
    $("ptipProj").hidden=!$("ptipProj").textContent;
    // OJO, `toggleAttribute` y no `.hidden`: la propiedad `hidden` vive en
    // HTMLElement y este punto es un <circle> SVG — asignarla ahí crea una
    // propiedad suelta en JS y NO toca el atributo, así que el punto se
    // quedaría escondido para siempre. Comprobado en Chromium: `hidden` no
    // está en SVGElement.prototype. El CSS sí funciona ([hidden] es un
    // selector de ATRIBUTO y le da igual el namespace).
    $("ideaRly").toggleAttribute("hidden", !pr.relay);
  }
  if(d.ok===false) return;                 // conserva el último % bueno
  const s=d.session;
  if(!s) return;                           // aún sin cuota: cápsula oculta
  document.body.classList.remove("nodata");
  $("chipPct").textContent = Math.round(s.pct)+"%";
  $("chipPct").style.color = col(Math.round(s.pct), s.pace);
}

if(EVENT){
  EVENT.listen("quota:update", e=>apply(e.payload));
  // Cuenta atrás del automático (3c-2): mientras corre, tocar al gatito PARA.
  EVENT.listen("relay:auto", e=>{
    const a=e.payload;
    $("cAuto").hidden=!a;
    document.body.classList.toggle("autorun",!!a && !a.mark);
    if(a){
      // el veredicto cierra la cuenta: ✓ aplicado, ✕ el relevo se negó. Una
      // cuenta atrás que acaba en silencio deja al usuario adivinando.
      $("cNum").textContent = a.mark==="ok" ? "✓" : a.mark==="err" ? "✕" : a.left;
      $("cAuto").classList.toggle("bad", a.mark==="err");
      $("cAuto").classList.toggle("good", a.mark==="ok");
    }
  });
  EVENT.emit("pill:ready");   // pide el último dato conocido al panel
}

// hover: tras una pausa breve aparece el globo de diálogo (y la cápsula del
// % se oculta para no duplicar la info); al salir, se pliega y vuelve
let hoverT=null;
function foldBubble(){
  clearTimeout(hoverT);
  document.body.classList.remove("hovering");
  invoke?.("hover_card",{hovering:false});
  // si había una alarma pendiente, su globo vuelve (el panel la re-muestra)
  EVENT?.emit("notif:ready");
}
// el hover que abre el globo vive SOLO en la cabeza del gato (Oscar
// 2026-08-04: pasar el mouse por la laptop no debe desplegar el resumen).
// Salir de la VENTANA entera lo pliega — así el globo no parpadea al
// cruzar de la cabeza a la laptop.
$("head").addEventListener("mouseenter",()=>{
  clearTimeout(hoverT);
  hoverT=setTimeout(()=>{
    document.body.classList.add("hovering");
    invoke?.("hover_card",{hovering:true});
  },300);
});
// rozar la cabeza <300ms y seguir a la laptop NO debe disparar el globo
// tarde: el temporizador se cancela al salir de la cabeza (si el globo ya
// está abierto, se queda hasta salir de la ventana)
$("head").addEventListener("mouseleave",()=>clearTimeout(hoverT));
document.body.addEventListener("mouseleave",()=>{ foldBubble(); hideTip(); });

// hover sobre la BOMBILLA → ficha de contexto (número y proyecto). Es una capa
// dentro de esta misma ventana, no otra ventana: cada WebView2 cuesta ~57 MB de
// piso y esto es una etiqueta. Espera menos que el globo del resumen (120 ms):
// el blanco es pequeño, y si ya apuntaste ahí es que lo estabas buscando.
let tipT=null;
function hideTip(){ clearTimeout(tipT); document.body.classList.remove("showtip"); }
$("idea").addEventListener("mouseenter",()=>{
  clearTimeout(tipT);
  tipT=setTimeout(()=>document.body.classList.add("showtip"),120);
});
$("idea").addEventListener("mouseleave",hideTip);

// la LAPTOP y los márgenes son asa de arrastre (se puede llevar a cualquier
// parte); al empezar a arrastrar, el globo se pliega. La cabeza queda fuera:
// ahí el clic abre el panel, así que no debe iniciar arrastre.
document.body.addEventListener("mousedown",e=>{
  if(e.button!==0 || e.target.closest("#head")) return;
  foldBubble();
  APPWIN?.startDragging();
});
// Con la cuenta atrás del automático en marcha, cualquier clic en el gatito
// la PARA y no hace nada más. Se pone en captura para ganarle a todos los
// demás manejadores: recuperar el control no puede depender de acertar la
// zona correcta.
document.addEventListener("click",e=>{
  if(!document.body.classList.contains("autorun")) return;
  e.stopPropagation(); e.preventDefault();
  EVENT?.emit("relay:stop");
},true);
// clic en la cabeza del gato = abrir el panel (el globo se pliega antes)
$("head").addEventListener("mousedown",e=>e.stopPropagation());
$("head").addEventListener("click",e=>{
  e.stopPropagation(); foldBubble(); invoke?.("show_panel");
});
// clic en la pilita de post-its = abrir el panel directo en Hallazgos (el
// panel escucha panel:findings; al pintarse las tarjetas el aviso se apaga).
// Va en el contenedor para que las orillas que asoman también sean botón.
$("fstack").addEventListener("mousedown",e=>e.stopPropagation());
$("fstack").addEventListener("click",e=>{
  e.stopPropagation(); foldBubble();
  EVENT?.emit("panel:findings"); invoke?.("show_panel");
});
// clic en el post-it acento = abrir el panel directo en Consejos
$("tstack").addEventListener("mousedown",e=>e.stopPropagation());
$("tstack").addEventListener("click",e=>{
  e.stopPropagation(); foldBubble();
  EVENT?.emit("panel:tips"); invoke?.("show_panel");
});
// clic derecho oculta el widget (se reactiva desde Preferencias o el tray)
window.addEventListener("contextmenu",e=>{
  e.preventDefault(); invoke?.("set_pill_visible",{visible:false});
});
</script>
</body>
</html>
