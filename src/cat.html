<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MichiClaude — cat</title>
<style>
  /* Widget mascota: el gatito SUSTITUYE a la pastilla. Sobre el gif van un
     chip con el % de sesión (con etiqueta, para que se entienda) y el botón
     del logo que abre el panel. Hover → globo de diálogo (ventana 'card').
     Estética cómic (blanco + trazo negro) a juego con el gato, en ambos temas. */
  :root{
    --font:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
    --mono:"Cascadia Code",ui-monospace,"Consolas",monospace;
    --ink:#111; --paper:#FDFCF9; --brand:#d97757;
    --ok:#40b869; --warn:#e6a417; --bad:#f05a41;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:transparent;overflow:hidden}
  body{font-family:var(--font);cursor:grab;user-select:none;-webkit-user-select:none}
  body:active{cursor:grabbing}
  /* RECORTE por CSS del margen transparente de los gifs (medido con
     gifbbox: unión visible de los 3 estados = x[39,748] y[0,530] de 800².
     La ventana es 210x157 (proporción 710x531); el img se escala y desplaza
     para que esa caja llene la ventana — así el globo/chip/logo quedan
     pegados al gato y los 3 gifs no saltan entre sí. NO editar los gifs. */
  .cat{position:absolute;width:112.7%;height:150.7%;left:-5.5%;top:0;
    display:block;-webkit-user-drag:none;filter:drop-shadow(0 3px 6px rgba(0,0,0,.22))}
  /* Retícula de la maqueta 304x219 de Oscar, escalada x0.691 a 210x157. */
  /* sticker (sticker-black/white.png según tema) centrado en la pantalla
     de la laptop; sigue siendo el botón que abre el panel */
  .logo{position:absolute;left:22.7%;top:58.5%;width:24px;height:24px;
    border:0;background:transparent;padding:0;cursor:pointer;z-index:3;
    filter:drop-shadow(0 1px 2px rgba(0,0,0,.3))}
  .logo:hover{transform:scale(1.15)}
  .logo img{width:100%;height:100%;object-fit:contain;display:block;
    -webkit-user-drag:none;opacity:.55;transition:opacity .15s}
  .logo:hover img{opacity:1}
  /* cápsula "sesión 39%" flotando sobre la cabeza del gato: stadium
     (radio = altura/2) rotada +15.5°, rótulo anclado al gato (deliberado).
     Se oculta mientras el globo del hover está desplegado. */
  .plabel{position:absolute;left:72.4%;top:37.9%;
    transform:translate(-50%,-50%) rotate(15.5deg);
    display:flex;align-items:baseline;gap:4px;white-space:nowrap;
    background:var(--paper);border:1.5px solid var(--ink);border-radius:999px;
    padding:2px 10px;z-index:3;transition:opacity .15s;
    box-shadow:0 1px 3px rgba(0,0,0,.25)}
  .plabel .lab{font-size:10.5px;font-weight:600;color:var(--ink)}
  .plabel b{font-family:var(--mono);font-size:13px;font-weight:800;color:var(--ink)}
  body.hovering .plabel{opacity:0}
</style>
</head>
<body>
<img class="cat" id="cat" src="cat-black.gif" alt="" draggable="false">
<button class="logo" id="logo"><img id="logoImg" src="sticker-black.png" alt="" draggable="false"></button>
<div class="plabel"><span class="lab" id="chipLab">session</span><b id="chipPct">—</b></div>
<script>
// Nunca llama al endpoint: escucha el resumen que emite el panel.
const $=id=>document.getElementById(id);
const TAURI=window.__TAURI__;
const invoke=TAURI?.core?.invoke;
const EVENT=TAURI?.event;
const APPWIN=TAURI?.window?TAURI.window.getCurrentWindow():null;
// arte por TEMA: oscuro → *-black, claro → *-white (gifs y sticker)
let curTheme="dark", curMascot="normal";
function catSrc(){
  const base = curMascot==="fire" ? "cat-fire" : curMascot==="zzz" ? "cat-zzz" : "cat";
  return base + (curTheme==="light" ? "-white.gif" : "-black.gif");
}
function stickerSrc(){ return curTheme==="light" ? "sticker-white.png" : "sticker-black.png"; }
function syncArt(){
  const g=catSrc(); if($("cat").getAttribute("src")!==g) $("cat").setAttribute("src",g);
  const st=stickerSrc(); const im=$("logoImg");
  if(im && im.getAttribute("src")!==st) im.setAttribute("src",st);
}

// mismo código de color de estado que el panel (para el % del chip)
function col(p,pace){ if(p>=95) return "var(--bad)";
  if(pace!=null && p>pace+8) return p>85?"var(--bad)":"var(--warn)";
  if(p>=80) return "var(--warn)"; return "var(--ink)"; }

function apply(d){
  if(!d) return;
  // "Sesión" con mayúscula en la cápsula (misma etiqueta que el globo)
  if(d.labels) $("chipLab").textContent=d.labels.cardSes||d.labels.ses||"Session";
  // sin title/tooltip nativo: la info completa vive en el globo del hover
  if(d.theme) curTheme = d.theme==="light" ? "light" : "dark";
  if(d.mascot) curMascot = d.mascot;
  syncArt();
  if(d.ok===false) return;                 // conserva el último % bueno
  const s=d.session;
  $("chipPct").textContent = s ? Math.round(s.pct)+"%" : "—";
  $("chipPct").style.color = s ? col(Math.round(s.pct), s.pace) : "var(--ink)";
}

if(EVENT){
  EVENT.listen("quota:update", e=>apply(e.payload));
  EVENT.emit("pill:ready");   // pide el último dato conocido al panel
}

// hover: tras una pausa breve aparece el globo de diálogo (y la cápsula del
// % se oculta para no duplicar la info); al salir, se pliega y vuelve
let hoverT=null;
function foldBubble(){
  clearTimeout(hoverT);
  document.body.classList.remove("hovering");
  invoke?.("hover_card",{hovering:false});
  // si había una alarma pendiente, su globo vuelve (el panel la re-muestra)
  EVENT?.emit("notif:ready");
}
document.body.addEventListener("mouseenter",()=>{
  clearTimeout(hoverT);
  hoverT=setTimeout(()=>{
    document.body.classList.add("hovering");
    invoke?.("hover_card",{hovering:true});
  },300);
});
document.body.addEventListener("mouseleave",foldBubble);

// el gatito entero es asa de arrastre (se puede llevar a cualquier parte);
// al empezar a arrastrar, el globo se pliega
document.body.addEventListener("mousedown",e=>{
  if(e.button!==0 || e.target.closest("#logo")) return;
  foldBubble();
  APPWIN?.startDragging();
});
// el botón del sticker abre el panel; el globo se pliega mientras tanto
$("logo").addEventListener("mousedown",e=>e.stopPropagation());
$("logo").addEventListener("click",e=>{
  e.stopPropagation(); foldBubble(); invoke?.("show_panel");
});
// clic derecho oculta el widget (se reactiva desde Preferencias o el tray)
window.addEventListener("contextmenu",e=>{
  e.preventDefault(); invoke?.("set_pill_visible",{visible:false});
});
</script>
</body>
</html>
