<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Claude Code Meter — cat</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:transparent;overflow:hidden}
  body{cursor:grab;user-select:none;-webkit-user-select:none}
  body:active{cursor:grabbing}
  img{width:100%;height:100%;object-fit:contain;display:block;-webkit-user-drag:none;
    filter:drop-shadow(0 3px 6px rgba(0,0,0,.22))}
</style>
</head>
<body>
<img id="cat" src="cat.gif" alt="" draggable="false">
<script>
// Mascota del widget: vive en su PROPIA ventana fija encima de la pastilla
// (redimensionar la ventana de la pastilla dejaba el WebView sin pintar).
// Nunca llama al endpoint: escucha el resumen que emite el panel.
const TAURI=window.__TAURI__;
const invoke=TAURI?.core?.invoke;
const EVENT=TAURI?.event;
const APPWIN=TAURI?.window?TAURI.window.getCurrentWindow():null;
const GIF={normal:"cat.gif",fire:"cat-fire.gif",zzz:"cat-zzz.gif"};
function apply(d){
  if(!d || !d.mascot) return;             // en errores transitorios conserva el estado
  const g=GIF[d.mascot]||"cat.gif";
  const el=document.getElementById("cat");
  if(el.getAttribute("src")!==g) el.setAttribute("src",g);
}
if(EVENT){
  EVENT.listen("quota:update", e=>apply(e.payload));
  EVENT.emit("pill:ready");   // pide el último dato conocido al panel
}
// el gatito entero es ASA DE ARRASTRE: mueve el conjunto (la pastilla lo
// sigue desde el backend vía el evento Moved). Para abrir el panel, clic en
// la pastilla. Clic derecho oculta el widget.
document.body.addEventListener("mousedown",e=>{
  if(e.button===0) APPWIN?.startDragging();
});
window.addEventListener("contextmenu",e=>{
  e.preventDefault(); invoke?.("set_pill_visible",{visible:false});
});
</script>
</body>
</html>
