<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Claude Code Meter — widget</title>
<style>
  :root{
    --font:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
    --mono:"Cascadia Code",ui-monospace,"Consolas",monospace;
    --bg:#181a20; --stroke:rgba(255,255,255,.12);
    --txt:#e9ebef; --txt-dim:#7b818c;
    --brand:#d97757; --track:rgba(255,255,255,.16);
    --ok:#40b869; --warn:#e6a417; --bad:#f05a41; --dim:#9aa0aa;
  }
  body.light{
    --bg:#f3f4f7; --stroke:rgba(0,0,0,.14);
    --txt:#1b1e24; --txt-dim:#8a909b; --track:rgba(0,0,0,.12);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:transparent;overflow:hidden}
  body{font-family:var(--font);color:var(--txt);user-select:none;-webkit-user-select:none}

  .pill{display:flex;align-items:center;gap:8px;height:100%;padding:0 10px 0 4px;
    background:var(--bg);border:1px solid var(--stroke);border-radius:12px;cursor:pointer}
  .grip{width:14px;height:70%;display:grid;place-items:center;color:var(--txt-dim);
    cursor:grab;font-size:11px;letter-spacing:-1px}
  .grip:active{cursor:grabbing}
  .mk{width:16px;height:16px;flex:0 0 auto;display:block}
  .ses{font-family:var(--mono);font-weight:700;font-size:14px;letter-spacing:.3px;white-space:nowrap}
  .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;background:var(--txt-dim)}
  .grp{display:flex;align-items:center;gap:4px;flex:0 0 auto}
  .grp .tag{font-size:9px;font-weight:700;color:var(--txt-dim)}
  .grp .track{position:relative;width:30px;height:5px;border-radius:3px;background:var(--track);overflow:hidden}
  .grp .fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:3px;
    background:var(--ok);transition:width .5s,background .3s}
  body.loading .ses,body.stale .ses{color:var(--txt-dim)}
  body.stale .dot{background:var(--bad)}

  /* ---- diseño "coral" opcional: % grande + barras etiquetadas + tarjeta al
     hover. Tokens: oscuro "Grafito" / claro "Papel", acento coral de la
     marca; el estado (verde/ámbar/rojo) vive en el punto de la tarjeta. */
  body.coral{ --bg:rgba(23,23,27,.92); --stroke:rgba(255,255,255,.14);
    --txt:#F5F4F2; --txt-dim:#96948E; --track:rgba(255,255,255,.15);
    --accent:#D97757; --wk:rgba(217,119,87,.55); }
  body.coral.light{ --bg:rgba(252,251,248,.94); --stroke:rgba(0,0,0,.13);
    --txt:#26251F; --txt-dim:#6F6D66; --track:rgba(0,0,0,.12);
    --accent:#C15F3C; --wk:rgba(193,95,60,.5); }
  body.coral .pill{gap:9px;border-radius:14px}
  body.coral .ses{font-size:16px}
  body.coral .dot{display:none}
  body.coral .grp{flex-direction:column;align-items:flex-start;gap:2px}
  body.coral .grp .tag{font-size:9px;font-weight:600;letter-spacing:.2px;text-transform:none}
  body.coral .grp .track{width:52px;height:4px}
  body.coral .dot+.grp{border-left:1px solid var(--stroke);padding-left:9px}
</style>
</head>
<body class="loading">
<div class="pill" id="pill">
  <span class="grip" id="grip" title="⠿">⠿</span>
  <span class="mk" id="mk"></span>
  <span class="ses" id="ses">…</span>
  <span class="dot" id="dot"></span>
  <div class="grp"><span class="tag" id="sTag">S</span><div class="track"><div class="fill" id="sFill"></div></div></div>
  <div class="grp"><span class="tag" id="wTag">W</span><div class="track"><div class="fill" id="wFill"></div></div></div>
</div>

<script>
const $=id=>document.getElementById(id);
const TAURI=window.__TAURI__;
const invoke=TAURI?.core?.invoke;
const EVENT=TAURI?.event;
const APPWIN=TAURI?.window?TAURI.window.getCurrentWindow():null;

// marca (mini sunburst, igual que el panel)
(function(){
  const S=64,cx=32,cy=32,rays=11;let p=`<svg width="16" height="16" viewBox="0 0 ${S} ${S}">`;
  for(let i=0;i<rays;i++){const a=Math.PI*2*i/rays-Math.PI/2;
    const ux=Math.cos(a),uy=Math.sin(a),px=-uy,py=ux;
    const base=S*.04,tip=S*.46,mid=S*.26,hw=S*.055;
    const pts=[[cx+ux*base,cy+uy*base],[cx+ux*mid+px*hw,cy+uy*mid+py*hw],
      [cx+ux*tip,cy+uy*tip],[cx+ux*mid-px*hw,cy+uy*mid-py*hw]]
      .map(q=>q.map(n=>n.toFixed(2)).join(",")).join(" ");
    p+=`<polygon points="${pts}" fill="var(--brand)"/>`}
  $("mk").innerHTML=p+`<circle cx="${cx}" cy="${cy}" r="${S*.07}" fill="var(--brand)"/></svg>`;
})();

// mismo código de color que el panel (pct vs ritmo)
function col(p,pace){ if(p>=95) return "var(--bad)";
  if(pace!=null && p>pace+8) return p>85?"var(--bad)":"var(--warn)";
  if(p>=80) return "var(--warn)"; return "var(--ok)"; }
function setFill(el,pct,pace){
  if(pct==null){ el.style.width="0"; return; }
  el.style.width=Math.min(100,pct)+"%"; el.style.background=col(pct,pace);
}

// Renderiza desde el resumen que emite el panel (nunca llama al endpoint).
// Los porcentajes SIEMPRE enteros (Math.round).
function render(d){
  document.body.classList.remove("loading");
  document.body.classList.toggle("light", d?.theme==="light");
  // diseño (clásico/coral): solo se toca si viene en el dato
  if(d && d.design!==undefined){
    const coral=d.design==="coral";
    document.body.classList.toggle("coral", coral);
    curDesign=coral?"coral":"classic";
    $("sTag").textContent=coral?((d.labels&&d.labels.ses)||"session"):"S";
    $("wTag").textContent=coral?((d.labels&&d.labels.week)||"week"):"W";
  }
  if(!d || d.ok===false){
    document.body.classList.add("stale");
    $("ses").textContent="—"; $("dot").style.background="";
    setFill($("sFill"),null); setFill($("wFill"),null); return;
  }
  document.body.classList.remove("stale");
  const s=d.session, w=d.weekly;
  $("ses").textContent = s ? Math.round(s.pct)+"%" : "—";
  $("dot").style.background = s ? col(Math.round(s.pct), s.pace) : "var(--txt-dim)";
  setFill($("sFill"), s?Math.round(s.pct):null, s?s.pace:null);
  setFill($("wFill"), w?Math.round(w.pct):null, null);
  // en coral las barras van SIEMPRE en acento (el estado vive en la tarjeta)
  if(document.body.classList.contains("coral")){
    $("sFill").style.background="var(--accent)";
    $("wFill").style.background="var(--wk)";
  }
  if(d.tip) $("pill").title=d.tip;
}

let curDesign="classic";
if(EVENT){
  // diseño inmediato al cargar, sin esperar el primer dato del panel
  if(invoke){ invoke("get_pill_design").then(dsn=>{
    curDesign=dsn==="coral"?"coral":"classic";
    document.body.classList.toggle("coral", curDesign==="coral");
  }).catch(()=>{}); }
  EVENT.listen("quota:update", e=>render(e.payload));
  EVENT.emit("pill:ready");   // pide el último dato conocido al panel
}else{
  render({ok:true, design:"coral", session:{pct:23,pace:30}, weekly:{pct:23},
    labels:{ses:"sesión",week:"semana"}});  // preview en navegador
}

// hover (solo diseño coral): tras una pausa breve, la tarjeta expandida
// sustituye a la pastilla; la pausa evita disparos al pasar de largo o al
// iniciar un arrastre desde el asa
let hoverT=null;
$("pill").addEventListener("mouseenter",()=>{
  if(curDesign!=="coral") return;
  clearTimeout(hoverT);
  hoverT=setTimeout(()=>invoke?.("hover_card",{hovering:true}),350);
});
$("pill").addEventListener("mouseleave",()=>clearTimeout(hoverT));

// arrastre solo desde el asa ⠿ (clic en el resto abre el panel)
let dragging=false;
$("grip").addEventListener("mousedown",e=>{
  if(e.button!==0) return;
  clearTimeout(hoverT);
  e.stopPropagation(); dragging=true;
  APPWIN?.startDragging();
  setTimeout(()=>{ dragging=false; invoke?.("pill_moved"); },600);
});
$("pill").addEventListener("click",e=>{
  if(dragging || e.target.id==="grip") return;
  invoke?.("show_panel");
});
// clic derecho: ocultar el widget (se reactiva desde ⚙ Preferencias o el menú del tray)
window.addEventListener("contextmenu",e=>{
  e.preventDefault(); invoke?.("set_pill_visible",{visible:false});
});
</script>
</body>
</html>
