<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Claude Code Meter — widget</title>
<style>
  :root{
    --font:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
    --mono:"Cascadia Code",ui-monospace,"Consolas",monospace;
    --bg:#181a20; --stroke:rgba(255,255,255,.12);
    --ok:#40b869; --warn:#e6a417; --bad:#f05a41; --dim:#9aa0aa;
    /* la "pantalla" del laptop del gif es clara SIEMPRE (colores horneados en
       el gif), así que el texto sobre ella es oscuro en ambos temas */
    --scr-ink:#2a2f39; --scr-track:rgba(0,0,0,.16);
    /* zona de la pantalla del laptop dentro de la tarjeta (ajustable) */
    --sx:14%; --sy:27%; --sw:38%;
  }
  body.light{ --bg:#f3f4f7; --stroke:rgba(0,0,0,.14); }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:transparent;overflow:hidden}
  body{font-family:var(--font);user-select:none;-webkit-user-select:none}

  /* tarjeta: escena del gato Bongo de fondo, métricas superpuestas */
  .pill{position:relative;height:100%;border-radius:14px;overflow:hidden;cursor:pointer;
    background:var(--bg) url("bongo.gif") center/cover no-repeat;
    border:1px solid var(--stroke)}

  /* métricas dibujadas sobre la pantalla del laptop */
  .screen{position:absolute;left:var(--sx);top:var(--sy);width:var(--sw);
    display:flex;flex-direction:column;gap:3px;align-items:flex-start;pointer-events:none}
  .ses{font-family:var(--mono);font-weight:700;font-size:15px;letter-spacing:.3px;
    line-height:1;color:var(--ok);text-shadow:0 1px 2px rgba(255,255,255,.85)}
  .grp{display:flex;align-items:center;gap:4px;width:100%}
  .grp .tag{font-size:9px;font-weight:800;color:var(--scr-ink);width:8px;flex:0 0 auto;
    text-shadow:0 1px 2px rgba(255,255,255,.85)}
  .grp .track{position:relative;flex:1 1 auto;height:5px;border-radius:3px;
    background:var(--scr-track);overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.4)}
  .grp .fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:3px;
    background:var(--ok);transition:width .5s,background .3s}

  /* asa de arrastre (esquina) y punto de estado */
  .grip{position:absolute;left:5px;top:3px;width:15px;height:15px;display:grid;
    place-items:center;color:rgba(0,0,0,.4);font-size:11px;letter-spacing:-1px;
    cursor:grab;z-index:3;text-shadow:0 1px 1px rgba(255,255,255,.6)}
  .grip:active{cursor:grabbing}
  .dot{position:absolute;right:6px;top:6px;width:8px;height:8px;border-radius:50%;
    z-index:3;background:var(--ok);box-shadow:0 0 0 1px rgba(255,255,255,.5)}
  body.loading .ses{color:var(--scr-ink)}
  body.stale .dot{background:var(--bad)}
</style>
</head>
<body class="loading">
<div class="pill" id="pill">
  <span class="grip" id="grip" title="⠿">⠿</span>
  <span class="dot" id="dot"></span>
  <div class="screen">
    <span class="ses" id="ses">…</span>
    <div class="grp"><span class="tag">S</span><div class="track"><div class="fill" id="sFill"></div></div></div>
    <div class="grp"><span class="tag">W</span><div class="track"><div class="fill" id="wFill"></div></div></div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const TAURI=window.__TAURI__;
const invoke=TAURI?.core?.invoke;
const EVENT=TAURI?.event;
const APPWIN=TAURI?.window?TAURI.window.getCurrentWindow():null;

// mismo código de color que el panel (pct vs ritmo)
function col(p,pace){ if(p>=95) return "var(--bad)";
  if(pace!=null && p>pace+8) return p>85?"var(--bad)":"var(--warn)";
  if(p>=80) return "var(--warn)"; return "var(--ok)"; }
function setFill(el,pct,pace){
  if(pct==null){ el.style.width="0"; return; }
  el.style.width=Math.min(100,pct)+"%"; el.style.background=col(pct,pace);
}

// Renderiza desde el resumen que emite el panel (nunca llama al endpoint).
// Los porcentajes SIEMPRE enteros (Math.round).
function render(d){
  document.body.classList.remove("loading");
  document.body.classList.toggle("light", d?.theme==="light");
  if(!d || d.ok===false){
    document.body.classList.add("stale");
    $("ses").textContent="—"; $("ses").style.color=""; $("dot").style.background="";
    setFill($("sFill"),null); setFill($("wFill"),null); return;
  }
  document.body.classList.remove("stale");
  const s=d.session, w=d.weekly;
  $("ses").textContent = s ? Math.round(s.pct)+"%" : "—";
  $("ses").style.color = s ? col(Math.round(s.pct), s.pace) : "var(--scr-ink)";
  $("dot").style.background = s ? col(Math.round(s.pct), s.pace) : "var(--dim)";
  setFill($("sFill"), s?Math.round(s.pct):null, s?s.pace:null);
  setFill($("wFill"), w?Math.round(w.pct):null, null);
  if(d.tip) $("pill").title=d.tip;
}

if(EVENT){
  EVENT.listen("quota:update", e=>render(e.payload));
  EVENT.emit("pill:ready");   // pide el último dato conocido al panel
}else{
  render({ok:true, session:{pct:44,pace:30}, weekly:{pct:10}});  // preview en navegador
}

// arrastre solo desde el asa ⠿ (clic en el resto abre el panel)
let dragging=false;
$("grip").addEventListener("mousedown",e=>{
  if(e.button!==0) return;
  e.stopPropagation(); dragging=true;
  APPWIN?.startDragging();
  setTimeout(()=>{ dragging=false; invoke?.("pill_moved"); },600);
});
$("pill").addEventListener("click",e=>{
  if(dragging || e.target.id==="grip") return;
  invoke?.("show_panel");
});
// clic derecho: ocultar el widget (se reactiva desde ⚙ Preferencias o el menú del tray)
window.addEventListener("contextmenu",e=>{
  e.preventDefault(); invoke?.("set_pill_visible",{visible:false});
});
</script>
</body>
</html>
