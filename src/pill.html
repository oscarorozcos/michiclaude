<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MichiClaude — widget</title>
<style>
  /* Pastilla compacta (rediseño 2026-07-27, maqueta de Oscar): cápsula de
     cristal con borde de acento, la marca, el % de sesión y hasta dos
     porcentajes más con icono — semanal y el bucket semanal por modelo, que
     es VARIABLE (Fable hoy, lo que salga mañana): el icono se queda, el
     modelo cambia. Al hacer clic se despliega el detalle, que vive en OTRA
     ventana (pcard): esta nunca se redimensiona, porque redimensionar una
     ventana transparente en vivo deja a WebView2 sin pintar.
     Los iconos son SVG aquí dentro; nada se descarga de fuera. */
  :root{
    --font:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
    --glass:rgba(15,19,26,.74); --line:rgba(86,199,214,.5);
    --shadow:0 0 6px rgba(86,199,214,.3), inset 0 1px 0 rgba(255,255,255,.06);
    --txt:#cfd8e0; --txt-strong:#eef3f8; --dim:#6b7783;
    --brand:#d97757;
    --acc:#56c7d6;   /* = tag "Suscripción" del panel */
    --ok:#40b869; --warn:#e6a417; --bad:#f05a41;
  }
  body.light{
    --glass:rgba(255,255,255,.84); --line:rgba(11,124,140,.42);
    --shadow:0 2px 6px rgba(11,124,140,.22), inset 0 1px 0 rgba(255,255,255,.7);
    --txt:#42505b; --txt-strong:#0f1b26; --dim:#8a95a1;
    --acc:#0b7c8c;   /* = pestaña activa del panel */
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:transparent;overflow:hidden}
  body{font-family:var(--font);color:var(--txt);user-select:none;-webkit-user-select:none}

  /* sin backdrop-filter: la ventana es transparente, así que detrás no hay
     nada que desenfocar — el alfa del fondo ya deja ver el escritorio */
  /* la caja se mete 6 px: pegada al borde, el halo se cortaba en recto y se
     veían dos esquinas rectangulares sobre el escritorio (2026-07-27) */
  .cap{display:flex;align-items:center;gap:7px;margin:6px;height:44px;padding:0 10px 0 5px;
    background:var(--glass);border:1px solid var(--line);border-radius:999px;
    box-shadow:var(--shadow);cursor:pointer;overflow:hidden}
  .grip{flex:0 0 auto;width:13px;color:var(--dim);cursor:grab;
    font-size:11px;letter-spacing:-1px;text-align:center}
  .grip:active{cursor:grabbing}
  /* margin-left:auto aquí + el auto de .chev centran el grupo (marca +
     Sesión % + campana/foco) entre el asa y la flecha: sin avisos queda
     centrado, y cuando nacen los iconos se suman al grupo y todo se
     reacomoda parejo sin brincar (pedido de Oscar 2026-07-31) */
  .mkbtn{flex:0 0 auto;width:26px;height:26px;padding:0;border:0;background:none;
    cursor:pointer;display:grid;place-items:center;margin-left:auto}
  .mkbtn img{width:26px;height:26px;object-fit:contain;display:block;
    -webkit-user-drag:none}
  .lab{font-size:13px;font-weight:500;min-width:0;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .pct{font-size:13.5px;font-weight:700;color:var(--txt-strong);white-space:nowrap}
  /* .m/.spk quedaron sin uso el 2026-07-31 (los huecos semanal y por
     modelo salieron de la cápsula); se conservan por si el detalle o un
     rediseño los retoma — son 6 líneas */
  .m{display:inline-flex;align-items:center;gap:3px;flex:0 0 auto;
    font-size:12.5px;font-weight:600;white-space:nowrap}
  .m svg{width:15px;height:15px;flex:0 0 auto}
  /* INVARIANTE 10bis, ahora también aquí: cualquier regla con `display`
     anula a [hidden] en silencio. Pasó el 2026-08-08 — la cuenta atrás del
     automático (.m.auto / .pauto) traía display propio, escrito DESPUÉS de
     las reglas por clase de abajo, y se quedaba pegada como un círculo
     ámbar vacío en la cápsula. Con la global no puede repetirse. */
  [hidden]{display:none !important}
  .m[hidden]{display:none}
  /* el bucket por modelo destella suave: recuerda que ese slot es variable */
  .spk{animation:tw 2.4s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:1}50%{opacity:.55}}
  .chev{margin-left:auto;flex:0 0 auto;width:13px;height:13px;color:var(--dim)}
  /* campana ROJA de hallazgos nuevos (maqueta de Oscar 2026-07-29: rojo
     fijo, un poco más brillante en oscuro); clic → panel directo en Hallazgos */
  .fbell{flex:0 0 auto;display:inline-flex;cursor:pointer;color:#ff5a5a}
  body.light .fbell{color:#ef4444}
  .fbell svg{width:16px;height:16px;display:block}
  .fbell[hidden]{display:none}
  /* FOCO ÁMBAR de consejos del coach (maqueta de Oscar 2026-07-31): se
     enciende cuando hay un consejo nuevo. Ámbar más oscuro en claro para
     que resalte. Clic → panel directo en Consejos. SVG inline: la fuente
     de iconos de la maqueta se descarga de fuera y la CSP no lo permite. */
  .tbulb{flex:0 0 auto;display:inline-flex;cursor:pointer;color:#fbbf24;
    filter:drop-shadow(0 0 3px rgba(251,191,36,.65))}
  body.light .tbulb{color:#e0930b;
    filter:drop-shadow(0 0 3px rgba(224,147,11,.4))}
  /* el resplandor es lo que lo hace verse PRENDIDO (validación de Oscar
     2026-07-31: solo contorno parecía apagado y perdía junto a la campana) */
  .tbulb svg{width:16px;height:16px;display:block}
  .tbulb[hidden]{display:none}
  body.loading .pct,body.stale .pct{color:var(--dim)}
  .m.auto{display:flex;align-items:center;justify-content:center;min-width:22px;
    height:18px;padding:0 6px;border-radius:999px;background:var(--warn);
    color:#1a1206;font-weight:700;font-size:11px;font-variant-numeric:tabular-nums}
  body.autorun .cap{box-shadow:0 0 0 1.5px var(--warn) inset}
  .m.auto.bad{background:var(--bad);color:#fff}
  .m.auto.good{background:var(--ok);color:#04231a}
</style>
</head>
<body class="loading">
<div class="cap" id="cap">
  <span class="grip" id="grip" title="⠿">⠿</span>
  <button class="mkbtn" id="mkbtn"><img id="mkImg" src="sticker-black.png" alt="" draggable="false"></button>
  <span class="lab" id="sesLab"></span><b class="pct" id="sPct">—</b>
  <!-- manómetro de PRESIÓN DE CONTEXTO (docs/remediacion.md etapa 1):
       arco diminuto que se llena con el % de contexto de la sesión activa.
       Solo aparece con una sesión de Claude Code bajo los dedos; sin texto
       ni tooltip (regla de la cápsula) — el número vive en el detalle. -->
  <!-- Cuenta atrás del automático (3c-2): mientras corre, la cápsula ENTERA
       es el botón de parar. Un solo control y sin texto largo: aquí no cabe.
       El segundero es la promesa de que puedes intervenir. -->
  <span class="m auto" id="aBox" hidden><b id="aNum"></b></span>
  <span class="m" id="pBox" hidden aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"
      stroke-linecap="round">
      <path d="M4 17.5a8.5 8.5 0 1 1 16 0" opacity=".28" pathLength="100"/>
      <path id="pArc" d="M4 17.5a8.5 8.5 0 1 1 16 0" pathLength="100"
        stroke-dasharray="0 100"/>
      <!-- Punto en el centro del arco = esta sesión tiene RELEVO, o sea que
           Michi puede aplicar el comando y no solo avisarte. Va dentro del
           manómetro y no al lado porque la cápsula no tiene un píxel libre;
           relleno, no trazo, para que se lea a 24 px. -->
      <circle id="pRly" cx="12" cy="15" r="2.1" fill="currentColor"
        stroke="none" hidden/>
    </svg>
  </span>
  <!-- Los huecos semanal y por-modelo se quitaron y VOLVIERON el mismo
       2026-07-31 (Oscar los extrañó a las horas): la cápsula es el
       vistazo rápido y esos dos números le faltaban. -->
  <span class="m" id="wBox" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="4" y="5" width="16" height="16" rx="2"/><path d="M16 3v4M8 3v4M4 11h16"/>
    </svg><span id="wPct"></span>
  </span>
  <span class="m" id="xBox" hidden>
    <svg class="spk" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M10 3.5 11.8 8.2 16.5 10 11.8 11.8 10 16.5 8.2 11.8 3.5 10 8.2 8.2Z"/>
      <path d="M18 4v3M19.5 5.5h-3M18 15v3M19.5 16.5h-3"/>
    </svg><span id="xPct"></span>
  </span>
  <span class="fbell" id="fdot" hidden role="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M10 5a2 2 0 1 1 4 0 7 7 0 0 1 4 6v3a4 4 0 0 0 2 3H4a4 4 0 0 0 2-3v-3a7 7 0 0 1 4-6"/>
      <path d="M9 17v1a3 3 0 0 0 6 0v-1"/>
    </svg>
  </span>
  <span class="tbulb" id="tdotc" hidden role="button" aria-label="Consejo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 12h1M12 3v1M21 12h-1M5.6 5.6l.7 .7M18.4 5.6l-.7 .7"/>
      <path d="M9 16a5 5 0 1 1 6 0a3.5 3.5 0 0 0-1 3a2 2 0 0 1-4 0a3.5 3.5 0 0 0-1-3"/>
      <path d="M9.7 17h4.6"/>
    </svg>
  </span>
  <svg class="chev" id="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M6 9l6 6 6-6"/>
  </svg>
</div>

<script>
const $=id=>document.getElementById(id);
const TAURI=window.__TAURI__;
const invoke=TAURI?.core?.invoke;
const EVENT=TAURI?.event;
const APPWIN=TAURI?.window?TAURI.window.getCurrentWindow():null;

// marca: el GATITO (sticker en variante por tema, misma regla que los gifs:
// claro → -white, oscuro → -black). Antes era el mini sunburst; se cambió a
// petición de Oscar el 2026-07-29 — la mascota ES la marca.
function syncMk(light){
  const src = light ? "sticker-white.png" : "sticker-black.png";
  if($("mkImg").getAttribute("src")!==src) $("mkImg").setAttribute("src",src);
}

// Color de los porcentajes. El verde de "todo bien" se cambió por el acento
// de la app (petición de Oscar 2026-07-27: el mismo tono del tag
// "Suscripción" en oscuro y de la pestaña activa en claro). Ámbar y rojo se
// quedan: son los que avisan de que vas por encima del ritmo.
function col(p,pace){ if(p>=95) return "var(--bad)";
  if(pace!=null && p>pace+8) return p>85?"var(--bad)":"var(--warn)";
  if(p>=80) return "var(--warn)"; return "var(--acc)"; }

// Renderiza desde el resumen que emite el panel (nunca llama al endpoint).
// Los porcentajes SIEMPRE enteros (Math.round).
function render(d){
  document.body.classList.remove("loading");
  document.body.classList.toggle("light", d?.theme==="light");
  syncMk(d?.theme==="light");
  if(d?.labels) $("sesLab").textContent=d.labels.cardSes||d.labels.ses||"Session";
  // campana de hallazgos: va ANTES del early-return de ok:false — un fallo
  // pasajero de la cuota no debe apagar un aviso que sigue pendiente
  const f=d?.fnd;
  $("fdot").hidden=!f;
  if(f) $("fdot").title=f.tip||"";
  // punto acento del coach: mismo trato que la campana
  const tc=d?.coach;
  $("tdotc").hidden=!tc;
  if(tc) $("tdotc").title=tc.tip||"";
  // manómetro de contexto: también ANTES del early-return — la presión sale
  // de los logs locales y un fallo pasajero del endpoint de cuota no la toca.
  // Umbrales propios (60/85): son de presión de contexto, no de ritmo.
  const pr=d?.press;
  $("pBox").hidden=!pr;
  if(pr){
    $("pBox").style.color = pr.pct>=85?"var(--bad)":pr.pct>=60?"var(--warn)":"var(--acc)";
    $("pArc").setAttribute("stroke-dasharray",Math.max(3,pr.pct)+" 100");
    // `toggleAttribute` y no `.hidden`: es un <circle> SVG y la propiedad
    // `hidden` solo existe en HTMLElement — asignarla no tocaba el atributo y
    // el punto del relevo no se ha enseñado nunca (cazado el 2026-08-11 al
    // repetir el patrón en el gatito).
    $("pRly").toggleAttribute("hidden", !pr.relay);
  }
  if(!d || d.ok===false){
    document.body.classList.add("stale");
    $("sPct").textContent="—"; $("wBox").hidden=true; $("xBox").hidden=true; return;
  }
  document.body.classList.remove("stale");
  const s=d.session, w=d.weekly, x=(d.extras||[])[0];
  $("sPct").textContent = s ? Math.round(s.pct)+"%" : "—";
  $("sPct").style.color = s ? col(Math.round(s.pct), s.pace) : "";
  $("wBox").hidden = !w;
  if(w){ $("wPct").textContent=Math.round(w.pct)+"%";
    $("wBox").style.color=col(Math.round(w.pct),null); }
  // tercer hueco: el bucket semanal por MODELO, que es variable — el icono se
  // queda y el modelo cambia. Si el endpoint no reporta ninguno, no se pinta.
  $("xBox").hidden = !x;
  if(x){ $("xPct").textContent=Math.round(x.pct)+"%";
    $("xBox").style.color=col(Math.round(x.pct),null); }
  // SIN tooltips nativos en la cápsula (ni title del cap ni del bucket):
  // se veían encima del detalle por hover (los quitó Oscar 2026-07-31);
  // el nombre del modelo y el resumen viven en el detalle y en el tray
}

if(EVENT){
  EVENT.listen("quota:update", e=>render(e.payload));
  // el detalle avisa cuando se cierra, para voltear la flecha
  EVENT.listen("pcard:closed", ()=>{ open=false; syncChev(); });
  // Cuenta atrás del automático. Con ella en marcha la cápsula no despliega
  // el detalle: cualquier toque PARA. Recuperar el control tiene que ser la
  // acción más fácil de la pantalla, no una que compita con otra.
  EVENT.listen("relay:auto", e=>{
    const a=e.payload;
    $("aBox").hidden=!a;
    document.body.classList.toggle("autorun",!!a && !a.mark);
    if(a){
      // el veredicto cierra la cuenta: ✓ aplicado, ✕ el relevo se negó. Una
      // cuenta atrás que acaba en silencio deja al usuario adivinando.
      $("aNum").textContent = a.mark==="ok" ? "✓" : a.mark==="err" ? "✕" : a.left;
      $("aBox").classList.toggle("bad", a.mark==="err");
      $("aBox").classList.toggle("good", a.mark==="ok");
    }
  });
  EVENT.emit("pill:ready");   // pide el último dato conocido al panel
}else{   // preview suelto en un navegador
  render({ok:true, session:{pct:6,pace:30}, weekly:{pct:35},
    extras:[{label:"Weekly · Fable",pct:28}], labels:{cardSes:"Session"},
    press:{pct:64, proj:"demo", relay:true}});
}

// clic en la cápsula = desplegar/plegar el detalle. (El hover se probó el
// 2026-07-31 y Oscar lo devolvió a clic ese mismo día — queda anotado.)
let open=false, dragging=false;
function syncChev(){ $("chev").style.transform = open?"rotate(180deg)":""; }
$("cap").addEventListener("click",e=>{
  if(dragging || e.target.closest("#grip")) return;
  // Con la cuenta atrás en marcha, CUALQUIER toque para el automático y no
  // hace nada más. Recuperar el control es lo más fácil de la pantalla.
  if(document.body.classList.contains("autorun")){ EVENT?.emit("relay:stop"); return; }
  if(e.target.closest("#mkbtn")){ invoke?.("show_panel"); return; }  // la marca abre el panel
  if(e.target.closest("#fdot")){  // la campana abre el panel YA en Hallazgos
    $("fdot").animate([{transform:"rotate(0)"},{transform:"rotate(-14deg)"},
      {transform:"rotate(12deg)"},{transform:"rotate(-6deg)"},{transform:"rotate(0)"}],
      {duration:420});
    EVENT?.emit("panel:findings"); invoke?.("show_panel"); return; }
  if(e.target.closest("#tdotc")){ // el foco abre el panel directo en Consejos
    $("tdotc").animate([{transform:"scale(1)"},{transform:"scale(1.25)"},
      {transform:"scale(1)"}],{duration:320});
    EVENT?.emit("panel:tips"); invoke?.("show_panel"); return; }
  open=!open; syncChev();
  invoke?.("toggle_pill_card",{open});
});
// arrastre solo desde el asa ⠿ (el detalle se pliega antes, no lo sigue)
$("grip").addEventListener("mousedown",e=>{
  if(e.button!==0) return;
  e.stopPropagation(); dragging=true;
  if(open){ open=false; syncChev(); invoke?.("toggle_pill_card",{open:false}); }
  APPWIN?.startDragging();
  setTimeout(()=>{ dragging=false; invoke?.("pill_moved"); },600);
});
// clic derecho: ocultar el widget (se reactiva desde Preferencias o el tray)
window.addEventListener("contextmenu",e=>{
  e.preventDefault(); invoke?.("set_pill_visible",{visible:false});
});
</script>
</body>
</html>
