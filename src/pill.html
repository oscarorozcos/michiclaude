<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MichiClaude — widget</title>
<style>
  /* Pastilla compacta (rediseño 2026-07-27, maqueta de Oscar): cápsula de
     cristal con borde de acento, la marca, el % de sesión y hasta dos
     porcentajes más con icono — semanal y el bucket semanal por modelo, que
     es VARIABLE (Fable hoy, lo que salga mañana): el icono se queda, el
     modelo cambia. Al hacer clic se despliega el detalle, que vive en OTRA
     ventana (pcard): esta nunca se redimensiona, porque redimensionar una
     ventana transparente en vivo deja a WebView2 sin pintar.
     Los iconos son SVG aquí dentro; nada se descarga de fuera. */
  :root{
    --font:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
    --glass:rgba(15,19,26,.74); --line:rgba(86,199,214,.5);
    --shadow:0 0 6px rgba(86,199,214,.3), inset 0 1px 0 rgba(255,255,255,.06);
    --txt:#cfd8e0; --txt-strong:#eef3f8; --dim:#6b7783;
    --brand:#d97757;
    --acc:#56c7d6;   /* = tag "Suscripción" del panel */
    --ok:#40b869; --warn:#e6a417; --bad:#f05a41;
  }
  body.light{
    --glass:rgba(255,255,255,.84); --line:rgba(11,124,140,.42);
    --shadow:0 2px 6px rgba(11,124,140,.22), inset 0 1px 0 rgba(255,255,255,.7);
    --txt:#42505b; --txt-strong:#0f1b26; --dim:#8a95a1;
    --acc:#0b7c8c;   /* = pestaña activa del panel */
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:transparent;overflow:hidden}
  body{font-family:var(--font);color:var(--txt);user-select:none;-webkit-user-select:none}

  /* sin backdrop-filter: la ventana es transparente, así que detrás no hay
     nada que desenfocar — el alfa del fondo ya deja ver el escritorio */
  /* la caja se mete 6 px: pegada al borde, el halo se cortaba en recto y se
     veían dos esquinas rectangulares sobre el escritorio (2026-07-27) */
  .cap{display:flex;align-items:center;gap:7px;margin:6px;height:44px;padding:0 10px 0 5px;
    background:var(--glass);border:1px solid var(--line);border-radius:999px;
    box-shadow:var(--shadow);cursor:pointer;overflow:hidden}
  .grip{flex:0 0 auto;width:13px;color:var(--dim);cursor:grab;
    font-size:11px;letter-spacing:-1px;text-align:center}
  .grip:active{cursor:grabbing}
  .mkbtn{flex:0 0 auto;width:24px;height:24px;padding:0;border:0;background:none;
    cursor:pointer;display:grid;place-items:center}
  .lab{font-size:13px;font-weight:500;min-width:0;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .pct{font-size:13.5px;font-weight:700;color:var(--txt-strong);white-space:nowrap}
  .m{display:inline-flex;align-items:center;gap:3px;flex:0 0 auto;
    font-size:12.5px;font-weight:600;white-space:nowrap}
  .m svg{width:15px;height:15px;flex:0 0 auto}
  .m[hidden]{display:none}
  /* el bucket por modelo destella suave: recuerda que ese slot es variable */
  .spk{animation:tw 2.4s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:1}50%{opacity:.55}}
  .chev{margin-left:auto;flex:0 0 auto;width:13px;height:13px;color:var(--dim)}
  body.loading .pct,body.stale .pct{color:var(--dim)}
</style>
</head>
<body class="loading">
<div class="cap" id="cap">
  <span class="grip" id="grip" title="⠿">⠿</span>
  <button class="mkbtn" id="mkbtn"><span id="mk"></span></button>
  <span class="lab" id="sesLab"></span><b class="pct" id="sPct">—</b>
  <span class="m" id="wBox" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="4" y="5" width="16" height="16" rx="2"/><path d="M16 3v4M8 3v4M4 11h16"/>
    </svg><span id="wPct"></span>
  </span>
  <span class="m" id="xBox" hidden>
    <svg class="spk" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M10 3.5 11.8 8.2 16.5 10 11.8 11.8 10 16.5 8.2 11.8 3.5 10 8.2 8.2Z"/>
      <path d="M18 4v3M19.5 5.5h-3M18 15v3M19.5 16.5h-3"/>
    </svg><span id="xPct"></span>
  </span>
  <svg class="chev" id="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M6 9l6 6 6-6"/>
  </svg>
</div>

<script>
const $=id=>document.getElementById(id);
const TAURI=window.__TAURI__;
const invoke=TAURI?.core?.invoke;
const EVENT=TAURI?.event;
const APPWIN=TAURI?.window?TAURI.window.getCurrentWindow():null;

// marca (mini sunburst, igual que el panel)
(function(){
  const S=64,cx=32,cy=32,rays=11;let p=`<svg width="22" height="22" viewBox="0 0 ${S} ${S}">`;
  for(let i=0;i<rays;i++){const a=Math.PI*2*i/rays-Math.PI/2;
    const ux=Math.cos(a),uy=Math.sin(a),px=-uy,py=ux;
    const base=S*.04,tip=S*.46,mid=S*.26,hw=S*.055;
    const pts=[[cx+ux*base,cy+uy*base],[cx+ux*mid+px*hw,cy+uy*mid+py*hw],
      [cx+ux*tip,cy+uy*tip],[cx+ux*mid-px*hw,cy+uy*mid-py*hw]]
      .map(q=>q.map(n=>n.toFixed(2)).join(",")).join(" ");
    p+=`<polygon points="${pts}" fill="var(--brand)"/>`}
  $("mk").innerHTML=p+`<circle cx="${cx}" cy="${cy}" r="${S*.07}" fill="var(--brand)"/></svg>`;
})();

// Color de los porcentajes. El verde de "todo bien" se cambió por el acento
// de la app (petición de Oscar 2026-07-27: el mismo tono del tag
// "Suscripción" en oscuro y de la pestaña activa en claro). Ámbar y rojo se
// quedan: son los que avisan de que vas por encima del ritmo.
function col(p,pace){ if(p>=95) return "var(--bad)";
  if(pace!=null && p>pace+8) return p>85?"var(--bad)":"var(--warn)";
  if(p>=80) return "var(--warn)"; return "var(--acc)"; }

// Renderiza desde el resumen que emite el panel (nunca llama al endpoint).
// Los porcentajes SIEMPRE enteros (Math.round).
function render(d){
  document.body.classList.remove("loading");
  document.body.classList.toggle("light", d?.theme==="light");
  if(d?.labels) $("sesLab").textContent=d.labels.cardSes||d.labels.ses||"Session";
  if(!d || d.ok===false){
    document.body.classList.add("stale");
    $("sPct").textContent="—"; $("wBox").hidden=true; $("xBox").hidden=true; return;
  }
  document.body.classList.remove("stale");
  const s=d.session, w=d.weekly, x=(d.extras||[])[0];
  $("sPct").textContent = s ? Math.round(s.pct)+"%" : "—";
  $("sPct").style.color = s ? col(Math.round(s.pct), s.pace) : "";
  $("wBox").hidden = !w;
  if(w){ $("wPct").textContent=Math.round(w.pct)+"%";
    $("wBox").style.color=col(Math.round(w.pct),null); }
  // tercer hueco: el bucket semanal por MODELO, que es variable — el icono se
  // queda y el modelo cambia. Si el endpoint no reporta ninguno, no se pinta.
  $("xBox").hidden = !x;
  if(x){ $("xPct").textContent=Math.round(x.pct)+"%";
    $("xBox").style.color=col(Math.round(x.pct),null);
    $("xBox").title=x.label||""; }
  if(d.tip) $("cap").title=d.tip;
}

if(EVENT){
  EVENT.listen("quota:update", e=>render(e.payload));
  // el detalle avisa cuando se cierra, para voltear la flecha
  EVENT.listen("pcard:closed", ()=>{ open=false; syncChev(); });
  EVENT.emit("pill:ready");   // pide el último dato conocido al panel
}else{   // preview suelto en un navegador
  render({ok:true, session:{pct:6,pace:30}, weekly:{pct:35},
    extras:[{label:"Weekly · Fable",pct:28}], labels:{cardSes:"Session"}});
}

// clic en la cápsula = desplegar/plegar el detalle (ventana aparte, ver arriba)
let open=false, dragging=false;
function syncChev(){ $("chev").style.transform = open?"rotate(180deg)":""; }
$("cap").addEventListener("click",e=>{
  if(dragging || e.target.closest("#grip")) return;
  if(e.target.closest("#mkbtn")){ invoke?.("show_panel"); return; }  // la marca abre el panel
  open=!open; syncChev();
  invoke?.("toggle_pill_card",{open});
});
// arrastre solo desde el asa ⠿ (el detalle se pliega antes, no lo sigue)
$("grip").addEventListener("mousedown",e=>{
  if(e.button!==0) return;
  e.stopPropagation(); dragging=true;
  if(open){ open=false; syncChev(); invoke?.("toggle_pill_card",{open:false}); }
  APPWIN?.startDragging();
  setTimeout(()=>{ dragging=false; invoke?.("pill_moved"); },600);
});
// clic derecho: ocultar el widget (se reactiva desde Preferencias o el tray)
window.addEventListener("contextmenu",e=>{
  e.preventDefault(); invoke?.("set_pill_visible",{visible:false});
});
</script>
</body>
</html>
