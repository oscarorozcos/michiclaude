<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MichiClaude</title>
<style>
  :root{
    --font:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
    --mono:"Cascadia Code",ui-monospace,"Consolas",monospace;
    /* fondo SÓLIDO: con alpha se transparenta lo que haya detrás del panel */
    --mica:#1e2128;
    --surface:rgba(255,255,255,.045);
    --stroke:rgba(255,255,255,.09);
    --stroke-soft:rgba(255,255,255,.055);
    --txt:#e9ebef; --txt-mut:#969ba6; --txt-dim:#6c717c;
    --brand:#d97757; --accent:#56c7d6;
    --accent-weak:rgba(86,199,214,.14); --accent-line:rgba(86,199,214,.35);
    --ok:#40b869; --warn:#e6a417; --bad:#f05a41;
    --track:rgba(255,255,255,.08);
  }
  body.light{
    --mica:#f3f4f7;
    --surface:rgba(0,0,0,.035);
    --stroke:rgba(0,0,0,.1);
    --stroke-soft:rgba(0,0,0,.06);
    --txt:#1b1e24; --txt-mut:#575d68; --txt-dim:#8a909b;
    /* teal profundo: el #56c7d6 brillante queda lavado sobre blanco (contraste
       ~1.7:1). Este da ~4.7:1 — legible en pestañas, enlaces y barras. */
    --accent:#0b7c8c;
    --accent-weak:rgba(11,124,140,.12); --accent-line:rgba(11,124,140,.30);
    --track:rgba(0,0,0,.09);
  }
  /* `hidden` gana SIEMPRE. El navegador lo aplica con display:none desde su
     hoja por defecto, así que cualquier regla nuestra con display propio
     (.cfg-row, .btnrow, .fld son flex) lo anulaba sin avisar: las filas del
     gatito seguían viéndose con la pastilla puesta y —lo grave— el
     simulador, que solo debe existir en desarrollo, se veía en release.
     Detectado 2026-07-28. No quitar este !important. */
  [hidden]{display:none !important}
  *{box-sizing:border-box}
  html,body{margin:0;background:transparent;height:100%}
  /* color-scheme: los controles nativos (desplegables, spinners, scrollbars)
     se pintan a juego con el tema — sin esto, la lista del idioma se ve mal
     en oscuro */
  body{font-family:var(--font);color:var(--txt);padding:8px;overflow:hidden;color-scheme:dark}
  body.light{color-scheme:light}
  /* si el contenido crece (ajustes abiertos), el panel hace scroll interno */
  .panel{max-height:calc(100vh - 16px);overflow-y:auto;scrollbar-width:thin}

  .panel{
    background:var(--mica);border-radius:14px;
    box-shadow:0 24px 60px -12px rgba(0,0,0,.7),0 0 0 1px var(--stroke);
    padding:0 15px 13px;   /* el relleno de arriba vive en .p-top (sticky) */
  }
  /* Encabezado + pestañas SIEMPRE a la vista: al hacer scroll dentro del panel
     se quedan pegados arriba en vez de irse. Los márgenes negativos los llevan
     de borde a borde para que el contenido no se cuele por los lados, y el
     relleno de abajo sustituye al margen de .tabs (un margen no lleva fondo y
     dejaría una rendija transparente por donde se vería pasar el texto). */
  .p-top{position:sticky;top:0;z-index:5;background:var(--mica);
    margin:0 -15px;padding:15px 15px 12px}
  body.light .panel{box-shadow:0 24px 60px -14px rgba(30,40,60,.35),0 0 0 1px var(--stroke)}
  .p-head{display:flex;align-items:center;gap:10px;margin-bottom:13px;
    cursor:grab;user-select:none;-webkit-user-select:none}
  .p-head:active{cursor:grabbing}
  .p-head button{cursor:pointer}
  .p-head .mark{width:22px;height:22px;flex:0 0 auto}
  .p-htext{min-width:0;flex:1 1 auto}
  .p-title{font-size:13.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .p-sub{font-size:11px;color:var(--txt-dim);font-family:var(--mono);margin-top:4px;
    display:flex;align-items:center;gap:6px;transition:opacity .2s;
    min-width:0;white-space:normal;overflow-wrap:anywhere}
  .p-sub #syncTxt{min-width:0;overflow-wrap:anywhere}
  .p-sub .live{flex:0 0 auto}
  .live{width:7px;height:7px;border-radius:50%;background:var(--ok);
    box-shadow:0 0 0 0 rgba(64,184,105,.6);animation:pulse 2.4s infinite}
  .live.err{background:var(--bad);animation:none}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(64,184,105,.5)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
  .plan{margin-left:auto;flex:0 0 auto;font-size:10.5px;font-weight:650;letter-spacing:.4px;
    color:var(--accent);background:var(--accent-weak);
    border:1px solid var(--accent-line);padding:3px 8px;border-radius:7px}
  .xbtn{margin-left:8px;width:24px;height:24px;border-radius:6px;border:0;cursor:pointer;
    background:transparent;color:var(--txt-mut);font-size:14px;line-height:1}
  .xbtn:hover{background:var(--surface);color:var(--txt)}
  .p-head .xbtn{margin-left:4px}

  /* pestañas (subrayado activo, estilo navegación) */
  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--stroke-soft)}
  .tab{background:transparent;border:0;border-bottom:2px solid transparent;
    color:var(--txt-mut);font-family:var(--font);font-size:12px;font-weight:600;
    padding:7px 10px;cursor:pointer;letter-spacing:.2px}
  .tab:hover{color:var(--txt)}
  .tab.on{color:var(--accent);border-bottom-color:var(--accent)}
  /* contador de hallazgos NUEVOS sin ver: lo enciende la pasada diaria y lo
     apaga abrir la pestaña. Cápsula ROJA flotando en la esquina superior
     derecha de la pestaña (maqueta de Oscar 2026-07-29), tope en 9+; el
     border-radius tipo cápsula la ensancha sola si el número crece. */
  .tab{position:relative}
  .tab .tdot{position:absolute;top:0;right:-6px;min-width:16px;height:14px;
    padding:0 4px;border-radius:999px;background:var(--bad);color:#fff;
    font-size:9px;line-height:14px;font-weight:700;text-align:center;
    box-shadow:0 1px 3px rgba(0,0,0,.35)}

  .sect{border-top:1px solid var(--stroke-soft);padding-top:11px;margin-top:11px}
  .sect:first-of-type{border-top:0;margin-top:0;padding-top:0}
  /* Tarjetas del analizador de fugas (pestaña Hallazgos). El borde
     izquierdo lleva la severidad, como el popover de avisos: se entiende
     sin leer. */
  .fnd{border:1px solid var(--stroke-soft);border-left:3px solid var(--accent);
    border-radius:9px;padding:9px 11px;margin-top:8px}
  .fnd.warn{border-left-color:var(--warn)}
  .fnd.bad{border-left-color:var(--bad)}
  .fnd-t{font-size:12px;font-weight:600}
  .fnd-m{font-size:11px;color:var(--txt-dim);margin-top:2px;overflow-wrap:anywhere}
  .fnd-c{font-family:var(--mono);font-size:11.5px;margin-top:4px}
  .fnd-f{font-size:11px;margin-top:4px}
  /* ficha de Consejos: mismo molde que la tarjeta de Hallazgos, variante
     tip — sin costo ni borde de severidad (una ficha con $0.00 devalúa el
     sistema); acordeón: el cuerpo se abre al tocar el título */
  .fnd.tip{border-left-color:var(--stroke-soft);cursor:pointer}
  /* cuerpo más grande que el fix de Hallazgos (11px): aquí son párrafos de
     lectura, no una línea de remate (lo notó Oscar el 2026-07-30) */
  .fnd.tip .fnd-f{display:none;white-space:pre-line;margin-top:6px;
    font-size:12.5px;line-height:1.5}
  /* ficha disparada por el motor de reglas: la línea "Ahora: ..." lleva el
     dato MEDIDO de la sesión activa, en acento — consejo, no alarma */
  .fnd.tip .fnd-m{color:var(--accent)}
  .tab .tdot.acc{background:var(--accent)}
  .fnd.tip.open{border-left-color:var(--accent)}
  .fnd.tip.open .fnd-f{display:block}
  .fnd-x{float:right;background:transparent;border:0;color:var(--txt-dim);
    font-size:10.5px;cursor:pointer;padding:2px 4px}
  .fnd-x:hover{color:var(--txt)}
  .eyebrow{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--txt-dim);
    font-weight:700;margin-bottom:9px;display:flex;justify-content:space-between;align-items:center}
  .eyebrow .q{font-family:var(--mono);letter-spacing:0;text-transform:none;
    color:var(--txt-mut);font-weight:500;font-size:11px}

  .hero{display:flex;gap:14px;align-items:center}
  .gauge{width:132px;flex:0 0 auto;position:relative;text-align:center}
  .gauge svg{width:132px;height:78px;display:block}
  .g-val{position:absolute;left:0;right:0;top:38px;font-family:var(--mono);font-weight:700;
    font-size:23px;letter-spacing:.5px}
  .g-cap{position:absolute;left:0;right:0;top:64px;font-size:10px;color:var(--txt-dim)}
  .g-reset{font-family:var(--mono);font-size:11px;color:var(--txt-mut);margin-top:2px}

  .stack{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
  .bar-row .brow-top{display:flex;justify-content:space-between;align-items:baseline;
    gap:8px;min-width:0;font-size:11.5px;margin-bottom:5px}
  .bar-row .brow-top.wrap{flex-wrap:wrap;gap:2px 8px}
  .bar-row .brow-top.wrap .rst{white-space:normal;min-width:0;margin-left:0}
  .bar-row .lbl{color:var(--txt-mut);flex:1 1 auto;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar-row .lbl b{color:var(--txt);font-weight:600}
  .bar-row .rst{font-family:var(--mono);font-size:10.5px;color:var(--txt-dim);flex:0 1 auto;margin-left:8px}
  .track{position:relative;height:9px;border-radius:6px;background:var(--track);overflow:hidden}
  .mini .track{height:6px}
  .fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px;transition:width .6s,background .3s}
  .pace{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--txt);opacity:.85}

  .proj{display:flex;gap:11px;align-items:flex-start;border-radius:10px;padding:10px 12px;
    background:rgba(230,164,23,.12);border:1px solid rgba(230,164,23,.32)}
  .proj.calm{background:rgba(64,184,105,.11);border-color:rgba(64,184,105,.3)}
  .proj .ptxt{font-size:12px;line-height:1.42}
  .proj .rate{font-family:var(--mono);font-size:10.5px;color:var(--txt-mut);margin-top:3px}

  .plist{display:flex;flex-direction:column;gap:8px}
  .pitem{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
  .pitem .pname{font-size:12px;display:flex;align-items:center;gap:7px;min-width:0}
  .pitem .swatch{width:8px;height:8px;border-radius:2px;flex:0 0 auto}
  .pitem .pname span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pitem .pcost{font-family:var(--mono);font-size:12px;font-weight:600}
  .pitem .pbar{grid-column:1/-1;height:5px;border-radius:4px;background:var(--track);overflow:hidden}
  .pitem .pbar i{display:block;height:100%;border-radius:4px}
  .pitem.other{margin-top:2px;padding-top:8px;border-top:1px dashed var(--stroke-soft);cursor:help}
  .pitem.other .pname span:last-child{color:var(--txt-mut);font-style:italic}
  .pitem.other .pcost{color:var(--txt-mut);font-weight:500}

  .split{height:11px;border-radius:6px;overflow:hidden;display:flex;border:1px solid var(--stroke-soft)}
  .legend{display:flex;gap:14px;margin-top:8px;flex-wrap:wrap}
  .legend span{font-size:11px;color:var(--txt-mut);display:flex;align-items:center;gap:6px}
  .legend b{width:8px;height:8px;border-radius:2px;display:inline-block}

  .p-foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;
    padding-top:10px;border-top:1px solid var(--stroke-soft)}
  .totals{display:flex;gap:16px}
  .totals .t{font-size:10px;color:var(--txt-dim);text-transform:uppercase;letter-spacing:.6px}
  .totals .t b{display:block;font-family:var(--mono);font-size:15px;color:var(--txt);margin-top:2px}
  .foot-note{font-size:10px;color:var(--txt-dim);max-width:160px;text-align:right;line-height:1.35}
  .errbox{font-size:11.5px;color:var(--warn);line-height:1.4;padding:6px 0}

  /* ajustes (fuentes de datos) */
  .cfg-note{font-size:11px;color:var(--txt-mut);line-height:1.5;margin-bottom:9px}
  .cfg-note b{color:var(--txt);font-weight:600}
  .cfg-form{display:flex;flex-direction:column;gap:6px;margin-top:9px}
  .cfg-form input{background:var(--surface);border:1px solid var(--stroke);border-radius:7px;
    padding:6px 9px;color:var(--txt);font-family:var(--mono);font-size:11px;outline:none}
  .cfg-form input:focus{border-color:var(--accent)}
  /* Un solo aspecto para todos los botones del panel. Los de ajustes
     compartidos quedaron fuera de .cfg-form al moverlos a Fuentes de datos y
     salían sin estilo, con otro color que el resto (2026-07-28). */
  .cfg-form button,.btnrow button{align-self:flex-start;background:var(--accent-weak);
    color:var(--accent);border:1px solid var(--accent-line);border-radius:7px;
    padding:6px 12px;font-size:11.5px;cursor:pointer;font-family:var(--font)}
  .cfg-form button:hover,.btnrow button:hover{background:var(--accent-line)}
  .cfg-form button:disabled:hover,.btnrow button:disabled:hover{background:var(--accent-weak)}
  #rMsg{font-size:11px;color:var(--txt-mut);font-family:var(--mono)}
  /* La ruta de exportación era el único mensaje del panel sin estilo:
     heredaba el tamaño del texto normal y cantaba al lado de los demás,
     que van a 10.5-11 px. Salta de línea por caracteres porque una ruta
     larga no tiene espacios donde partir (2026-07-29). */
  #expBox{display:flex;align-items:center;gap:10px;margin-top:8px;
    padding:9px 11px;border-radius:8px;background:var(--surface);
    border-left:3px solid var(--ok)}
  #expBox.bad{border-left-color:var(--bad)}
  .exp-ico{flex:0 0 auto;display:grid;place-items:center;color:var(--ok)}
  #expBox.bad .exp-ico{color:var(--bad)}
  .exp-txt{min-width:0;flex:1 1 auto}
  .exp-t{font-size:12px;color:var(--txt)}
  /* una ruta no tiene espacios donde partir, así que se recorta en una línea
     y la completa vive en el title */
  .exp-p{font-size:10.5px;font-family:var(--mono);color:var(--txt-dim);
    margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .exp-open{flex:0 0 auto;background:none;border:0;color:var(--ok);
    font-size:11.5px;cursor:pointer;padding:0;font-family:var(--font)}
  #expBox.bad .exp-open{display:none}
  /* Sin temporizador, como el resto de avisos de la app: lo cierra el
     usuario. Y se va solo al cambiar de pestaña, porque el mensaje
     pertenece a ese momento y no al panel entero (2026-07-29). */
  .exp-x{flex:0 0 auto;background:none;border:0;color:var(--txt-dim);
    font-size:11px;cursor:pointer;padding:0 2px;line-height:1}
  .exp-x:hover{color:var(--txt)}
  /* el lápiz avisa de que el nombre se puede tocar; sin él nadie
     descubre que es editable (2026-07-29) */
  .srv-name{cursor:text}
  .srv-name:hover{color:var(--accent)}
  .srv-name .pen{margin-left:6px;opacity:.4;vertical-align:-1px}
  .srv-name:hover .pen{opacity:1}
  #remList .pitem{grid-template-columns:1fr auto}
  .cfg-row{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--txt-mut)}
  /* select con colores SÓLIDOS explícitos: el popup nativo de opciones no
     hereda bien — oscuro: fondo oscuro/letra blanca; claro: al revés */
  .cfg-row select{background:#262a33;border:1px solid var(--stroke);border-radius:7px;
    padding:4px 8px;color:#e9ebef;font-family:var(--font);font-size:11.5px;outline:none}
  .cfg-row select option{background:#262a33;color:#e9ebef}
  body.light .cfg-row select{background:#ffffff;color:#1b1e24}
  body.light .cfg-row select option{background:#ffffff;color:#1b1e24}
  .cfg-lbl{font-size:10.5px;color:var(--txt-dim);margin-top:6px;letter-spacing:.3px}
  .btnrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  button:disabled{opacity:.45;cursor:not-allowed}
  .btnrow button{align-self:auto}
  .rstat{font-size:10px;font-family:var(--mono);margin-left:8px;flex:0 0 auto;color:var(--txt-dim)}
  .rstat.ok{color:var(--ok)} .rstat.bad{color:var(--bad)}

  /* alarmas de uso (chips) */
  .chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .chip{display:inline-flex;align-items:center;gap:5px;background:var(--surface);
    border:1px solid var(--stroke);border-radius:999px;padding:3px 9px;
    font-family:var(--mono);font-size:11px}
  .chip b{cursor:pointer;color:var(--txt-dim);font-weight:400}
  .chip b:hover{color:var(--bad)}


  /* selector de periodo (1d/7d/30d) */
  /* Ventana del gasto: lista desplegable en vez de 1d·7d·30d sueltos. Con
     cuatro opciones la fila se llenaba de texto (2026-07-28). */
  .dsel{font:inherit;font-size:10px;color:var(--accent);font-weight:700;
    background:var(--mica);border:0;padding:0;cursor:pointer}
  .dsel:focus{outline:none}
  /* La lista desplegada hereda el color del control, y el acento sobre el
     fondo del sistema no se leía en oscuro. Se le da el mismo par de
     colores que usan los demás desplegables del panel (2026-07-28). */
  .dsel option{background:var(--mica);color:var(--txt);font-weight:600}
  /* la fila de "más proyectos" se despliega al hacer clic */
  .pitem.more{cursor:pointer}
  .pitem.more:hover .pname span:not(.swatch){color:var(--accent)}

  /* etiqueta de origen del proyecto (local / wsl / servidor) */
  .srctag{font-size:9px;color:var(--txt-dim);background:var(--surface);
    border:1px solid var(--stroke-soft);padding:1px 6px;border-radius:5px;
    margin-left:7px;flex:0 0 auto;letter-spacing:.3px}

  /* tendencia diaria: barras finas, un solo tono, hoy enfatizado por intensidad */
  .tchart{display:flex;align-items:flex-end;gap:2px;height:56px;
    border-bottom:1px solid var(--stroke-soft);padding-bottom:1px}
  .tchart i{flex:1 1 0;background:var(--accent);opacity:.5;border-radius:3px 3px 0 0;
    min-height:2px;cursor:default;transition:opacity .15s}
  .tchart i:hover{opacity:1}
  .tchart i.today{opacity:1}
  .tchart i.zero{background:var(--track);opacity:1}
  .tspan{display:flex;justify-content:space-between;font-size:9px;color:var(--txt-dim);
    font-family:var(--mono);margin-top:4px}

  /* bienvenida/guía adaptativa:
     - body.setup   (sin token Y sin datos locales = no hay Claude Code):
       tarjeta completa, oculta el resto de Principal.
     - body.tokenhint (sin token pero CON datos locales = token vencido):
       banner compacto arriba, NO oculta los datos que sí hay. */
  #welcomeBox,.w-new,.w-expired{display:none}
  body.setup #welcomeBox,body.setup .w-new{display:block}
  body.setup #tab-main > .sect:not(#welcomeBox){display:none}
  body.tokenhint #welcomeBox,body.tokenhint .w-expired{display:block}
  body.tokenhint #welcomeBox{padding-bottom:0}
  .setup-p{font-size:12.5px;color:var(--txt-mut);line-height:1.5;margin:0 0 11px}
  .setup-steps{margin:0 0 11px;padding-left:20px;font-size:12.5px;line-height:1.7;color:var(--txt)}
  .setup-url{display:inline-block;font-family:var(--mono);font-size:12px;color:var(--accent);
    background:var(--surface);border:1px solid var(--stroke);border-radius:7px;padding:6px 10px;
    margin-bottom:11px;user-select:text;-webkit-user-select:text;cursor:text}
  .setup-note{font-size:11.5px;color:var(--txt-dim);line-height:1.5;margin:0 0 6px}

  /* fuentes de datos: nota en lista + formulario etiquetado + filas de servidores */
  .src-list{margin:0;padding-left:16px;display:flex;flex-direction:column;gap:5px}
  .src-list li{line-height:1.45}
  .fld{display:flex;flex-direction:column;gap:4px}
  .fld label{font-size:11.5px;font-weight:600}
  .fhint{font-size:10.5px;color:var(--txt-dim);line-height:1.4}
  .cfg-form input.mono{font-family:var(--mono);font-size:11.5px}
  .cfg-form button:disabled{opacity:.5;cursor:default}
  .srv-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;
    padding:8px 0;border-bottom:1px solid var(--stroke-soft)}
  .srv-row:last-child{border-bottom:0}
  .srv-name{font-size:12.5px;font-weight:650}
  .srv-meta{font-family:var(--mono);font-size:10.5px;color:var(--txt-dim);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .spill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;
    padding:2px 8px;border-radius:20px;white-space:nowrap}
  .spill i{width:6px;height:6px;border-radius:50%;font-style:normal}
  .spill.ok{background:rgba(64,184,105,.14);color:var(--ok)}
  .spill.ok i{background:var(--ok)}
  .spill.bad{background:rgba(240,90,65,.12);color:var(--bad)}
  .spill.bad i{background:var(--bad)}
  .spill.wait{background:var(--surface);color:var(--txt-dim)}
  .spill.wait i{background:var(--txt-dim)}
  .del-btn{border:0;background:transparent;color:var(--txt-dim);width:28px;height:28px;
    display:grid;place-items:center;border-radius:7px;cursor:pointer;transition:.15s}
  .del-btn:hover{background:rgba(240,90,65,.12);color:var(--bad)}
  .del-btn.arm{width:auto;padding:0 9px;background:rgba(240,90,65,.15);color:var(--bad);
    font-size:10.5px;font-weight:700}
  #srvCount{background:var(--surface);border:1px solid var(--stroke);border-radius:20px;
    padding:2px 9px;font-size:10px}
</style>
</head>
<body>
<div class="panel">
  <div class="p-top">
  <!-- Aviso de versión nueva. Va en la cabecera fija para que se vea desde
       cualquier pestaña: enterrado en Preferencias no lo encuentra nadie. -->
  <div id="updBar" hidden style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    background:var(--accent-weak);border:1px solid var(--accent-line);border-radius:8px;
    padding:7px 10px;margin-bottom:9px;font-size:11px">
    <span id="updMsg" style="flex:1 1 auto;min-width:0"></span>
    <button id="updBtn"></button>
  </div>
  <div class="p-head" id="pHead">
    <span class="mark" id="mark"></span>
    <div class="p-htext">
      <div class="p-title">MichiClaude</div>
      <div class="p-sub" id="syncLine"><span class="live" id="liveDot"></span><span id="syncTxt"></span></div>
    </div>
    <span class="plan" id="planTag">—</span>
    <button class="xbtn" id="themeBtn">◐</button>
    <button class="xbtn" id="hideBtn">✕</button>
  </div>

  <div class="tabs">
    <button class="tab on" data-tab="main" data-i18n="tab_main"></button>
    <button class="tab" data-tab="sources" data-i18n="sources_title"></button>
    <button class="tab" data-tab="findings"><span data-i18n="fnd_tab"></span><span class="tdot" id="fndTabDot" hidden></span></button>
    <button class="tab" data-tab="tips"><span data-i18n="tips_tab"></span><span class="tdot acc" id="tipsTabDot" hidden></span></button>
    <button class="tab" data-tab="prefs" data-i18n="prefs_title"></button>
  </div>
  </div><!-- /p-top -->

  <div id="tab-main">

  <div class="sect" id="welcomeBox">
    <div class="w-new">
      <div class="eyebrow" data-i18n="setup_title"></div>
      <p class="setup-p" data-i18n="setup_body"></p>
      <ol class="setup-steps">
        <li data-i18n="setup_s1"></li>
        <li data-i18n="setup_s2"></li>
        <li data-i18n="setup_s3"></li>
      </ol>
      <div class="setup-url">claude.com/claude-code</div>
      <p class="setup-note" data-i18n="setup_remote"></p>
      <p class="setup-note" data-i18n="setup_free"></p>
    </div>
    <div class="w-expired">
      <div class="eyebrow" data-i18n="setup_expired_title"></div>
      <p class="setup-p" data-i18n="setup_expired"></p>
    </div>
  </div>

  <div class="sect">
    <div class="eyebrow"><span data-i18n="quota_title"></span> <span class="q" id="remQ"></span></div>
    <div class="hero">
      <div class="gauge">
        <svg viewBox="0 0 132 78">
          <path d="M 14 72 A 52 52 0 0 1 118 72" fill="none" stroke="var(--track)" stroke-width="11" stroke-linecap="round"/>
          <path id="gFill" d="M 14 72 A 52 52 0 0 1 118 72" fill="none" stroke="var(--ok)" stroke-width="11"
                stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/>
        </svg>
        <div class="g-val" id="sesVal">–</div>
        <div class="g-cap" data-i18n="session_cap"></div>
        <div class="g-reset" id="sesReset"></div>
      </div>
      <div class="stack" id="weekStack"><!-- barras semanales dinámicas --></div>
    </div>
  </div>

  <div class="sect" id="projSect" hidden>
    <div class="eyebrow" data-i18n="at_this_rate"></div>
    <div class="proj calm" id="proj">
      <div>
        <div class="ptxt" id="projTxt"></div>
        <div class="rate" id="rateTxt"></div>
      </div>
    </div>
  </div>

  <div class="sect">
    <div class="eyebrow"><span data-i18n="spend_title"></span>
      <span class="q"><select id="daysSel" class="dsel"><option value="1">1 d</option><option value="7">7 d</option><option value="15">15 d</option><option value="30">30 d</option></select> · <span data-i18n="spend_q" data-i18n-title="spend_tip" style="cursor:help;border-bottom:1px dotted var(--txt-dim)"></span><span id="priceWarn" hidden style="cursor:pointer;color:var(--warn);margin-left:5px">&#9888;</span></span></div>
    <div class="plist" id="plist"></div>
    <div class="cfg-note" style="margin:8px 0 0" data-i18n="spend_only_cc"></div>
  </div>

  <div class="sect" id="trendSect" hidden>
    <div class="eyebrow"><span data-i18n="trend_title"></span> <span class="q" data-i18n="trend_q"></span></div>
    <div class="tchart" id="tchart"></div>
    <div class="tspan"><span id="tFrom"></span><span id="tTo"></span></div>
  </div>

  <div class="sect" id="modelSect" hidden>
    <div class="eyebrow"><span data-i18n="model_title"></span> <span class="q" id="modelQ"></span></div>
    <div class="split" id="split"></div>
    <div class="legend" id="legend"></div>
  </div>

  </div><!-- /tab-main -->

  <div id="tab-sources" hidden>
  <div class="sect" id="cfgSect">
    <div class="cfg-note" data-i18n-html="cfg_note"></div>
  </div>
  <div class="sect">
    <div class="eyebrow" data-i18n="srv_add_title"></div>
    <div class="cfg-form">
      <div class="fld">
        <label for="rName" data-i18n="lbl_name"></label>
        <input id="rName" data-i18n-ph="ph_name">
        <div class="fhint" data-i18n="hint_name"></div>
      </div>
      <div class="fld">
        <label for="rHost" data-i18n="lbl_host"></label>
        <input id="rHost" class="mono" data-i18n-ph="ph_host">
      </div>
      <!-- El comando propio es la salida de emergencia para un servidor raro
           (otro binario de Python, un contenedor). Nace OCULTO y solo sale si
           la instalación automática falla: enseñárselo a todo el mundo hace
           que un campo que sobra el 99% de las veces parezca obligatorio
           (2026-07-29). -->
      <div class="fld" id="rPyBox" hidden>
        <label for="rPy" data-i18n="lbl_py"></label>
        <input id="rPy" class="mono" data-i18n-ph="ph_py">
        <div class="fhint" data-i18n="hint_py"></div>
      </div>
      <div class="btnrow">
        <button id="rAdd" data-i18n="btn_test"></button>
        <span id="rMsg"></span>
      </div>
    </div>
  </div>
  <div class="sect">
    <div class="eyebrow"><span data-i18n="srv_saved_title"></span> <span class="q" id="srvCount"></span></div>
    <div id="remList"></div>
  </div>
  <!-- Los ajustes compartidos viven aquí, y no en Preferencias, porque
       dependen de tener un servidor: se leen después de la lista, cuando ya
       sabes cuáles tienes (petición de Oscar 2026-07-28). -->
  <div class="sect">
    <div class="eyebrow"><span data-i18n="hub_cfg_label"></span></div>
    <div class="cfg-note" data-i18n="hub_cfg_hint"></div>
    <div class="btnrow">
      <button id="hubSave" data-i18n="hub_cfg_save"></button>
      <button id="hubLoad" data-i18n="hub_cfg_load"></button>
      <span id="hubMsg" style="font-size:10.5px;color:var(--txt-dim)"></span>
    </div>
  </div>
  </div><!-- /tab-sources -->

  <div id="tab-findings" hidden>
    <div class="sect">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div class="eyebrow" data-i18n="fnd_title"></div>
        <span class="q"><select id="fndDays" class="dsel"><option value="1">1 d</option><option value="7">7 d</option><option value="15">15 d</option><option value="30">30 d</option></select></span>
      </div>
      <p style="font-size:11px;color:var(--txt-dim);margin:6px 0 2px" data-i18n="fnd_intro"></p>
      <div id="fndList"></div>
      <div id="fndFoot" style="font-size:10.5px;color:var(--txt-dim);margin-top:8px"></div>
    </div>
  </div>

  <!-- Consejos: el coach 100% estático (docs/consejos-coach.md). Fichas
       curadas a mano que viajan en la app y se actualizan con el updater;
       cero IA, cero red. La otra puerta del mismo saber que Hallazgos:
       "¿cuánto me costó?" -> Hallazgos; "¿qué hago ahora?" -> Consejos. -->
  <div id="tab-tips" hidden>
    <div class="sect">
      <div class="eyebrow" data-i18n="tips_title"></div>
      <p style="font-size:11px;color:var(--txt-dim);margin:6px 0 2px" data-i18n="tips_intro"></p>
      <input id="tipFilter" type="text" data-i18n-ph="tips_filter" style="width:100%;margin-top:6px;box-sizing:border-box">
      <div id="tipList"></div>
      <!-- faqMisses (doc §9): búsquedas que no encontraron ficha, contadas
           LOCALMENTE — cero telemetría. El botón abre un issue de GitHub
           pre-llenado que el usuario revisa y envía él mismo. -->
      <div id="tipFoot" hidden style="font-size:10.5px;color:var(--txt-dim);margin-top:8px">
        <span id="tipMissTxt"></span> · <a href="#" id="tipPropose" data-i18n="tips_propose" style="color:var(--accent)"></a>
        · <a href="#" id="tipDismiss" data-i18n="tips_dismiss" style="color:var(--txt-dim)"></a>
      </div>
    </div>
  </div>

  <div id="tab-prefs" hidden>
  <div class="sect" id="prefSect">
    <div class="cfg-form">
      <div class="cfg-row">
        <span data-i18n="lang_label"></span>
        <select id="langSel">
          <option value="en">English</option>
          <option value="es">Español</option>
          <option value="pt">Português</option>
          <option value="fr">Français</option>
          <option value="de">Deutsch</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어</option>
          <option value="zh">中文</option>
        </select>
      </div>
      <label class="cfg-row" style="cursor:pointer;margin-top:4px">
        <input type="checkbox" id="pillChk"> <span data-i18n="pill_label"></span>
      </label>
      <div class="cfg-row" id="pillStyleRow" style="margin-top:2px">
        <span data-i18n="pill_style_label"></span>
        <select id="pillStyleSel">
          <option value="plain" data-i18n="pill_style_plain"></option>
          <option value="cat" data-i18n="pill_style_cat"></option>
        </select>
      </div>
      <!-- El arte del gatito y el color de sus globos se eligen por separado:
           "Según el tema" (por defecto) sigue al botón ◐ como siempre. -->
      <div class="cfg-row catOnly" id="catArtRow" style="margin-top:2px">
        <span data-i18n="cat_art_label"></span>
        <select id="catArtSel">
          <option value="auto" data-i18n="theme_auto"></option>
          <option value="light" data-i18n="theme_light"></option>
          <option value="dark" data-i18n="theme_dark"></option>
        </select>
      </div>
      <div class="cfg-row catOnly" id="catSkinRow" style="margin-top:2px">
        <span data-i18n="cat_skin_label"></span>
        <select id="catSkinSel">
          <option value="auto" data-i18n="theme_auto"></option>
          <option value="light" data-i18n="theme_light"></option>
          <option value="dark" data-i18n="theme_dark"></option>
        </select>
      </div>
      <div class="cfg-row" id="pillLayerRow" style="margin-top:2px">
        <span data-i18n="pill_layer_label"></span>
        <select id="pillLayerSel">
          <option value="top" data-i18n="pill_layer_top"></option>
          <option value="normal" data-i18n="pill_layer_normal"></option>
          <option value="bottom" data-i18n="pill_layer_bottom"></option>
        </select>
      </div>
      <!-- El sticker/puntito de hallazgos nuevos en el widget. Encendido por
           defecto; quien lo sienta encima lo apaga aquí. El contador de la
           pestaña se queda siempre: no interrumpe a nadie. -->
      <label class="cfg-row" style="cursor:pointer;margin-top:2px">
        <input type="checkbox" id="fndBadgeChk"> <span data-i18n="fnd_badge_label"></span>
      </label>
      <!-- El globo del día: umbral en dólares (propuesta de Oscar). Por
           debajo solo el post-it; a partir de aquí, globo con texto.
           Comparte el interruptor de arriba: un concepto, un apagador. -->
      <div class="cfg-lbl" data-i18n="fnd_nudge_lbl"></div>
      <input id="fndNudgeIn" type="number" min="0" step="0.5" style="max-width:80px" placeholder="$">
      <!-- Simulador de estados del gatito: SOLO visible en compilaciones de
           desarrollo (is_dev). Nunca llega a un usuario, por eso es el único
           control cuyos textos no pasan por t(). -->
      <div class="btnrow" id="devSimRow" hidden style="margin-top:6px">
        <button id="simBtn">🐱 Simular estados</button>
        <button id="sfBtn">🧪 Simular hallazgos</button>
        <input id="simMin" type="number" min="0.1" max="60" step="0.5" style="max-width:62px">
        <span style="font-size:10.5px;color:var(--txt-dim)">min c/u</span>
        <span id="simMsg" style="font-size:10.5px;color:var(--txt-dim)"></span>
      </div>
      <div class="cfg-lbl" data-i18n="alarms_label"></div>
      <div class="chips" id="alarmList"></div>
      <div class="btnrow">
        <input id="alarmIn" type="number" min="1" max="100" step="1" style="max-width:80px" placeholder="%">
        <button id="alarmAdd" data-i18n="btn_add"></button>
      </div>
      <div class="cfg-lbl" data-i18n="budget_label"></div>
      <input id="budgetIn" type="number" min="0" step="1" style="max-width:120px">
      <!-- Avisos al celular vía ntfy (2026-08-01): opcional y APAGADO por
           defecto. Por este canal viajan SOLO porcentajes y horas de reset —
           nunca proyectos, rutas ni dólares (regla en CLAUDE.md). El topic es
           la contraseña del canal; el servidor se cambia a mano en
           ntfy_config.json, como las URLs de precios. El QR va SIEMPRE sobre
           blanco: un QR invertido no lo leen todas las cámaras. -->
      <div class="cfg-lbl" data-i18n="ntfy_label"></div>
      <label class="cfg-row" style="cursor:pointer">
        <input type="checkbox" id="ntfyChk"> <span data-i18n="ntfy_on"></span>
      </label>
      <div id="ntfyBox" hidden>
        <div class="cfg-note" data-i18n-html="ntfy_steps"></div>
        <canvas id="ntfyQr" width="180" height="180"
                style="border-radius:8px;margin:6px 0;background:#fff"></canvas>
        <div class="btnrow">
          <input id="ntfyTopic" readonly style="max-width:190px;font-size:11px">
          <button id="ntfyCopy" data-i18n="ntfy_copy"></button>
        </div>
        <div class="btnrow">
          <button id="ntfyTest" data-i18n="ntfy_test"></button>
          <span id="ntfyMsg" style="font-size:10.5px;color:var(--txt-dim)"></span>
        </div>
        <label class="cfg-row" style="cursor:pointer">
          <input type="checkbox" id="ntfyAlarmChk"> <span data-i18n="ntfy_alarms"></span>
        </label>
      </div>
      <div class="cfg-lbl" data-i18n="prices_label"></div>
      <div class="btnrow">
        <span id="pricesMsg" style="font-size:10.5px;color:var(--txt-dim)"></span>
        <button id="pricesInfo" data-i18n-title="prices_info_tip">&#9432;</button>
        <button id="pricesNow" data-i18n="prices_refresh"></button>
      </div>
      <div id="pricesSources" hidden class="cfg-note" data-i18n-html="prices_sources"></div>
      <div class="cfg-lbl" data-i18n="export_label"></div>
      <input id="exportDir" data-i18n-ph="export_dir_ph">
      <div class="btnrow">
        <!-- periodo PROPIO del export: mirar 1 día en pantalla y querer
             exportar 30 es un caso normal (2026-07-29) -->
        <select id="expDays" class="dsel" style="font-size:11.5px">
          <option value="1">1 d</option><option value="7">7 d</option>
          <option value="15">15 d</option><option value="30" selected>30 d</option>
        </select>
        <button id="expCsv">CSV</button>
        <button id="expJson">JSON</button>
      </div>
      <!-- Resultado de la exportación (maqueta de Oscar 2026-07-29): franja de
           color por resultado, icono, qué se exportó y la ruta RECORTADA POR
           EL PRINCIPIO — de una ruta larga lo que importa es el final. -->
      <div id="expBox" hidden>
        <span class="exp-ico" id="expIco"></span>
        <div class="exp-txt">
          <div class="exp-t" id="expTitle"></div>
          <div class="exp-p" id="expPath"></div>
        </div>
        <button class="exp-open" id="expOpen"></button>
        <button class="exp-x" id="expX" aria-label="✕">✕</button>
      </div>
    </div>
  </div>
  </div><!-- /tab-prefs -->

  <div class="p-foot">
    <div class="totals">
      <div class="t"><span data-i18n="today"></span><b id="costToday">–</b></div>
      <div class="t" id="winTot"><span id="winLbl"></span><b id="costWeek">–</b></div>
    </div>
    <div class="foot-note" data-i18n="footnote"></div>
  </div>
</div>

<script>

  fnd_reread_f:"Ask for the part that matters (line ranges) instead of the whole file — each read stacks onto the conversation, it does not replace the previous one.",
  fnd_inflate_f:"A /clear when you change topics splits the context: every turn re-reads everything that came before.",

  fnd_mcp_f:"Its tool definitions travel in every request anyway. Removing it from the config is one line, and reconnecting is another.",
  fnd_cachebreak_t:n=>`The context was rewritten ${n} times in one conversation`,
  fnd_cachebreak_f:"After a pause (the cache expires within minutes) or a model switch, the whole conversation is written to the cache again at full write price. If the topic changed while you were away, /clear starts from a tiny context — almost free.",
  fnd_skills_t:n=>`Installed skills you didn't use: ${n}`,
  fnd_skills_f:"Each installed skill adds its line to every request so Claude knows it exists. Removing the ones you don't use from ~/.claude/skills is free — and bringing one back is just copying a folder.",
  fnd_subagents_t:n=>`Subagents ran ${n} turns on the side`,
  fnd_subagents_f:"Each subagent reads and pays for its own context, separate from your conversation — this cost is already inside your total, it just isn't visible there. If the agent's task is mechanical, a small model (Haiku) does it for a fraction.",
  fnd_hooks_t:n=>`A hook printed output ${n} times`,
  fnd_hooks_f:"Everything a hook prints joins the context of that turn — and travels again with every turn after it. If it has nothing to say, exiting silently (exit 0, no output) is free.",
  fnd_claudemd_t:n=>`${n} CLAUDE.md lines mention things with no recent trace`,
  fnd_claudemd_f:"CLAUDE.md travels whole with every conversation. These lines mention paths or commands that never showed up in this window's logs — worth checking if they still earn their place. Deleting is free (only the next message rebuilds the cache once); if something is used only now and then, keep it.",

  tip_clear_t:"Does /clear delete my work?",
  tip_clear_b:"No. /clear wipes only the conversation. What you do NOT lose:\n• Your code — it lives in your files, not in the chat.\n• Your CLAUDE.md — it reloads by itself in the new session.\n• Past sessions — “claude --resume” lists them so you can pick one up.\nThe only thing gone is the chat thread — which is exactly what costs tokens every turn.",
  tip_compact_t:"/clear or /compact?",
  tip_compact_b:"/clear starts from zero: the cheapest. /compact summarizes the conversation keeping the essentials (tens of thousands of tokens down to a few thousand).\n• New, independent topic → /clear.\n• New topic overlaps the previous one → /compact.\nThe key question: does what comes next need what was already said?",
  tip_cache_t:"The cache expires in minutes",
  tip_cache_b:"Your conversation lives in a cache that expires after a few idle minutes. Coming back from a long pause rewrites the whole context at full price — reading it cached costs ~10x less. With a big conversation: finish the thought before stepping away, and if the topic changed while you were gone, /clear.",
  tip_attach_t:"Mention the file, don’t paste it",
  tip_attach_b:"Pasting the same code again and again stacks copies in the context, and every copy travels with every turn after that. Give the path instead (or @file): Claude reads exactly what it needs, from the current version, with no duplicates.",
  tip_ask_t:"Ask quick questions in a separate session",
  tip_ask_b:"A short question inside a big session drags the WHOLE accumulated context: you pay thousands of tokens for a two-line doubt. Open a fresh session and the same answer costs cents. Twice as true for general questions that don’t need your code.",
  tip_model_t:"Small model for mechanical work",
  tip_model_b:"Renaming, formatting, running tests, writing a commit message: a small model (Haiku) does it just as well for a fraction. Switch with /model for that task and go back to the big one for work that actually needs thinking.",

  tip_clear_b:"No. /clear borra solo la conversación. Lo que NO se pierde:\n• Tu código — vive en tus archivos, no en el chat.\n• Tu CLAUDE.md — se recarga solo en la sesión nueva.\n• Las sesiones anteriores — «claude --resume» las lista y puedes retomarlas.\nLo único que se va es el hilo de lo hablado — que es justo lo que cuesta tokens en cada turno.",
  tip_compact_t:"¿/clear o /compact?",
  tip_compact_b:"/clear arranca de cero: lo más barato. /compact resume la conversación conservando lo esencial (de decenas de miles de tokens a unos pocos miles).\n• Tema nuevo independiente → /clear.\n• El tema nuevo se cruza con el anterior → /compact.\nLa pregunta clave: ¿lo que sigue necesita lo ya hablado?",

  fnd_mcp_t:s=>`Serveur MCP inutilisé : ${s}`,
  fnd_reread_f:"Demandez la partie qui compte (plages de lignes) plutôt que le fichier entier — chaque lecture s'empile dans la conversation, elle ne remplace pas la précédente.",
  fnd_inflate_f:"Un /clear quand vous changez de sujet coupe le contexte : chaque tour relit tout ce qui précède.",
  fnd_mech_f:"Regroupez-les à la fin, ou faites-les vous-même dans le terminal — là, c'est gratuit.",
  fnd_mcp_f:"Ses définitions voyagent dans chaque requête de toute façon. Le retirer de la config tient en une ligne, le reconnecter aussi.",
  fnd_cachebreak_t:n=>`Le contexte a été réécrit ${n} fois dans la même conversation`,
  fnd_cachebreak_f:"Après une pause (le cache expire en quelques minutes) ou un changement de modèle, toute la conversation est réécrite dans le cache au plein tarif. Si le sujet a changé entre-temps, /clear repart d'un contexte minuscule — presque gratuit.",
  fnd_skills_t:n=>`Skills installées non utilisées : ${n}`,
  fnd_skills_f:"Chaque skill installée ajoute sa ligne à chaque requête pour que Claude sache qu'elle existe. Retirer de ~/.claude/skills celles que vous n'utilisez pas est gratuit — et en remettre une, c'est copier un dossier.",
  fnd_subagents_t:n=>`Les sous-agents ont travaillé ${n} tours à part`,
  fnd_subagents_f:"Chaque sous-agent lit et paie son propre contexte, à part de votre conversation — ce coût est déjà dans le total, mais il n'y est pas visible. Si la tâche de l'agent est mécanique, un petit modèle (Haiku) la fait pour une fraction.",
  fnd_hooks_t:n=>`Un hook a imprimé une sortie ${n} fois`,
  fnd_hooks_f:"Tout ce qu'un hook imprime entre dans le contexte de ce tour — et voyage à nouveau à chaque tour suivant. S'il n'a rien à dire, se taire (exit 0 sans sortie) ne coûte rien.",
  fnd_claudemd_t:n=>`${n} lignes du CLAUDE.md mentionnent des choses sans trace récente`,
  fnd_claudemd_f:"Le CLAUDE.md voyage en entier avec chaque conversation. Ces lignes mentionnent des chemins ou des commandes absents des journaux de cette fenêtre — cela vaut la peine de vérifier s'ils méritent encore leur place. Supprimer est gratuit (seul le message suivant reconstruit le cache une fois) ; ce qui ne sert que de temps en temps peut rester.",

  tips_title:"Conseils pour économiser votre quota",
  tips_intro:"Fiches courtes écrites à la main — sans IA, sans réseau. Mises à jour à chaque version de l’app. Touchez-en une pour l’ouvrir.",

  tips_none:"Rien ne correspond au filtre.",

  tips_issue_title:"Conseils : recherches sans fiche",
  tips_issue_intro:"Ces recherches dans l’onglet Conseils n’ont trouvé aucune fiche. Idées de nouvelles fiches :",
  tip_clear_t:"/clear efface-t-il mon travail ?",
  tip_clear_b:"Non. /clear n’efface que la conversation. Ce que vous ne perdez PAS :\n• Votre code — il vit dans vos fichiers, pas dans le chat.\n• Votre CLAUDE.md — il se recharge tout seul dans la nouvelle session.\n• Les sessions passées — « claude --resume » les liste pour les reprendre.\nSeul le fil de la discussion disparaît — précisément ce qui coûte des tokens à chaque tour.",
  tip_compact_t:"/clear ou /compact ?",
  tip_compact_b:"/clear repart de zéro : le moins cher. /compact résume la conversation en gardant l’essentiel (de dizaines de milliers de tokens à quelques milliers).\n• Sujet nouveau et indépendant → /clear.\n• Le nouveau sujet recoupe le précédent → /compact.\nLa question clé : la suite a-t-elle besoin de ce qui a déjà été dit ?",
  tip_cache_t:"Le cache expire en quelques minutes",
  tip_cache_b:"Votre conversation vit dans un cache qui expire après quelques minutes d’inactivité. Au retour d’une longue pause, tout le contexte est réécrit à plein tarif — le relire depuis le cache coûte ~10x moins. Avec une grosse conversation : terminez l’idée avant de partir, et si le sujet a changé au retour, /clear.",
  tip_attach_t:"Mentionnez le fichier, ne le collez pas",
  tip_attach_b:"Coller le même code encore et encore empile des copies dans le contexte, et chaque copie voyage à chaque tour suivant. Donnez plutôt le chemin (ou @fichier) : Claude lit exactement ce qu’il faut, dans la version actuelle, sans doublons.",
  tip_ask_t:"Les questions rapides, dans une session à part",
  tip_ask_b:"Une question courte dans une grosse session traîne TOUT le contexte accumulé : des milliers de tokens pour un doute de deux lignes. Posez-la dans une session neuve et la même réponse coûte des centimes. Doublement vrai pour les questions générales qui n’ont pas besoin de votre code.",
  tip_model_t:"Petit modèle pour le mécanique",
  tip_model_b:"Renommer, formater, lancer des tests, rédiger un commit : un petit modèle (Haiku) le fait aussi bien pour une fraction. Passez avec /model pour cette tâche, puis revenez au grand pour ce qui demande de réfléchir.",

  fnd_reread_f:"Frag nach dem relevanten Teil (Zeilenbereiche) statt nach der ganzen Datei — jede Lektüre stapelt sich im Gespräch, sie ersetzt die vorherige nicht.",
  fnd_inflate_f:"Ein /clear beim Themenwechsel teilt den Kontext: Jeder Zug liest alles Vorherige erneut.",
  fnd_mech_f:"Bündle sie am Ende, oder führe sie selbst im Terminal aus — dann sind sie gratis.",
  fnd_mcp_f:"Seine Tool-Definitionen reisen ohnehin in jeder Anfrage mit. Ihn aus der Konfiguration zu nehmen ist eine Zeile, das Wiederverbinden auch.",
  fnd_cachebreak_t:n=>`Der Kontext wurde ${n}-mal in derselben Unterhaltung neu geschrieben`,
  fnd_cachebreak_f:"Nach einer Pause (der Cache läuft nach Minuten ab) oder einem Modellwechsel wird die ganze Unterhaltung zum vollen Schreibpreis neu in den Cache geschrieben. Hat sich das Thema inzwischen geändert, startet /clear mit winzigem Kontext — fast gratis.",
  fnd_skills_t:n=>`Installierte Skills ohne Nutzung: ${n}`,
  fnd_skills_f:"Jede installierte Skill fügt jeder Anfrage ihre Zeile hinzu, damit Claude weiß, dass es sie gibt. Ungenutzte aus ~/.claude/skills zu entfernen ist gratis — und zurückholen heißt nur einen Ordner kopieren.",
  fnd_subagents_t:n=>`Subagenten: ${n} Runden nebenbei`,
  fnd_subagents_f:"Jeder Subagent liest und bezahlt seinen eigenen Kontext, getrennt von deiner Unterhaltung — diese Kosten stecken schon im Gesamtwert, sind dort aber unsichtbar. Ist die Agentenaufgabe mechanisch, erledigt sie ein kleines Modell (Haiku) für einen Bruchteil.",
  fnd_hooks_t:n=>`Ein Hook hat ${n}-mal Ausgabe gedruckt`,
  fnd_hooks_f:"Alles, was ein Hook ausgibt, wandert in den Kontext dieses Zugs — und reist mit jedem weiteren Zug erneut mit. Wenn er nichts zu sagen hat, ist Schweigen (exit 0 ohne Ausgabe) kostenlos.",
  fnd_claudemd_t:n=>`${n} CLAUDE.md-Zeilen nennen Dinge ohne aktuelle Spur`,
  fnd_claudemd_f:"Die CLAUDE.md reist mit jeder Unterhaltung komplett mit. Diese Zeilen nennen Pfade oder Befehle, die in den Logs dieses Zeitraums nie auftauchten — es lohnt sich zu prüfen, ob sie ihren Platz noch verdienen. Löschen ist gratis (nur die nächste Nachricht baut den Cache einmal neu auf); was nur ab und zu gebraucht wird, bleibt.",

  tips_title:"Tipps, damit die Quota länger reicht",
  tips_intro:"Kurze, handgeschriebene Karten — ohne KI, ohne Netz. Sie aktualisieren sich mit jeder App-Version. Zum Öffnen antippen.",

  tips_issue_title:"Tipps: Suchen ohne Karte",
  tips_issue_intro:"Diese Suchen im Tipps-Tab fanden keine Karte. Ideen für neue Karten:",
  tip_clear_t:"Löscht /clear meine Arbeit?",
  tip_clear_b:"Nein. /clear löscht nur die Unterhaltung. Was NICHT verloren geht:\n• Dein Code — er lebt in deinen Dateien, nicht im Chat.\n• Deine CLAUDE.md — sie lädt sich in der neuen Sitzung von selbst.\n• Frühere Sitzungen — „claude --resume“ listet sie zum Weitermachen.\nWeg ist nur der Gesprächsfaden — genau das, was in jedem Zug Tokens kostet.",
  tip_compact_t:"/clear oder /compact?",
  tip_compact_b:"/clear beginnt bei null: am günstigsten. /compact fasst die Unterhaltung zusammen und behält das Wesentliche (von Zehntausenden Tokens auf wenige Tausend).\n• Neues, unabhängiges Thema → /clear.\n• Das neue Thema überschneidet sich mit dem alten → /compact.\nDie Schlüsselfrage: Braucht das, was kommt, das bereits Gesagte?",
  tip_cache_t:"Der Cache läuft nach Minuten ab",
  tip_cache_b:"Deine Unterhaltung lebt in einem Cache, der nach wenigen Minuten Inaktivität abläuft. Nach einer langen Pause wird der ganze Kontext zum vollen Preis neu geschrieben — ihn aus dem Cache zu lesen kostet ~10x weniger. Bei großen Unterhaltungen: den Gedanken zu Ende bringen, bevor du aufstehst — und wenn das Thema danach ein anderes ist, /clear.",
  tip_attach_t:"Datei nennen statt einfügen",
  tip_attach_b:"Denselben Code immer wieder einzufügen stapelt Kopien im Kontext, und jede Kopie reist in jedem weiteren Zug mit. Gib stattdessen den Pfad an (oder @datei): Claude liest genau das Nötige, aus der aktuellen Version, ohne Duplikate.",
  tip_ask_t:"Kurze Fragen in eine eigene Sitzung",
  tip_ask_b:"Eine kurze Frage in einer großen Sitzung schleppt den GESAMTEN Kontext mit: Tausende Tokens für einen Zweizeiler. In einer frischen Sitzung kostet dieselbe Antwort Cents. Doppelt wahr für allgemeine Fragen, die deinen Code nicht brauchen.",
  tip_model_t:"Kleines Modell für Mechanisches",
  tip_model_b:"Umbenennen, Formatieren, Tests laufen lassen, Commit-Text schreiben: ein kleines Modell (Haiku) macht das genauso gut für einen Bruchteil. Mit /model für die Aufgabe wechseln und für echtes Denken zurück zum großen.",

const navLang=String(navigator.language||"").toLowerCase().slice(0,2);
let lang = localStorage.getItem("lang") || (I18N[navLang]?navLang:"en");
if(!I18N[lang]) lang="en";
function t(key,...a){
  const v=(I18N[lang]&&I18N[lang][key])??I18N.en[key];
  return typeof v==="function"?v(...a):(v??key);
}
function applyI18n(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-i18n]").forEach(el=>{ el.textContent=t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-html]").forEach(el=>{ el.innerHTML=t(el.dataset.i18nHtml); });
  document.querySelectorAll("[data-i18n-ph]").forEach(el=>{ el.placeholder=t(el.dataset.i18nPh); });
  document.querySelectorAll("[data-i18n-title]").forEach(el=>{ el.title=t(el.dataset.i18nTitle); });
  $("hideBtn").title=t("hide_title"); $("themeBtn").title=t("theme_title");
  $("langSel").value=lang;
  // El menú del icono de bandeja lo construye Rust al arrancar y no puede
  // pasar por t(): el idioma vive aquí. Se lo mandamos ya traducido, al
  // cargar y en cada cambio de idioma (era el único texto que se quedaba
  // en inglés — invariante #10).
  if(typeof invoke!=="undefined" && invoke)
    invoke("set_tray_menu",{open:t("tray_open"),widget:t("tray_widget"),quit:t("tray_quit")})
      .catch(()=>{});
  // las fichas de Consejos se pintan desde t(): un cambio de idioma con la
  // pestaña abierta debe repintarlas al momento
  if(!$("tab-tips").hidden) renderTips();
}

// Traducción de códigos de error del backend (ERR_*)
function errText(code){
  code=String(code);
  if(code.startsWith("ERR_RATE_LIMITED")) return t("err_rate", +code.split(":")[1]||3);
  if(code.startsWith("ERR_API")) return t("err_api", code.split(":")[1]||"?");
  const map={ERR_NO_TOKEN:"err_no_token",ERR_TOKEN_EXPIRED:"err_expired",
             ERR_NET:"err_net",ERR_BAD_RESPONSE:"err_bad"};
  return map[code]?t(map[code]):code;
}

$("themeBtn").addEventListener("click",()=>{
  const light=document.body.classList.toggle("light");
  localStorage.setItem("theme", light?"light":"dark");

  if(typeof lastPill!=="undefined" && lastPill){
    lastPill.theme=light?"light":"dark";

    lastPill.skinTheme=getPillStyle()==="cat" ? pickTheme("catSkin") : panelTheme();
    EVENT?.emit("quota:update",lastPill);

});

// ---------- marca ----------
function sunburst(size){
  const S=64,cx=32,cy=32,rays=11;let p=`<svg width="${size}" height="${size}" viewBox="0 0 ${S} ${S}">`;
  for(let i=0;i<rays;i++){const a=Math.PI*2*i/rays-Math.PI/2;
    const ux=Math.cos(a),uy=Math.sin(a),px=-uy,py=ux;
    const base=S*.04,tip=S*.46,mid=S*.26,hw=S*.055;
    const pts=[[cx+ux*base,cy+uy*base],[cx+ux*mid+px*hw,cy+uy*mid+py*hw],
      [cx+ux*tip,cy+uy*tip],[cx+ux*mid-px*hw,cy+uy*mid-py*hw]]
      .map(q=>q.map(n=>n.toFixed(2)).join(",")).join(" ");
    p+=`<polygon points="${pts}" fill="var(--brand)"/>`}
  return p+`<circle cx="${cx}" cy="${cy}" r="${S*.07}" fill="var(--brand)"/></svg>`;
}
$("mark").innerHTML=sunburst(22);

const TAURI = window.__TAURI__?.core;
const invoke = TAURI ? TAURI.invoke : null;
const EVENT = window.__TAURI__?.event;   // el panel alimenta al widget flotante por evento
const PALETTE = ["var(--accent)","var(--brand)","var(--ok)","var(--warn)","var(--txt-dim)"];
let lastQuotaData=null, lastLocalData=null;   // caché para re-render al cambiar idioma

// ---------- widget flotante: el panel es el ÚNICO que consulta; el widget escucha ----------
// ¿hay widget en pantalla? Decide si un aviso puede salir como globo o si
// tiene que caer al toast de Windows (no hay dónde colgarlo).
let lastPill=null, pillOn=false;
function getPillStyle(){ return localStorage.getItem("pillStyle")==="cat"?"cat":"plain"; }
function pillLabels(){
  return {ses:t("pill_ses"), week:t("pill_week"), cardSes:t("card_ses"), cardWeek:t("card_week")};
}
// Tema del panel (el que manda el botón ◐) y los dos que puede soltar el
// usuario: el ARTE del gatito y la PIEL de sus globos (cápsula incluida — es
// información, va con los mensajes). "auto" = sigue al panel, que es el
// comportamiento de siempre y el valor por defecto.
function panelTheme(){ return document.body.classList.contains("light")?"light":"dark"; }
function pickTheme(key){
  const v=localStorage.getItem(key);
  return (v==="light"||v==="dark") ? v : panelTheme();
}
// Estado del gatito — misma lógica que las notificaciones, de lo más grave a
// lo más leve:
// 😴 zzz   sin cuota SEMANAL (hit:week): dormido hasta que la semana se
//          restablezca — es el peor caso, no hay nada que hacer en días.
// ☕ break  sin cuota de la SESIÓN (hit:session): de descanso hasta el reset,
//          que llega en horas. Ambos banderines los limpia trackResets().
// 🔥 fire   alarma de % pendiente de "enterado": arde hasta que abra el panel.
// 🐱 normal cualquier otro caso.
function mascotState(ses, weekPct){
  if(simMascot) return simMascot;                     // simulador (solo en dev)
  if((weekPct!=null && Math.round(weekPct)>=100) || localStorage.getItem("hit:week")==="1")
    return "zzz";
  if((ses && Math.round(ses.pct)>=100) || localStorage.getItem("hit:session")==="1")
    return "break";
  if(localStorage.getItem("ackPending:alarm")==="1") return "fire";
  return "normal";
}
let lastPillArgs=null;
function emitPill(ses, wk, extras){
  lastPillArgs=[ses,wk,extras];             // para el tic del contador (abajo)
  const weekPct = wk ? wk.pct : null;
  lastPill={ok:!!ses, session:ses, weekly:wk?{pct:wk.pct, resets:wk.resets}:null,
    theme:panelTheme(), artTheme:pickTheme("catArt"),
    // los dos selectores son DEL GATITO: con la pastilla, los globos siguen
    // al tema del panel y no a una preferencia que ahí no se ve
    skinTheme: getPillStyle()==="cat" ? pickTheme("catSkin") : panelTheme(),
    style:getPillStyle(), mascot:mascotState(ses,weekPct),
    labels:pillLabels(),
    sesReset: ses&&ses.resets?fmtReset(ses.resets):"",

}

// ---------- simulador de estados del gatito (SOLO compilaciones de dev) ----------
// Recorre el ciclo completo —dibujo Y globo— con una pausa ajustable entre
// pasos, para verlo entero sin esperar a que se cumplan las condiciones reales
// (cruzar una alarma, agotar la sesión, agotar la semana, esperar el reset).
// Mientras corre, mascotState() devuelve el estado forzado, así que los
// refrescos normales del panel no lo pisan. Vive en memoria: cerrar la app
// cancela la simulación.
// Los globos simulados NO tocan el localStorage (nada de ackPending ni
// infoBalloon): al terminar no debe quedar ningún aviso pendiente falso.
let simRunning=false, simMascot=null, simTimer=null, simTick=null, simB=null;
// el paso puede sobreescribir lo que calcula balloonMeta (p. ej. forzar la
// severidad para enseñar el mismo aviso en ámbar y en rojo)
function simBalloon(o){
  EVENT?.emit("notif:update",{...balloonMeta(o.kind), ...o});
  invoke?.("set_notif_visible",{visible:true});
}
// Usa los datos REALES cuando existen (tu propio reset, tu propia alarma) y
// solo inventa la fecha si aún no hay lectura de cuota.
function simReset(which, fallbackMs){
  const r = which==="session" ? lastPill?.session?.resets : lastPill?.weekly?.resets;
  return r || new Date(Date.now()+fallbackMs).toISOString();
}
function simAlarmBody(){
  const thr=[...getAlarms()].sort((a,b)=>b-a)[0]||80;
  return thr>=95 ? t("notif_hi",thr) : t("notif_lo",thr);
}
const SIM_CAT=[
  {m:"normal"},                                                        // sin globo
  {m:"fire",   b:()=>({kind:"alarm",   body:simAlarmBody()})},
  {m:"break",  b:()=>({kind:"break",   body:breakBody(simReset("session",8*60000))})},
  {m:"zzz",    b:()=>({kind:"zzz",     body:weekBody(simReset("weekly",3*24*3.6e6))})},
  {m:"normal", b:()=>({kind:"session", body:balloonBody("session")})}, // vuelve la cuota
];
// Guion de la PASTILLA: no hay mascota que cambiar, así que recorre los
// AVISOS — uno por cada severidad e icono del popover. La alarma sale dos
// veces a propósito: por debajo del 95% es ámbar y por encima es roja, y ver
// las dos seguidas es la única forma de comparar.
function simPillSeq(){
  const low=[...getAlarms()].sort((a,b)=>a-b)[0]||80;
  const seq=[
    {b:()=>({kind:"alarm", body:t("notif_lo",low), sev:"warn"})},
    {b:()=>({kind:"alarm", body:t("notif_hi",95),  sev:"danger"})},
    {b:()=>({kind:"break", body:breakBody(simReset("session",8*60000))})},
    {b:()=>({kind:"zzz",   body:weekBody(simReset("weekly",3*24*3.6e6))})},
  ];
  // el del presupuesto solo si el usuario puso uno: sin cifra real no se
  // inventa un importe (invariante: nada de datos de demo en la app real)
  const bg=+localStorage.getItem("budgetWeek")||0;
  if(bg>0) seq.push({b:()=>({kind:"budget", body:t("notif_budget", bg.toFixed(2), bg)})});
  seq.push({b:()=>({kind:"session", body:balloonBody("session")})});
  return seq;
}
let simSeq=SIM_CAT;
// minutos por estado, ajustables (admite decimales: 0.5 = 30 s). Se lee en
// cada paso, así que cambiarlo a media simulación afecta al siguiente estado.
function simMs(){ return Math.max(5, (parseFloat($("simMin").value)||1)*60)*1000; }
const simLeft=ms=> ms>=60000 ? Math.ceil(ms/60000)+" min" : Math.ceil(ms/1000)+" s";
function simPush(){
  if(lastPill){
    lastPill.mascot=mascotState(lastPill.session, lastPill.weekly?lastPill.weekly.pct:null);
    EVENT?.emit("quota:update", lastPill);
  } else {   // aún sin cuota: al menos que cambie el dibujo
    EVENT?.emit("quota:update",{ok:false, mascot:simMascot||"normal",
      theme:document.body.classList.contains("light")?"light":"dark"});
  }
}
function simLabel(){
  return getPillStyle()==="cat" ? "🐱 Simular estados" : "🔔 Simular avisos";
}
function simStop(msg){
  clearTimeout(simTimer); clearInterval(simTick); simTimer=null; simTick=null;
  simRunning=false; simMascot=null; simB=null; simPush();
  invoke?.("set_notif_visible",{visible:false});
  processAcks();          // si había un aviso REAL pendiente, vuelve a salir
  $("simBtn").textContent=simLabel();
  $("simMsg").textContent=msg||"";
}
function simStep(i){
  if(i>=simSeq.length){ simStop("listo · de vuelta al estado real"); return; }
  const step=simSeq[i];
  simMascot=step.m||null; simPush();
  // el globo se queda entre pasos y solo cambia de texto (así no parpadea);
  // si al paso no le toca globo, se cierra
  simB = step.b ? step.b() : null;
  if(simB) simBalloon(simB);
  else invoke?.("set_notif_visible",{visible:false});
  let left=simMs();
  const paint=()=>{ $("simMsg").textContent=
    `${i+1}/${simSeq.length} · ${simB?(simB.sev||simB.kind):step.m} · ${simLeft(left)}`; };
  paint();
  clearInterval(simTick);
  simTick=setInterval(()=>{ left-=1000; if(left>0) paint(); },1000);
  simTimer=setTimeout(()=>simStep(i+1), left);
}

// Qué viaja: lo que define CÓMO usas la app. Fuera se quedan la posición del
// widget (cada pantalla es distinta) y la identidad de la máquina.
function hubCfgSnapshot(srv){
  return {
    v: 1,
    savedAt: new Date().toISOString(),
    lang,
    theme: panelTheme(),
    alarms: getAlarms(),
    budgetWeek: localStorage.getItem("budgetWeek") || "",
    days: curDays,

    pillLayer: $("pillLayerSel").value,
    catArt: localStorage.getItem("catArt") || "auto",
    catSkin: localStorage.getItem("catSkin") || "auto",
    // La LISTA de servidores (nombre, host, comando) sí viaja: no es un
    // secreto, es una libreta de direcciones, y con varios servidores es lo
    // más pesado de rehacer a mano. Las LLAVES no viajan nunca: MichiClaude
    // no las tiene ni las lee — de eso se encarga el SSH del sistema.
    // Se pasa desde fuera y no se lee la variable `remotes`: esa solo se
    // rellena al abrir Fuentes de datos, así que guardar sin haber pasado por
    // esa pestaña dejaba la lista vacía sin decir nada (visto 2026-07-28).
    remotes: srv,
  };
}
// Se aplica sobre el almacén y luego se recarga el panel: hay ajustes que se
// leen al arrancar, y repintarlos uno a uno sería fácil de olvidar al añadir
// el siguiente.
function hubCfgApply(c){
  if(!c || typeof c!=="object") return false;
  const set=(k,v)=>{ if(v==null||v==="") localStorage.removeItem(k); else localStorage.setItem(k,String(v)); };
  if(c.lang && I18N[c.lang]) set("lang", c.lang);
  if(c.theme==="light"||c.theme==="dark") set("theme", c.theme);
  if(Array.isArray(c.alarms)) set("alarms", JSON.stringify(c.alarms));
  if(c.budgetWeek!=null) set("budgetWeek", c.budgetWeek);
  if([1,7,15,30].includes(+c.days)) set("days", +c.days);
  set("catArt",  c.catArt ==="auto" ? null : c.catArt);
  set("catSkin", c.catSkin==="auto" ? null : c.catSkin);
  // estos dos los guarda el backend, no el almacén del panel
  if(c.pillStyle) invoke?.("set_pill_style",{style:c.pillStyle==="cat"?"cat":"plain"});
  if(c.pillLayer) invoke?.("set_pill_layer",{layer:c.pillLayer});
  // Los servidores se FUSIONAN por host, no se reemplazan: si esta máquina
  // tiene uno que la otra no conocía, quitárselo la dejaría sin acceso, y
  // recuperar un servidor cuesta mucho más que borrar una fila de sobra.
  if(Array.isArray(c.remotes) && c.remotes.length){
    const byHost=new Map(remotes.map(r=>[r.host, r]));
    for(const r of c.remotes){
      if(r && typeof r.host==="string" && r.host.trim()) byHost.set(r.host, r);
    }
    invoke?.("save_remotes",{remotes:[...byHost.values()]});
  }
  return true;
}

// ---------- icono de bandeja dinámico ----------
// El % de sesión vive junto al reloj, como los medidores de batería/CPU: se
// dibuja en un canvas y el backend lo aplica como icono del tray (update_tray).
// (Windows 11 no permite incrustar ventanas en la barra; esta es la vía nativa.)
const HEX={ok:"#40b869",warn:"#e6a417",bad:"#f05a41",dim:"#9aa0aa"};
function colorHex(pct,pace){ if(pct>=95) return HEX.bad;
  if(pace!=null && pct>pace+8) return pct>85?HEX.bad:HEX.warn;
  if(pct>=80) return HEX.warn; return HEX.ok; }

function updateTray(ses, weekPct){
  if(!invoke) return;
  const S=32, cv=document.createElement("canvas"); cv.width=cv.height=S;
  const ctx=cv.getContext("2d");
  const label = ses ? String(Math.round(ses.pct)) : "–";
  const c = ses ? colorHex(ses.pct, ses.pace) : HEX.dim;
  ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.font=`bold ${label.length>2?18:24}px "Segoe UI",sans-serif`;
  const y = S/2 - (weekPct!=null?2:0);
  // Contorno oscuro antes del relleno: la barra de tareas puede ser clara,
  // oscura o de un color de acento, y el verde/ámbar sobre blanco se lava.
  // Con el contorno el número se lee sobre cualquier fondo sin tener que
  // detectar el tema de Windows (que además no cubre fondos personalizados).
  ctx.lineWidth=4; ctx.lineJoin="round"; ctx.strokeStyle="rgba(0,0,0,.85)";
  ctx.strokeText(label, S/2, y);
  ctx.fillStyle=c;
  ctx.fillText(label, S/2, y);
  if(weekPct!=null){                      // barrita semanal al pie del icono
    ctx.fillStyle="rgba(0,0,0,.55)"; ctx.fillRect(3,S-6,S-6,5);   // marco
    ctx.fillStyle="rgba(160,160,160,.55)"; ctx.fillRect(4,S-5,S-8,3);
    ctx.fillStyle=colorHex(weekPct,null);
    ctx.fillRect(4,S-5,Math.round((S-8)*Math.min(100,weekPct)/100),3);
  }
  const tip = ses
    ? t("tray_tip", Math.round(ses.pct), fmtReset(ses.resets), weekPct!=null?Math.round(weekPct):null)
    // sin datos: el tooltip dice POR QUÉ ("token vencido…"), no solo que no hay
    : t("tray_no_data") + (lastErrCode ? " · " + errText(lastErrCode) : "");
  invoke("update_tray",{rgba:Array.from(ctx.getImageData(0,0,S,S).data),
    width:S, height:S, tooltip:tip}).catch(()=>{});
}

// ---------- helpers de cuota ----------
function col(pct,pace){ if(pct>=95) return "var(--bad)";
  if(pace!=null && pct>pace+8) return pct>85?"var(--bad)":"var(--warn)";
  if(pct>=80) return "var(--warn)"; return "var(--ok)"; }
function fmtReset(iso){ if(!iso) return "";
  const ms=new Date(iso)-Date.now(); if(ms<=0) return t("reset_now");
  const h=Math.floor(ms/3.6e6),m=Math.floor(ms%3.6e6/6e4);
  return t("reset_in",h,m); }

function prettyBucket(k){
  return k.replace(/seven_day|7d/gi,"Weekly").replace(/five_hour|5h/gi,"Session")
          .replace(/[_-]/g," ").replace(/\b\w/g,c=>c.toUpperCase());
}

// Nombre bonito de modelo. GENÉRICO a propósito: sin lista de familias ni
// de versiones, para que los modelos que Anthropic saque mañana se
// identifiquen solos (mismo criterio que los buckets de cuota). Separa el
// id en palabras (familia) y números (versión), en cualquier orden:
//   claude-opus-4-5-20250929 -> Opus 4.5      claude-opus-5 -> Opus 5
//   claude-3-5-sonnet-latest -> Sonnet 3.5    claude-fable-5 -> Fable 5
function prettyModel(id){
  if(!id) return t("unknown_model");
  const s=String(id)
    .replace(/^claude-/i,"")        // prefijo de marca
    .replace(/\[[^\]]*\]/g,"")      // variantes entre corchetes: [1m]
    .replace(/-\d{8}$/,"");         // fecha del snapshot
  const words=[], nums=[];
  for(const tok of s.split(/[-_.]+/)){
    if(!tok || /^latest$/i.test(tok)) continue;
    if(/^\d+$/.test(tok)) nums.push(tok);
    else if(/^[a-z]+$/i.test(tok)) words.push(tok);
    // tokens mixtos (p. ej. "1m") se ignoran: no son familia ni versión
  }
  if(!words.length) return s || t("unknown_model");
  const name=words.map(w=>w[0].toUpperCase()+w.slice(1).toLowerCase()).join(" ");
  return nums.length ? `${name} ${nums.join(".")}` : name;
}

// ---------- cuota real (dinámica por plan) ----------
// Fuente principal: el array `limits` del endpoint. Fallback: búsqueda
// recursiva de objetos con { utilization } por si el endpoint cambia de forma.
function extractBuckets(node, path, out){
  if(!node || typeof node!=="object") return;
  const u = node.utilization ?? node.used_percent ?? node.percent_used;
  if(typeof u==="number"){
    const key=path.join("."), isSes=/five|5h|session/i.test(key);
    out.push({
      kind: isSes?"session":(/seven_day$|week/i.test(key)?"weekly_all":"weekly_scoped"),
      label: isSes?t("session_label"):prettyBucket(key),
      pct:Math.round(u<=1?u*100:u),
      resets:node.resets_at ?? node.reset_at ?? null}); return;
  }
  for(const [k,v] of Object.entries(node)) extractBuckets(v,[...path,k],out);
}

function parseQuota(data){
  const out=[];
  if(Array.isArray(data?.limits) && data.limits.length){
    for(const l of data.limits){
      const pct=Math.round(l.percent ?? l.utilization ?? 0);
      const resets=l.resets_at ?? null;
      let kind,label;
      if(l.kind==="session" || l.group==="session"){ kind="session"; label=t("session_label"); }
      else if(l.kind==="weekly_all"){ kind="weekly_all"; label=t("weekly_all"); }
      else if(l.kind==="weekly_scoped"){
        const m=l.scope?.model?.display_name || l.scope?.surface || "?";
        kind="weekly_scoped"; label=t("weekly_x", m);
      } else { kind=l.kind||l.group||"otro"; label=prettyBucket(l.kind||l.group||"otro"); }
      out.push({kind,label,pct,resets});
    }
  } else {
    extractBuckets(data,[],out);         // fallback recursivo
  }
  return out;
}

const WRANK={session:0,weekly_all:1,weekly_scoped:2};
let weeklyAllPct=null;   // % semanal global: lo usa la barrita del icono de bandeja

// marcador de ritmo: % del periodo ya transcurrido
function elapsedPct(resets,hours){ if(!resets) return null;
  const left=(new Date(resets)-Date.now())/3.6e6;
  return Math.round(Math.min(100,Math.max(0,(1-left/hours)*100))); }
