<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MichiClaude</title>
<style>
  :root{
    --font:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
    --mono:"Cascadia Code",ui-monospace,"Consolas",monospace;
    /* fondo SÓLIDO: con alpha se transparenta lo que haya detrás del panel */
    --mica:#1e2128;
    --surface:rgba(255,255,255,.045);
    --stroke:rgba(255,255,255,.09);
    --stroke-soft:rgba(255,255,255,.055);
    --txt:#e9ebef; --txt-mut:#969ba6; --txt-dim:#6c717c;
    --brand:#d97757; --accent:#56c7d6;
    --accent-weak:rgba(86,199,214,.14); --accent-line:rgba(86,199,214,.35);
    --ok:#40b869; --warn:#e6a417; --bad:#f05a41;
    --track:rgba(255,255,255,.08);
  }
  body.light{
    --mica:#f3f4f7;
    --surface:rgba(0,0,0,.035);
    --stroke:rgba(0,0,0,.1);
    --stroke-soft:rgba(0,0,0,.06);
    --txt:#1b1e24; --txt-mut:#575d68; --txt-dim:#8a909b;
    /* teal profundo: el #56c7d6 brillante queda lavado sobre blanco (contraste
       ~1.7:1). Este da ~4.7:1 — legible en pestañas, enlaces y barras. */
    --accent:#0b7c8c;
    --accent-weak:rgba(11,124,140,.12); --accent-line:rgba(11,124,140,.30);
    --track:rgba(0,0,0,.09);
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:transparent;height:100%}
  /* color-scheme: los controles nativos (desplegables, spinners, scrollbars)
     se pintan a juego con el tema — sin esto, la lista del idioma se ve mal
     en oscuro */
  body{font-family:var(--font);color:var(--txt);padding:8px;overflow:hidden;color-scheme:dark}
  body.light{color-scheme:light}
  /* si el contenido crece (ajustes abiertos), el panel hace scroll interno */
  .panel{max-height:calc(100vh - 16px);overflow-y:auto;scrollbar-width:thin}

  .panel{
    background:var(--mica);border-radius:14px;
    box-shadow:0 24px 60px -12px rgba(0,0,0,.7),0 0 0 1px var(--stroke);
    padding:0 15px 13px;   /* el relleno de arriba vive en .p-top (sticky) */
  }
  /* Encabezado + pestañas SIEMPRE a la vista: al hacer scroll dentro del panel
     se quedan pegados arriba en vez de irse. Los márgenes negativos los llevan
     de borde a borde para que el contenido no se cuele por los lados, y el
     relleno de abajo sustituye al margen de .tabs (un margen no lleva fondo y
     dejaría una rendija transparente por donde se vería pasar el texto). */
  .p-top{position:sticky;top:0;z-index:5;background:var(--mica);
    margin:0 -15px;padding:15px 15px 12px}
  body.light .panel{box-shadow:0 24px 60px -14px rgba(30,40,60,.35),0 0 0 1px var(--stroke)}
  .p-head{display:flex;align-items:center;gap:10px;margin-bottom:13px;
    cursor:grab;user-select:none;-webkit-user-select:none}
  .p-head:active{cursor:grabbing}
  .p-head button{cursor:pointer}
  .p-head .mark{width:22px;height:22px;flex:0 0 auto}
  .p-htext{min-width:0;flex:1 1 auto}
  .p-title{font-size:13.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .p-sub{font-size:11px;color:var(--txt-dim);font-family:var(--mono);margin-top:4px;
    display:flex;align-items:center;gap:6px;transition:opacity .2s;
    min-width:0;white-space:normal;overflow-wrap:anywhere}
  .p-sub #syncTxt{min-width:0;overflow-wrap:anywhere}
  .p-sub .live{flex:0 0 auto}
  .live{width:7px;height:7px;border-radius:50%;background:var(--ok);
    box-shadow:0 0 0 0 rgba(64,184,105,.6);animation:pulse 2.4s infinite}
  .live.err{background:var(--bad);animation:none}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(64,184,105,.5)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
  .plan{margin-left:auto;flex:0 0 auto;font-size:10.5px;font-weight:650;letter-spacing:.4px;
    color:var(--accent);background:var(--accent-weak);
    border:1px solid var(--accent-line);padding:3px 8px;border-radius:7px}
  .xbtn{margin-left:8px;width:24px;height:24px;border-radius:6px;border:0;cursor:pointer;
    background:transparent;color:var(--txt-mut);font-size:14px;line-height:1}
  .xbtn:hover{background:var(--surface);color:var(--txt)}
  .p-head .xbtn{margin-left:4px}

  /* pestañas (subrayado activo, estilo navegación) */
  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--stroke-soft)}
  .tab{background:transparent;border:0;border-bottom:2px solid transparent;
    color:var(--txt-mut);font-family:var(--font);font-size:12px;font-weight:600;
    padding:7px 10px;cursor:pointer;letter-spacing:.2px}
  .tab:hover{color:var(--txt)}
  .tab.on{color:var(--accent);border-bottom-color:var(--accent)}

  .sect{border-top:1px solid var(--stroke-soft);padding-top:11px;margin-top:11px}
  .sect:first-of-type{border-top:0;margin-top:0;padding-top:0}
  .eyebrow{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--txt-dim);
    font-weight:700;margin-bottom:9px;display:flex;justify-content:space-between;align-items:center}
  .eyebrow .q{font-family:var(--mono);letter-spacing:0;text-transform:none;
    color:var(--txt-mut);font-weight:500;font-size:11px}

  .hero{display:flex;gap:14px;align-items:center}
  .gauge{width:132px;flex:0 0 auto;position:relative;text-align:center}
  .gauge svg{width:132px;height:78px;display:block}
  .g-val{position:absolute;left:0;right:0;top:38px;font-family:var(--mono);font-weight:700;
    font-size:23px;letter-spacing:.5px}
  .g-cap{position:absolute;left:0;right:0;top:64px;font-size:10px;color:var(--txt-dim)}
  .g-reset{font-family:var(--mono);font-size:11px;color:var(--txt-mut);margin-top:2px}

  .stack{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
  .bar-row .brow-top{display:flex;justify-content:space-between;align-items:baseline;
    gap:8px;min-width:0;font-size:11.5px;margin-bottom:5px}
  .bar-row .brow-top.wrap{flex-wrap:wrap;gap:2px 8px}
  .bar-row .brow-top.wrap .rst{white-space:normal;min-width:0;margin-left:0}
  .bar-row .lbl{color:var(--txt-mut);flex:1 1 auto;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar-row .lbl b{color:var(--txt);font-weight:600}
  .bar-row .rst{font-family:var(--mono);font-size:10.5px;color:var(--txt-dim);flex:0 1 auto;margin-left:8px}
  .track{position:relative;height:9px;border-radius:6px;background:var(--track);overflow:hidden}
  .mini .track{height:6px}
  .fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px;transition:width .6s,background .3s}
  .pace{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--txt);opacity:.85}

  .proj{display:flex;gap:11px;align-items:flex-start;border-radius:10px;padding:10px 12px;
    background:rgba(230,164,23,.12);border:1px solid rgba(230,164,23,.32)}
  .proj.calm{background:rgba(64,184,105,.11);border-color:rgba(64,184,105,.3)}
  .proj .ptxt{font-size:12px;line-height:1.42}
  .proj .rate{font-family:var(--mono);font-size:10.5px;color:var(--txt-mut);margin-top:3px}

  .plist{display:flex;flex-direction:column;gap:8px}
  .pitem{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
  .pitem .pname{font-size:12px;display:flex;align-items:center;gap:7px;min-width:0}
  .pitem .swatch{width:8px;height:8px;border-radius:2px;flex:0 0 auto}
  .pitem .pname span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pitem .pcost{font-family:var(--mono);font-size:12px;font-weight:600}
  .pitem .pbar{grid-column:1/-1;height:5px;border-radius:4px;background:var(--track);overflow:hidden}
  .pitem .pbar i{display:block;height:100%;border-radius:4px}
  .pitem.other{margin-top:2px;padding-top:8px;border-top:1px dashed var(--stroke-soft);cursor:help}
  .pitem.other .pname span:last-child{color:var(--txt-mut);font-style:italic}
  .pitem.other .pcost{color:var(--txt-mut);font-weight:500}

  .split{height:11px;border-radius:6px;overflow:hidden;display:flex;border:1px solid var(--stroke-soft)}
  .legend{display:flex;gap:14px;margin-top:8px;flex-wrap:wrap}
  .legend span{font-size:11px;color:var(--txt-mut);display:flex;align-items:center;gap:6px}
  .legend b{width:8px;height:8px;border-radius:2px;display:inline-block}

  .p-foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;
    padding-top:10px;border-top:1px solid var(--stroke-soft)}
  .totals{display:flex;gap:16px}
  .totals .t{font-size:10px;color:var(--txt-dim);text-transform:uppercase;letter-spacing:.6px}
  .totals .t b{display:block;font-family:var(--mono);font-size:15px;color:var(--txt);margin-top:2px}
  .foot-note{font-size:10px;color:var(--txt-dim);max-width:160px;text-align:right;line-height:1.35}
  .errbox{font-size:11.5px;color:var(--warn);line-height:1.4;padding:6px 0}

  /* ajustes (fuentes de datos) */
  .cfg-note{font-size:11px;color:var(--txt-mut);line-height:1.5;margin-bottom:9px}
  .cfg-note b{color:var(--txt);font-weight:600}
  .cfg-form{display:flex;flex-direction:column;gap:6px;margin-top:9px}
  .cfg-form input{background:var(--surface);border:1px solid var(--stroke);border-radius:7px;
    padding:6px 9px;color:var(--txt);font-family:var(--mono);font-size:11px;outline:none}
  .cfg-form input:focus{border-color:var(--accent)}
  .cfg-form button{align-self:flex-start;background:var(--accent-weak);color:var(--accent);
    border:1px solid var(--accent-line);border-radius:7px;padding:6px 12px;
    font-size:11.5px;cursor:pointer;font-family:var(--font)}
  .cfg-form button:hover{background:var(--accent-line)}
  #rMsg{font-size:11px;color:var(--txt-mut);font-family:var(--mono)}
  #remList .pitem{grid-template-columns:1fr auto}
  .cfg-row{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--txt-mut)}
  /* select con colores SÓLIDOS explícitos: el popup nativo de opciones no
     hereda bien — oscuro: fondo oscuro/letra blanca; claro: al revés */
  .cfg-row select{background:#262a33;border:1px solid var(--stroke);border-radius:7px;
    padding:4px 8px;color:#e9ebef;font-family:var(--font);font-size:11.5px;outline:none}
  .cfg-row select option{background:#262a33;color:#e9ebef}
  body.light .cfg-row select{background:#ffffff;color:#1b1e24}
  body.light .cfg-row select option{background:#ffffff;color:#1b1e24}
  .cfg-lbl{font-size:10.5px;color:var(--txt-dim);margin-top:6px;letter-spacing:.3px}
  .btnrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .btnrow button{align-self:auto}
  .rstat{font-size:10px;font-family:var(--mono);margin-left:8px;flex:0 0 auto;color:var(--txt-dim)}
  .rstat.ok{color:var(--ok)} .rstat.bad{color:var(--bad)}

  /* alarmas de uso (chips) */
  .chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .chip{display:inline-flex;align-items:center;gap:5px;background:var(--surface);
    border:1px solid var(--stroke);border-radius:999px;padding:3px 9px;
    font-family:var(--mono);font-size:11px}
  .chip b{cursor:pointer;color:var(--txt-dim);font-weight:400}
  .chip b:hover{color:var(--bad)}


  /* selector de periodo (1d/7d/30d) */
  .dlink{cursor:pointer;color:var(--txt-dim)}
  .dlink:hover{color:var(--txt)}
  .dlink.on{color:var(--accent);font-weight:700}

  /* etiqueta de origen del proyecto (local / wsl / servidor) */
  .srctag{font-size:9px;color:var(--txt-dim);background:var(--surface);
    border:1px solid var(--stroke-soft);padding:1px 6px;border-radius:5px;
    margin-left:7px;flex:0 0 auto;letter-spacing:.3px}

  /* tendencia diaria: barras finas, un solo tono, hoy enfatizado por intensidad */
  .tchart{display:flex;align-items:flex-end;gap:2px;height:56px;
    border-bottom:1px solid var(--stroke-soft);padding-bottom:1px}
  .tchart i{flex:1 1 0;background:var(--accent);opacity:.5;border-radius:3px 3px 0 0;
    min-height:2px;cursor:default;transition:opacity .15s}
  .tchart i:hover{opacity:1}
  .tchart i.today{opacity:1}
  .tchart i.zero{background:var(--track);opacity:1}
  .tspan{display:flex;justify-content:space-between;font-size:9px;color:var(--txt-dim);
    font-family:var(--mono);margin-top:4px}

  /* bienvenida/guía adaptativa:
     - body.setup   (sin token Y sin datos locales = no hay Claude Code):
       tarjeta completa, oculta el resto de Principal.
     - body.tokenhint (sin token pero CON datos locales = token vencido):
       banner compacto arriba, NO oculta los datos que sí hay. */
  #welcomeBox,.w-new,.w-expired{display:none}
  body.setup #welcomeBox,body.setup .w-new{display:block}
  body.setup #tab-main > .sect:not(#welcomeBox){display:none}
  body.tokenhint #welcomeBox,body.tokenhint .w-expired{display:block}
  body.tokenhint #welcomeBox{padding-bottom:0}
  .setup-p{font-size:12.5px;color:var(--txt-mut);line-height:1.5;margin:0 0 11px}
  .setup-steps{margin:0 0 11px;padding-left:20px;font-size:12.5px;line-height:1.7;color:var(--txt)}
  .setup-url{display:inline-block;font-family:var(--mono);font-size:12px;color:var(--accent);
    background:var(--surface);border:1px solid var(--stroke);border-radius:7px;padding:6px 10px;
    margin-bottom:11px;user-select:text;-webkit-user-select:text;cursor:text}
  .setup-note{font-size:11.5px;color:var(--txt-dim);line-height:1.5;margin:0 0 6px}

  /* fuentes de datos: nota en lista + formulario etiquetado + filas de servidores */
  .src-list{margin:0;padding-left:16px;display:flex;flex-direction:column;gap:5px}
  .src-list li{line-height:1.45}
  .fld{display:flex;flex-direction:column;gap:4px}
  .fld label{font-size:11.5px;font-weight:600}
  .fhint{font-size:10.5px;color:var(--txt-dim);line-height:1.4}
  .cfg-form input.mono{font-family:var(--mono);font-size:11.5px}
  .cfg-form button:disabled{opacity:.5;cursor:default}
  .srv-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;
    padding:8px 0;border-bottom:1px solid var(--stroke-soft)}
  .srv-row:last-child{border-bottom:0}
  .srv-name{font-size:12.5px;font-weight:650}
  .srv-meta{font-family:var(--mono);font-size:10.5px;color:var(--txt-dim);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .spill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;
    padding:2px 8px;border-radius:20px;white-space:nowrap}
  .spill i{width:6px;height:6px;border-radius:50%;font-style:normal}
  .spill.ok{background:rgba(64,184,105,.14);color:var(--ok)}
  .spill.ok i{background:var(--ok)}
  .spill.bad{background:rgba(240,90,65,.12);color:var(--bad)}
  .spill.bad i{background:var(--bad)}
  .spill.wait{background:var(--surface);color:var(--txt-dim)}
  .spill.wait i{background:var(--txt-dim)}
  .del-btn{border:0;background:transparent;color:var(--txt-dim);width:28px;height:28px;
    display:grid;place-items:center;border-radius:7px;cursor:pointer;transition:.15s}
  .del-btn:hover{background:rgba(240,90,65,.12);color:var(--bad)}
  .del-btn.arm{width:auto;padding:0 9px;background:rgba(240,90,65,.15);color:var(--bad);
    font-size:10.5px;font-weight:700}
  #srvCount{background:var(--surface);border:1px solid var(--stroke);border-radius:20px;
    padding:2px 9px;font-size:10px}
</style>
</head>
<body>
<div class="panel">
  <div class="p-top">
  <div class="p-head" id="pHead">
    <span class="mark" id="mark"></span>
    <div class="p-htext">
      <div class="p-title">MichiClaude</div>
      <div class="p-sub" id="syncLine"><span class="live" id="liveDot"></span><span id="syncTxt"></span></div>
    </div>
    <span class="plan" id="planTag">—</span>
    <button class="xbtn" id="themeBtn">◐</button>
    <button class="xbtn" id="hideBtn">✕</button>
  </div>

  <div class="tabs">
    <button class="tab on" data-tab="main" data-i18n="tab_main"></button>
    <button class="tab" data-tab="sources" data-i18n="sources_title"></button>
    <button class="tab" data-tab="prefs" data-i18n="prefs_title"></button>
  </div>
  </div><!-- /p-top -->

  <div id="tab-main">

  <div class="sect" id="welcomeBox">
    <div class="w-new">
      <div class="eyebrow" data-i18n="setup_title"></div>
      <p class="setup-p" data-i18n="setup_body"></p>
      <ol class="setup-steps">
        <li data-i18n="setup_s1"></li>
        <li data-i18n="setup_s2"></li>
        <li data-i18n="setup_s3"></li>
      </ol>
      <div class="setup-url">claude.com/claude-code</div>
      <p class="setup-note" data-i18n="setup_remote"></p>
      <p class="setup-note" data-i18n="setup_free"></p>
    </div>
    <div class="w-expired">
      <div class="eyebrow" data-i18n="setup_expired_title"></div>
      <p class="setup-p" data-i18n="setup_expired"></p>
    </div>
  </div>

  <div class="sect">
    <div class="eyebrow"><span data-i18n="quota_title"></span> <span class="q" id="remQ"></span></div>
    <div class="hero">
      <div class="gauge">
        <svg viewBox="0 0 132 78">
          <path d="M 14 72 A 52 52 0 0 1 118 72" fill="none" stroke="var(--track)" stroke-width="11" stroke-linecap="round"/>
          <path id="gFill" d="M 14 72 A 52 52 0 0 1 118 72" fill="none" stroke="var(--ok)" stroke-width="11"
                stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/>
        </svg>
        <div class="g-val" id="sesVal">–</div>
        <div class="g-cap" data-i18n="session_cap"></div>
        <div class="g-reset" id="sesReset"></div>
      </div>
      <div class="stack" id="weekStack"><!-- barras semanales dinámicas --></div>
    </div>
  </div>

  <div class="sect" id="projSect" hidden>
    <div class="eyebrow" data-i18n="at_this_rate"></div>
    <div class="proj calm" id="proj">
      <div>
        <div class="ptxt" id="projTxt"></div>
        <div class="rate" id="rateTxt"></div>
      </div>
    </div>
  </div>

  <div class="sect">
    <div class="eyebrow"><span data-i18n="spend_title"></span>
      <span class="q"><span class="dlink" data-d="1">1d</span> · <span class="dlink" data-d="7">7d</span> · <span class="dlink" data-d="30">30d</span> · <span data-i18n="spend_q" data-i18n-title="spend_tip" style="cursor:help;border-bottom:1px dotted var(--txt-dim)"></span><span id="priceWarn" hidden style="cursor:pointer;color:var(--warn);margin-left:5px">&#9888;</span></span></div>
    <div class="plist" id="plist"></div>
  </div>

  <div class="sect" id="trendSect" hidden>
    <div class="eyebrow"><span data-i18n="trend_title"></span> <span class="q" data-i18n="trend_q"></span></div>
    <div class="tchart" id="tchart"></div>
    <div class="tspan"><span id="tFrom"></span><span id="tTo"></span></div>
  </div>

  <div class="sect" id="modelSect" hidden>
    <div class="eyebrow"><span data-i18n="model_title"></span> <span class="q" id="modelQ"></span></div>
    <div class="split" id="split"></div>
    <div class="legend" id="legend"></div>
  </div>

  </div><!-- /tab-main -->

  <div id="tab-sources" hidden>
  <div class="sect" id="cfgSect">
    <div class="cfg-note" data-i18n-html="cfg_note"></div>
  </div>
  <div class="sect">
    <div class="eyebrow" data-i18n="srv_add_title"></div>
    <div class="cfg-form">
      <div class="fld">
        <label for="rName" data-i18n="lbl_name"></label>
        <input id="rName" data-i18n-ph="ph_name">
        <div class="fhint" data-i18n="hint_name"></div>
      </div>
      <div class="fld">
        <label for="rHost" data-i18n="lbl_host"></label>
        <input id="rHost" class="mono" data-i18n-ph="ph_host">
      </div>
      <div class="fld">
        <span id="rAdv" data-i18n="lbl_adv" style="cursor:pointer;font-size:10.5px;
          color:var(--accent);border-bottom:1px dotted var(--accent)"></span>
      </div>
      <div class="fld" id="rAdvBox" hidden>
        <label for="rCmd" data-i18n="lbl_cmd"></label>
        <input id="rCmd" class="mono" data-i18n-ph="ph_cmd">
        <div class="fhint" data-i18n="hint_cmd"></div>
      </div>
      <div class="btnrow">
        <button id="rAdd" data-i18n="btn_test"></button>
        <span id="rMsg"></span>
      </div>
    </div>
  </div>

const navLang=String(navigator.language||"").toLowerCase().slice(0,2);
let lang = localStorage.getItem("lang") || (I18N[navLang]?navLang:"en");
if(!I18N[lang]) lang="en";
function t(key,...a){
  const v=(I18N[lang]&&I18N[lang][key])??I18N.en[key];
  return typeof v==="function"?v(...a):(v??key);
}
function applyI18n(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-i18n]").forEach(el=>{ el.textContent=t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-html]").forEach(el=>{ el.innerHTML=t(el.dataset.i18nHtml); });
  document.querySelectorAll("[data-i18n-ph]").forEach(el=>{ el.placeholder=t(el.dataset.i18nPh); });
  document.querySelectorAll("[data-i18n-title]").forEach(el=>{ el.title=t(el.dataset.i18nTitle); });
  $("hideBtn").title=t("hide_title"); $("themeBtn").title=t("theme_title");
  $("langSel").value=lang;
}

// Traducción de códigos de error del backend (ERR_*)
function errText(code){
  code=String(code);
  if(code.startsWith("ERR_RATE_LIMITED")) return t("err_rate", +code.split(":")[1]||3);
  if(code.startsWith("ERR_API")) return t("err_api", code.split(":")[1]||"?");
  const map={ERR_NO_TOKEN:"err_no_token",ERR_TOKEN_EXPIRED:"err_expired",
             ERR_NET:"err_net",ERR_BAD_RESPONSE:"err_bad"};
  return map[code]?t(map[code]):code;
}

});

// ---------- marca ----------
function sunburst(size){
  const S=64,cx=32,cy=32,rays=11;let p=`<svg width="${size}" height="${size}" viewBox="0 0 ${S} ${S}">`;
  for(let i=0;i<rays;i++){const a=Math.PI*2*i/rays-Math.PI/2;
    const ux=Math.cos(a),uy=Math.sin(a),px=-uy,py=ux;
    const base=S*.04,tip=S*.46,mid=S*.26,hw=S*.055;
    const pts=[[cx+ux*base,cy+uy*base],[cx+ux*mid+px*hw,cy+uy*mid+py*hw],
      [cx+ux*tip,cy+uy*tip],[cx+ux*mid-px*hw,cy+uy*mid-py*hw]]
      .map(q=>q.map(n=>n.toFixed(2)).join(",")).join(" ");
    p+=`<polygon points="${pts}" fill="var(--brand)"/>`}
  return p+`<circle cx="${cx}" cy="${cy}" r="${S*.07}" fill="var(--brand)"/></svg>`;
}
$("mark").innerHTML=sunburst(22);

const TAURI = window.__TAURI__?.core;
const invoke = TAURI ? TAURI.invoke : null;
const EVENT = window.__TAURI__?.event;   // el panel alimenta al widget flotante por evento
const PALETTE = ["var(--accent)","var(--brand)","var(--ok)","var(--warn)","var(--txt-dim)"];
let lastQuotaData=null, lastLocalData=null;   // caché para re-render al cambiar idioma

// ---------- widget flotante: el panel es el ÚNICO que consulta; el widget escucha ----------
let lastPill=null;
function getPillStyle(){ return localStorage.getItem("pillStyle")==="cat"?"cat":"plain"; }
function pillLabels(){
  return {ses:t("pill_ses"), week:t("pill_week"), cardSes:t("card_ses"), cardWeek:t("card_week")};
}
// Estado del gatito — misma lógica que las notificaciones, de lo más grave a
// lo más leve:
// 😴 zzz   sin cuota SEMANAL (hit:week): dormido hasta que la semana se
//          restablezca — es el peor caso, no hay nada que hacer en días.
// ☕ break  sin cuota de la SESIÓN (hit:session): de descanso hasta el reset,
//          que llega en horas. Ambos banderines los limpia trackResets().
// 🔥 fire   alarma de % pendiente de "enterado": arde hasta que abra el panel.
// 🐱 normal cualquier otro caso.
function mascotState(ses, weekPct){
  if(simMascot) return simMascot;                     // simulador (solo en dev)
  if((weekPct!=null && Math.round(weekPct)>=100) || localStorage.getItem("hit:week")==="1")
    return "zzz";
  if((ses && Math.round(ses.pct)>=100) || localStorage.getItem("hit:session")==="1")
    return "break";
  if(localStorage.getItem("ackPending:alarm")==="1") return "fire";
  return "normal";
}
let lastPillArgs=null;
function emitPill(ses, wk, extras){
  lastPillArgs=[ses,wk,extras];             // para el tic del contador (abajo)
  const weekPct = wk ? wk.pct : null;
  lastPill={ok:!!ses, session:ses, weekly:wk?{pct:wk.pct, resets:wk.resets}:null,
    theme:document.body.classList.contains("light")?"light":"dark",
    style:getPillStyle(), mascot:mascotState(ses,weekPct),
    labels:pillLabels(),
    sesReset: ses&&ses.resets?fmtReset(ses.resets):"",
    wkReset: wk&&wk.resets?fmtReset(wk.resets):"",
    // buckets semanales extra (Fable, futuros…) tal como los reporte el
    // endpoint — DINÁMICO, nunca nombres hardcodeados (invariante #6)
    extras: extras||[],
    tip: ses?t("tray_tip",Math.round(ses.pct),fmtReset(ses.resets),weekPct!=null?Math.round(weekPct):null):t("tray_no_data")};
  EVENT?.emit("quota:update", lastPill);
}
// Cuando el widget (re)carga, pide el último dato conocido para no esperar el ciclo.
EVENT?.listen("pill:ready",()=>{ if(lastPill) EVENT.emit("quota:update", lastPill); });

// El "se restablece en…" del globo del hover baja solo, minuto a minuto. Sin
// esto se quedaba congelado hasta el siguiente ciclo de cuota (3 min), que es
// justo cuando más se mira: esperando a que vuelva la sesión. Rehace el
// resumen con los mismos datos —no consulta nada— así que también recalcula
// el estado del gatito de paso.
// Si la última lectura buena ya pasó de vieja, NO se reemite: onQuotaFail ya
// puso el widget en gris y revivir ese dato cada minuto lo desharía.
setInterval(()=>{
  if(lastPillArgs && Date.now()-lastSync<=STALE_MS) emitPill(...lastPillArgs);
}, 60000);

// ---------- simulador de estados del gatito (SOLO compilaciones de dev) ----------
// Recorre el ciclo completo —dibujo Y globo— con una pausa ajustable entre
// pasos, para verlo entero sin esperar a que se cumplan las condiciones reales
// (cruzar una alarma, agotar la sesión, agotar la semana, esperar el reset).
// Mientras corre, mascotState() devuelve el estado forzado, así que los
// refrescos normales del panel no lo pisan. Vive en memoria: cerrar la app
// cancela la simulación.
// Los globos simulados NO tocan el localStorage (nada de ackPending ni
// infoBalloon): al terminar no debe quedar ningún aviso pendiente falso.
let simMascot=null, simTimer=null, simTick=null, simB=null;
function simBalloon(body, kind){
  EVENT?.emit("notif:update",{body, kind});
  invoke?.("set_notif_visible",{visible:true});
}
// Usa los datos REALES cuando existen (tu propio reset, tu propia alarma) y
// solo inventa la fecha si aún no hay lectura de cuota.
function simReset(which, fallbackMs){
  const r = which==="session" ? lastPill?.session?.resets : lastPill?.weekly?.resets;
  return r || new Date(Date.now()+fallbackMs).toISOString();
}
function simAlarmBody(){
  const thr=[...getAlarms()].sort((a,b)=>b-a)[0]||80;
  return thr>=95 ? t("notif_hi",thr) : t("notif_lo",thr);
}
const SIM_SEQ=[
  {m:"normal"},                                                        // sin globo
  {m:"fire",   b:()=>({kind:"alarm",   body:simAlarmBody()})},
  {m:"break",  b:()=>({kind:"break",   body:breakBody(simReset("session",8*60000))})},
  {m:"zzz",    b:()=>({kind:"zzz",     body:weekBody(simReset("weekly",3*24*3.6e6))})},
  {m:"normal", b:()=>({kind:"session", body:balloonBody("session")})}, // vuelve la cuota
];
// minutos por estado, ajustables (admite decimales: 0.5 = 30 s). Se lee en
// cada paso, así que cambiarlo a media simulación afecta al siguiente estado.
function simMs(){ return Math.max(5, (parseFloat($("simMin").value)||1)*60)*1000; }
const simLeft=ms=> ms>=60000 ? Math.ceil(ms/60000)+" min" : Math.ceil(ms/1000)+" s";
function simPush(){
  if(lastPill){
    lastPill.mascot=mascotState(lastPill.session, lastPill.weekly?lastPill.weekly.pct:null);
    EVENT?.emit("quota:update", lastPill);
  } else {   // aún sin cuota: al menos que cambie el dibujo
    EVENT?.emit("quota:update",{ok:false, mascot:simMascot||"normal",
      theme:document.body.classList.contains("light")?"light":"dark"});
  }
}
function simStop(msg){
  clearTimeout(simTimer); clearInterval(simTick); simTimer=null; simTick=null;
  simMascot=null; simB=null; simPush();
  invoke?.("set_notif_visible",{visible:false});
  processAcks();          // si había un aviso REAL pendiente, vuelve a salir
  $("simBtn").textContent="🐱 Simular estados";
  $("simMsg").textContent=msg||"";
}
function simStep(i){
  if(i>=SIM_SEQ.length){ simStop("listo · de vuelta al estado real"); return; }
  const step=SIM_SEQ[i];
  simMascot=step.m; simPush();
  // el globo se queda entre pasos y solo cambia de texto (así no parpadea);
  // si al paso no le toca globo, se cierra
  simB = step.b ? step.b() : null;
  if(simB) simBalloon(simB.body, simB.kind);
  else invoke?.("set_notif_visible",{visible:false});
  let left=simMs();
  const paint=()=>{ $("simMsg").textContent=
    `${i+1}/${SIM_SEQ.length} · ${step.m}${step.b?" + globo":""} · ${simLeft(left)}`; };
  paint();
  clearInterval(simTick);
  simTick=setInterval(()=>{ left-=1000; if(left>0) paint(); },1000);
  simTimer=setTimeout(()=>simStep(i+1), left);
}
if(invoke) invoke("is_dev").then(d=>{ if(d) $("devSimRow").hidden=false; }).catch(()=>{});
$("simMin").value=localStorage.getItem("simMin")||"1";
$("simMin").addEventListener("change",()=>localStorage.setItem("simMin",$("simMin").value));
$("simBtn").addEventListener("click",()=>{
  if(simTimer||simTick){ simStop("detenido"); return; }
  if(getPillStyle()!=="cat"){ $("simMsg").textContent="activa el widget gatito primero"; return; }
  $("simBtn").textContent="■ Detener"; simStep(0);
});

// ---------- icono de bandeja dinámico ----------
// El % de sesión vive junto al reloj, como los medidores de batería/CPU: se
// dibuja en un canvas y el backend lo aplica como icono del tray (update_tray).
// (Windows 11 no permite incrustar ventanas en la barra; esta es la vía nativa.)
const HEX={ok:"#40b869",warn:"#e6a417",bad:"#f05a41",dim:"#9aa0aa"};
function colorHex(pct,pace){ if(pct>=95) return HEX.bad;
  if(pace!=null && pct>pace+8) return pct>85?HEX.bad:HEX.warn;
  if(pct>=80) return HEX.warn; return HEX.ok; }

function updateTray(ses, weekPct){
  if(!invoke) return;
  const S=32, cv=document.createElement("canvas"); cv.width=cv.height=S;
  const ctx=cv.getContext("2d");
  const label = ses ? String(Math.round(ses.pct)) : "–";
  const c = ses ? colorHex(ses.pct, ses.pace) : HEX.dim;
  ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.font=`bold ${label.length>2?18:24}px "Segoe UI",sans-serif`;
  const y = S/2 - (weekPct!=null?2:0);
  // Contorno oscuro antes del relleno: la barra de tareas puede ser clara,
  // oscura o de un color de acento, y el verde/ámbar sobre blanco se lava.
  // Con el contorno el número se lee sobre cualquier fondo sin tener que
  // detectar el tema de Windows (que además no cubre fondos personalizados).
  ctx.lineWidth=4; ctx.lineJoin="round"; ctx.strokeStyle="rgba(0,0,0,.85)";
  ctx.strokeText(label, S/2, y);
  ctx.fillStyle=c;
  ctx.fillText(label, S/2, y);
  if(weekPct!=null){                      // barrita semanal al pie del icono
    ctx.fillStyle="rgba(0,0,0,.55)"; ctx.fillRect(3,S-6,S-6,5);   // marco
    ctx.fillStyle="rgba(160,160,160,.55)"; ctx.fillRect(4,S-5,S-8,3);
    ctx.fillStyle=colorHex(weekPct,null);
    ctx.fillRect(4,S-5,Math.round((S-8)*Math.min(100,weekPct)/100),3);
  }
  const tip = ses
    ? t("tray_tip", Math.round(ses.pct), fmtReset(ses.resets), weekPct!=null?Math.round(weekPct):null)
    : t("tray_no_data");
  invoke("update_tray",{rgba:Array.from(ctx.getImageData(0,0,S,S).data),
    width:S, height:S, tooltip:tip}).catch(()=>{});
}

// ---------- helpers de cuota ----------
function col(pct,pace){ if(pct>=95) return "var(--bad)";
  if(pace!=null && pct>pace+8) return pct>85?"var(--bad)":"var(--warn)";
  if(pct>=80) return "var(--warn)"; return "var(--ok)"; }
function fmtReset(iso){ if(!iso) return "";
  const ms=new Date(iso)-Date.now(); if(ms<=0) return t("reset_now");
  const h=Math.floor(ms/3.6e6),m=Math.floor(ms%3.6e6/6e4);
  return t("reset_in",h,m); }

function prettyBucket(k){
  return k.replace(/seven_day|7d/gi,"Weekly").replace(/five_hour|5h/gi,"Session")
          .replace(/[_-]/g," ").replace(/\b\w/g,c=>c.toUpperCase());
}

// Nombre bonito de modelo. GENÉRICO a propósito: sin lista de familias ni
// de versiones, para que los modelos que Anthropic saque mañana se
// identifiquen solos (mismo criterio que los buckets de cuota). Separa el
// id en palabras (familia) y números (versión), en cualquier orden:
//   claude-opus-4-5-20250929 -> Opus 4.5      claude-opus-5 -> Opus 5
//   claude-3-5-sonnet-latest -> Sonnet 3.5    claude-fable-5 -> Fable 5
function prettyModel(id){
  if(!id) return t("unknown_model");
  const s=String(id)
    .replace(/^claude-/i,"")        // prefijo de marca
    .replace(/\[[^\]]*\]/g,"")      // variantes entre corchetes: [1m]
    .replace(/-\d{8}$/,"");         // fecha del snapshot
  const words=[], nums=[];
  for(const tok of s.split(/[-_.]+/)){
    if(!tok || /^latest$/i.test(tok)) continue;
    if(/^\d+$/.test(tok)) nums.push(tok);
    else if(/^[a-z]+$/i.test(tok)) words.push(tok);
    // tokens mixtos (p. ej. "1m") se ignoran: no son familia ni versión
  }
  if(!words.length) return s || t("unknown_model");
  const name=words.map(w=>w[0].toUpperCase()+w.slice(1).toLowerCase()).join(" ");
  return nums.length ? `${name} ${nums.join(".")}` : name;
}

// ---------- cuota real (dinámica por plan) ----------
// Fuente principal: el array `limits` del endpoint. Fallback: búsqueda
// recursiva de objetos con { utilization } por si el endpoint cambia de forma.
function extractBuckets(node, path, out){
  if(!node || typeof node!=="object") return;
  const u = node.utilization ?? node.used_percent ?? node.percent_used;
  if(typeof u==="number"){
    const key=path.join("."), isSes=/five|5h|session/i.test(key);
    out.push({
      kind: isSes?"session":(/seven_day$|week/i.test(key)?"weekly_all":"weekly_scoped"),
      label: isSes?t("session_label"):prettyBucket(key),
      pct:Math.round(u<=1?u*100:u),
      resets:node.resets_at ?? node.reset_at ?? null}); return;
  }
  for(const [k,v] of Object.entries(node)) extractBuckets(v,[...path,k],out);
}

function parseQuota(data){
  const out=[];
  if(Array.isArray(data?.limits) && data.limits.length){
    for(const l of data.limits){
      const pct=Math.round(l.percent ?? l.utilization ?? 0);
      const resets=l.resets_at ?? null;
      let kind,label;
      if(l.kind==="session" || l.group==="session"){ kind="session"; label=t("session_label"); }
      else if(l.kind==="weekly_all"){ kind="weekly_all"; label=t("weekly_all"); }
      else if(l.kind==="weekly_scoped"){
        const m=l.scope?.model?.display_name || l.scope?.surface || "?";
        kind="weekly_scoped"; label=t("weekly_x", m);
      } else { kind=l.kind||l.group||"otro"; label=prettyBucket(l.kind||l.group||"otro"); }
      out.push({kind,label,pct,resets});
    }
  } else {
    extractBuckets(data,[],out);         // fallback recursivo
  }
  return out;
}

const WRANK={session:0,weekly_all:1,weekly_scoped:2};
let weeklyAllPct=null;   // lo usa la fila "claude.ai / otros" en renderLocal

// marcador de ritmo: % del periodo ya transcurrido
function elapsedPct(resets,hours){ if(!resets) return null;
  const left=(new Date(resets)-Date.now())/3.6e6;
  return Math.round(Math.min(100,Math.max(0,(1-left/hours)*100))); }

function renderQuota(data){
  lastQuotaData=data;
  $("planTag").textContent = data?.plan?.name || data?.subscription?.plan || data?.plan_name || t("plan_sub");

  const buckets=parseQuota(data);
  const ses=buckets.find(b=>b.kind==="session");
  const weekly=buckets.filter(b=>b.kind!=="session")
    .sort((a,b)=>(WRANK[a.kind]??9)-(WRANK[b.kind]??9));
  const wkAll = weekly.find(b=>b.kind==="weekly_all") || weekly[0] || null;
  weeklyAllPct = wkAll ? wkAll.pct : null;
  trackResets(ses, weekly.find(b=>b.kind==="weekly_all"));

  if(ses){
    const pace=elapsedPct(ses.resets,5);
    const c=col(ses.pct,pace);
    $("gFill").setAttribute("stroke-dashoffset",(100-ses.pct));
    $("gFill").setAttribute("stroke",c);
    $("sesVal").textContent=ses.pct+"%"; $("sesVal").style.color=c;
    $("sesReset").textContent=fmtReset(ses.resets);
    $("remQ").textContent = pace!=null && ses.pct>pace+8 ? t("ahead_clock") : t("on_track");
    renderProjection(ses.pct,pace,ses.resets);
    maybeNotify(ses.pct,ses.resets);
  }

  $("weekStack").innerHTML = weekly.map((b)=>{
    const hero=b.kind==="weekly_all";
    const pace=elapsedPct(b.resets,168), c=col(b.pct,pace);
    return `<div class="bar-row ${hero?'':'mini'}">
      <div class="brow-top"><span class="lbl">${escapeHtml(b.label)}</span>
        <span class="rst">${b.pct}%</span></div>
      <div class="track"><div class="fill" style="width:${b.pct}%;background:${c}"></div>
        ${pace!=null?`<div class="pace" style="left:${pace}%"></div>`:""}</div>
      ${hero?`<div class="brow-top wrap" style="margin-top:4px;margin-bottom:0">
        <span class="rst">${pace!=null&&b.pct<=pace?t("pace_ok"):t("pace_watch")}</span>
        <span class="rst">${fmtReset(b.resets)}</span></div>`
       :`<div class="brow-top" style="margin-top:3px;margin-bottom:0">
        <span class="rst" style="margin-left:auto">${fmtReset(b.resets)}</span></div>`}
    </div>`;
  }).join("") || `<div class="errbox">${t("no_buckets")}</div>`;

  const sesInfo = ses ? {pct:ses.pct, resets:ses.resets, pace:elapsedPct(ses.resets,5)} : null;
  updateTray(sesInfo, weeklyAllPct);
  // buckets semanales por modelo (todos menos el "hero"), para el globo
  const wkExtras = weekly.filter(b=>b!==wkAll)
    .map(b=>({label:b.label, pct:b.pct, resets:b.resets?fmtReset(b.resets):""}));
  emitPill(sesInfo, wkAll?{pct:wkAll.pct, resets:wkAll.resets}:null, wkExtras);
}

// ---------- notificaciones ----------
function toast(body){
  const notif=window.__TAURI__?.notification;
  if(!notif) return;
  Promise.resolve(notif.isPermissionGranted())
    .then(g=> g ? true : notif.requestPermission().then(p=>p==="granted"))
    .then(ok=>{ if(ok) notif.sendNotification({title:"MichiClaude", body}); })
    .catch(()=>{});
}

// Alarmas de sesión configurables (como alarmas del celular, pero en % usado).
function getAlarms(){
  try{ const a=JSON.parse(localStorage.getItem("alarms")||"[80,95]");
    return Array.isArray(a)?a.filter(x=>x>=1&&x<=100):[80,95]; }
  catch(e){ return [80,95]; }
}
function saveAlarms(a){ localStorage.setItem("alarms", JSON.stringify(a.sort((x,y)=>x-y))); }

// ¿Cambió la ventana (sesión/semana)? Con TOLERANCIA: el resets_at del
// endpoint trae pequeñas variaciones entre consultas; solo un salto grande
// significa ventana nueva (si no, las alarmas se re-dispararían cada ciclo).
function windowChanged(storeKey, curIso, tolMin){
  const prev=localStorage.getItem(storeKey);
  localStorage.setItem(storeKey, curIso);
  if(!prev) return false;
  return Math.abs(new Date(curIso)-new Date(prev)) > tolMin*60000;
}

// Alarma de umbral: al cruzar un % configurado arranca un recordatorio que se
// REPITE cada 5 min hasta que el usuario abra el panel ("enterado"). Después,
// silencio hasta el siguiente umbral o la siguiente ventana de sesión.
function maybeNotify(pct,resets){
  if(resets && windowChanged("alarmWin", resets, 10)){
    localStorage.setItem("alarmFired","[]");          // ventana nueva: rearmar todo
    localStorage.removeItem("ackPending:alarm");
    localStorage.removeItem("ackLastToast:alarm");
  }
  let fired=[]; try{ fired=JSON.parse(localStorage.getItem("alarmFired")||"[]"); }catch(e){}
  const alarms=[...getAlarms()].sort((a,b)=>b-a);     // el más alto primero
  for(const thr of alarms){
    if(pct>=thr){
      if(!fired.includes(thr)){
        // marca este umbral y los menores como disparados (sin ráfagas)
        fired=Array.from(new Set([...fired, ...alarms.filter(x=>x<=thr)]));
        localStorage.setItem("alarmFired", JSON.stringify(fired));
        localStorage.setItem("ackBody:alarm",
          thr>=95 ? t("notif_hi",Math.round(pct)) : t("notif_lo",Math.round(pct)));
        localStorage.setItem("ackPending:alarm","1");
        localStorage.removeItem("ackLastToast:alarm"); // dispara ya, no en 5 min
      }
      break;
    }
  }
}

// Límite alcanzado (100%) y restablecimiento, sesión y semanal.
function trackResets(ses, wk){
  if(ses && ses.resets){
    if(windowChanged("lastRes:session", ses.resets, 10)){
      if(localStorage.getItem("hit:session")==="1"){
        localStorage.setItem("ackPending:session","1");
        localStorage.removeItem("ackLastToast:session");
      }
      localStorage.removeItem("hit:session");
      localStorage.removeItem("notifS");
    }
    if(ses.pct>=100){
      localStorage.setItem("hit:session","1");
      // Globo de descanso: UNA vez por ventana y solo en modo gatito. Se
      // queda hasta que el usuario lo cierre, pero cerrarlo NO levanta al
      // gatito: la sesión sigue agotada hasta su reset.
      if(!localStorage.getItem("notifS") && getPillStyle()==="cat"){
        localStorage.setItem("notifS","1");
        showBalloon(breakBody(ses.resets), "break");
      }
    }
  }
  if(wk && wk.resets){
    if(windowChanged("lastRes:week", wk.resets, 360)){
      if(localStorage.getItem("hit:week")==="1"){
        localStorage.setItem("ackPending:week","1");
        localStorage.removeItem("ackLastToast:week");
      }
      localStorage.removeItem("hit:week");
      localStorage.removeItem("notifW");
    }
    if(wk.pct>=100){
      localStorage.setItem("hit:week","1");
      if(!localStorage.getItem("notifW")){
        localStorage.setItem("notifW","1");
        // Un aviso, un canal: en modo gatito el globo SUSTITUYE al toast de
        // Windows (misma regla que las alarmas de %); con la pastilla normal
        // sigue el toast de siempre.
        if(getPillStyle()==="cat") showBalloon(weekBody(wk.resets), "zzz");
        else toast(t("notif_week_limit"));
      }
    }
  }
}

// ---------- globo del gatito ----------
// UNA SOLA REGLA para los cuatro avisos: el globo se queda hasta que el
// usuario le dé ✕ o abra el panel, y no vuelve. Nada de temporizadores: un
// reloj no sabe si estabas frente a la pantalla.
// Lo que NO se toca al cerrarlo es el dibujo del gatito, que refleja siempre
// el estado REAL. Cerrar el globo de descanso no devuelve la cuota, así que
// el gato sigue de break hasta el reset de verdad; solo el de la alarma lo
// calma, porque ahí el estado ERA "hay un aviso sin ver".
// El `kind` viaja al globo y vuelve con la ✕ para saber qué dar por cerrado.
function showBalloon(body, kind){
  if(!ACK_KINDS.includes(kind))          // break/zzz: no esperan confirmación,
    localStorage.setItem("infoBalloon", JSON.stringify({body, kind}));  // pero sí sobreviven a un hover
  EVENT?.emit("notif:update",{body, kind});
  invoke?.("set_notif_visible",{visible:true});
}
function infoBalloon(){
  try{ return JSON.parse(localStorage.getItem("infoBalloon")||"null"); }catch(e){ return null; }
}
// "Sin cuota de sesión. Vuelvo en 8 min." — el tiempo sale del resets_at real
function breakBody(resets){
  const ms=resets ? new Date(resets)-Date.now() : 0;
  const h=Math.max(0,Math.floor(ms/3.6e6)), m=Math.max(0,Math.floor(ms%3.6e6/6e4));
  return t("notif_break",h,m);
}
// "Semana agotada. Vuelvo el lunes." — el reset semanal suele caer a días
// vista, y "vuelvo en 52 h 10 min" no se lee. El día lo da el sistema en el
// idioma activo (nada que traducir); a menos de 24 h sí se dicen las horas.
function weekBody(resets){
  const ms=resets ? new Date(resets)-Date.now() : 0;
  if(ms>=24*3.6e6)
    return t("notif_zzz_day", new Date(resets).toLocaleDateString(lang,{weekday:"long"}));
  const h=Math.max(0,Math.floor(ms/3.6e6)), m=Math.max(0,Math.floor(ms%3.6e6/6e4));
  return t("notif_zzz_soon",h,m);
}

// Recordatorios pendientes (alarma de %, sesión restablecida, semana
// restablecida): SOLO notificaciones de Windows, repetidas cada 5 min hasta
// que el usuario abra el panel (eso cuenta como "enterado").
const ACK_KINDS=["alarm","session","week"];
function ackBody(k){
  if(k==="alarm") return localStorage.getItem("ackBody:alarm")||"";
  return t(k==="session"?"notif_reset_session":"notif_reset_week");
}
// El mismo aviso, más corto, para el globo del gatito: el toast tiene que
// explicar cómo dejar de recibirlo, el globo lleva su ✕ a la vista.
function balloonBody(k){
  if(k==="alarm") return localStorage.getItem("ackBody:alarm")||"";
  return t(k==="session"?"notif_back_session":"notif_back_week");
}
function processAcks(){
  if(simMascot) return;          // simulación en curso: no la pises
  for(const k of ACK_KINDS){
    if(localStorage.getItem("ackPending:"+k)!=="1") continue;
    // Modo gatito: NINGÚN aviso va a Windows — todos salen como globo cómic
    // sobre el gato, que solo cierra el usuario (✕ o abrir el panel). Como
    // el globo no se va solo, tampoco hace falta repetirlo cada 5 min. Un
    // globo a la vez: gana el primero de la lista, que es el más urgente.
    if(getPillStyle()==="cat"){ showBalloon(balloonBody(k), k); return; }
    const last=+localStorage.getItem("ackLastToast:"+k)||0;
    if(Date.now()-last>5*60000){
      localStorage.setItem("ackLastToast:"+k, String(Date.now()));
      const b=ackBody(k); if(b) toast(b);
    }
  }
}

// El globo se comunica por eventos. Pide lo pendiente al cargar y también
// cada vez que termina un hover (el hover lo oculta para dejar salir el globo
// de información, y tiene que volver: pasar el mouse no es haberlo leído).
EVENT?.listen("notif:ready",()=>{
  if(getPillStyle()!=="cat") return;
  if(simMascot){ if(simB) simBalloon(simB.body, simB.kind); return; }
  for(const k of ACK_KINDS)
    if(localStorage.getItem("ackPending:"+k)==="1"){ showBalloon(balloonBody(k), k); return; }
  const info=infoBalloon();
  if(info) showBalloon(info.body, info.kind);
});
// La ✕ cierra el globo y da por visto SU aviso, sea del tipo que sea.
EVENT?.listen("notif:ack",(e)=>{
  const kind=e?.payload?.kind||"alarm";
  invoke?.("set_notif_visible",{visible:false});
  if(simMascot) return;   // globo simulado: cerrarlo no confirma nada real
  if(ACK_KINDS.includes(kind)){
    localStorage.removeItem("ackPending:"+kind);
    localStorage.removeItem("ackLastToast:"+kind);
  }else{
    localStorage.removeItem("infoBalloon");
  }
  // Recalcula el gatito: la alarma confirmada lo calma, pero break y zzz
  // siguen igual — el dibujo va con el estado real, no con si leíste el aviso.
  if(lastPill){
    lastPill.mascot=mascotState(lastPill.session, lastPill.weekly?lastPill.weekly.pct:null);
    EVENT.emit("quota:update", lastPill);
  }
});

// proyección simple: burn rate de la sesión vs tiempo restante
let lastSes=null, lastTs=null;
function renderProjection(pct,pace,resets){
  $("projSect").hidden=false;
  const now=Date.now();
  let txt, calm=true, rate="";
  if(lastSes!=null && pct>lastSes && now>lastTs){
    const perMin=(pct-lastSes)/((now-lastTs)/6e4);      // %/min
    const minsLeft=resets?(new Date(resets)-now)/6e4:null;
    const minsTo100=perMin>0?(100-pct)/perMin:Infinity;
    rate=t("burn", perMin.toFixed(2));
    if(minsLeft!=null && minsTo100<minsLeft){
      calm=false;
      txt=t("proj_hit", fmtDur(minsTo100), fmtDur(minsLeft));
    }else{
      txt=t("proj_ok_rate");
    }
  }else{
    txt = pace!=null && pct>pace+8 ? t("proj_ahead") : t("proj_behind");
    calm = !(pace!=null && pct>pace+8);
  }
  lastSes=pct; lastTs=now;
  $("proj").classList.toggle("calm",calm);
  $("projTxt").innerHTML=txt; $("rateTxt").textContent=rate;
}
function fmtDur(m){m=Math.round(m);const h=Math.floor(m/60);return h?`${h} h ${m%60} min`:`${m} min`;}

// Fecha corta legible: "21/Jul/26" (mes abreviado en el idioma activo)
function fmtDate(iso, withYear=true){
  const d=new Date(iso+"T00:00:00");
  let mon=d.toLocaleDateString(lang,{month:"short"}).replace(".","");
  mon=mon.charAt(0).toUpperCase()+mon.slice(1);
  const dd=String(d.getDate()).padStart(2,"0");
  return withYear ? `${dd}/${mon}/${String(d.getFullYear()).slice(2)}` : `${dd}/${mon}`;
}

// ---------- detalle local ----------
// Separa "nombre · origen" que arma el backend (local no lleva sufijo).
function splitSrc(name){
  const i=name.lastIndexOf(" · ");
  return i>0?{base:name.slice(0,i),src:name.slice(i+3)}:{base:name,src:t("src_local")};
}
// Tooltip con el desglose por modelo del proyecto ("Fable: $75.65 · Opus 4.8: $0.15")
function modelTip(p){
  const e=Object.entries(p.by_model||{}).sort((a,b)=>b[1]-a[1]);
  return e.length?e.map(([m,c])=>`${prettyModel(m)}: $${c.toFixed(2)}`).join(" · "):"";
}

function renderLocal(s){
  lastLocalData=s;
  const projs=s.projects.slice(0,4).map(p=>({...p, ...splitSrc(p.name)}));
  const others=s.projects.slice(4);
  if(others.length) projs.push({base:t("others",others.length),src:null,
    cost:others.reduce((a,p)=>a+p.cost,0), by_model:null});
  const max=Math.max(...projs.map(p=>p.cost),0.01);

  let rows = projs.map((p,i)=>`
    <div class="pitem" title="${escapeHtml(modelTip(p))}">
      <div class="pname"><span class="swatch" style="background:${PALETTE[i%PALETTE.length]}"></span><span>${escapeHtml(p.base)}</span>${p.src?`<span class="srctag">${escapeHtml(p.src)}</span>`:""}</div>
      <div class="pcost">$${p.cost.toFixed(2)}</div>
      <div class="pbar"><i style="width:${Math.round(p.cost/max*100)}%;background:${PALETTE[i%PALETTE.length]}"></i></div>
    </div>`).join("");
  if(!rows) rows = `<div class="errbox" style="color:var(--txt-dim)">${t("no_activity")}</div>`;

  // Fila estimada de otras superficies (claude.ai / IDE): solo si hay dato
  // fiable, en % de cuota (nunca convertido a dólares).
  if(weeklyAllPct!=null){
    rows += `<div class="pitem other" title="${escapeHtml(t("claudeai_tip"))}">
      <div class="pname"><span class="swatch" style="background:var(--txt-dim);border-radius:50%"></span><span>${t("claudeai_row")}</span></div>
      <div class="pcost">${t("pct_quota", weeklyAllPct)}</div>
      <div class="pbar"><i style="width:${weeklyAllPct}%;background:var(--txt-dim)"></i></div>
    </div>`;
  }
  $("plist").innerHTML = rows;

  // Todos los modelos usados, por pequeño que sea su %, con su color fijo.
  const models=Object.entries(s.models).map(([m,a])=>({m,t:a.input+a.output+a.cache_write,est:!!a.estimated}))
    .filter(x=>x.t>0)                       // fuera modelos sin trabajo real
    .sort((a,b)=>b.t-a.t);
  const tot=models.reduce((a,x)=>a+x.t,0);
  if(tot>0){
    $("modelSect").hidden=false;
    $("split").innerHTML=models.map((x,i)=>`<i style="width:${(x.t/tot*100).toFixed(1)}%;background:${PALETTE[i%PALETTE.length]}" title="${escapeHtml(prettyModel(x.m))} ${(x.t/tot*100).toFixed(1)}%"></i>`).join("");
    $("legend").innerHTML=models.map((x,i)=>{
      const pct=x.t/tot*100;
      // "~" = el modelo no está en ninguna tabla de precios: su coste sale de
      // la tarifa por defecto, así que se avisa en vez de darlo por firme.
      const est=x.est?` <span title="${escapeHtml(t("est_tip"))}" style="cursor:help">~</span>`:"";
      return `<span><b style="background:${PALETTE[i%PALETTE.length]}"></b>${escapeHtml(prettyModel(x.m))} ${pct<1?"<1":Math.round(pct)}%${est}</span>`;
    }).join("");
    $("modelQ").textContent=t("model_leads", prettyModel(models[0].m));
  }
  $("costToday").textContent="$"+s.cost_today.toFixed(2);
  $("costWeek").textContent="$"+s.cost_week.toFixed(2);

  renderTrend(s.daily||[]);
  checkBudget(s.daily||[]);
}

// ---------- tendencia diaria (30 días, una sola serie, un solo tono) ----------
function renderTrend(daily){
  if(!daily.length){ $("trendSect").hidden=true; return; }
  $("trendSect").hidden=false;
  const map=Object.fromEntries(daily.map(d=>[d.date,d.cost]));
  const days=[];
  for(let i=29;i>=0;i--){
    const d=new Date(Date.now()-i*864e5);
    const key=d.toISOString().slice(0,10);
    days.push({key, cost:map[key]||0});
  }
  const max=Math.max(...days.map(d=>d.cost),0.01);
  $("tchart").innerHTML=days.map((d,i)=>{
    const h=Math.max(2,Math.round(d.cost/max*54));
    const cls=(i===days.length-1?"today":"")+(d.cost===0?" zero":"");
    return `<i class="${cls.trim()}" style="height:${h}px" title="${fmtDate(d.key)} · $${d.cost.toFixed(2)}"></i>`;
  }).join("");
  $("tFrom").textContent=fmtDate(days[0].key);
  $("tTo").textContent=fmtDate(days[days.length-1].key);
}

// ---------- presupuesto semanal (toast aunque el panel esté oculto) ----------
function checkBudget(daily){
  const budget=+(localStorage.getItem("budgetWeek")||0);
  if(!(budget>0)) return;
  // gasto de los últimos 7 días desde la serie diaria (independiente del
  // periodo seleccionado en "gasto por proyecto")
  const cut=new Date(Date.now()-7*864e5).toISOString().slice(0,10);
  const spent=daily.filter(d=>d.date>=cut).reduce((a,d)=>a+d.cost,0);
  if(spent<=budget) return;
  const week=Math.floor(Date.now()/(7*864e5));       // anti-spam: 1 aviso/semana/valor
  const key=`notifBudget:${budget}:${week}`;
  if(localStorage.getItem(key)) return;
  localStorage.setItem(key,"1");
  toast(t("notif_budget", spent.toFixed(2), budget));
}

// ---------- ciclo de refresco (auto-programado, con backoff ante fallos) ----------
// El endpoint de cuota tiene rate-limit estricto: cadencia normal de 3 min.
const REFRESH_MS=180000, STALE_MS=15*60000;
let lastSync=Date.now(), fails=0, rateLimited=false, rateWaitMs=REFRESH_MS,
    hadQuota=false, refreshTimer=null, lastErrCode=null;

function onQuotaFail(reason){
  lastErrCode=String(reason);
  $("liveDot").classList.add("err"); $("syncTxt").textContent=errText(reason); fails++;
  rateLimited=lastErrCode.startsWith("ERR_RATE_LIMITED");
  // respeta el Retry-After del servidor, con piso de 3 min
  rateWaitMs=Math.max(REFRESH_MS, (+lastErrCode.split(":")[1]||3)*60000);
  // el gauge, el icono y el widget CONSERVAN el último dato bueno reciente;
  // solo pasan a gris si nunca hubo dato o si el último tiene más de 15 min.
  if(!hadQuota || Date.now()-lastSync>STALE_MS){
    updateTray(null,null);
    EVENT?.emit("quota:update",{ok:false});
  }
}

// periodo del gasto por proyecto (1/7/30 días), persistido
let curDays=+(localStorage.getItem("days")||7);
if(![1,7,30].includes(curDays)) curDays=7;
function markDays(){
  document.querySelectorAll(".dlink").forEach(el=>el.classList.toggle("on",+el.dataset.d===curDays));
  // la etiqueta del pie refleja la ventana activa (1d/7d/30d), no siempre "semana"
  const w=$("winLbl"); if(w) w.textContent = curDays===7 ? t("week") : curDays+"d";
}
document.querySelectorAll(".dlink").forEach(el=>{
  el.addEventListener("click",()=>{
    curDays=+el.dataset.d; localStorage.setItem("days",curDays);
    markDays();
    // feedback inmediato mientras recalcula (el remoto por SSH tarda ~1-2 s)
    $("plist").innerHTML=`<div class="errbox" style="color:var(--txt-dim)">${t("reading")}</div>`;
    $("costWeek").textContent="–";
    refresh();
  });
});
markDays();

async function refresh(){
  if(!invoke){ demo(); return; }
  try{
    const [quota, local] = await Promise.allSettled([invoke("get_quota"), invoke("get_local_stats",{days:curDays})]);
    if(quota.status==="fulfilled"){
      renderQuota(quota.value); $("liveDot").classList.remove("err");
      lastSync=Date.now(); fails=0; rateLimited=false; hadQuota=true; lastErrCode=null;
    }else{
      onQuotaFail(quota.reason);
    }
    if(local.status==="fulfilled") renderLocal(local.value);
    // Modo setup: sin token vigente Y sin ningún proyecto local = no hay
    // Claude Code en juego (usuario gratuito, o aún sin iniciar sesión, o
    // sin fuentes remotas). Mostramos la bienvenida en vez del gauge vacío.
    // Con datos locales (Claude Code sí, solo token vencido) NO se activa.
    const noToken = quota.status==="rejected" && String(quota.reason).startsWith("ERR_NO_TOKEN");
    const hasLocal = local.status==="fulfilled" && local.value.projects && local.value.projects.length>0;
    document.body.classList.toggle("setup", noToken && !hasLocal);      // no hay Claude Code
    document.body.classList.toggle("tokenhint", noToken && hasLocal);   // token vencido
    if(noToken){ $("liveDot").classList.remove("err");
      $("syncTxt").textContent = t(hasLocal ? "setup_expired_title" : "setup_sub"); }
  }catch(e){ onQuotaFail(e); }
  finally{ processAcks(); scheduleNext(); }
}
function scheduleNext(){
  // 3 min en régimen normal; errores de red: backoff 5→10→20→40 s (máx 60 s);
  // 429: lo que pida el servidor, mínimo 3 min (reintentar rápido lo empeora).
  const delay = rateLimited ? rateWaitMs
    : fails>0 ? Math.min(60000, 5000*2**(fails-1)) : REFRESH_MS;
  clearTimeout(refreshTimer); refreshTimer=setTimeout(refresh, delay);
}
setInterval(()=>{ const b=document.body.classList;
  if(!$("liveDot").classList.contains("err") && !b.contains("setup") && !b.contains("tokenhint"))
    $("syncTxt").textContent=t("live_ago", Math.round((Date.now()-lastSync)/1000)); },1000);

const TRASH='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M10 11v6M14 11v6"/></svg>';
function renderRemotes(){
  $("srvCount").textContent = t("srv_count", remotes.length);
  $("remList").innerHTML = remotes.map((r,i)=>`
    <div class="srv-row">
      <div style="min-width:0">
        <div class="srv-name">${escapeHtml(r.name)}</div>
        <div class="srv-meta" title="${escapeHtml(r.host)} · ${escapeHtml(r.command||"")}">${escapeHtml(r.host)} · ${escapeHtml(r.command||"")}</div>
      </div>
      <span class="spill wait" id="rstat-${i}"><i></i>…</span>
      <button class="del-btn" data-i="${i}" title="${escapeHtml(t("remove_server"))}">${TRASH}</button>
    </div>`).join("")
    || `<div class="errbox" style="color:var(--txt-dim)">${t("no_servers")}</div>`;
  document.querySelectorAll("#remList .del-btn").forEach(b=>{
    b.onclick=async()=>{
      // confirmación en dos pasos: el primer clic pregunta, el segundo
      // elimina; si no confirmas en 4 s, el botón vuelve a la normalidad
      if(!b.classList.contains("arm")){
        b.classList.add("arm"); b.textContent=t("confirm_delete");

      clearTimeout(b._t);
      remotes.splice(+b.dataset.i,1);
      try{ await invoke("save_remotes",{remotes}); }catch(e){}
      renderRemotes(); refresh();
    };
  });
  // estado de conexión de cada servidor (pastilla: conectado / sin conexión)
  remotes.forEach((r,i)=>{

      const el=$("rstat-"+i); if(el){ el.className="spill ok"; el.innerHTML="<i></i>"+escapeHtml(t("status_active")); }
    }).catch(()=>{
      const el=$("rstat-"+i); if(el){ el.className="spill bad"; el.innerHTML="<i></i>"+escapeHtml(t("status_fail")); }
    });
  });
}

// ---------- precios de modelos (descarga automática con cascada) ----------
// El backend hace la descarga; aquí solo se muestra el estado y el interruptor.
// "hace 2 h" en el idioma activo sin añadir claves: lo resuelve el navegador.
function fmtAgo(iso){
  const ms = Date.now() - new Date(iso).getTime();
  if(!isFinite(ms) || ms < 0) return "";
  try{
    const rtf = new Intl.RelativeTimeFormat(lang, {numeric:"auto"});
    const min = Math.round(ms/6e4);
    if(min < 60) return rtf.format(-min, "minute");
    const h = Math.round(min/60);
    return h < 48 ? rtf.format(-h, "hour") : rtf.format(-Math.round(h/24), "day");
  }catch(e){ return ""; }
}
function renderPricesStatus(){
  if(!invoke) return;
  invoke("get_prices_status").then(s=>{
    // El botón sobra mientras todo va bien: la descarga es automática. Solo
    // aparece cuando hay algo que reintentar (sin red, o nunca descargado).
    const ok = !!s.fetched_at;
    // "viejo" = lleva más de una semana sin poder actualizarse: los precios
    // cambian pocas veces, pero si la descarga lleva días fallando hay que
    // decirlo en vez de mostrar costes con datos rancios.
    const viejo = ok && (Date.now() - new Date(s.fetched_at).getTime()) > 7*864e5;
    const problema = !s.auto ? false : (!ok || viejo);
    // El botón se queda SIEMPRE visible: que aparezca y desaparezca confunde
    // más de lo que limpia, y en Preferencias no estorba.
    // Aviso donde de verdad importa: junto a los costes. Un usuario normal no
    // entra a Preferencias a comprobar si la descarga funcionó.
    $("priceWarn").hidden = !problema;
    $("priceWarn").title = t("prices_warn_tip");
    $("pricesMsg").textContent = !s.auto ? t("prices_off")
      : ok ? t("prices_src", s.source, fmtAgo(s.fetched_at), s.count)
      : (s.last_try ? t("prices_offline") : t("prices_none"));
  }).catch(()=>{});
}
renderPricesStatus();
// La descarga corre sola en segundo plano; cuando termina, el backend avisa y
// aquí se repinta el estado y se recalculan los costes con los precios nuevos.
// Se pide SOLO get_local_stats: refresh() llamaría también al endpoint de
// cuota, que tiene límite de peticiones.
EVENT?.listen("prices:updated",e=>{
  renderPricesStatus();                      // también en el fallo: pinta el aviso
  if(e.payload && e.payload.ok===false) return;
  invoke?.("get_local_stats",{days:curDays}).then(renderLocal).catch(()=>{});
});
$("priceWarn").addEventListener("click",()=>showTab("prefs"));
// Transparencia: de dónde salen los precios, a la vista y sin tener que ir al
// README. El interruptor para apagar la descarga vive en prices_config.json
// (documentado); sacarlo de la UI evita que alguien se quede con precios
// viejos sin querer, pero no le quita la salida a quien la necesite.
$("pricesInfo").addEventListener("click",()=>{
  $("pricesSources").hidden = !$("pricesSources").hidden;
});
$("pricesNow").addEventListener("click",()=>{
  $("pricesMsg").textContent="…";
  // el propio backend emite prices:updated al terminar, que ya repinta el
  // estado y recalcula los costes; aquí solo se informa del fallo
  invoke?.("refresh_prices_now")
    .catch(()=>{ $("pricesMsg").textContent=t("prices_err"); });
});
async function doExport(format){
  if(!invoke) return;
  $("expMsg").textContent="…";
  try{
    const p=await invoke("export_data",{format, dir:$("exportDir").value.trim()||null, days:curDays});
    $("expMsg").textContent=t("msg_exported", p);
  }catch(e){ $("expMsg").textContent="✗ "+e; }
}
$("expCsv").addEventListener("click",()=>doExport("csv"));
$("expJson").addEventListener("click",()=>doExport("json"));

// ---------- idioma (persistido; re-render en caliente) ----------
$("langSel").addEventListener("change",()=>{
  lang=$("langSel").value; localStorage.setItem("lang",lang);
  applyI18n();
  if(lastQuotaData) renderQuota(lastQuotaData);
  if(lastLocalData) renderLocal(lastLocalData);
  if(lastErrCode) $("syncTxt").textContent=errText(lastErrCode);
  renderRemotes(); markDays();
});
