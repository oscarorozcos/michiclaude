      ${hero?`<div class="brow-top wrap" style="margin-top:4px;margin-bottom:0">
        <span class="rst">${pace!=null&&b.pct<=pace?t("pace_ok"):t("pace_watch")}</span>
        <span class="rst">${fmtReset(b.resets)}</span></div>`
       :`<div class="brow-top" style="margin-top:3px;margin-bottom:0">
        <span class="rst" style="margin-left:auto">${fmtReset(b.resets)}</span></div>`}
    </div>`;
  }).join("") || `<div class="errbox">${t("no_buckets")}</div>`;

  const sesInfo = ses ? {pct:ses.pct, resets:ses.resets, pace:elapsedPct(ses.resets,5)} : null;
  updateTray(sesInfo, weeklyAllPct);
  // buckets semanales por modelo (todos menos el "hero"), para el globo
  const wkExtras = weekly.filter(b=>b!==wkAll)
    .map(b=>({label:b.label, pct:b.pct, resets:b.resets?fmtReset(b.resets):""}));
  emitPill(sesInfo, wkAll?{pct:wkAll.pct, resets:wkAll.resets}:null, wkExtras);
}

// ---------- notificaciones ----------
function toast(body){
  const notif=window.__TAURI__?.notification;
  if(!notif) return;
  Promise.resolve(notif.isPermissionGranted())
    .then(g=> g ? true : notif.requestPermission().then(p=>p==="granted"))
    .then(ok=>{ if(ok) notif.sendNotification({title:"MichiClaude", body}); })
    .catch(()=>{});
}

// Alarmas de sesión configurables (como alarmas del celular, pero en % usado).
function getAlarms(){
  try{ const a=JSON.parse(localStorage.getItem("alarms")||"[80,95]");
    return Array.isArray(a)?a.filter(x=>x>=1&&x<=100):[80,95]; }
  catch(e){ return [80,95]; }
}
function saveAlarms(a){ localStorage.setItem("alarms", JSON.stringify(a.sort((x,y)=>x-y))); }

// ¿Cambió la ventana (sesión/semana)? Con TOLERANCIA: el resets_at del
// endpoint trae pequeñas variaciones entre consultas; solo un salto grande
// significa ventana nueva (si no, las alarmas se re-dispararían cada ciclo).
function windowChanged(storeKey, curIso, tolMin){
  const prev=localStorage.getItem(storeKey);
  localStorage.setItem(storeKey, curIso);
  if(!prev) return false;
  return Math.abs(new Date(curIso)-new Date(prev)) > tolMin*60000;
}

// Alarma de umbral: al cruzar un % configurado arranca un recordatorio que se
// REPITE cada 5 min hasta que el usuario abra el panel ("enterado"). Después,
// silencio hasta el siguiente umbral o la siguiente ventana de sesión.
function maybeNotify(pct,resets){
  if(resets && windowChanged("alarmWin", resets, 10)){
    localStorage.setItem("alarmFired","[]");          // ventana nueva: rearmar todo
    localStorage.removeItem("ackPending:alarm");
    localStorage.removeItem("ackLastToast:alarm");
  }
  let fired=[]; try{ fired=JSON.parse(localStorage.getItem("alarmFired")||"[]"); }catch(e){}
  const alarms=[...getAlarms()].sort((a,b)=>b-a);     // el más alto primero
  for(const thr of alarms){
    if(pct>=thr){
      if(!fired.includes(thr)){
        // marca este umbral y los menores como disparados (sin ráfagas)
        fired=Array.from(new Set([...fired, ...alarms.filter(x=>x<=thr)]));
        localStorage.setItem("alarmFired", JSON.stringify(fired));
        localStorage.setItem("ackBody:alarm",
          thr>=95 ? t("notif_hi",Math.round(pct)) : t("notif_lo",Math.round(pct)));
        localStorage.setItem("ackSev:alarm", thr>=95 ? "danger" : "warn");
        localStorage.setItem("ackPending:alarm","1");
        localStorage.removeItem("ackLastToast:alarm"); // dispara ya, no en 5 min
        // al celular solo con su casilla propia: frente a la PC ya tienes el
        // globo; esto es para cuando no estás
        if(ntfyCfg&&ntfyCfg.alarms)
          ntfyPush(thr>=95?t("notif_hi",Math.round(pct)):t("notif_lo",Math.round(pct)),
                   thr>=95?4:3, null);
      }
      break;
    }
  }
}

// Límite alcanzado (100%) y restablecimiento, sesión y semanal.
function trackResets(ses, wk){
  if(ses && ses.resets){
    if(windowChanged("lastRes:session", ses.resets, 10)){
      if(localStorage.getItem("hit:session")==="1"){
        localStorage.setItem("ackPending:session","1");
        localStorage.removeItem("ackLastToast:session");
      }
      localStorage.removeItem("hit:session");
      localStorage.removeItem("notifS");
    }
    if(ses.pct>=100){
      localStorage.setItem("hit:session","1");
      // Globo de descanso: UNA vez por ventana y solo en modo gatito. Se
      // queda hasta que el usuario lo cierre, pero cerrarlo NO levanta al
      // gatito: la sesión sigue agotada hasta su reset.
      if(!localStorage.getItem("notifS")){
        localStorage.setItem("notifS","1");
        showBalloon(breakBody(ses.resets), "break");
        // al celular: mismo texto + promesa, y el "ya volvió" programado
        // que llega con la PC apagada (banderín notifS = un push por ventana)
        ntfyLimit(breakBody(ses.resets), ses.resets, "session");
      }
    }
  }
  if(wk && wk.resets){
    if(windowChanged("lastRes:week", wk.resets, 360)){
      if(localStorage.getItem("hit:week")==="1"){
        localStorage.setItem("ackPending:week","1");
        localStorage.removeItem("ackLastToast:week");
      }
      localStorage.removeItem("hit:week");
      localStorage.removeItem("notifW");
    }
    if(wk.pct>=100){
      localStorage.setItem("hit:week","1");
      if(!localStorage.getItem("notifW")){
        localStorage.setItem("notifW","1");
        // Un aviso, un canal: el globo SUSTITUYE al toast de Windows, con
        // gatito y con pastilla.
        showBalloon(weekBody(wk.resets), "zzz");
        // al celular: si el reset semanal no cabe en los 3 días de ntfy.sh,
        // ntfyLimit no programa nada y el inmediato ya dice el día
        ntfyLimit(weekBody(wk.resets), wk.resets, "week");
      }
    }
  }
}

// ---------- globo del gatito ----------
// UNA SOLA REGLA para los cuatro avisos: el globo se queda hasta que el
// usuario le dé ✕ o abra el panel, y no vuelve. Nada de temporizadores: un
// reloj no sabe si estabas frente a la pantalla.
// Lo que NO se toca al cerrarlo es el dibujo del gatito, que refleja siempre
// el estado REAL. Cerrar el globo de descanso no devuelve la cuota, así que
// el gato sigue de break hasta el reset de verdad; solo el de la alarma lo
// calma, porque ahí el estado ERA "hay un aviso sin ver".
// El `kind` viaja al globo y vuelve con la ✕ para saber qué dar por cerrado.
// Severidad, icono y segunda línea de cada aviso. La severidad es lo que
// permite entenderlo sin leerlo (acento = informativo, ámbar = ojo, rojo =
// crítico); solo la pinta el popover de la pastilla, el cómic del gatito la
// ignora. La línea secundaria solo se pone donde aporta: en la alarma de %,
// donde saber cuánto falta para el reset cambia lo que decides hacer.
function balloonMeta(kind){
  const ses=lastPill&&lastPill.session;
  if(kind==="alarm") return {sev:localStorage.getItem("ackSev:alarm")||"warn",
    icon:"bolt", sub:ses&&ses.resets?fmtReset(ses.resets):""};
  if(kind==="break")  return {sev:"danger", icon:"bolt", sub:""};
  if(kind==="zzz")    return {sev:"danger", icon:"week", sub:""};
  if(kind==="budget") return {sev:"warn",   icon:"warn", sub:""};
  // globo del día de hallazgos: la severidad se decidió al dispararlo y se
  // guarda para que sobreviva al ciclo hover -> notif:ready -> showBalloon
  if(kind==="findings") return {sev:localStorage.getItem("fndNudgeSev")||"warn",
    icon:"warn", sub:t("fnd_nudge_sub")};
  return {sev:"ok", icon:"ok", sub:""};      // sesión/semana restablecidas
}
function showBalloon(body, kind){
  // Sin widget en pantalla no hay dónde colgar el globo: ahí sí toca el toast
  // de Windows, con su repetición cada 5 min (que es lo que lo salva de ser
  // efímero). Es el ÚNICO caso en que se sigue usando.
  if(!pillOn){
    const last=+localStorage.getItem("ackLastToast:"+kind)||0;
    if(Date.now()-last>5*60000){
      localStorage.setItem("ackLastToast:"+kind, String(Date.now()));
      if(body) toast(body);
    }
    return;
  }
  if(!ACK_KINDS.includes(kind))          // break/zzz: no esperan confirmación,
    localStorage.setItem("infoBalloon", JSON.stringify({body, kind}));  // pero sí sobreviven a un hover
  EVENT?.emit("notif:update",{body, kind, ...balloonMeta(kind)});
  invoke?.("set_notif_visible",{visible:true});
}
function infoBalloon(){
  try{ return JSON.parse(localStorage.getItem("infoBalloon")||"null"); }catch(e){ return null; }
}
// "Sin cuota de sesión. Vuelvo en 8 min." — el tiempo sale del resets_at real
function breakBody(resets){
  const ms=resets ? new Date(resets)-Date.now() : 0;
  const h=Math.max(0,Math.floor(ms/3.6e6)), m=Math.max(0,Math.floor(ms%3.6e6/6e4));
  return t("notif_break",h,m);
}
// "Semana agotada. Vuelvo el lunes." — el reset semanal suele caer a días
// vista, y "vuelvo en 52 h 10 min" no se lee. El día lo da el sistema en el
// idioma activo (nada que traducir); a menos de 24 h sí se dicen las horas.
function weekBody(resets){
  const ms=resets ? new Date(resets)-Date.now() : 0;
  if(ms>=24*3.6e6)
    return t("notif_zzz_day", new Date(resets).toLocaleDateString(lang,{weekday:"long"}));
  const h=Math.max(0,Math.floor(ms/3.6e6)), m=Math.max(0,Math.floor(ms%3.6e6/6e4));
  return t("notif_zzz_soon",h,m);
}

// Recordatorios pendientes (alarma de %, sesión restablecida, semana
// restablecida): SOLO notificaciones de Windows, repetidas cada 5 min hasta
// que el usuario abra el panel (eso cuenta como "enterado").
const ACK_KINDS=["alarm","session","week"];
function ackBody(k){
  if(k==="alarm") return localStorage.getItem("ackBody:alarm")||"";
  return t(k==="session"?"notif_reset_session":"notif_reset_week");
}
// El mismo aviso, más corto, para el globo del gatito: el toast tiene que
// explicar cómo dejar de recibirlo, el globo lleva su ✕ a la vista.
function balloonBody(k){
  if(k==="alarm") return localStorage.getItem("ackBody:alarm")||"";
  return t(k==="session"?"notif_back_session":"notif_back_week");
}
function processAcks(){
  if(simRunning) return;         // simulación en curso: no la pises
  for(const k of ACK_KINDS){
    if(localStorage.getItem("ackPending:"+k)!=="1") continue;
    // NINGÚN aviso va ya a Windows: todos salen como globo sobre el widget
    // —gatito o pastilla—, que solo cierra el usuario (✕ o abrir el panel).
    // El toast de Windows se iba a los segundos y quien no estuviera delante
    // no se enteraba; el globo espera. Como no se va solo, tampoco hace
    // falta repetirlo cada 5 min. Un globo a la vez: gana el primero de la
    // lista, que es el más urgente.
    showBalloon(balloonBody(k), k); return;
  }
}

// El globo se comunica por eventos. Pide lo pendiente al cargar y también
// cada vez que termina un hover (el hover lo oculta para dejar salir el globo
// de información, y tiene que volver: pasar el mouse no es haberlo leído).
EVENT?.listen("notif:ready",()=>{
  if(simRunning){ if(simB) simBalloon(simB); return; }
  for(const k of ACK_KINDS)
    if(localStorage.getItem("ackPending:"+k)==="1"){ showBalloon(balloonBody(k), k); return; }
  const info=infoBalloon();
  if(info) showBalloon(info.body, info.kind);
});
// La ✕ cierra el globo y da por visto SU aviso, sea del tipo que sea.
EVENT?.listen("notif:ack",(e)=>{
  const kind=e?.payload?.kind||"alarm";
  invoke?.("set_notif_visible",{visible:false});
  // Globo simulado: cerrarlo no confirma nada real, pero sí debe QUEDARSE
  // cerrado. Sin borrar simB, el `notif:ready` que emite el gatito al salir
  // el mouse lo volvía a levantar y no había forma de quitárselo de encima.
  if(simRunning){ simB=null; return; }
  if(ACK_KINDS.includes(kind)){
    localStorage.removeItem("ackPending:"+kind);
    localStorage.removeItem("ackLastToast:"+kind);
  }else{
    localStorage.removeItem("infoBalloon");
  }
  // Recalcula el gatito: la alarma confirmada lo calma, pero break y zzz
  // siguen igual — el dibujo va con el estado real, no con si leíste el aviso.
  if(lastPill){
    lastPill.mascot=mascotState(lastPill.session, lastPill.weekly?lastPill.weekly.pct:null);
    EVENT.emit("quota:update", lastPill);
  }
});

// proyección simple: burn rate de la sesión vs tiempo restante
let lastSes=null, lastTs=null;
function renderProjection(pct,pace,resets){
  $("projSect").hidden=false;
  const now=Date.now();
  let txt, calm=true, rate="";
  if(lastSes!=null && pct>lastSes && now>lastTs){
    const perMin=(pct-lastSes)/((now-lastTs)/6e4);      // %/min
    const minsLeft=resets?(new Date(resets)-now)/6e4:null;
    const minsTo100=perMin>0?(100-pct)/perMin:Infinity;
    rate=t("burn", perMin.toFixed(2));
    if(minsLeft!=null && minsTo100<minsLeft){
      calm=false;
      txt=t("proj_hit", fmtDur(minsTo100), fmtDur(minsLeft));
    }else{
      txt=t("proj_ok_rate");
    }
  }else{
    txt = pace!=null && pct>pace+8 ? t("proj_ahead") : t("proj_behind");
    calm = !(pace!=null && pct>pace+8);
  }
  lastSes=pct; lastTs=now;
  $("proj").classList.toggle("calm",calm);
  $("projTxt").innerHTML=txt; $("rateTxt").textContent=rate;
}
function fmtDur(m){m=Math.round(m);const h=Math.floor(m/60);return h?`${h} h ${m%60} min`:`${m} min`;}

// Fecha corta legible: "21/Jul/26" (mes abreviado en el idioma activo)
function fmtDate(iso, withYear=true){
  const d=new Date(iso+"T00:00:00");
  let mon=d.toLocaleDateString(lang,{month:"short"}).replace(".","");
  mon=mon.charAt(0).toUpperCase()+mon.slice(1);
  const dd=String(d.getDate()).padStart(2,"0");
  return withYear ? `${dd}/${mon}/${String(d.getFullYear()).slice(2)}` : `${dd}/${mon}`;
}

// ---------- detalle local ----------
// Separa "nombre · origen" que arma el backend (local no lleva sufijo).
function splitSrc(name){
  const i=name.lastIndexOf(" · ");
  return i>0?{base:name.slice(0,i),src:name.slice(i+3)}:{base:name,src:t("src_local")};
}
// Tooltip con el desglose por modelo del proyecto ("Fable: $75.65 · Opus 4.8: $0.15")
function modelTip(p){
  const e=Object.entries(p.by_model||{}).sort((a,b)=>b[1]-a[1]);
  return e.length?e.map(([m,c])=>`${prettyModel(m)}: $${c.toFixed(2)}`).join(" · "):"";
}

// ¿está desplegada la cola de proyectos? Vive fuera de renderLocal para
// sobrevivir a los refrescos automáticos: si no, se plegaría sola cada ciclo.
let projOpen=false;
const PROJ_TOP=4;

function renderLocal(s){
  lastLocalData=s;
  const all=s.projects.map(p=>({...p, ...splitSrc(p.name)}));
  const rest=all.slice(PROJ_TOP);
  const projs=projOpen?all:all.slice(0,PROJ_TOP);
  const max=Math.max(...all.map(p=>p.cost),0.01);

  let rows = projs.map((p,i)=>`
    <div class="pitem" title="${escapeHtml(modelTip(p))}">
      <div class="pname"><span class="swatch" style="background:${PALETTE[i%PALETTE.length]}"></span><span>${escapeHtml(p.base)}</span>${p.src?`<span class="srctag">${escapeHtml(p.src)}</span>`:""}</div>
      <div class="pcost">$${p.cost.toFixed(2)}</div>
      <div class="pbar"><i style="width:${Math.round(p.cost/max*100)}%;background:${PALETTE[i%PALETTE.length]}"></i></div>
    </div>`).join("");
  // La cola se resume en una fila que se despliega al hacer clic: saber que
  // hay $39 repartidos no sirve de nada si no puedes ver en qué.
  if(rest.length) rows += `
    <div class="pitem more" id="plistMore">
      <div class="pname"><span class="swatch" style="background:var(--txt-dim)"></span><span>${escapeHtml(projOpen?t("others_less"):t("others",rest.length))}</span></div>
      <div class="pcost">${projOpen?"":"$"+rest.reduce((a,p)=>a+p.cost,0).toFixed(2)}</div>
      <div class="pbar"></div>
    </div>`;
  if(!rows) rows = `<div class="errbox" style="color:var(--txt-dim)">${t("no_activity")}</div>`;

  // Aquí vivía una fila "claude.ai / otros" con el % semanal. Se quitó el
  // 2026-07-28: su etiqueta prometía un desglose de claude.ai y el número era
  // el consumo TOTAL de la semana, el mismo que ya sale en el medidor de
  // arriba. No se puede calcular lo que prometía —el gasto local está en
  // dólares y la cuota en porcentaje, y el endpoint nunca dice cuánto vale el
  // tope en dinero—, así que en su lugar va una nota que sí es cierta.
  $("plist").innerHTML = rows;
  const more=$("plistMore");
  if(more) more.addEventListener("click",()=>{ projOpen=!projOpen; renderLocal(s); });

  // Todos los modelos usados, por pequeño que sea su %, con su color fijo.
  const models=Object.entries(s.models).map(([m,a])=>({m,t:a.input+a.output+a.cache_write,est:!!a.estimated}))
    .filter(x=>x.t>0)                       // fuera modelos sin trabajo real
    .sort((a,b)=>b.t-a.t);
  const tot=models.reduce((a,x)=>a+x.t,0);
  if(tot>0){
    $("modelSect").hidden=false;
    $("split").innerHTML=models.map((x,i)=>`<i style="width:${(x.t/tot*100).toFixed(1)}%;background:${PALETTE[i%PALETTE.length]}" title="${escapeHtml(prettyModel(x.m))} ${(x.t/tot*100).toFixed(1)}%"></i>`).join("");
    $("legend").innerHTML=models.map((x,i)=>{
      const pct=x.t/tot*100;
      // "~" = el modelo no está en ninguna tabla de precios: su coste sale de
      // la tarifa por defecto, así que se avisa en vez de darlo por firme.
      const est=x.est?` <span title="${escapeHtml(t("est_tip"))}" style="cursor:help">~</span>`:"";
      return `<span><b style="background:${PALETTE[i%PALETTE.length]}"></b>${escapeHtml(prettyModel(x.m))} ${pct<1?"<1":Math.round(pct)}%${est}</span>`;
    }).join("");
    $("modelQ").textContent=t("model_leads", prettyModel(models[0].m));
  }
  $("costToday").textContent="$"+s.cost_today.toFixed(2);
  $("costWeek").textContent="$"+s.cost_week.toFixed(2);

  renderTrend(s.daily||[]);
  checkBudget(s.daily||[]);
}

// ---------- tendencia diaria (30 días, una sola serie, un solo tono) ----------
function renderTrend(daily){
  if(!daily.length){ $("trendSect").hidden=true; return; }
  $("trendSect").hidden=false;
  const map=Object.fromEntries(daily.map(d=>[d.date,d.cost]));
  const days=[];
  for(let i=29;i>=0;i--){
    const d=new Date(Date.now()-i*864e5);
    const key=d.toISOString().slice(0,10);
    days.push({key, cost:map[key]||0});
  }
  const max=Math.max(...days.map(d=>d.cost),0.01);
  $("tchart").innerHTML=days.map((d,i)=>{
    const h=Math.max(2,Math.round(d.cost/max*54));
    const cls=(i===days.length-1?"today":"")+(d.cost===0?" zero":"");
    return `<i class="${cls.trim()}" style="height:${h}px" title="${fmtDate(d.key)} · $${d.cost.toFixed(2)}"></i>`;
  }).join("");
  $("tFrom").textContent=fmtDate(days[0].key);
  $("tTo").textContent=fmtDate(days[days.length-1].key);
}

// ---------- presupuesto semanal (toast aunque el panel esté oculto) ----------
function checkBudget(daily){
  const budget=+(localStorage.getItem("budgetWeek")||0);
  if(!(budget>0)) return;
  // gasto de los últimos 7 días desde la serie diaria (independiente del
  // periodo seleccionado en "gasto por proyecto")
  const cut=new Date(Date.now()-7*864e5).toISOString().slice(0,10);
  const spent=daily.filter(d=>d.date>=cut).reduce((a,d)=>a+d.cost,0);
  if(spent<=budget) return;
  const week=Math.floor(Date.now()/(7*864e5));       // anti-spam: 1 aviso/semana/valor
  const key=`notifBudget:${budget}:${week}`;
  if(localStorage.getItem(key)) return;
  localStorage.setItem(key,"1");
  showBalloon(t("notif_budget", spent.toFixed(2), budget), "budget");
}

// ---------- ciclo de refresco (auto-programado, con backoff ante fallos) ----------
// El endpoint de cuota tiene rate-limit estricto: cadencia normal de 3 min.
const REFRESH_MS=180000, STALE_MS=15*60000;
let lastSync=Date.now(), fails=0, rateLimited=false, rateWaitMs=REFRESH_MS,
    hadQuota=false, refreshTimer=null, lastErrCode=null;

function onQuotaFail(reason){
  lastErrCode=String(reason);
  $("liveDot").classList.add("err"); $("syncTxt").textContent=errText(reason); fails++;
  rateLimited=lastErrCode.startsWith("ERR_RATE_LIMITED");
  // respeta el Retry-After del servidor, con piso de 3 min
  rateWaitMs=Math.max(REFRESH_MS, (+lastErrCode.split(":")[1]||3)*60000);
  // el gauge, el icono y el widget CONSERVAN el último dato bueno reciente;
  // solo pasan a gris si nunca hubo dato o si el último tiene más de 15 min.
  if(!hadQuota || Date.now()-lastSync>STALE_MS){
    updateTray(null,null);
    // el globo del widget enseña el MOTIVO y qué hacer (petición de Oscar
    // 2026-07-31: "Session —" a secas no dice si es normal o hay que actuar)
    EVENT?.emit("quota:update",{ok:false, reason:errText(reason)});
  }
}

// periodo del gasto por proyecto (1/7/30 días), persistido
let curDays=+(localStorage.getItem("days")||7);
if(![1,7,15,30].includes(curDays)) curDays=7;
function markDays(){
  $("daysSel").value=String(curDays);
  // "Hoy" son las últimas 24 h y la ventana de 1 día también: enseñar la
  // misma cifra dos veces con dos nombres parece un error de la app.
  $("winTot").hidden = (curDays===1);
  // la etiqueta del pie refleja la ventana activa, no siempre "semana"
  const w=$("winLbl"); if(w) w.textContent = curDays===7 ? t("week") : curDays+"d";
}
$("daysSel").addEventListener("change",()=>{
  curDays=+$("daysSel").value; localStorage.setItem("days",curDays);
  projOpen=false;                      // otra ventana, otra lista: se pliega
  markDays();
  // feedback inmediato mientras recalcula (el remoto por SSH tarda ~1-2 s)
  $("plist").innerHTML=`<div class="errbox" style="color:var(--txt-dim)">${t("reading")}</div>`;
  $("costWeek").textContent="–";
  refresh();
});
markDays();

async function refresh(){
  if(!invoke){ demo(); return; }
  try{
    const [quota, local] = await Promise.allSettled([invoke("get_quota"), invoke("get_local_stats",{days:curDays})]);
    if(quota.status==="fulfilled"){
      renderQuota(quota.value); $("liveDot").classList.remove("err");
      lastSync=Date.now(); fails=0; rateLimited=false; hadQuota=true; lastErrCode=null;
    }else{
      onQuotaFail(quota.reason);
    }
    if(local.status==="fulfilled") renderLocal(local.value);
    // Modo setup: sin token vigente Y sin ningún proyecto local = no hay
    // Claude Code en juego (usuario gratuito, o aún sin iniciar sesión, o
    // sin fuentes remotas). Mostramos la bienvenida en vez del gauge vacío.
    // Con datos locales (Claude Code sí, solo token vencido) NO se activa.
    const noToken = quota.status==="rejected" && String(quota.reason).startsWith("ERR_NO_TOKEN");
    const hasLocal = local.status==="fulfilled" && local.value.projects && local.value.projects.length>0;
    document.body.classList.toggle("setup", noToken && !hasLocal);      // no hay Claude Code
    document.body.classList.toggle("tokenhint", noToken && hasLocal);   // token vencido
    if(noToken){ $("liveDot").classList.remove("err");
      $("syncTxt").textContent = t(hasLocal ? "setup_expired_title" : "setup_sub"); }
  }catch(e){ onQuotaFail(e); }
  finally{ processAcks(); scheduleNext(); }
}
function scheduleNext(){
  // 3 min en régimen normal; errores de red: backoff 5→10→20→40 s (máx 60 s);
  // 429: lo que pida el servidor, mínimo 3 min (reintentar rápido lo empeora).
  const delay = rateLimited ? rateWaitMs
    : fails>0 ? Math.min(60000, 5000*2**(fails-1)) : REFRESH_MS;
  clearTimeout(refreshTimer); refreshTimer=setTimeout(refresh, delay);
}
setInterval(()=>{ const b=document.body.classList;
  if(!$("liveDot").classList.contains("err") && !b.contains("setup") && !b.contains("tokenhint"))
    $("syncTxt").textContent=t("live_ago", Math.round((Date.now()-lastSync)/1000)); },1000);

let remotes=[];
async function loadRemotes(){
  if(!invoke) return;
  try{ remotes=await invoke("get_remotes"); }catch(e){ remotes=[]; }
  renderRemotes();
  syncHubButtons();

// Sin servidor, los ajustes compartidos no pueden funcionar. Se apagan los
// botones y se dice POR QUÉ, en vez de dejar que el usuario los pulse y le
// salga un error: quien solo usa su PC pensaría que la app está rota.
function syncHubButtons(){
  const on = remotes.length > 0;
  $("hubSave").disabled = !on;
  $("hubLoad").disabled = !on;
  if(!on) $("hubMsg").textContent = t("hub_cfg_needs");
  else if($("hubMsg").textContent === t("hub_cfg_needs")) $("hubMsg").textContent = "";
}
const PENCIL='<svg class="pen" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L18.5 9.5a2.1 2.1 0 0 0-3-3L5 17v3z"/><path d="M13.5 6.5l4 4"/></svg>';
const TRASH='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M10 11v6M14 11v6"/></svg>';
function renderRemotes(){
  $("srvCount").textContent = t("srv_count", remotes.length);
  $("remList").innerHTML = remotes.map((r,i)=>`
    <div class="srv-row">
      <div style="min-width:0">
        <div class="srv-name" data-i="${i}" title="${escapeHtml(t("rename_server"))}">${escapeHtml(r.name)}${PENCIL}</div>
        <div class="srv-meta" title="${escapeHtml(r.host)} · ${escapeHtml(r.command||"")}">${escapeHtml(r.host)} · ${escapeHtml(r.command||"")}</div>
      </div>
      <span class="spill wait" id="rstat-${i}"><i></i>…</span>
      <button class="del-btn" data-i="${i}" title="${escapeHtml(t("remove_server"))}">${TRASH}</button>
    </div>`).join("")
    || `<div class="errbox" style="color:var(--txt-dim)">${t("no_servers")}</div>`;
  // Renombrar sin tener que borrar y volver a agregar: equivocarse al
  // escribir el nombre es lo más fácil del mundo, y rehacer el alta por una
  // letra es desproporcionado. El nombre es también el sufijo que llevan los
  // proyectos de ese servidor, así que al cambiarlo se recarga el panel.
  document.querySelectorAll("#remList .srv-name").forEach(el=>{
    el.addEventListener("click",()=>{
      const i=+el.dataset.i, before=remotes[i].name;
      const inp=document.createElement("input");
      inp.className="mono"; inp.value=before;
      inp.style.cssText="width:100%;font:inherit;font-size:12px;font-weight:650";
      el.replaceWith(inp); inp.focus(); inp.select();
      let done=false;
      const close=async(save)=>{
        if(done) return;                 // Enter dispara también el blur
        done=true;
        const v=inp.value.trim();
        if(save && v && v!==before){
          remotes[i].name=v;
          await invoke("save_remotes",{remotes});
          refresh();                     // los proyectos llevan ese sufijo
        }
        renderRemotes();
      };
      inp.addEventListener("keydown",e=>{
        if(e.key==="Enter") close(true);
        if(e.key==="Escape") close(false);
      });
      inp.addEventListener("blur",()=>close(true));
    });
  });
  document.querySelectorAll("#remList .del-btn").forEach(b=>{
    b.onclick=async()=>{
      // confirmación en dos pasos: el primer clic pregunta, el segundo
      // elimina; si no confirmas en 4 s, el botón vuelve a la normalidad
      if(!b.classList.contains("arm")){
        b.classList.add("arm"); b.textContent=t("confirm_delete");
        b._t=setTimeout(()=>{ b.classList.remove("arm"); b.innerHTML=TRASH; },4000);
        return;
      }
      clearTimeout(b._t);
      remotes.splice(+b.dataset.i,1);
      try{ await invoke("save_remotes",{remotes}); }catch(e){}
      renderRemotes(); refresh();
    };
  });
  // estado de conexión de cada servidor (pastilla: conectado / sin conexión)
  remotes.forEach((r,i)=>{
    invoke("test_remote",{host:r.host}).then(()=>{
      const el=$("rstat-"+i); if(el){ el.className="spill ok"; el.innerHTML="<i></i>"+escapeHtml(t("status_active")); }
    }).catch(()=>{
      const el=$("rstat-"+i); if(el){ el.className="spill bad"; el.innerHTML="<i></i>"+escapeHtml(t("status_fail")); }
    });
  });
}
// ---------- Consejos: el coach 100% estático ----------
// Catálogo de fichas curadas (docs/consejos-coach.md). El contenido vive en
// I18N como todo texto visible; aquí solo van los ids, en el orden en que
// se muestran. Acordeón + filtro del lado del cliente — cero red, cero IA.
const TIPS=["clear","compact","cache","attach","ask","model"];
function renderTips(){
  const q=($("tipFilter").value||"").toLowerCase();
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  // resúmenes de sesión terminada (regla "sum"): tarjeta-espejo con el
  // ai-title del log (solo display; respaldo = nombre del proyecto) y los
  // contadores medidos. Se enseñan arriba y solo sin filtro activo.
  const sums=q?[]:coachHits.filter(h=>h.rule==="sum");
  const sumHtml=sums.map(h=>`<div class="fnd tip open">
      <div class="fnd-t">«${esc(h.title||fndProj(h.project))}»</div>
      <div class="fnd-m">${t("tip_sum_t")} — ${fndProj(h.project)} · ${t("src_local")}</div>
      <div class="fnd-f">${t("tip_sum_line",h.value,h.cmds,h.edits)}</div>
    </div>`).join("");
  // fichas disparadas por el motor de reglas: primero, abiertas y con su
  // línea "Ahora: <dato medido>" — el consejo en el momento en que sirve
  const hot={}; coachHits.forEach(h=>{ if(h.rule!=="sum"&&!(h.rule in hot)) hot[h.rule]=h; });
  const ids=[...TIPS].sort((a,b)=>((b in hot)?1:0)-((a in hot)?1:0));
  const list=ids.filter(id=>!q ||
    (t("tip_"+id+"_t")+" "+t("tip_"+id+"_b")).toLowerCase().includes(q));
  $("tipList").innerHTML=(sumHtml + list.map(id=>{
    const h=hot[id];
    // la ficha disparada dice A QUÉ sesión aplicar el consejo: proyecto +
    // "local" — el coach solo mira esta máquina, y con el VPS abierto al
    // lado la duda era real (Oscar, 2026-07-31)
    const donde=h?[h.project?fndProj(h.project):"", t("src_local")]
      .filter(Boolean).join(" · "):"";
    return `<div class="fnd tip${h?" open":""}" data-tip="${id}">
      <div class="fnd-t">${t("tip_"+id+"_t")}</div>
      ${h?`<div class="fnd-m">${t("tip_now_"+id,h.value)} — ${donde}</div>`:""}
      <div class="fnd-f">${t("tip_"+id+"_b")}</div>
    </div>`;}).join(""))
    || `<div style="font-size:11.5px;margin-top:10px;color:var(--txt-dim)">${t("tips_none")}</div>`;
  $("tipList").querySelectorAll(".tip").forEach(el=>
    el.addEventListener("click",()=>el.classList.toggle("open")));
  // lo que llegó a pintarse con la pestaña VISIBLE queda despachado: el
  // punto se apaga y esa regla no vuelve a sonar en esta sesión. Las fichas
  // siguen resaltadas hasta el próximo sondeo (ahí el filtro las limpia).
  if(!$("tab-tips").hidden && coachHits.length && !simFnd){
    const seen=tipSeenSet();
    coachHits.forEach(h=>seen.add(h.rule+"|"+h.session));
    localStorage.setItem("tipSeen",JSON.stringify([...seen].slice(-300)));
    coachHits=[];                                 // despachados
    renderTipsDot();
    if(lastPillArgs) emitPill(...lastPillArgs);   // apaga el aviso del widget
  }
}
$("tipFilter").addEventListener("input",renderTips);

// ---------- faqMisses: la cola larga, sin telemetría (doc §9) ----------
// Una búsqueda de 4+ letras que no enciende NINGUNA ficha se apunta LOCAL
// (dedup, tope 50); la pestaña dice cuántas van este mes y el botón abre un
// issue de GitHub PRE-LLENADO que el usuario revisa y envía él mismo. Nada
// viaja solo — así se juntan, a la vista, las 20-30 preguntas de la
// compuerta del modelo-lector.
function tipMisses(){ try{ return JSON.parse(localStorage.getItem("faqMisses")||"[]"); }catch(_){ return []; } }
const tipMes=()=>new Date().toISOString().slice(0,7);
function renderTipFoot(){
  const del=tipMisses().filter(x=>x.m===tipMes());
  $("tipFoot").hidden=!del.length;
  if(del.length) $("tipMissTxt").textContent=t("tips_miss",del.length);
}
let missT=null;
$("tipFilter").addEventListener("input",()=>{
  clearTimeout(missT);
  missT=setTimeout(()=>{                       // pausa: la búsqueda terminó
    const q=($("tipFilter").value||"").trim();
    if(q.length<4) return;                     // teclear no es preguntar
    const ql=q.toLowerCase();
    if(TIPS.some(id=>(t("tip_"+id+"_t")+" "+t("tip_"+id+"_b")).toLowerCase().includes(ql))) return;
    const m=tipMisses();
    if(m.some(x=>x.q.toLowerCase()===ql)) return;
    m.push({q, m:tipMes()});
    localStorage.setItem("faqMisses",JSON.stringify(m.slice(-50)));
    renderTipFoot();
  },1500);
});
$("tipPropose").addEventListener("click",e=>{
  e.preventDefault();
  const list=tipMisses().filter(x=>x.m===tipMes()).map(x=>"- "+x.q).join("\n");
  if(!list) return;
  invoke?.("open_faq_issue",{
    title:encodeURIComponent(t("tips_issue_title")),
    body:encodeURIComponent(t("tips_issue_intro")+"\n\n"+list)});
});
// descartar (propuesta de Oscar 2026-07-31): quien no use GitHub cierra la
// línea y en paz — se limpia lo del mes en curso y el pie se esconde
$("tipDismiss").addEventListener("click",e=>{
  e.preventDefault();
  localStorage.setItem("faqMisses",
    JSON.stringify(tipMisses().filter(x=>x.m!==tipMes())));

// ---------- motor de reglas de sesión activa (nivel 2 del doc) ----------
// El backend sondea la COLA de los logs vivos (lectura incremental) y
// devuelve hechos medidos; aquí vive el anti-spam: una vez por sesión por
// regla (tipSeen) y tope diario global (tipDay). Nada de esto va al globo:
// el globo es del umbral en dólares. Consejo = pestaña + punto en acento.
let coachHits=[];
function tipSeenSet(){ try{ return new Set(JSON.parse(localStorage.getItem("tipSeen")||"[]")); }catch(_){ return new Set(); } }
function renderTipsDot(n){
  const d=$("tipsTabDot");
  const v=(n!=null?n:coachHits.length);
  d.hidden=!v;
  if(v) d.textContent=v>9?"9+":String(v);
}
async function coachPoll(){
  if(!invoke) return;
  if(simFnd) return;               // simulación en curso: no la pises
  try{
    const hits=await invoke("get_coach")||[];
    const seen=tipSeenSet();
    let day={}; try{ day=JSON.parse(localStorage.getItem("tipDay")||"{}"); }catch(_){ day={}; }
    const hoy=new Date().toISOString().slice(0,10);
    if(day.d!==hoy||!Array.isArray(day.keys)) day={d:hoy,keys:[]};
    const out=[];
    for(const h of hits){
      const k=h.rule+"|"+h.session;
      if(seen.has(k)) continue;
      if(!day.keys.includes(k)){
        if(day.keys.length>=5) continue;   // tope diario: el coach no ametralla
        day.keys.push(k);
      }
      out.push(h);
    }
    localStorage.setItem("tipDay",JSON.stringify(day));
    coachHits=out;
    renderTipsDot();
    if(lastPillArgs) emitPill(...lastPillArgs);   // el widget lo ve al instante
    if(!$("tab-tips").hidden) renderTips();
  }catch(_){/* sin backend o sin logs: el siguiente ciclo reintenta */}
}
setTimeout(coachPoll,60*1000);       // el primer sondeo, tras la carga inicial
setInterval(coachPoll,3*60*1000);    // mismo compás que el ciclo del panel

// ---------- simulador de HALLAZGOS y CONSEJOS (solo dev, como el 🐱) ----------
// Idea de Oscar (2026-07-31): recorrer las superficies del analizador y el
// coach con datos FALSOS para testear lo visual en segundos; la detección
// real se valida con el uso. Mismas reglas que el simulador del gatito:
// solo builds de dev (is_dev), textos sin t(), y NADA toca localStorage —
// fndSeen/tipSeen quedan intactos (los guards !simFnd en los render) y al
// terminar se restaura el estado real. simRunning se enciende también para
// heredar la inhibición de acks y de notif:ready del otro simulador.

function sfFakeCoach(){

function sfStop(msg){
  clearTimeout(sfTimer); sfTimer=null;
  simFnd=false; simRunning=false; simB=null;
  fndCache=sfSavedFnd; sfSavedFnd=null;
  invoke?.("set_notif_visible",{visible:false});
  fndBadgeCalc();                       // contador y post-it rojos REALES
  coachHits=[]; renderTipsDot(); coachPoll();   // el sondeo real refresca

  if(!$("tab-tips").hidden) renderTips();
  if(lastPillArgs) emitPill(...lastPillArgs);

  $("sfBtn").textContent="🧪 Simular hallazgos";
  $("simMsg").textContent=msg||"";
}
const SF_STEPS=[
  function(){   // 1: tarjetas de Hallazgos + contador + post-it rojo
    showTab("findings");
    sfSavedFnd=fndCache; fndCache=sfFakeFindings(); renderFindings();
    fndBadge={n:4,sev:"bad"}; renderFndDot();
    if(lastPillArgs) emitPill(...lastPillArgs);
    return "hallazgos: tarjetas + post-it rojo";
  },
  function(){   // 2: el globo del día, en rojo (pasa de $10)
    simB={kind:"findings", sev:"danger",
      body:`${t("fnd_cachebreak_t",15)} · ~$63.37`};
    simBalloon(simB);
    return "globo del día";
  },
  function(){   // 3: fichas calientes + resumen + post-it turquesa
    simB=null; invoke?.("set_notif_visible",{visible:false});
    showTab("tips");
    coachHits=sfFakeCoach(); renderTipsDot(); renderTips();
    if(lastPillArgs) emitPill(...lastPillArgs);
    return "consejos: fichas + resumen + post-it turquesa";
  },
];
function sfStep(i){
  if(i>=SF_STEPS.length){ sfStop("listo · de vuelta al estado real"); return; }
  const lbl=SF_STEPS[i]();
  $("simMsg").textContent=`${i+1}/${SF_STEPS.length} · ${lbl}`;
  sfTimer=setTimeout(()=>sfStep(i+1), simMs());
}
$("sfBtn").addEventListener("click",()=>{
  if(simFnd){ sfStop("detenido"); return; }
  if(simRunning) return;               // el simulador del gatito va primero

  $("sfBtn").textContent="■ Detener"; sfStep(0);

// El backend mide; aquí solo se pinta. Reglas de docs/analizador-fugas.md:
// costos con "~" cuando llevan heurística, nunca se aplica nada solo, y el
// botón Ignorar persiste (un hallazgo despachado no debe volver cada semana).

function fndKey(f){ return [f.kind,f.file||f.server||f.session,f.origin||""].join("|"); }
// título de una tarjeta — lo usan la pestaña Y el globo del día
function fndTitle(f){
  return f.kind==="reread"?t("fnd_reread_t",f.count)
    :f.kind==="inflate"?t("fnd_inflate_t",f.turns)
    :f.kind==="mech"?t("fnd_mech_t",f.count)
    :f.kind==="cachebreak"?t("fnd_cachebreak_t",f.count)
    :f.kind==="skills_unused"?t("fnd_skills_t",f.count)
    :f.kind==="subagents"?t("fnd_subagents_t",f.count)
    :f.kind==="hooks_noise"?t("fnd_hooks_t",f.count)
    :f.kind==="claudemd"?t("fnd_claudemd_t",f.count)
    :t("fnd_mcp_t",f.server);
}
function fndIgnored(){ try{ return new Set(JSON.parse(localStorage.getItem("fndIgnore")||"[]")); }catch(_){ return new Set(); } }
function fmtTok(n){ return n>=1e6 ? (n/1e6).toFixed(1)+"M" : n>=1e3 ? Math.round(n/1e3)+"k" : String(n); }
// nombre legible del proyecto: la carpeta cruda viene tipo
// "-opt-projects-michiclaude" o "C--Users-oscar-mi-proyecto"
function fndProj(raw){
  const m=String(raw).match(/projects-(.+)$/);
  return m ? m[1] : String(raw).replace(/^-+/,"").split("-").pop() || raw;
}
// ---------- aviso de hallazgos nuevos (contador + sticker del widget) ----------
// El panel es el ÚNICO que escanea: una pasada ligera de 1 día, como mucho una
// vez cada FND_SCAN_MS. Los widgets solo reciben {n, sev, tip} dentro de
// quota:update y pintan. "Visto" = la tarjeta llegó a pintarse en la pestaña;
// su clave se guarda y el aviso se apaga — mismo espíritu que el globo: se
// despacha una vez, no persigue. El resultado de la pasada se guarda
// (fndAuto) para que reiniciar la app no apague un aviso que nadie vio.
const FND_SCAN_MS=20*3600*1000;   // ~diaria, con margen para no ir derivando
let fndBadge=null;                // {n, sev} o null
function fndSeen(){ try{ return new Set(JSON.parse(localStorage.getItem("fndSeen")||"[]")); }catch(_){ return new Set(); } }
function fndBadgeOn(){ return localStorage.getItem("fndBadgeOff")!=="1"; }
function fndBadgeCalc(){
  let saved=[]; try{ saved=JSON.parse(localStorage.getItem("fndAuto")||"[]"); }catch(_){ saved=[]; }
  const seen=fndSeen(), ign=fndIgnored();
  const fresh=saved.filter(x=>!seen.has(x.k)&&!ign.has(x.k));
  // misma escala de severidad que las tarjetas: rojo duele, ámbar avisa
  fndBadge = fresh.length ? {n:fresh.length,
    sev: fresh.some(x=>x.c>=10)?"bad":fresh.some(x=>x.c>=1||x.mcp)?"warn":"acc"} : null;
  renderFndDot();
  if(lastPillArgs) emitPill(...lastPillArgs);   // el widget lo ve al instante
}
function renderFndDot(){
  const d=$("fndTabDot");
  d.hidden=!fndBadge;
  // rojo fijo, como el post-it y la campana (maqueta de Oscar): el rojo ES
  // la señal de "hay algo nuevo"; la severidad se ve en las tarjetas
  if(fndBadge) d.textContent=fndBadge.n>9?"9+":String(fndBadge.n);
}
async function fndAutoScan(){
  if(!invoke) return;
  if(simFnd) return;               // simulación en curso: no la pises
  if(Date.now()-(+localStorage.getItem("fndAutoLast")||0)<FND_SCAN_MS) return;
  try{
    const list=await invoke("get_findings",{days:1});
    localStorage.setItem("fndAutoLast",String(Date.now()));
    // se guarda lo justo para el badge Y para el título del globo del día
    localStorage.setItem("fndAuto",JSON.stringify(
      (list||[]).map(f=>({k:fndKey(f),c:f.cost,mcp:f.kind==="mcp_unused",
        kind:f.kind,n:f.count||f.turns,sv:f.server}))));
    fndBadgeCalc();
    fndNudge();
  }catch(_){/* sin datos o sin red: el siguiente tic reintenta */}
}
// ---------- el globo del día ----------
// Un hallazgo NUEVO que duela en dólares merece un empujón activo, no solo
// el post-it. Reglas (acordadas con Oscar 2026-07-30): máximo uno al día
// (hereda la cadencia del escaneo), umbral en $ configurable, la CUOTA
// siempre gana la prioridad de globos, sin toast de Windows (no es urgente:
// sin widget queda el contador de la pestaña), y cada hallazgo se avisa UNA
// sola vez en la vida (fndNudged) — el globo no persigue, como todo aquí.
// Se despacha con la ✕ o al abrir el panel (regla única de los globos, vía
// infoBalloon); si hoy no se pudo salir, el escaneo de mañana reintenta.
function fndNudgeUsd(){
  const v=parseFloat(localStorage.getItem("fndNudgeUsd"));
  return isNaN(v)||v<0 ? 1 : v;
}
function fndNudgedSet(){ try{ return new Set(JSON.parse(localStorage.getItem("fndNudged")||"[]")); }catch(_){ return new Set(); } }
function fndNudge(){
  if(simRunning) return;
  if(!fndBadgeOn()) return;              // mismo interruptor que el post-it
  if(!pillOn) return;                    // sin widget no hay dónde colgarlo
  for(const k of ACK_KINDS)
    if(localStorage.getItem("ackPending:"+k)==="1") return;   // la cuota gana
  if(infoBalloon()) return;              // ya hay un globo informativo puesto
  let saved=[]; try{ saved=JSON.parse(localStorage.getItem("fndAuto")||"[]"); }catch(_){ saved=[]; }
  const seen=fndSeen(), ign=fndIgnored(), nudged=fndNudgedSet();
  const cand=saved.filter(x=>!seen.has(x.k)&&!ign.has(x.k)&&!nudged.has(x.k)
    &&x.c>0&&x.c>=fndNudgeUsd());
  if(!cand.length) return;
  cand.sort((a,b)=>b.c-a.c);
  // TODOS los candidatos quedan avisados: un globo al día, no una cola
  cand.forEach(x=>nudged.add(x.k));
  localStorage.setItem("fndNudged",JSON.stringify([...nudged].slice(-300)));
  const f=cand[0];
  localStorage.setItem("fndNudgeSev", f.c>=10?"danger":"warn");
  const title=f.kind?fndTitle({kind:f.kind,count:f.n,turns:f.n,server:f.sv})
    :t("fnd_badge_tip",cand.length);     // entrada vieja sin kind: genérico
  showBalloon(`${title} · ~$${f.c.toFixed(2)}`,"findings");
}

// ---------- avisos al celular (ntfy) ----------
// La config vive en ntfy_config.json (backend); aquí solo una copia en
// memoria. Rust no redacta nada: todos los textos salen de t() ya en el
// idioma activo, la misma regla del menú del tray.
let ntfyCfg=null;
async function ntfyLoad(){
  if(!invoke) return;
  try{ ntfyCfg=await invoke("get_ntfy"); }catch(_){ ntfyCfg=null; }
  ntfyUi();
}
function ntfyOn(){ return !!(ntfyCfg&&ntfyCfg.enabled&&ntfyCfg.topic); }
// Fire-and-forget: un fallo de red JAMÁS bloquea nada local (queda en
// ntfy_debug.json). simRunning: el simulador nunca manda pushes de verdad.
function ntfyPush(body, priority, at){
  if(!ntfyOn()||simRunning||!invoke) return;
  invoke("ntfy_push",{title:"MichiClaude", body, priority:priority||3, at:at??null})
    .catch(()=>{});
}
// Límite al 100%: aviso INMEDIATO + el PROGRAMADO de "ya volvió", que ntfy
// retiene y entrega a la hora del reset AUNQUE la PC esté apagada — por eso
// el inmediato puede prometer "puedes apagar, yo te aviso". El programado
// solo si cabe en el límite de 3 días de ntfy.sh (el semanal puede no caber:
// entonces el inmediato ya dice el día y no se promete nada). +2 min de
// colchón por el jitter del resets_at.
function ntfyLimit(body, resets, kind){
  if(!ntfyOn()) return;
  const ms=resets ? new Date(resets)-Date.now() : 0;
  const fits=ms>6e4 && ms<(3*86400-3600)*1000;
  ntfyPush(body+(fits?" "+t("ntfy_promise"):""), 4, null);
  if(fits)
    ntfyPush(t(kind==="session"?"notif_back_session":"notif_back_week"), 3,
             Math.floor(new Date(resets).getTime()/1000)+120);
}
function ntfyUi(){
  const on=!!(ntfyCfg&&ntfyCfg.enabled);
  $("ntfyChk").checked=on;
  $("ntfyBox").hidden=!on;
  $("ntfyAlarmChk").checked=!!(ntfyCfg&&ntfyCfg.alarms);
  if(!on||!ntfyCfg.topic) return;
  $("ntfyTopic").value=(ntfyCfg.server||"https://ntfy.sh").replace(/\/+$/,"")+"/"+ntfyCfg.topic;
  invoke&&invoke("ntfy_qr").then(ntfyPaintQr).catch(()=>{});
}
// El QR llega como matriz de módulos y se pinta aquí: sin PNG, sin librerías.
// Siempre negro sobre blanco, en los dos temas: un QR invertido no lo leen
// todas las cámaras.
function ntfyPaintQr(q){
  const cv=$("ntfyQr"), n=q.size, ctx=cv.getContext("2d");
  const px=Math.max(1, Math.floor(cv.width/(n+8)));   // 4 módulos de zona quieta
  const off=Math.floor((cv.width-px*n)/2);
  ctx.fillStyle="#ffffff"; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.fillStyle="#000000";
  for(let y=0;y<n;y++)for(let x=0;x<n;x++)
    if(q.cells[y*n+x]==="1") ctx.fillRect(off+x*px, off+y*px, px, px);
}

async function loadFindings(force){
  if(!invoke) return;
  if(fndBusy) return;
  if(fndCache && !force){ renderFindings(); return; }
  fndBusy=true;
  // el primer escaneo de la sesión tarda segundos (SSH incluido): mientras
  // llega, se enseña el ÚLTIMO resultado guardado de la misma ventana, con
  // el "Analizando…" en el pie para no vender lo viejo como fresco
  let warm=false;
  if(!fndCache){
    try{
      const s=JSON.parse(localStorage.getItem("fndCacheSaved")||"null");
      if(s && s.days===fndDays && Array.isArray(s.list)){
        fndCache=s.list; warm=true; renderFindings();
        $("fndFoot").textContent=t("fnd_scanning");
      }
    }catch(_){}
  }
  if(!warm){
    $("fndList").innerHTML=`<div style="font-size:11px;color:var(--txt-dim);margin-top:8px">${t("fnd_scanning")}</div>`;
    $("fndFoot").textContent="";
  }
  try{
    fndCache=await invoke("get_findings",{days:fndDays});
    try{ localStorage.setItem("fndCacheSaved",
      JSON.stringify({days:fndDays,list:fndCache})); }catch(_){}
    renderFindings();
  }
  catch(_){
    // con datos viejos ya en pantalla se quedan; el pie dice que falló
    if(warm) $("fndFoot").textContent=t("fnd_err");
    else $("fndList").innerHTML=`<div style="font-size:11px;color:var(--bad);margin-top:8px">${t("fnd_err")}</div>`;
  }
  finally{ fndBusy=false; }
}
function renderFindings(){
  const ign=fndIgnored();
  const list=(fndCache||[]).filter(f=>!ign.has(fndKey(f)));
  const hid=(fndCache||[]).length-list.length;
  if(!list.length){
    $("fndList").innerHTML=`<div style="font-size:11.5px;margin-top:10px">${t("fnd_none")}</div>`;
  }else{
    $("fndList").innerHTML=list.map(f=>{
      // severidad por costo, como los avisos: rojo duele, ámbar avisa
      const sev=f.cost>=10?"bad":f.cost>=1||f.kind==="mcp_unused"?"warn":"";
      const est=f.estimated?"~":"";
      const title=fndTitle(f);
      const meta=[f.file?f.file.split(/[\\/]/).pop():"",
        f.project?fndProj(f.project):"", f.origin||t("src_local")]
        .filter(Boolean).join(" · ");
      const cost=f.cost>0?`${est}$${f.cost.toFixed(2)} · ${est}${fmtTok(f.tokens)} tok`
        :f.tokens>0?`${est}${fmtTok(f.tokens)} tok`:"";
      return `<div class="fnd ${sev}">
        <button class="fnd-x" data-k="${fndKey(f).replace(/"/g,"&quot;")}">${t("fnd_ignore")} ✕</button>
        <div class="fnd-t">${title}</div>
        <div class="fnd-m">${meta}</div>
        ${cost?`<div class="fnd-c">${cost}</div>`:""}
        <div class="fnd-f">${t("fnd_"+f.kind.split("_")[0]+"_f")||""}</div>
      </div>`;
    }).join("");
    $("fndList").querySelectorAll(".fnd-x").forEach(b=>b.addEventListener("click",()=>{
      const ign2=fndIgnored(); ign2.add(b.dataset.k);
      localStorage.setItem("fndIgnore",JSON.stringify([...ign2]));
      renderFindings();
    }));
  }
  const bits=[t("fnd_est_note")];
  if(hid>0) bits.push(`${t("fnd_hidden",hid)} · <a href="#" id="fndRestore" style="color:var(--accent)">${t("fnd_restore")}</a>`);
  $("fndFoot").innerHTML=bits.join(" · ");
  const r=$("fndRestore");
  if(r) r.addEventListener("click",e=>{ e.preventDefault();
    localStorage.removeItem("fndIgnore"); renderFindings(); });
  // lo que quedó A LA VISTA cuenta como visto: el contador y el sticker se
  // apagan y estas tarjetas no los vuelven a encender (las de mañana sí).
  // SOLO si la pestaña está de verdad en pantalla: la precarga de fondo
  // también pinta, y marcar visto lo que nadie vio mataría el aviso.
  // (Y NUNCA durante el simulador: sus tarjetas falsas no deben pisar
  // fndSeen — misma regla que los globos simulados y localStorage.)
  if(!$("tab-findings").hidden && !simFnd){
    const seen=fndSeen(); list.forEach(f=>seen.add(fndKey(f)));
    localStorage.setItem("fndSeen",JSON.stringify([...seen].slice(-300)));
    fndBadgeCalc();
  }
}
// El comando propio es un caso rarísimo (otro binario de python, un
// contenedor...). Oculto por defecto: verlo sin saber para qué es solo
// genera dudas, y vacío es lo correcto para casi todo el mundo.
$("rAdd").addEventListener("click",async()=>{
  const name=$("rName").value.trim()||"server";
  const host=$("rHost").value.trim();
  const python=$("rPy").value.trim();
  if(!host){ $("rMsg").textContent=t("msg_no_host"); return; }
  $("rAdd").disabled=true;
  $("rMsg").textContent=t("msg_testing");
  try{
    await invoke("test_remote",{host});
    // MichiClaude instala el lector él mismo: el usuario no copia nada ni
    // sabe rutas. Si la detección falló antes, `python` trae la ruta que
    // escribió y se usa esa; el comando lo arma siempre la app.
    $("rMsg").textContent=t("msg_installing");
    const cmd = await invoke("install_remote",{host, python:python||null});
    remotes=remotes.filter(r=>!(r.host===host&&r.command===cmd)); // sin duplicados
    remotes.push({name,host,command:cmd});
    await invoke("save_remotes",{remotes});
    $("rMsg").textContent=t("msg_added");
    $("rName").value=""; $("rHost").value=""; $("rPy").value="";
    $("rPyBox").hidden=true;                 // volvió a funcionar solo
    renderRemotes(); refresh();
  }catch(e){
    // los códigos ERR_* del backend se traducen; el resto se muestra tal cual
    const m=String(e);
    const known={ERR_NO_PYTHON:"err_no_python", ERR_BAD_PYTHON:"err_bad_python"};
    $("rMsg").textContent="✗ "+(known[m]?t(known[m]):m);
    // No lo encontró solo: el campo aparece CON el error delante, que es lo
    // que le da sentido. Y sigue visible si la ruta escrita tampoco servía.
    if(known[m]) $("rPyBox").hidden=false;
  }
  finally{ $("rAdd").disabled=false; }
});

// ---------- precios de modelos (descarga automática con cascada) ----------
// El backend hace la descarga; aquí solo se muestra el estado y el interruptor.
// "hace 2 h" en el idioma activo sin añadir claves: lo resuelve el navegador.
function fmtAgo(iso){
  const ms = Date.now() - new Date(iso).getTime();
  if(!isFinite(ms) || ms < 0) return "";
  try{
    const rtf = new Intl.RelativeTimeFormat(lang, {numeric:"auto"});
    const min = Math.round(ms/6e4);
    if(min < 60) return rtf.format(-min, "minute");
    const h = Math.round(min/60);
    return h < 48 ? rtf.format(-h, "hour") : rtf.format(-Math.round(h/24), "day");
  }catch(e){ return ""; }
}
function renderPricesStatus(){
  if(!invoke) return;
  invoke("get_prices_status").then(s=>{
    // El botón sobra mientras todo va bien: la descarga es automática. Solo
    // aparece cuando hay algo que reintentar (sin red, o nunca descargado).
    const ok = !!s.fetched_at;
    // "viejo" = lleva más de una semana sin poder actualizarse: los precios
    // cambian pocas veces, pero si la descarga lleva días fallando hay que
    // decirlo en vez de mostrar costes con datos rancios.
    const viejo = ok && (Date.now() - new Date(s.fetched_at).getTime()) > 7*864e5;
    const problema = !s.auto ? false : (!ok || viejo);
    // El botón se queda SIEMPRE visible: que aparezca y desaparezca confunde
    // más de lo que limpia, y en Preferencias no estorba.
    // Aviso donde de verdad importa: junto a los costes. Un usuario normal no
    // entra a Preferencias a comprobar si la descarga funcionó.
    $("priceWarn").hidden = !problema;
    $("priceWarn").title = t("prices_warn_tip");
    $("pricesMsg").textContent = !s.auto ? t("prices_off")
      : ok ? t("prices_src", s.source, fmtAgo(s.fetched_at), s.count)
      : (s.last_try ? t("prices_offline") : t("prices_none"));
  }).catch(()=>{});
}

// Transparencia: de dónde salen los precios, a la vista y sin tener que ir al
// README. El interruptor para apagar la descarga vive en prices_config.json
// (documentado); sacarlo de la UI evita que alguien se quede con precios
// viejos sin querer, pero no le quita la salida a quien la necesite.
$("pricesInfo").addEventListener("click",()=>{
  $("pricesSources").hidden = !$("pricesSources").hidden;
});
$("pricesNow").addEventListener("click",()=>{
  $("pricesMsg").textContent="…";
  // el propio backend emite prices:updated al terminar, que ya repinta el
  // estado y recalcula los costes; aquí solo se informa del fallo
  invoke?.("refresh_prices_now")
    .catch(()=>{ $("pricesMsg").textContent=t("prices_err"); });
});
function doExport(format){
  expShow(null);
  invoke("export_data",{
    format,
    dir:$("exportDir").value.trim()||null,
    days:+$("expDays").value||30,
    headers:t("exp_cols"),
    // En el reporte el origen es un nombre propio junto a "VPS-EU" o
    // "Ubuntu", así que va en mayúscula. En el panel es una etiqueta pequeña
    // dentro de una frase y ahí va en minúscula: mismo dato, dos contextos.
    local:(x=>x.charAt(0).toUpperCase()+x.slice(1))(t("src_local")),
  })
    .then(p=>expShow(p, format))
    .catch(e=>expShow(null, format, String(e)));
}
// La ruta se recorta por el PRINCIPIO: de "C:\\Users\\oscar\\Downloads\\x.csv"
// lo que importa es el final, no la letra de la unidad.
function shortPath(p){
  const parts=String(p).split(/[\\/]/);
  return parts.length>2 ? "…" + p.slice(p.length - (parts.at(-1).length + parts.at(-2).length + 2)) : p;
}
function expShow(path, format, err){
  const b=$("expBox");
  if(!path && !err){ b.hidden=true; return; }      // en curso: sin ruido
  b.hidden=false;
  b.classList.toggle("bad", !!err);
  $("expIco").innerHTML = err
    ? `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v5M12 16h.01"/></svg>`
    : `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 12.5l2.5 2.5L16 9.5"/></svg>`;
  $("expTitle").textContent = err ? err : t("exp_ok", format.toUpperCase());
  $("expPath").textContent = err ? "" : shortPath(path);
  $("expPath").title = err ? "" : path;
  $("expOpen").textContent = t("exp_open");
}
$("expOpen").addEventListener("click",()=>invoke?.("open_export"));
$("expX").addEventListener("click",()=>{ $("expBox").hidden=true; });
$("expDays").value=localStorage.getItem("expDays")||"30";
$("expDays").addEventListener("change",()=>localStorage.setItem("expDays",$("expDays").value));
$("expCsv").addEventListener("click",()=>doExport("csv"));
$("expJson").addEventListener("click",()=>doExport("json"));
