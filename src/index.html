  fnd_mcp_t:s=>`Unused MCP server: ${s}`,
  fnd_reread_f:"Ask for the part that matters (line ranges) instead of the whole file — each read stacks onto the conversation, it does not replace the previous one.",
  fnd_inflate_f:"A /clear when you change topics splits the context: every turn re-reads everything that came before.",
  fnd_mech_f:"Batch them at the end, or run them yourself in the terminal — that way they are free.",
  fnd_mcp_f:"Its tool definitions travel in every request anyway. Removing it from the config is one line, and reconnecting is another.",
  fnd_cachebreak_t:n=>`The context was rewritten ${n} times in one conversation`,
  fnd_cachebreak_f:"After a pause (the cache expires within minutes) or a model switch, the whole conversation is written to the cache again at full write price. If the topic changed while you were away, /clear starts from a tiny context — almost free.",
  fnd_skills_t:n=>`Installed skills you didn't use: ${n}`,
  fnd_skills_f:"Each installed skill adds its line to every request so Claude knows it exists. Removing the ones you don't use from ~/.claude/skills is free — and bringing one back is just copying a folder.",
  fnd_subagents_t:n=>`Subagents ran ${n} turns on the side`,
  fnd_subagents_f:"Each subagent reads and pays for its own context, separate from your conversation — this cost is already inside your total, it just isn't visible there. If the agent's task is mechanical, a small model (Haiku) does it for a fraction.",
  fnd_hooks_t:n=>`A hook printed output ${n} times`,
  fnd_hooks_f:"Everything a hook prints joins the context of that turn — and travels again with every turn after it. If it has nothing to say, exiting silently (exit 0, no output) is free.",
  fnd_claudemd_t:n=>`${n} CLAUDE.md lines mention things with no recent trace`,
  fnd_claudemd_f:"CLAUDE.md travels whole with every conversation. These lines mention paths or commands that never showed up in this window's logs — worth checking if they still earn their place. Deleting is free (only the next message rebuilds the cache once); if something is used only now and then, keep it.",
  fnd_claudemdsize_t:n=>`CLAUDE.md is bigger than Claude Code loads (${n}k chars)`,
  fnd_claudemdsize_f:"Claude Code only loads the first 40k characters — the rest is never read, so rules at the bottom of the file silently never reach the model. Move history and old notes to docs/ and keep only what's current in CLAUDE.md.",
  tips_tab:"Tips",
  tips_title:"Tips to stretch your quota",
  tips_intro:"Short hand-written cards — no AI, no network. They update with each app release. Tap one to open it.",
  tips_filter:"Filter…",
  tips_none:"Nothing matches the filter.",

  tips_issue_title:"Tips: searches with no card",
  tips_issue_intro:"These searches in the Tips tab matched no card. Ideas for new cards:",
  tip_clear_t:"Does /clear delete my work?",
  tip_clear_b:"No. /clear wipes only the conversation. What you do NOT lose:\n• Your code — it lives in your files, not in the chat.\n• Your CLAUDE.md — it reloads by itself in the new session.\n• Past sessions — “claude --resume” lists them so you can pick one up.\nThe only thing gone is the chat thread — which is exactly what costs tokens every turn.",
  tip_compact_t:"/clear or /compact?",
  tip_compact_b:"/clear starts from zero: the cheapest. /compact summarizes the conversation keeping the essentials (tens of thousands of tokens down to a few thousand).\n• New, independent topic → /clear.\n• New topic overlaps the previous one → /compact.\nThe key question: does what comes next need what was already said?",
  tip_cache_t:"The cache expires in minutes",
  tip_cache_b:"Your conversation lives in a cache that expires after a few idle minutes. Coming back from a long pause rewrites the whole context at full price — reading it cached costs ~10x less. With a big conversation: finish the thought before stepping away, and if the topic changed while you were gone, /clear.",
  tip_attach_t:"Mention the file, don’t paste it",
  tip_attach_b:"Pasting the same code again and again stacks copies in the context, and every copy travels with every turn after that. Give the path instead (or @file): Claude reads exactly what it needs, from the current version, with no duplicates.",
  tip_ask_t:"Ask quick questions in a separate session",
  tip_ask_b:"A short question inside a big session drags the WHOLE accumulated context: you pay thousands of tokens for a two-line doubt. Open a fresh session and the same answer costs cents. Twice as true for general questions that don’t need your code.",
  tip_model_t:"Small model for mechanical work",
  tip_model_b:"Renaming, formatting, running tests, writing a commit message: a small model (Haiku) does it just as well for a fraction. Switch with /model for that task and go back to the big one for work that actually needs thinking.",
  tip_now_compact:n=>`Now: this session carries ~${n}k tokens of context`,
  tip_now_cache:n=>`Now: ${n} min pause with a big context — the cache has expired`,
  tip_acomp_t:"Claude Code compacted on its own",
  tip_acomp_b:"When a session hits its context ceiling, Claude Code compresses the conversation by itself so it can keep going — that is why the pressure gauge just dropped. It works, but the machine picks the moment, right in the middle of whatever you were doing. If you run /compact yourself at a natural pause (a task just finished), you pick the moment and the summary comes out better.",
  tip_shots_t:"Many screenshots in one session",
  tip_shots_b:"Every screenshot Claude looks at goes into the context and travels with every turn after that — a look-tweak-look loop can pile up dozens. When iterating on a design, ask for a screenshot only at the end of each batch of changes (or cropped to the area that changed), not after every tweak.",

  fnd_reread_f:"Pide el trozo que importa (rangos de líneas) en vez del archivo entero — cada lectura se apila en la conversación, no reemplaza a la anterior.",
  fnd_inflate_f:"Un /clear al cambiar de tema parte el contexto: cada turno relee todo lo anterior.",

  fnd_mcp_f:"Sus definiciones viajan en cada petición de todas formas. Quitarlo de la configuración es una línea, y reconectarlo otra.",
  fnd_cachebreak_t:n=>`El contexto se reescribió ${n} veces en la misma conversación`,
  fnd_cachebreak_f:"Tras una pausa (el caché caduca en minutos) o al cambiar de modelo, toda la conversación vuelve a escribirse al caché a precio completo. Si al volver el tema ya es otro, /clear arranca con un contexto chiquito — casi gratis.",
  fnd_skills_t:n=>`Skills instaladas que no usaste: ${n}`,
  fnd_skills_f:"Cada skill instalada añade su línea a cada petición para que Claude sepa que existe. Quitar de ~/.claude/skills las que no usas es gratis — y devolver una es copiar una carpeta.",
  fnd_subagents_t:n=>`Los subagentes trabajaron ${n} turnos aparte`,
  fnd_subagents_f:"Cada subagente lee y paga su propio contexto, aparte del de tu conversación — ese costo ya está dentro del total, solo que ahí no se ve. Si la tarea del agente es mecánica, un modelo chico (Haiku) la hace igual por una fracción.",
  fnd_hooks_t:n=>`Un hook imprimió salida ${n} veces`,
  fnd_hooks_f:"Todo lo que un hook imprime entra al contexto de ese turno — y vuelve a viajar con cada turno posterior. Si no tiene nada que decir, callar (exit 0 sin salida) sale gratis.",
  fnd_claudemd_t:n=>`${n} líneas del CLAUDE.md mencionan cosas sin rastro reciente`,
  fnd_claudemd_f:"El CLAUDE.md viaja entero con cada conversación. Estas líneas mencionan rutas o comandos que no aparecieron en los logs de esta ventana — vale la pena revisar si siguen ganándose su lugar. Borrar es gratis (solo el siguiente mensaje reconstruye el caché una vez); si algo se usa solo de vez en cuando, se queda.",
  fnd_claudemdsize_t:n=>`El CLAUDE.md pasa de lo que Claude Code carga (${n}k caracteres)`,
  fnd_claudemdsize_f:"Claude Code solo carga los primeros 40k caracteres — el resto no se lee nunca, así que las reglas al fondo del archivo no llegan al modelo, en silencio. Muda el historial y lo viejo a docs/ y deja en CLAUDE.md solo lo vigente.",
  tips_tab:"Consejos",
  tips_title:"Consejos para cuidar tu cuota",
  tips_intro:"Fichas cortas escritas a mano — sin IA, sin red. Se actualizan con cada versión de la app. Toca una para abrirla.",

  tips_issue_intro:"Estas búsquedas en la pestaña Consejos no encontraron ninguna ficha. Ideas para fichas nuevas:",
  tip_clear_t:"¿/clear borra mi trabajo?",
  tip_clear_b:"No. /clear borra solo la conversación. Lo que NO se pierde:\n• Tu código — vive en tus archivos, no en el chat.\n• Tu CLAUDE.md — se recarga solo en la sesión nueva.\n• Las sesiones anteriores — «claude --resume» las lista y puedes retomarlas.\nLo único que se va es el hilo de lo hablado — que es justo lo que cuesta tokens en cada turno.",
  tip_compact_t:"¿/clear o /compact?",
  tip_compact_b:"/clear arranca de cero: lo más barato. /compact resume la conversación conservando lo esencial (de decenas de miles de tokens a unos pocos miles).\n• Tema nuevo independiente → /clear.\n• El tema nuevo se cruza con el anterior → /compact.\nLa pregunta clave: ¿lo que sigue necesita lo ya hablado?",
  tip_cache_t:"El caché caduca en minutos",
  tip_cache_b:"Tu conversación vive en un caché que expira a los pocos minutos sin actividad. Al volver de una pausa larga, todo el contexto se reescribe a precio completo — releerlo cacheado cuesta ~10 veces menos. Con una conversación grande: cierra la idea antes de levantarte, y si al volver el tema ya es otro, /clear.",
  tip_attach_t:"Menciona el archivo, no lo pegues",
  tip_attach_b:"Pegar el mismo código una y otra vez apila copias en el contexto, y cada copia viaja en todos los turnos siguientes. Mejor da la ruta (o @archivo): Claude lee justo lo que necesita, de la versión actual, sin duplicados.",
  tip_ask_t:"Las dudas, en una sesión aparte",
  tip_ask_b:"Una pregunta corta dentro de una sesión grande arrastra TODO el contexto acumulado: pagas miles de tokens por una duda de dos líneas. Ábrela en una sesión nueva y la misma respuesta cuesta centavos. Vale doble para dudas generales que no necesitan tu código.",
  tip_model_t:"Modelo chico para lo mecánico",
  tip_model_b:"Renombrar, formatear, correr tests, redactar un commit: un modelo chico (Haiku) lo hace igual por una fracción. Cámbialo con /model para esa tarea y regresa al grande para lo que sí requiere pensar.",
  tip_now_compact:n=>`Ahora: esta sesión lleva ~${n}k tokens de contexto`,
  tip_now_cache:n=>`Ahora: ${n} min de pausa con contexto grande — el caché ya venció`,
  tip_acomp_t:"Claude Code compactó por su cuenta",
  tip_acomp_b:"Cuando una sesión llega a su techo de contexto, Claude Code comprime la conversación él solo para poder seguir — por eso el manómetro bajó de golpe. Funciona, pero el momento lo elige la máquina, en mitad de lo que estuvieras haciendo. Si aplicas /compact tú en una pausa natural (una tarea recién terminada), el momento lo eliges tú y el resumen sale mejor.",
  tip_shots_t:"Muchas capturas en una sesión",
  tip_shots_b:"Cada captura que Claude mira entra al contexto y viaja en todos los turnos siguientes — un bucle de mirar-retocar-mirar acumula decenas. Cuando itere un diseño, pídele que verifique con captura solo al final de cada tanda de cambios (o recortada a la zona que cambió), no en cada retoque.",

  tip_clear_t:"O /clear apaga meu trabalho?",
  tip_clear_b:"Não. O /clear apaga só a conversa. O que você NÃO perde:\n• Seu código — vive nos seus arquivos, não no chat.\n• Seu CLAUDE.md — recarrega sozinho na sessão nova.\n• As sessões anteriores — “claude --resume” as lista para retomar.\nA única coisa que se vai é o fio da conversa — que é justamente o que custa tokens a cada turno.",
  tip_compact_t:"/clear ou /compact?",
  tip_compact_b:"/clear começa do zero: o mais barato. /compact resume a conversa mantendo o essencial (de dezenas de milhares de tokens para poucos milhares).\n• Assunto novo e independente → /clear.\n• O assunto novo se cruza com o anterior → /compact.\nA pergunta-chave: o que vem agora precisa do que já foi dito?",

  tip_cache_b:"Sua conversa vive num cache que expira após poucos minutos de inatividade. Ao voltar de uma pausa longa, todo o contexto é reescrito a preço cheio — lê-lo do cache custa ~10x menos. Com uma conversa grande: feche a ideia antes de sair, e se ao voltar o assunto for outro, /clear.",
  tip_attach_t:"Mencione o arquivo, não cole",
  tip_attach_b:"Colar o mesmo código várias vezes empilha cópias no contexto, e cada cópia viaja em todos os turnos seguintes. Melhor dar o caminho (ou @arquivo): o Claude lê exatamente o que precisa, da versão atual, sem duplicatas.",
  tip_ask_t:"Dúvidas, em uma sessão à parte",
  tip_ask_b:"Uma pergunta curta dentro de uma sessão grande arrasta TODO o contexto acumulado: você paga milhares de tokens por uma dúvida de duas linhas. Abra numa sessão nova e a mesma resposta custa centavos. Vale em dobro para dúvidas gerais que não precisam do seu código.",
  tip_model_t:"Modelo pequeno para o mecânico",
  tip_model_b:"Renomear, formatar, rodar testes, escrever um commit: um modelo pequeno (Haiku) faz igual por uma fração. Troque com /model para essa tarefa e volte ao grande para o que exige pensar.",

  tip_acomp_t:"O Claude Code compactou sozinho",

  fnd_mcp_t:s=>`Serveur MCP inutilisé : ${s}`,
  fnd_reread_f:"Demandez la partie qui compte (plages de lignes) plutôt que le fichier entier — chaque lecture s'empile dans la conversation, elle ne remplace pas la précédente.",
  fnd_inflate_f:"Un /clear quand vous changez de sujet coupe le contexte : chaque tour relit tout ce qui précède.",
  fnd_mech_f:"Regroupez-les à la fin, ou faites-les vous-même dans le terminal — là, c'est gratuit.",
  fnd_mcp_f:"Ses définitions voyagent dans chaque requête de toute façon. Le retirer de la config tient en une ligne, le reconnecter aussi.",
  fnd_cachebreak_t:n=>`Le contexte a été réécrit ${n} fois dans la même conversation`,
  fnd_cachebreak_f:"Après une pause (le cache expire en quelques minutes) ou un changement de modèle, toute la conversation est réécrite dans le cache au plein tarif. Si le sujet a changé entre-temps, /clear repart d'un contexte minuscule — presque gratuit.",
  fnd_skills_t:n=>`Skills installées non utilisées : ${n}`,
  fnd_skills_f:"Chaque skill installée ajoute sa ligne à chaque requête pour que Claude sache qu'elle existe. Retirer de ~/.claude/skills celles que vous n'utilisez pas est gratuit — et en remettre une, c'est copier un dossier.",
  fnd_subagents_t:n=>`Les sous-agents ont travaillé ${n} tours à part`,
  fnd_subagents_f:"Chaque sous-agent lit et paie son propre contexte, à part de votre conversation — ce coût est déjà dans le total, mais il n'y est pas visible. Si la tâche de l'agent est mécanique, un petit modèle (Haiku) la fait pour une fraction.",
  fnd_hooks_t:n=>`Un hook a imprimé une sortie ${n} fois`,
  fnd_hooks_f:"Tout ce qu'un hook imprime entre dans le contexte de ce tour — et voyage à nouveau à chaque tour suivant. S'il n'a rien à dire, se taire (exit 0 sans sortie) ne coûte rien.",
  fnd_claudemd_t:n=>`${n} lignes du CLAUDE.md mentionnent des choses sans trace récente`,
  fnd_claudemd_f:"Le CLAUDE.md voyage en entier avec chaque conversation. Ces lignes mentionnent des chemins ou des commandes absents des journaux de cette fenêtre — cela vaut la peine de vérifier s'ils méritent encore leur place. Supprimer est gratuit (seul le message suivant reconstruit le cache une fois) ; ce qui ne sert que de temps en temps peut rester.",
  fnd_claudemdsize_t:n=>`CLAUDE.md dépasse ce que Claude Code charge (${n}k caractères)`,
  fnd_claudemdsize_f:"Claude Code ne charge que les premiers 40k caractères — le reste n'est jamais lu : les règles en fin de fichier n'atteignent jamais le modèle, en silence. Déplacez l'historique vers docs/ et ne gardez que l'actuel dans CLAUDE.md.",
  tips_tab:"Conseils",
  tips_title:"Conseils pour économiser votre quota",
  tips_intro:"Fiches courtes écrites à la main — sans IA, sans réseau. Mises à jour à chaque version de l’app. Touchez-en une pour l’ouvrir.",
  tips_filter:"Filtrer…",
  tips_none:"Rien ne correspond au filtre.",
  tips_miss:q=>`Aucun conseil ne correspond à «${q}»`,
  tips_clear:"Effacer la recherche",
  tips_propose:"Les proposer sur GitHub",
  tips_issue_title:"Conseils : recherches sans fiche",
  tips_issue_intro:"Ces recherches dans l’onglet Conseils n’ont trouvé aucune fiche. Idées de nouvelles fiches :",
  tip_clear_t:"/clear efface-t-il mon travail ?",
  tip_clear_b:"Non. /clear n’efface que la conversation. Ce que vous ne perdez PAS :\n• Votre code — il vit dans vos fichiers, pas dans le chat.\n• Votre CLAUDE.md — il se recharge tout seul dans la nouvelle session.\n• Les sessions passées — « claude --resume » les liste pour les reprendre.\nSeul le fil de la discussion disparaît — précisément ce qui coûte des tokens à chaque tour.",
  tip_compact_t:"/clear ou /compact ?",
  tip_compact_b:"/clear repart de zéro : le moins cher. /compact résume la conversation en gardant l’essentiel (de dizaines de milliers de tokens à quelques milliers).\n• Sujet nouveau et indépendant → /clear.\n• Le nouveau sujet recoupe le précédent → /compact.\nLa question clé : la suite a-t-elle besoin de ce qui a déjà été dit ?",
  tip_cache_t:"Le cache expire en quelques minutes",
  tip_cache_b:"Votre conversation vit dans un cache qui expire après quelques minutes d’inactivité. Au retour d’une longue pause, tout le contexte est réécrit à plein tarif — le relire depuis le cache coûte ~10x moins. Avec une grosse conversation : terminez l’idée avant de partir, et si le sujet a changé au retour, /clear.",
  tip_attach_t:"Mentionnez le fichier, ne le collez pas",
  tip_attach_b:"Coller le même code encore et encore empile des copies dans le contexte, et chaque copie voyage à chaque tour suivant. Donnez plutôt le chemin (ou @fichier) : Claude lit exactement ce qu’il faut, dans la version actuelle, sans doublons.",
  tip_ask_t:"Les questions rapides, dans une session à part",
  tip_ask_b:"Une question courte dans une grosse session traîne TOUT le contexte accumulé : des milliers de tokens pour un doute de deux lignes. Posez-la dans une session neuve et la même réponse coûte des centimes. Doublement vrai pour les questions générales qui n’ont pas besoin de votre code.",
  tip_model_t:"Petit modèle pour le mécanique",
  tip_model_b:"Renommer, formater, lancer des tests, rédiger un commit : un petit modèle (Haiku) le fait aussi bien pour une fraction. Passez avec /model pour cette tâche, puis revenez au grand pour ce qui demande de réfléchir.",
  tip_now_compact:n=>`Maintenant : cette session porte ~${n}k tokens de contexte`,
  tip_now_cache:n=>`Maintenant : ${n} min de pause avec un gros contexte — le cache a expiré`,
  tip_acomp_t:"Claude Code a compacté tout seul",
  tip_acomp_b:"Quand une session atteint son plafond de contexte, Claude Code compresse la conversation lui-même pour continuer — c’est pour ça que la jauge vient de chuter. Ça marche, mais c’est la machine qui choisit le moment, en plein milieu de ce que tu faisais. Si tu lances /compact toi-même à une pause naturelle (une tâche qui vient de se terminer), tu choisis le moment et le résumé est meilleur.",
  tip_shots_t:"Beaucoup de captures dans une session",
  tip_shots_b:"Chaque capture que Claude regarde entre dans le contexte et voyage à chaque tour suivant — une boucle regarder-retoucher-regarder en accumule des dizaines. Quand tu itères sur un design, demande une capture seulement à la fin de chaque série de changements (ou recadrée sur la zone modifiée), pas à chaque retouche.",

  prices_label:"Modellpreise und -grenzen",
  prices_info_tip:"Woher kommen Preise und Grenzen?",
  prices_sources:"Anthropic veröffentlicht weder seine Tarife noch seine Kontextgrenzen in einer API, daher lädt MichiClaude sie aus diesen öffentlichen Community-Tabellen, in dieser Reihenfolge bis eine antwortet: <b>LiteLLM &rarr; models.dev &rarr; OpenRouter</b>. Derselbe Download liefert den Preis pro Million Tokens und die Kontextgrenze jedes Modells — die Zahl, durch die die Druckanzeige teilt. Der Download ist anonym: nichts von dir wird gesendet. Zum Abschalten <code>\"auto\": false</code> in <code>prices_config.json</code> setzen.",

  fnd_acompact_t:n=>`Claude Code hat sich ${n}-mal auto-kompaktiert`,
  fnd_acompact_f:"Bei ~94% der Fenstergröße fasst Claude Code das Gespräch selbst zusammen, um weitermachen zu können: ein Rettungsring, nicht abschalten — aber der ganze Kontext wird neu gelesen und die Zusammenfassung verliert Details. Passiert es oft, ist das das Signal, früher einzugreifen: /compact bei 80% (die Katze warnt) kostet weniger und du behältst, was du willst.",
  fnd_paste_t:n=>`Du hast ${n}-mal riesige Blöcke eingefügt`,
  fnd_paste_f:"Eingefügtes wird Teil deiner Nachricht und reist mit jedem weiteren Zug mit — meist weit mehr als nötig war. Ist es eine Projektdatei, nenne lieber den Pfad: Claude liest sie selbst, und nur den nötigen Teil. (Konsolenausgabe oder Text, der nicht auf der Platte liegt? Einfügen ist okay.)",

  rep_foot:"Von MichiClaude aus deinen lokalen Daten erzeugt. $-Beträge sind Schätzungen zu API-Preisen — im Abo zahlst du nicht pro Token. Nichts verlässt deinen Rechner.",

  fnd_mcp_t:s=>`Ungenutzter MCP-Server: ${s}`,
  fnd_reread_f:"Frag nach dem relevanten Teil (Zeilenbereiche) statt nach der ganzen Datei — jede Lektüre stapelt sich im Gespräch, sie ersetzt die vorherige nicht.",
  fnd_inflate_f:"Ein /clear beim Themenwechsel teilt den Kontext: Jeder Zug liest alles Vorherige erneut.",
  fnd_mech_f:"Bündle sie am Ende, oder führe sie selbst im Terminal aus — dann sind sie gratis.",
  fnd_mcp_f:"Seine Tool-Definitionen reisen ohnehin in jeder Anfrage mit. Ihn aus der Konfiguration zu nehmen ist eine Zeile, das Wiederverbinden auch.",
  fnd_cachebreak_t:n=>`Der Kontext wurde ${n}-mal in derselben Unterhaltung neu geschrieben`,
  fnd_cachebreak_f:"Nach einer Pause (der Cache läuft nach Minuten ab) oder einem Modellwechsel wird die ganze Unterhaltung zum vollen Schreibpreis neu in den Cache geschrieben. Hat sich das Thema inzwischen geändert, startet /clear mit winzigem Kontext — fast gratis.",
  fnd_skills_t:n=>`Installierte Skills ohne Nutzung: ${n}`,
  fnd_skills_f:"Jede installierte Skill fügt jeder Anfrage ihre Zeile hinzu, damit Claude weiß, dass es sie gibt. Ungenutzte aus ~/.claude/skills zu entfernen ist gratis — und zurückholen heißt nur einen Ordner kopieren.",
  fnd_subagents_t:n=>`Subagenten: ${n} Runden nebenbei`,
  fnd_subagents_f:"Jeder Subagent liest und bezahlt seinen eigenen Kontext, getrennt von deiner Unterhaltung — diese Kosten stecken schon im Gesamtwert, sind dort aber unsichtbar. Ist die Agentenaufgabe mechanisch, erledigt sie ein kleines Modell (Haiku) für einen Bruchteil.",
  fnd_hooks_t:n=>`Ein Hook hat ${n}-mal Ausgabe gedruckt`,
  fnd_hooks_f:"Alles, was ein Hook ausgibt, wandert in den Kontext dieses Zugs — und reist mit jedem weiteren Zug erneut mit. Wenn er nichts zu sagen hat, ist Schweigen (exit 0 ohne Ausgabe) kostenlos.",
  fnd_claudemd_t:n=>`${n} CLAUDE.md-Zeilen nennen Dinge ohne aktuelle Spur`,
  fnd_claudemd_f:"Die CLAUDE.md reist mit jeder Unterhaltung komplett mit. Diese Zeilen nennen Pfade oder Befehle, die in den Logs dieses Zeitraums nie auftauchten — es lohnt sich zu prüfen, ob sie ihren Platz noch verdienen. Löschen ist gratis (nur die nächste Nachricht baut den Cache einmal neu auf); was nur ab und zu gebraucht wird, bleibt.",
  fnd_claudemdsize_t:n=>`Die CLAUDE.md ist größer, als Claude Code lädt (${n}k Zeichen)`,
  fnd_claudemdsize_f:"Claude Code lädt nur die ersten 40k Zeichen — der Rest wird nie gelesen: Regeln am Ende der Datei erreichen das Modell stillschweigend nie. Historie nach docs/ verschieben und in der CLAUDE.md nur das Aktuelle behalten.",
  tips_tab:"Tipps",
  tips_title:"Tipps, damit die Quota länger reicht",
  tips_intro:"Kurze, handgeschriebene Karten — ohne KI, ohne Netz. Sie aktualisieren sich mit jeder App-Version. Zum Öffnen antippen.",
  tips_filter:"Filtern…",
  tips_none:"Nichts passt zum Filter.",
  tips_miss:q=>`Kein Tipp passt zu „${q}“`,
  tips_clear:"Suche löschen",
  tips_propose:"Auf GitHub vorschlagen",
  tips_issue_title:"Tipps: Suchen ohne Karte",
  tips_issue_intro:"Diese Suchen im Tipps-Tab fanden keine Karte. Ideen für neue Karten:",
  tip_clear_t:"Löscht /clear meine Arbeit?",
  tip_clear_b:"Nein. /clear löscht nur die Unterhaltung. Was NICHT verloren geht:\n• Dein Code — er lebt in deinen Dateien, nicht im Chat.\n• Deine CLAUDE.md — sie lädt sich in der neuen Sitzung von selbst.\n• Frühere Sitzungen — „claude --resume“ listet sie zum Weitermachen.\nWeg ist nur der Gesprächsfaden — genau das, was in jedem Zug Tokens kostet.",
  tip_compact_t:"/clear oder /compact?",
  tip_compact_b:"/clear beginnt bei null: am günstigsten. /compact fasst die Unterhaltung zusammen und behält das Wesentliche (von Zehntausenden Tokens auf wenige Tausend).\n• Neues, unabhängiges Thema → /clear.\n• Das neue Thema überschneidet sich mit dem alten → /compact.\nDie Schlüsselfrage: Braucht das, was kommt, das bereits Gesagte?",
  tip_cache_t:"Der Cache läuft nach Minuten ab",
  tip_cache_b:"Deine Unterhaltung lebt in einem Cache, der nach wenigen Minuten Inaktivität abläuft. Nach einer langen Pause wird der ganze Kontext zum vollen Preis neu geschrieben — ihn aus dem Cache zu lesen kostet ~10x weniger. Bei großen Unterhaltungen: den Gedanken zu Ende bringen, bevor du aufstehst — und wenn das Thema danach ein anderes ist, /clear.",
  tip_attach_t:"Datei nennen statt einfügen",
  tip_attach_b:"Denselben Code immer wieder einzufügen stapelt Kopien im Kontext, und jede Kopie reist in jedem weiteren Zug mit. Gib stattdessen den Pfad an (oder @datei): Claude liest genau das Nötige, aus der aktuellen Version, ohne Duplikate.",
  tip_ask_t:"Kurze Fragen in eine eigene Sitzung",
  tip_ask_b:"Eine kurze Frage in einer großen Sitzung schleppt den GESAMTEN Kontext mit: Tausende Tokens für einen Zweizeiler. In einer frischen Sitzung kostet dieselbe Antwort Cents. Doppelt wahr für allgemeine Fragen, die deinen Code nicht brauchen.",
  tip_model_t:"Kleines Modell für Mechanisches",
  tip_model_b:"Umbenennen, Formatieren, Tests laufen lassen, Commit-Text schreiben: ein kleines Modell (Haiku) macht das genauso gut für einen Bruchteil. Mit /model für die Aufgabe wechseln und für echtes Denken zurück zum großen.",
  tip_now_compact:n=>`Jetzt: diese Sitzung trägt ~${n}k Tokens Kontext`,
  tip_now_cache:n=>`Jetzt: ${n} Min. Pause mit großem Kontext — der Cache ist abgelaufen`,
  tip_acomp_t:"Claude Code hat von selbst kompaktiert",
  tip_acomp_b:"Erreicht eine Sitzung ihre Kontextgrenze, komprimiert Claude Code die Unterhaltung selbst, um weitermachen zu können — deshalb ist die Druckanzeige gerade eingebrochen. Es funktioniert, aber den Moment wählt die Maschine, mitten in dem, was du gerade tatest. Wendest du /compact selbst in einer natürlichen Pause an (eine gerade abgeschlossene Aufgabe), wählst du den Moment und die Zusammenfassung wird besser.",
  tip_shots_t:"Viele Screenshots in einer Sitzung",

  fnd_cachebreak_f:"잠시 쉬거나(캐시는 몇 분이면 만료) 모델을 바꾸면 대화 전체가 제값으로 캐시에 다시 기록됩니다. 돌아왔을 때 주제가 바뀌었다면 /clear로 작은 컨텍스트에서 시작하세요 — 거의 무료입니다.",
  fnd_skills_t:n=>`사용하지 않은 설치된 스킬: ${n}개`,
  fnd_skills_f:"설치된 스킬은 Claude가 존재를 알 수 있도록 매 요청에 한 줄씩 추가됩니다. 쓰지 않는 것을 ~/.claude/skills에서 빼는 건 무료이고, 되돌리는 건 폴더 복사면 됩니다.",
  fnd_subagents_t:n=>`서브에이전트가 별도로 ${n}턴 작업했습니다`,
  fnd_subagents_f:"서브에이전트는 대화와 별도로 자기 컨텍스트를 읽고 그만큼 비용을 냅니다. 이 비용은 이미 합계에 포함되어 있지만 거기서는 보이지 않습니다. 기계적인 작업이라면 작은 모델(Haiku)로도 충분하며 비용은 극히 일부입니다.",
  fnd_hooks_t:n=>`훅이 ${n}번 출력을 남겼습니다`,
  fnd_hooks_f:"훅이 출력하는 모든 내용은 그 턴의 컨텍스트에 들어가고, 이후 매 턴마다 다시 전송됩니다. 전할 내용이 없다면 아무것도 출력하지 않고 종료(exit 0)하는 것이 무료입니다.",
  fnd_claudemd_t:n=>`CLAUDE.md의 ${n}개 줄이 최근 흔적 없는 것을 언급합니다`,
  fnd_claudemd_f:"CLAUDE.md는 대화마다 통째로 전송됩니다. 이 줄들은 이 기간의 로그에 한 번도 나타나지 않은 경로나 명령을 언급합니다 — 아직 자리를 차지할 가치가 있는지 확인해 볼 만합니다. 삭제는 무료입니다(다음 메시지에서 캐시가 한 번만 재구축됩니다). 가끔만 쓰는 것은 남겨 두세요.",
  fnd_claudemdsize_t:n=>`CLAUDE.md가 Claude Code 로드 한도를 넘었습니다 (${n}k자)`,
  fnd_claudemdsize_f:"Claude Code는 처음 40k자만 로드합니다. 나머지는 전혀 읽히지 않아 파일 뒷부분의 규칙이 모델에 조용히 전달되지 않습니다. 이력은 docs/로 옮기고 CLAUDE.md에는 현재 유효한 내용만 남기세요.",
  tips_tab:"팁",
  tips_title:"쿼터를 아끼는 팁",
  tips_intro:"손으로 쓴 짧은 카드입니다 — AI도 네트워크도 쓰지 않습니다. 앱 업데이트마다 갱신됩니다. 눌러서 여세요.",

  tips_issue_title:"팁: 카드 없는 검색",
  tips_issue_intro:"팁 탭에서 아래 검색에 해당하는 카드가 없었습니다. 새 카드 아이디어:",
  tip_clear_t:"/clear 하면 작업이 지워지나요?",
  tip_clear_b:"아니요. /clear 는 대화만 지웁니다. 잃지 않는 것:\n• 코드 — 파일에 있고 채팅에 있지 않습니다.\n• CLAUDE.md — 새 세션에서 자동으로 다시 불러옵니다.\n• 이전 세션들 — “claude --resume” 으로 목록에서 이어갈 수 있습니다.\n사라지는 건 대화의 흐름뿐 — 바로 그것이 매 턴 토큰을 쓰던 부분입니다.",
  tip_compact_t:"/clear 와 /compact 중 무엇?",
  tip_compact_b:"/clear 는 처음부터: 가장 저렴합니다. /compact 는 핵심을 남기고 대화를 요약합니다(수만 토큰이 수천으로).\n• 새롭고 독립적인 주제 → /clear.\n• 새 주제가 이전과 얽힘 → /compact.\n핵심 질문: 다음 작업에 지금까지의 이야기가 필요한가?",
  tip_cache_t:"캐시는 몇 분이면 만료됩니다",
  tip_cache_b:"대화는 몇 분만 쉬어도 만료되는 캐시에 올라가 있습니다. 긴 휴식 후 돌아오면 전체 컨텍스트가 정가로 다시 쓰입니다 — 캐시에서 읽으면 약 10분의 1입니다. 대화가 크다면: 자리를 뜨기 전에 생각을 마무리하고, 돌아왔을 때 주제가 바뀌었다면 /clear.",
  tip_attach_t:"붙여넣지 말고 파일을 알려주세요",
  tip_attach_b:"같은 코드를 반복해서 붙여넣으면 컨텍스트에 사본이 쌓이고, 그 사본은 이후 매 턴마다 전송됩니다. 대신 경로(또는 @파일)를 주세요: Claude 가 최신 버전에서 필요한 만큼만 읽고 중복도 없습니다.",
  tip_ask_t:"짧은 질문은 별도 세션에서",
  tip_ask_b:"큰 세션 안의 짧은 질문은 쌓인 컨텍스트 전체를 끌고 갑니다: 두 줄짜리 궁금증에 수천 토큰. 새 세션에서 물으면 같은 답이 몇 센트입니다. 코드가 필요 없는 일반 질문이라면 더욱 그렇습니다.",
  tip_model_t:"기계적인 일은 작은 모델로",
  tip_model_b:"이름 바꾸기, 포맷, 테스트 실행, 커밋 메시지: 작은 모델(Haiku)도 똑같이 해내며 비용은 극히 일부입니다. 그 작업만 /model 로 바꾸고, 생각이 필요한 일은 큰 모델로 돌아가세요.",

  tip_now_cache:n=>`지금: 큰 컨텍스트로 ${n}분 휴지 — 캐시가 만료되었습니다`,
  tip_acomp_t:"Claude Code가 스스로 컴팩트했습니다",
  tip_acomp_b:"세션이 컨텍스트 상한에 도달하면 Claude Code는 계속하기 위해 대화를 스스로 압축합니다 — 압력 게이지가 갑자기 내려간 이유입니다. 동작은 하지만 시점은 작업 도중에 기계가 정합니다. 자연스러운 멈춤(작업을 막 끝낸 때)에 직접 /compact 를 실행하면 시점을 당신이 고르고 요약도 더 좋아집니다.",

  tip_shots_b:"Claude가 보는 스크린샷은 모두 컨텍스트에 들어가 이후 모든 턴에 함께 실립니다 — 보고-고치고-보는 반복이면 수십 장이 쌓입니다. 디자인을 다듬을 때는 변경 묶음이 끝날 때만(또는 바뀐 부분만 잘라서) 스크린샷을 찍게 하고, 매번 손볼 때마다 찍지 않게 하세요.",

const navLang=String(navigator.language||"").toLowerCase().slice(0,2);
let lang = localStorage.getItem("lang") || (I18N[navLang]?navLang:"en");
if(!I18N[lang]) lang="en";
function t(key,...a){
  const v=(I18N[lang]&&I18N[lang][key])??I18N.en[key];
  return typeof v==="function"?v(...a):(v??key);
}
function applyI18n(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-i18n]").forEach(el=>{ el.textContent=t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-html]").forEach(el=>{ el.innerHTML=t(el.dataset.i18nHtml); });
  document.querySelectorAll("[data-i18n-ph]").forEach(el=>{ el.placeholder=t(el.dataset.i18nPh); });
  document.querySelectorAll("[data-i18n-title]").forEach(el=>{ el.title=t(el.dataset.i18nTitle); });
  $("hideBtn").title=t("hide_title"); $("themeBtn").title=t("theme_title");
  $("langSel").value=lang;
  // los mensajes TRANSITORIOS (estado del alta de servidor) se escribieron
  // con t() del idioma anterior y el cambio no los repinta: mejor limpiarlos
  // que dejarlos en el idioma viejo (cazado por Oscar 2026-08-04 probando
  // ERR_BAD_PYTHON en alemán: la UI cambió y el error siguió en español)
  $("rMsg").textContent="";
  // El menú del icono de bandeja lo construye Rust al arrancar y no puede
  // pasar por t(): el idioma vive aquí. Se lo mandamos ya traducido, al
  // cargar y en cada cambio de idioma (era el único texto que se quedaba
  // en inglés — invariante #10).
  if(typeof invoke!=="undefined" && invoke)
    invoke("set_tray_menu",{open:t("tray_open"),widget:t("tray_widget"),quit:t("tray_quit")})
      .catch(()=>{});
  // las fichas de Consejos se pintan desde t(): un cambio de idioma con la
  // pestaña abierta debe repintarlas al momento
  if(!$("tab-tips").hidden) renderTips();
  // la lista de relevos también: sus filas se arman con t() y el aviso de
  // "ninguna sesión" pisa el data-i18n de arriba
  if(!$("tab-prefs").hidden) rlyRows();
}

// Traducción de códigos de error del backend (ERR_*)
// Primera frase de un texto, para donde el espacio es fijo (el tooltip de la
// bandeja). Corta en el punto de los idiomas occidentales y en el 。 de
// japonés/chino; si no encuentra ninguno, devuelve el texto tal cual — nunca
// parte una palabra por la mitad.
function firstSentence(s){
  const m=String(s).match(/^[\s\S]*?(?:[.!?](?=\s)|[。！？])/);
  return m ? m[0].trim() : String(s);
}
function errText(code){
  code=String(code);
  if(code.startsWith("ERR_RATE_LIMITED")) return t("err_rate", +code.split(":")[1]||3);
  if(code.startsWith("ERR_API")) return t("err_api", code.split(":")[1]||"?");
  const map={ERR_NO_TOKEN:"err_no_token",ERR_TOKEN_EXPIRED:"err_expired",
             ERR_NET:"err_net",ERR_BAD_RESPONSE:"err_bad"};
  return map[code]?t(map[code]):code;
}

$("themeBtn").addEventListener("click",()=>{

    lastPill.theme=light?"light":"dark";

    lastPill.skinTheme=getPillStyle()==="cat" ? pickTheme("catSkin") : panelTheme();
    EVENT?.emit("quota:update",lastPill);
  }
});

// ---------- marca ----------
function sunburst(size){
  const S=64,cx=32,cy=32,rays=11;let p=`<svg width="${size}" height="${size}" viewBox="0 0 ${S} ${S}">`;
  for(let i=0;i<rays;i++){const a=Math.PI*2*i/rays-Math.PI/2;
    const ux=Math.cos(a),uy=Math.sin(a),px=-uy,py=ux;
    const base=S*.04,tip=S*.46,mid=S*.26,hw=S*.055;
    const pts=[[cx+ux*base,cy+uy*base],[cx+ux*mid+px*hw,cy+uy*mid+py*hw],
      [cx+ux*tip,cy+uy*tip],[cx+ux*mid-px*hw,cy+uy*mid-py*hw]]
      .map(q=>q.map(n=>n.toFixed(2)).join(",")).join(" ");
    p+=`<polygon points="${pts}" fill="var(--brand)"/>`}
  return p+`<circle cx="${cx}" cy="${cy}" r="${S*.07}" fill="var(--brand)"/></svg>`;
}
$("mark").innerHTML=sunburst(22);

let lastPill=null, pillOn=false;

// Tema del panel (el que manda el botón ◐) y los dos que puede soltar el
// usuario: el ARTE del gatito y la PIEL de sus globos (cápsula incluida — es
// información, va con los mensajes). "auto" = sigue al panel, que es el
// comportamiento de siempre y el valor por defecto.
function panelTheme(){ return document.body.classList.contains("light")?"light":"dark"; }
function pickTheme(key){
  const v=localStorage.getItem(key);
  return (v==="light"||v==="dark") ? v : panelTheme();
}
// Estado del gatito — misma lógica que las notificaciones, de lo más grave a
// lo más leve:
// 😴 zzz   sin cuota SEMANAL (hit:week): dormido hasta que la semana se
//          restablezca — es el peor caso, no hay nada que hacer en días.
// ☕ break  sin cuota de la SESIÓN (hit:session): de descanso hasta el reset,
//          que llega en horas. Ambos banderines los limpia trackResets().
// 🔥 fire   alarma de % pendiente de "enterado": arde hasta que abra el panel.
// 🐱 normal cualquier otro caso.
function mascotState(ses, weekPct){
  if(simMascot) return simMascot;                     // simulador (solo en dev)
  if((weekPct!=null && Math.round(weekPct)>=100) || localStorage.getItem("hit:week")==="1")
    return "zzz";
  if((ses && Math.round(ses.pct)>=100) || localStorage.getItem("hit:session")==="1")
    return "break";
  if(localStorage.getItem("ackPending:alarm")==="1") return "fire";
  return "normal";
}
let lastPillArgs=null;
// Manómetro de presión de contexto (docs/remediacion.md etapa 1): lo llena
// coachPoll con el hit "press" más fresco; null = ninguna sesión activa y el
// widget lo esconde. El backend manda tokens CRUDOS y, desde 2026-08-08, el
// TECHO de esa sesión en el mismo hit (`full`): no es una constante — va de
// 200k (Haiku, modelos ≤4.5) a 1M (Opus/Sonnet 4.6+). Ver pressFull().
let lastPress=null;
// todos los hits "press" del último sondeo (el manómetro usa el más fresco,
// pero la lista de relevos necesita casar cada sesión con el suyo — etapa 3b)
let pressAll=[];
// Respaldo cuando el hit no trae techo (exportador viejo): 200k era el techo de
// TODOS los modelos hasta Opus/Sonnet 4.6. Quedarse corto avisa de más, que es
// el fallo seguro de un avisador; pasarse sería no avisar nunca.
const PRESS_FULL=200000;
// Techo de UN hit "press", con su respaldo. Único sitio donde se decide el
// denominador — si esto se duplica, vuelve el bug del 200k fijo.
function pressFull(h){ return (h&&h.full>0) ? h.full : PRESS_FULL; }
function pressPct(h){ return Math.min(100,Math.round((h&&h.value||0)/pressFull(h)*100)); }
function pressField(){
  if(!lastPress||!lastPress.ctx) return null;
  return {pct:Math.min(100,Math.round(lastPress.ctx/pressFull(lastPress)*100)),
    proj:lastPress.project+(lastPress.origin?" · "+lastPress.origin:""),
    // ¿la sesión que estamos midiendo tiene relevo? (etapa 3c). Dice algo
    // DISTINTO de la marca del título de la pestaña: aquella habla de la
    // terminal que tienes delante, esta de la sesión que Michi mide. Con una
    // sola sesión coinciden; con varias, no — y confundirlas es adivinar.
    relay:!!lastPress.relay};
}
// Clasificador de tarea viva (docs/remediacion.md etapa 1b): determinista y
// con UNA sola implementación — el motor (Rust/Python) manda hechos crudos en
// el hit "press" y el veredicto se calcula aquí. La lista de tareas es la
// señal reina; después la lista cerrada y el commit limpio (cierre); después
// la continuidad de archivos. En la duda: "unsure" y la tarjeta NO recomienda
// (regla de oro: en la duda se pregunta, no se actúa).
const INTENT_PCT=80;   // % de presión que enciende la tarjeta de intención
function intentVerdict(h){
  if((h.topen||0)>0) return "alive";      // pendientes abiertos: a media tarea
  if((h.ttotal||0)>0) return "boundary";  // la lista existió y quedó al 100%
  if(h.gclean) return "boundary";         // commit sin ediciones después
  if((h.cont||0)>=40) return "alive";     // sigue en los mismos archivos
  return "unsure";
}
function emitPill(ses, wk, extras){
  lastPillArgs=[ses,wk,extras];             // para el tic del contador (abajo)
  const weekPct = wk ? wk.pct : null;
  lastPill={ok:!!ses, session:ses, weekly:wk?{pct:wk.pct, resets:wk.resets}:null,
    theme:panelTheme(), artTheme:pickTheme("catArt"),
    // los dos selectores son DEL GATITO: con la pastilla, los globos siguen
    // al tema del panel y no a una preferencia que ahí no se ve
    skinTheme: getPillStyle()==="cat" ? pickTheme("catSkin") : panelTheme(),
    style:getPillStyle(), mascot:mascotState(ses,weekPct),
    labels:pillLabels(),
    sesReset: ses&&ses.resets?fmtReset(ses.resets):"",
    wkReset: wk&&wk.resets?fmtReset(wk.resets):"",
    // buckets semanales extra (Fable, futuros…) tal como los reporte el
    // endpoint — DINÁMICO, nunca nombres hardcodeados (invariante #6)
    extras: extras||[],
    // hallazgos nuevos sin ver, para el sticker/puntito del widget;
    // null = nada que enseñar (o el usuario lo apagó en Preferencias)
    fnd: fndBadgeOn()&&fndBadge ? {...fndBadge, tip:t("fnd_badge_tip",fndBadge.n)} : null,
    // consejos del coach sin ver (post-it acento / punto de la pastilla);
    // comparte el interruptor de hallazgos: un concepto, un apagador
    coach: fndBadgeOn()&&coachCount() ? {n:coachCount(), tip:t("tips_tab")} : null,
    // manómetro de presión de contexto: LECTURA, no aviso — no pasa por el
    // interruptor de avisos ni por contadores (como el % de sesión)
    press: simPressField(),
    tip: ses?t("tray_tip",Math.round(ses.pct),fmtReset(ses.resets),weekPct!=null?Math.round(weekPct):null):t("tray_no_data")};
  EVENT?.emit("quota:update", lastPill);
}
// Cuando el widget (re)carga, pide el último dato conocido para no esperar el ciclo.
EVENT?.listen("pill:ready",()=>{ if(lastPill) EVENT.emit("quota:update", lastPill); });

// El "se restablece en…" del globo del hover baja solo, minuto a minuto. Sin
// esto se quedaba congelado hasta el siguiente ciclo de cuota (3 min), que es
// justo cuando más se mira: esperando a que vuelva la sesión. Rehace el
// resumen con los mismos datos —no consulta nada— así que también recalcula
// el estado del gatito de paso.
// Si la última lectura buena ya pasó de vieja, NO se reemite: onQuotaFail ya
// puso el widget en gris y revivir ese dato cada minuto lo desharía.
setInterval(()=>{
  if(lastPillArgs && Date.now()-lastSync<=STALE_MS) emitPill(...lastPillArgs);
}, 60000);

// ---------- simulador de estados del gatito (SOLO compilaciones de dev) ----------
// Recorre el ciclo completo —dibujo Y globo— con una pausa ajustable entre
// pasos, para verlo entero sin esperar a que se cumplan las condiciones reales
// (cruzar una alarma, agotar la sesión, agotar la semana, esperar el reset).
// Mientras corre, mascotState() devuelve el estado forzado, así que los
// refrescos normales del panel no lo pisan. Vive en memoria: cerrar la app
// cancela la simulación.
// Los globos simulados NO tocan el localStorage (nada de ackPending ni
// infoBalloon): al terminar no debe quedar ningún aviso pendiente falso.
let simRunning=false, simMascot=null, simTimer=null, simTick=null, simB=null;
// presión de contexto FORZADA por el paso del simulador (null = la real). La
// bombilla del gatito tiene cuatro estados y el último llega al 85% de un
// contexto: sin esto, verlos todos costaría llenar una sesión de verdad.
// Vive DENTRO de emitPill —no parcheando lastPill, que la regla prohíbe— para
// que cualquier reemisión durante la simulación (el tic del minuto, un cambio
// de tema) siga enseñando el nivel simulado, y para que al parar vuelva el
// dato real sin tener que restaurar nada.
let simPress=null;
function simPressField(){
  const real=pressField();
  if(simPress==null) return real;
  return {pct:simPress, proj:real?real.proj:"", relay:real?real.relay:false};
}
// el paso puede sobreescribir lo que calcula balloonMeta (p. ej. forzar la
// severidad para enseñar el mismo aviso en ámbar y en rojo)
function simBalloon(o){
  EVENT?.emit("notif:update",{...balloonMeta(o.kind), ...o});
  invoke?.("set_notif_visible",{visible:true});
}
// Usa los datos REALES cuando existen (tu propio reset, tu propia alarma) y
// solo inventa la fecha si aún no hay lectura de cuota.
function simReset(which, fallbackMs){
  const r = which==="session" ? lastPill?.session?.resets : lastPill?.weekly?.resets;
  return r || new Date(Date.now()+fallbackMs).toISOString();
}
function simAlarmBody(){
  const thr=[...getAlarms()].sort((a,b)=>b-a)[0]||80;
  return thr>=95 ? t("notif_hi",thr) : t("notif_lo",thr);
}
const SIM_CAT=[
  {m:"normal"},                                                        // sin globo
  {m:"fire",   b:()=>({kind:"alarm",   body:simAlarmBody()})},
  {m:"break",  b:()=>({kind:"break",   body:breakBody(simReset("session",8*60000))})},
  {m:"zzz",    b:()=>({kind:"zzz",     body:weekBody(simReset("weekly",3*24*3.6e6))})},
  {m:"normal", b:()=>({kind:"session", body:balloonBody("session")})}, // vuelve la cuota
];
// Guion de la PASTILLA: no hay mascota que cambiar, así que recorre los
// AVISOS — uno por cada severidad e icono del popover. La alarma sale dos
// veces a propósito: por debajo del 95% es ámbar y por encima es roja, y ver
// las dos seguidas es la única forma de comparar.
function simPillSeq(){
  const low=[...getAlarms()].sort((a,b)=>a-b)[0]||80;
  const seq=[
    {b:()=>({kind:"alarm", body:t("notif_lo",low), sev:"warn"})},
    {b:()=>({kind:"alarm", body:t("notif_hi",95),  sev:"danger"})},
    {b:()=>({kind:"break", body:breakBody(simReset("session",8*60000))})},
    {b:()=>({kind:"zzz",   body:weekBody(simReset("weekly",3*24*3.6e6))})},
  ];
  // el del presupuesto solo si el usuario puso uno: sin cifra real no se
  // inventa un importe (invariante: nada de datos de demo en la app real)
  const bg=+localStorage.getItem("budgetWeek")||0;
  if(bg>0) seq.push({b:()=>({kind:"budget", body:t("notif_budget", bg.toFixed(2), bg)})});
  seq.push({b:()=>({kind:"session", body:balloonBody("session")})});
  return seq;
}
let simSeq=SIM_CAT;
// minutos por estado, ajustables (admite decimales: 0.5 = 30 s). Se lee en
// cada paso, así que cambiarlo a media simulación afecta al siguiente estado.
function simMs(){ return Math.max(5, (parseFloat($("simMin").value)||1)*60)*1000; }
const simLeft=ms=> ms>=60000 ? Math.ceil(ms/60000)+" min" : Math.ceil(ms/1000)+" s";
function simPush(){
  if(lastPill){
    lastPill.mascot=mascotState(lastPill.session, lastPill.weekly?lastPill.weekly.pct:null);
    EVENT?.emit("quota:update", lastPill);
  } else {   // aún sin cuota: al menos que cambie el dibujo
    EVENT?.emit("quota:update",{ok:false, mascot:simMascot||"normal",
      theme:document.body.classList.contains("light")?"light":"dark"});
  }
}
function simLabel(){
  return getPillStyle()==="cat" ? "🐱 Simular estados" : "🔔 Simular avisos";
}
function simStop(msg){
  clearTimeout(simTimer); clearInterval(simTick); simTimer=null; simTick=null;
  simRunning=false; simMascot=null; simB=null; simPress=null; simPush();
  invoke?.("set_notif_visible",{visible:false});
  processAcks();          // si había un aviso REAL pendiente, vuelve a salir
  $("simBtn").textContent=simLabel();
  $("simMsg").textContent=msg||"";
}
function simStep(i){
  if(i>=simSeq.length){ simStop("listo · de vuelta al estado real"); return; }
  const step=simSeq[i];
  simMascot=step.m||null; simPush();
  // el globo se queda entre pasos y solo cambia de texto (así no parpadea);
  // si al paso no le toca globo, se cierra
  simB = step.b ? step.b() : null;
  if(simB) simBalloon(simB);
  else invoke?.("set_notif_visible",{visible:false});
  let left=simMs();
  const paint=()=>{ $("simMsg").textContent=
    `${i+1}/${simSeq.length} · ${simB?(simB.sev||simB.kind):step.m} · ${simLeft(left)}`; };
  paint();
  clearInterval(simTick);
  simTick=setInterval(()=>{ left-=1000; if(left>0) paint(); },1000);
  simTimer=setTimeout(()=>simStep(i+1), left);
}
// ---------- ajustes compartidos (fase 3 del hub) ----------
// Qué viaja: lo que define CÓMO usas la app. Fuera se quedan la posición del
// widget (cada pantalla es distinta) y la identidad de la máquina.
function hubCfgSnapshot(srv){
  return {
    v: 1,
    savedAt: new Date().toISOString(),
    lang,
    theme: panelTheme(),
    alarms: getAlarms(),
    budgetWeek: localStorage.getItem("budgetWeek") || "",
    days: curDays,
    pillStyle: getPillStyle(),
    pillLayer: $("pillLayerSel").value,
    catArt: localStorage.getItem("catArt") || "auto",
    catSkin: localStorage.getItem("catSkin") || "auto",
    // La LISTA de servidores (nombre, host, comando) sí viaja: no es un
    // secreto, es una libreta de direcciones, y con varios servidores es lo
    // más pesado de rehacer a mano. Las LLAVES no viajan nunca: MichiClaude
    // no las tiene ni las lee — de eso se encarga el SSH del sistema.
    // Se pasa desde fuera y no se lee la variable `remotes`: esa solo se
    // rellena al abrir Fuentes de datos, así que guardar sin haber pasado por
    // esa pestaña dejaba la lista vacía sin decir nada (visto 2026-07-28).
    remotes: srv,
    // ntfy NO viaja, a propósito (2026-08-01, duda de Oscar): el topic ES
    // la contraseña del canal y esta pantalla promete "no guarda llaves ni
    // contraseñas". Tampoco hace falta —activarlo en otra PC son 30 s con
    // su propio QR— y tener un canal por máquina permite silenciar una sin
    // la otra desde la app ntfy. Si algún día se compartiera, serían los
    // booleanos (enabled/alarms), jamás el topic.
  };
}
// Se aplica sobre el almacén y luego se recarga el panel: hay ajustes que se
// leen al arrancar, y repintarlos uno a uno sería fácil de olvidar al añadir
// el siguiente.
function hubCfgApply(c){
  if(!c || typeof c!=="object") return false;
  const set=(k,v)=>{ if(v==null||v==="") localStorage.removeItem(k); else localStorage.setItem(k,String(v)); };
  if(c.lang && I18N[c.lang]) set("lang", c.lang);
  if(c.theme==="light"||c.theme==="dark") set("theme", c.theme);
  if(Array.isArray(c.alarms)) set("alarms", JSON.stringify(c.alarms));
  if(c.budgetWeek!=null) set("budgetWeek", c.budgetWeek);
  if([1,7,15,30].includes(+c.days)) set("days", +c.days);
  set("catArt",  c.catArt ==="auto" ? null : c.catArt);
  set("catSkin", c.catSkin==="auto" ? null : c.catSkin);
  // estos dos los guarda el backend, no el almacén del panel
  if(c.pillStyle) invoke?.("set_pill_style",{style:c.pillStyle==="cat"?"cat":"plain"});
  if(c.pillLayer) invoke?.("set_pill_layer",{layer:c.pillLayer});
  // Los servidores se FUSIONAN por host, no se reemplazan: si esta máquina
  // tiene uno que la otra no conocía, quitárselo la dejaría sin acceso, y
  // recuperar un servidor cuesta mucho más que borrar una fila de sobra.
  if(Array.isArray(c.remotes) && c.remotes.length){
    const byHost=new Map(remotes.map(r=>[r.host, r]));
    for(const r of c.remotes){
      if(r && typeof r.host==="string" && r.host.trim()) byHost.set(r.host, r);
    }
    invoke?.("save_remotes",{remotes:[...byHost.values()]});
  }
  return true;
}

// Traer reemplaza TODA la configuración y no tiene deshacer: lo que hayas
// cambiado sin guardar se pierde. Por eso va en dos pasos, como el bote de
// borrar servidor, y el segundo dice de cuándo es lo que vas a traer — sin
// esa fecha, confirmar es decir que sí a ciegas.
let hubPend=null, hubPendT=null;
$("hubLoad").addEventListener("click",()=>{
  if(hubPend){                          // segundo clic: adelante
    clearTimeout(hubPendT);
    const c=hubPend; hubPend=null; $("hubLoad").textContent=t("hub_cfg_load");
    if(!hubCfgApply(c)){ $("hubMsg").textContent=t("hub_cfg_err"); return; }
    $("hubMsg").textContent=t("hub_cfg_loaded");
    setTimeout(()=>location.reload(), 700);
    return;
  }
  $("hubMsg").textContent="…";
  invoke?.("load_hub_config")
    .then(txt=>{
      let c=null; try{ c=JSON.parse(txt); }catch(e){}
      if(!c || typeof c!=="object"){ $("hubMsg").textContent=t("hub_cfg_err"); return; }
      hubPend=c;
      $("hubLoad").textContent=t("hub_cfg_load");
      $("hubMsg").textContent=t("hub_cfg_confirm", fmtAgo(c.savedAt)||"");
      // si no confirma en 8 s, se olvida: un botón armado que se queda así
      // acaba pulsándose sin querer
      hubPendT=setTimeout(()=>{ hubPend=null; $("hubMsg").textContent=t("hub_cfg_cancel"); }, 8000);
    })
    .catch(()=>{ $("hubMsg").textContent=t("hub_cfg_err"); });
});

let updVer=null;
function updShow(msg, btn, act){

async function updCheck(){
  if(!invoke) return;
  let v=null;
  try{ v=await invoke("check_update"); }catch(e){ return; }
  if(!v) return;
  // la MISMA versión ya anunciada no se re-anuncia: el check ahora es
  // periódico, y sin esta guarda cada pasada re-mostraría el globo que el
  // usuario ya cerró — violando la REGLA ÚNICA de los globos (cerrado no
  // vuelve). La franja es idempotente; el globo no.
  if(v===updVer) return;
  updVer=v;
  updShow(t("upd_found",v), t("upd_do"), async()=>{
    $("updBtn").disabled=true;
    $("updMsg").textContent=t("upd_doing");
    try{
      await invoke("install_update");     // si va bien, la app se reinicia
    }catch(e){
      // La firma no cuadra (o la descarga falló). Ni se instala a medias ni
      // se deja al usuario congelado sin enterarse: se le manda a GitHub, y
      // el enlace vive en el backend para que nadie pueda cambiarlo.
      updShow(t("upd_manual"), t("upd_open"), ()=>invoke("open_releases"));
      $("updBtn").disabled=false;
    }
  });
  // Y por si no abre el panel en días: el widget lo dice y se queda ahí.
  showBalloon(t("upd_balloon",v), "update");
}

// ---------- simulador de la BOMBILLA de contexto (solo dev) ----------
// Guion aparte del gatito porque prueba otra cosa: aquel recorre estados de
// ánimo y avisos, este los cuatro dibujos de la bombilla y el salto de la
// cápsula. Sin él, ver el último nivel costaba llenar un contexto de verdad
// hasta el 85%. Empuja con emitPill —no parcheando `lastPill`— así que
// cualquier refresco durante la simulación sigue enseñando el nivel simulado.
const SIM_CTX=[8,45,70,92,100];
let ctxTimer=null;
function ctxPush(){
  if(lastPillArgs){ emitPill(...lastPillArgs); return; }
  EVENT?.emit("quota:update",{ok:false, mascot:simMascot||"normal",
    press: simPress==null?null:{pct:simPress, proj:"", relay:false},
    theme:document.body.classList.contains("light")?"light":"dark"});
}
function ctxStop(msg){
  clearTimeout(ctxTimer); clearInterval(simTick); ctxTimer=null; simTick=null;
  simRunning=false; simPress=null; ctxPush();
  $("ctxBtn").textContent="💡 Simular contexto";
  $("simMsg").textContent=msg||"";
}
function ctxStep(i){
  if(i>=SIM_CTX.length){ ctxStop("listo · de vuelta al dato real"); return; }
  simPress=SIM_CTX[i]; ctxPush();
  let left=simMs();
  const paint=()=>{ $("simMsg").textContent=
    `${i+1}/${SIM_CTX.length} · bombilla ${SIM_CTX[i]}% · ${simLeft(left)}`; };
  paint();
  clearInterval(simTick);
  simTick=setInterval(()=>{ left-=1000; if(left>0) paint(); },1000);
  ctxTimer=setTimeout(()=>{ clearInterval(simTick); ctxStep(i+1); }, simMs());
}
$("ctxBtn").addEventListener("click",()=>{
  if(ctxTimer){ ctxStop("detenido"); return; }
  if(simFnd){ sfStop("detenido"); return; }
  if(simRunning){ simStop("detenido"); return; }
  if(!pillOn){ $("simMsg").textContent="activa el widget primero"; return; }
  simRunning=true;                       // ni pushes ni acks durante la prueba
  $("ctxBtn").textContent="■ Detener"; ctxStep(0);
});

$("simBtn").addEventListener("click",()=>{
  if(ctxTimer){ ctxStop("detenido"); return; }   // corría el de contexto
  if(simFnd){ sfStop("detenido"); return; }  // corría el de hallazgos: pararlo
