<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MichiClaude</title>
<style>
  /* TIPOGRAFÍA DEL REDISEÑO v5 (2026-08-05, decisión de Oscar): las tres
     familias de la maqueta viajan DENTRO de la app (src/fonts/, 238 KB en
     woff2 variable, licencia OFL en fonts/LICENSES.md). NUNCA se piden a
     un servidor: una fuente remota rompería la promesa de privacidad y la
     CSP, y dejaría la app fea si el CDN falla. Los subconjuntos son latin
     y latin-ext; en japonés, coreano y chino no hay glifos y la pila cae
     sola a la tipografía del sistema — por eso los respaldos siguen
     completos en --font/--mono. */
  @font-face{font-family:'Inter';font-style:normal;font-weight:100 900;
    font-display:swap;src:url('fonts/inter-latin.woff2') format('woff2');
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
  @font-face{font-family:'Inter';font-style:normal;font-weight:100 900;
    font-display:swap;src:url('fonts/inter-latin-ext.woff2') format('woff2');
    unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
  @font-face{font-family:'Sora';font-style:normal;font-weight:100 800;
    font-display:swap;src:url('fonts/sora-latin.woff2') format('woff2');
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
  @font-face{font-family:'Sora';font-style:normal;font-weight:100 800;
    font-display:swap;src:url('fonts/sora-latin-ext.woff2') format('woff2');
    unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
  @font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:100 800;
    font-display:swap;src:url('fonts/jbmono-latin.woff2') format('woff2');
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
  @font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:100 800;
    font-display:swap;src:url('fonts/jbmono-latin-ext.woff2') format('woff2');
    unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}

  /* PALETA DEL REDISEÑO v5 (2026-08-05, maqueta de Oscar): azul-noche con
     acento violeta y secundario turquesa. Se conservan los NOMBRES de las
     variables viejas para que toda la app herede los colores sin tocar cada
     regla; las nuevas (--card, --grad, --r-*) las van adoptando las
     secciones conforme se rediseñan. Tipografía: sigue la del sistema — las
     fuentes web de la maqueta violarían la CSP (decisión pendiente de
     Oscar: embeberlas o quedarnos así). */
  :root{
    --font:'Inter',"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
    /* display: títulos y cifras grandes (nombre de la app, % del medidor,
       totales). El resto usa --font. */
    --disp:'Sora',var(--font);
    --mono:'JetBrains Mono',"Cascadia Code",ui-monospace,"Consolas",monospace;
    /* fondo SÓLIDO: con alpha se transparenta lo que haya detrás del panel */
    --mica:#0F1830;
    --card:#151F3A; --card-hi:#1B2748;
    --surface:rgba(148,170,255,.07);
    --stroke:rgba(148,170,255,.16);
    --stroke-soft:rgba(148,170,255,.08);
    --txt:#EAF0FF; --txt-mut:#93A0C4; --txt-dim:#5E6B92;
    --brand:#E08B63; --accent:#7C8CFF;
    /* texto SOBRE el acento: blanco sobre #7C8CFF da ~3:1 — tinta oscura
       (>5:1). En claro el acento es profundo y ahí el blanco sí funciona.
       (Regla del 2026-08-04: el color del texto se elige según el fondo.) */
    --accent-ink:#101736;
    --accent-weak:rgba(124,140,255,.14); --accent-line:rgba(124,140,255,.38);
    --grad:linear-gradient(135deg,#7C8CFF 0%,#A46BFF 100%);
    --teal:#4FD1E0; --teal-weak:rgba(79,209,224,.13);
    --ok:#3FD68F; --warn:#F2B443; --bad:#FF6B5E;
    --track:rgba(148,170,255,.10);
    --r-lg:20px; --r-md:14px; --r-sm:10px;
  }
  body.light{
    --mica:#F4F5FB;
    --card:#FFFFFF; --card-hi:#EDEFF9;
    --surface:rgba(30,40,90,.045);
    --stroke:rgba(30,40,90,.13);
    --stroke-soft:rgba(30,40,90,.07);
    --txt:#1A1F33; --txt-mut:#525C7A; --txt-dim:#8890AC;
    /* violeta profundo: el #7C8CFF brillante queda lavado sobre blanco;
       este da ~5:1 — legible en pestañas, enlaces y barras. */
    --accent:#5B5FE0;
    --accent-ink:#fff;
    --accent-weak:rgba(91,95,224,.10); --accent-line:rgba(91,95,224,.30);
    --grad:linear-gradient(135deg,#6A74F2 0%,#9D5CF0 100%);
    --teal:#0D8A9E; --teal-weak:rgba(13,138,158,.10);
    --ok:#1FA968; --warn:#B57E09; --bad:#E04E3F;
    --track:rgba(30,40,90,.10);
  }
  /* `hidden` gana SIEMPRE. El navegador lo aplica con display:none desde su
     hoja por defecto, así que cualquier regla nuestra con display propio
     (.cfg-row, .btnrow, .fld son flex) lo anulaba sin avisar: las filas del
     gatito seguían viéndose con la pastilla puesta y —lo grave— el
     simulador, que solo debe existir en desarrollo, se veía en release.
     Detectado 2026-07-28. No quitar este !important. */
  [hidden]{display:none !important}
  *{box-sizing:border-box}
  html,body{margin:0;background:transparent;height:100%}
  /* color-scheme: los controles nativos (desplegables, spinners, scrollbars)
     se pintan a juego con el tema — sin esto, la lista del idioma se ve mal
     en oscuro */
  /* padding 0 (Oscar 2026-08-14): el 1px que quedaba se veía como rendija
     transparente en el borde. El anillo del borde ahora va INSET en el
     box-shadow de .panel — dibujado hacia adentro no necesita hueco. */
  body{font-family:var(--font);color:var(--txt);padding:0;overflow:hidden;color-scheme:dark}
  body.light{color-scheme:light}
  /* si el contenido crece (ajustes abiertos), el panel hace scroll interno */
  /* overflow-x HIDDEN a propósito: con solo overflow-y:auto el navegador
     pone el eje X en "auto" también, y cualquier cosa un pelo más ancha
     —la fila de pestañas en un idioma largo— sacaba una barra horizontal
     al pie del panel (visto 2026-08-01). Nada del panel se lee de lado. */
  /* ALTURA FIJA, no máxima (Oscar 2026-08-05): la ventana no puede
     redimensionarse en vivo (regla de las transparentes) y con max-height
     las pestañas cortas dejaban un hueco transparente por debajo — un
     "marco fantasma" que cambiaba con cada pestaña. Con height, el panel
     llena siempre la ventana con su fondo sólido y el hueco desaparece;
     el contenido largo sigue con scroll interno. */
  .panel{height:100vh;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin}
  /* Scrollbar FINA y redondeada, estilo overlay (Oscar 2026-08-06, con
     captura de referencia): riel invisible y pastilla delgada. El truco
     del borde transparente + background-clip deja la pastilla de ~4px
     visibles dentro de un carril de 10 y separada del borde redondeado. */
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-corner{background:transparent}
  ::-webkit-scrollbar-thumb{background:rgba(148,170,255,.28);border-radius:20px;
    border:3px solid transparent;background-clip:padding-box}
  ::-webkit-scrollbar-thumb:hover{background:rgba(148,170,255,.5);
    border:3px solid transparent;background-clip:padding-box}
  body.light ::-webkit-scrollbar-thumb{background:rgba(40,55,110,.3);
    border:3px solid transparent;background-clip:padding-box}
  body.light ::-webkit-scrollbar-thumb:hover{background:rgba(40,55,110,.5);
    border:3px solid transparent;background-clip:padding-box}

  .panel{
    background:var(--mica);border-radius:var(--r-lg);
    box-shadow:0 32px 80px -24px rgba(0,0,0,.8);
    /* SIN borde perimetral (Oscar 2026-08-14): primero cayó la rendija
       (padding 1px) y luego el anillo entero — la "línea translúcida de
       la orilla" era el propio borde --stroke. El panel es solo fondo. */
    padding:0 15px 13px;   /* el relleno de arriba vive en .p-top (sticky) */
  }
  /* Encabezado + pestañas SIEMPRE a la vista: al hacer scroll dentro del panel
     se quedan pegados arriba en vez de irse. Los márgenes negativos los llevan
     de borde a borde para que el contenido no se cuele por los lados, y el
     relleno de abajo sustituye al margen de .tabs (un margen no lleva fondo y
     dejaría una rendija transparente por donde se vería pasar el texto). */
  .p-top{position:sticky;top:0;z-index:5;background:var(--mica);
    margin:0 -15px;padding:15px 15px 12px}
  body.light .panel{box-shadow:0 32px 80px -26px rgba(30,40,60,.4)}
  #pHead{cursor:grab;user-select:none;-webkit-user-select:none;margin-bottom:12px}
  #pHead:active{cursor:grabbing}
  .p-head{display:flex;align-items:center;gap:11px}
  .p-head button{cursor:pointer}
  /* logo en cajita redondeada (maqueta v5); el SVG de siempre adentro */
  .p-head .avatar{width:40px;height:40px;border-radius:13px;flex:0 0 auto;
    background:radial-gradient(circle at 30% 30%,var(--card-hi),var(--card));
    border:1px solid var(--stroke-soft);display:grid;place-items:center}
  .p-head .mark{width:22px;height:22px;display:block}
  .p-htext{min-width:0;flex:1 1 auto}
  .p-title{font-family:var(--disp);font-size:15px;font-weight:700;letter-spacing:-.2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* A TODO EL ANCHO y sin recortes: los mensajes de error son largos y hay
     que leerlos completos; si no caben, pasan a la línea siguiente. La
     sangría iguala al avatar (40px) + su hueco (11px) para que el punto
     verde caiga bajo la M de MichiClaude (Oscar 2026-08-05). */
  .p-sub{font-size:10.5px;color:var(--txt-dim);font-family:var(--mono);margin:9px 0 0 51px;
    display:flex;align-items:flex-start;gap:7px;transition:opacity .2s;
    min-width:0;line-height:1.45}
  .p-sub .live{margin-top:4px}
  .p-sub #syncTxt{min-width:0;white-space:normal;overflow-wrap:anywhere}
  .p-sub .live{flex:0 0 auto}
  .live{width:7px;height:7px;border-radius:50%;background:var(--ok);
    box-shadow:0 0 0 0 rgba(63,214,143,.6);animation:pulse 2.4s infinite}
  .live.err{background:var(--bad);animation:none}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(63,214,143,.5)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
  /* chip del plan: degradado violeta con texto blanco (maqueta v5). El
     texto sigue siendo el que reporte el endpoint (invariante #7). */
  .plan{margin-left:auto;flex:0 0 auto;font-size:10.5px;font-weight:700;letter-spacing:.4px;
    color:#fff;background:var(--grad);border:0;padding:4px 10px;border-radius:999px;
    box-shadow:0 6px 14px -6px rgba(124,140,255,.55)}
  .xbtn{margin-left:8px;width:28px;height:28px;border-radius:10px;cursor:pointer;
    border:1px solid var(--stroke-soft);background:var(--card);
    color:var(--txt-mut);font-size:13px;line-height:1;transition:.15s}
  .xbtn:hover{background:var(--card-hi);color:var(--txt)}
  .p-head .xbtn{margin-left:4px}

  /* pestañas píldora (maqueta v5): contenedor tipo cápsula y la activa con
     degradado. Con 5 pestañas y 8 idiomas la fila no cabe siempre en 400 px:
     que PASE A DOS LÍNEAS en vez de cortarse (red de seguridad conservada —
     recortar la última deja una pestaña que no se ve ni se puede pulsar). */
  .tabs{display:flex;flex-wrap:wrap;gap:2px;background:var(--card);
    border:1px solid var(--stroke-soft);border-radius:14px;padding:4px}
  /* 6 pestañas en UNA fila a 446px (Oscar 2026-08-06: con "Reporte",
     "Ajustes" se caía a una segunda fila a lo ancho) — letra y aire
     apenas más apretados; el flex-wrap queda de red para idiomas largos */
  .tab{flex:1 1 auto;min-width:0;background:transparent;border:0;
    color:var(--txt-mut);font-family:var(--font);font-size:10.5px;font-weight:600;
    padding:7px 4px;border-radius:10px;cursor:pointer;letter-spacing:-.1px;
    white-space:nowrap;transition:.18s}
  .tab:hover{color:var(--txt)}
  .tab.on{color:#fff;background:var(--grad);
    box-shadow:0 8px 18px -8px rgba(124,140,255,.6)}
  /* contador de hallazgos NUEVOS sin ver: lo enciende la pasada diaria y lo
     apaga abrir la pestaña. Cápsula ROJA flotando en la esquina superior
     derecha de la pestaña (maqueta de Oscar 2026-07-29), tope en 9+; el
     border-radius tipo cápsula la ensancha sola si el número crece. */
  .tab{position:relative}
  .tab .tdot{position:absolute;top:-3px;right:0;min-width:16px;height:15px;
    padding:0 4px;border-radius:999px;background:var(--bad);color:#fff;
    font-size:9px;line-height:15px;font-weight:700;text-align:center;
    box-shadow:0 2px 6px rgba(0,0,0,.4)}

  /* CONTENEDOR BASE del rediseño v5 (2026-08-05): cada sección es una
     TARJETA con fondo propio en vez de un bloque separado por una línea.
     Es transversal a propósito —igual que la paleta—: da el lenguaje
     visual a todas las pestañas de una vez, y el CONTENIDO de cada una se
     sigue rediseñando por turnos. */
  .sect{background:var(--card);border:1px solid var(--stroke-soft);
    border-radius:var(--r-lg);padding:14px;margin-top:10px}
  .sect:first-of-type{margin-top:0}
  /* Tarjetas del analizador de fugas (pestaña Hallazgos). El borde
     izquierdo lleva la severidad, como el popover de avisos: se entiende
     sin leer. */
  /* TARJETA DE HALLAZGO (rediseño v5): fondo propio, icono de severidad en
     cuadrito y el importe destacado. El borde izquierdo de color se retira:
     la severidad ya la lleva el icono, y con fondo de tarjeta el filo
     quedaba como un resto del diseño viejo. */
  .fnd{position:relative;background:var(--card);border:1px solid var(--stroke-soft);
    border-radius:var(--r-md);padding:13px 14px;margin-top:10px;transition:background .15s}
  #fndList .fnd{cursor:pointer}
  #fndList .fnd:hover{background:var(--card-hi)}
  .fnd-top{display:flex;gap:11px;align-items:flex-start}
  .fnd-sev{flex:0 0 auto;position:relative;isolation:isolate;width:34px;height:34px;
    border-radius:11px;display:grid;place-items:center;color:var(--accent)}
  .fnd-sev i{position:absolute;inset:0;border-radius:inherit;background:currentColor;
    opacity:.15;z-index:-1}
  .fnd.warn .fnd-sev{color:var(--warn)}
  .fnd.bad .fnd-sev{color:var(--bad)}
  .fnd-body{min-width:0;flex:1 1 auto}
  /* hallazgo contraído a mano (clic, como Consejos): se pliega SOLO la
     recomendación — título, origen y costo se quedan, que son el ranking */
  .fnd.min .fnd-f{display:none}
  .fnd-t{font-size:12.5px;font-weight:600;line-height:1.35;padding-right:60px}
  .fnd-m{font-size:10.5px;color:var(--txt-dim);font-family:var(--mono);margin-top:3px;
    overflow-wrap:anywhere;display:flex;align-items:baseline;gap:8px;
    justify-content:space-between}
  .fnd-m>span{min-width:0;overflow-wrap:anywhere}
  /* cuándo pasó: a la derecha de la fuente, apagado pero legible */
  .fnd-when{font-style:normal;flex:0 0 auto;color:var(--txt-mut);white-space:nowrap}
  .fnd-c{font-family:var(--mono);font-size:11.5px;margin-top:5px;color:var(--txt-dim)}
  .fnd-c b{font-weight:600;color:var(--txt)}
  .fnd-f{font-size:12px;color:var(--txt-mut);line-height:1.55;margin-top:11px;
    border-top:1px dashed var(--stroke-soft);padding-top:10px}
  /* comandos dentro del texto: se distinguen sin gritar */
  .fnd-f code,.fnd-m code{font-family:var(--mono);font-size:.92em;color:var(--accent);
    background:var(--accent-weak);border:1px solid var(--accent-line);
    border-radius:6px;padding:1px 5px;white-space:nowrap}
  /* ficha de Consejos: mismo molde que la tarjeta de Hallazgos, variante
     tip — sin costo ni borde de severidad (una ficha con $0.00 devalúa el
     sistema); acordeón: el cuerpo se abre al tocar el título */
  .fnd.tip{cursor:pointer}
  /* la ficha no lleva icono de severidad, así que su título no necesita
     dejar hueco para la píldora de Ignorar (su ✕ es pequeña) */
  .fnd.tip .fnd-t{padding-right:22px}
  /* cuerpo más grande que el fix de Hallazgos: aquí son párrafos de
     lectura, no una línea de remate (lo notó Oscar el 2026-07-30) */
  .fnd.tip .fnd-f{display:none;white-space:pre-line;margin-top:10px;
    font-size:12.5px;line-height:1.55}
  /* ficha disparada por el motor de reglas: la línea "Ahora: ..." lleva el
     dato MEDIDO de la sesión activa, en acento — consejo, no alarma */
  .fnd.tip .fnd-m{color:var(--accent)}
  .tab .tdot.acc{background:var(--accent);color:var(--accent-ink)}
  .fnd.tip.open{border-color:var(--accent-line)}
  .fnd.tip.open .fnd-f{display:block}
  /* ✕ de las tarjetas VIVAS del coach (recibos y "Ahora"): como en
     Hallazgos, el usuario decide cuándo despacharlas (2026-08-03) */
  .fnd.tip{position:relative}
  .tip-x{position:absolute;top:7px;right:8px;background:transparent;border:0;
    color:var(--txt-dim);cursor:pointer;font-size:11px;line-height:1;
    padding:3px 5px;border-radius:6px;font-family:var(--font)}
  .tip-x:hover{color:var(--txt);background:rgba(128,128,128,.18)}
  /* Tarjeta de INTENCIÓN (docs/remediacion.md etapa 1c): la presión de la
     sesión activa cruzó el umbral. Pregunta la intención en llano y pone el
     comando pequeño al lado — el usuario aprende el mapeo sin que sea
     requisito. El cuerpo anida divs: fuera el pre-line de las fichas. */
  .fnd.tip.int .fnd-f{white-space:normal}
  .int-pct{font-family:var(--mono);color:var(--warn)}
  .int-pct.hot{color:var(--bad)}
  .int-ev{font-size:11px;color:var(--txt-dim);font-family:var(--mono);
    line-height:1.5;margin-top:6px;overflow-wrap:anywhere}
  .int-q{margin-bottom:2px}
  .int-opt{position:relative;border:1px solid var(--stroke-soft);border-radius:12px;
    padding:10px 12px;margin-top:10px;background:var(--card-hi)}
  .int-opt.rec{border-color:var(--accent-line)}
  .int-badge{position:absolute;top:-8px;right:10px;font-size:9.5px;font-weight:700;
    letter-spacing:.6px;text-transform:uppercase;color:var(--accent-ink);
    background:var(--accent);border-radius:999px;padding:2px 8px}
  /* insignia del ANÁLISIS LOCAL (docs/analisis-local.md regla #8): una
     INFERENCIA se ve distinta de un hecho — borde punteado y tonos suaves,
     nunca el acento sólido del "Recomendado" determinista */
  .int-opt.airec{border-style:dashed;border-color:var(--accent-line)}
  .int-badge.ai{background:var(--card-hi);color:var(--txt-mut);
    border:1px dashed var(--accent-line);text-transform:none;letter-spacing:.2px}
  .int-ot{font-size:12.5px;font-weight:600;color:var(--txt)}
  .int-ob{font-size:11.5px;color:var(--txt-mut);line-height:1.5;margin-top:3px}
  .int-warn{font-size:11px;color:var(--warn);line-height:1.5;margin-top:5px}
  .int-warn.ok{color:var(--ok)}
  .int-row{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
  .int-copy{margin-left:auto;font-size:11px;font-weight:600;font-family:var(--font);
    color:var(--txt);background:transparent;border:1px solid var(--stroke-soft);
    border-radius:999px;padding:4px 11px;cursor:pointer;transition:.15s}
  .int-copy:hover{border-color:var(--accent-line);color:var(--accent)}
  /* "Aplicar" (etapa 3c): relleno de acento porque es el único botón de la
     app que TECLEA en la terminal del usuario — tiene que distinguirse del
     de copiar a simple vista. Sin margin-left:auto: lo empuja el de copiar. */
  .int-apply{font-size:11px;font-weight:600;font-family:var(--font);
    color:var(--accent-ink);background:var(--accent);border:1px solid transparent;
    border-radius:999px;padding:4px 11px;cursor:pointer;transition:.15s;
    white-space:nowrap}
  .int-apply:hover{filter:brightness(1.08)}
  .int-apply[data-running]{background:var(--warn);color:#1a1206}
  /* El motivo del "no se aplicó" va en SU PROPIA LÍNEA, nunca dentro del
     botón: metido ahí lo estiraba hasta salirse de la ventana (visto por
     Oscar 2026-08-08). flex-basis 100% lo baja entero; el botón conserva
     su etiqueta corta y su nowrap. */
  .int-msg{flex:1 1 100%;font-size:10.5px;color:var(--bad);line-height:1.45;
    overflow-wrap:anywhere}
  .int-msg:empty{display:none}
  .int-later{margin-top:10px;text-align:right;font-size:11px;color:var(--txt-dim);
    cursor:pointer}
  .int-later:hover{color:var(--txt)}
  /* Remediación etapa 2: filas de zombies (Ajustes y tarjeta) y registro */
  .rem-z{display:flex;align-items:center;justify-content:space-between;gap:8px;
    font-size:11px;color:var(--txt-mut);padding:3px 0;min-width:0}
  .rem-z b{color:var(--txt)}
  .rem-z span{overflow-wrap:anywhere}
  .rem-l{font-size:10.5px;color:var(--txt-dim);padding:2px 0;overflow-wrap:anywhere}
  /* Enlace a la copia del /clear: va DENTRO de la línea del registro, así que
     es texto con acento, no un botón con caja (una caja aquí rompería el
     renglón y descuadraría la lista). */
  .lnk{background:none;border:0;padding:0;font:inherit;color:var(--accent);
    cursor:pointer;text-decoration:underline}
  /* Relevo etapa 3b: una fila por sesión de Claude Code abierta con relevo */
  .rly-r{display:flex;align-items:center;justify-content:space-between;gap:8px;
    font-size:11px;color:var(--txt-mut);padding:3px 0;min-width:0;flex-wrap:wrap}
  .rly-act{display:flex;align-items:center;gap:8px;min-width:0}
  .rly-r b{color:var(--txt)}
  .rly-s{font-size:10.5px;white-space:nowrap;color:var(--txt-dim)}
  .rly-s.ok{color:var(--ok)}
  /* la insignia de la tarjeta de intención: "esta sesión tiene relevo" */
  .int-rly{display:inline-block;margin-left:6px;font-size:9.5px;font-weight:600;
    letter-spacing:.4px;text-transform:uppercase;color:var(--accent-ink);
    background:var(--accent);border-radius:999px;padding:2px 7px;vertical-align:1px}
  .fnd-x{position:absolute;top:11px;right:12px;font-size:10.5px;font-weight:600;
    color:var(--txt-dim);background:var(--card-hi);border:1px solid var(--stroke-soft);
    border-radius:999px;padding:3px 9px;cursor:pointer;transition:.15s}
  .fnd-x:hover{color:var(--bad);border-color:rgba(255,107,94,.4)}
  .eyebrow{font-size:10.5px;letter-spacing:1.1px;text-transform:uppercase;color:var(--txt-dim);
    font-weight:700;margin-bottom:12px;display:flex;justify-content:space-between;
    align-items:center;gap:8px}
  /* el control de la derecha manda: el título se encoge antes que él, para
     que un rango como "03 ago – 05 ago" no se parta en dos líneas */
  .eyebrow>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis}
  .eyebrow .q{flex:0 0 auto}
  .eyebrow .q{font-family:var(--mono);letter-spacing:0;text-transform:none;
    color:var(--txt-mut);font-weight:500;font-size:11px}

  /* HERO del rediseño v5: tarjeta violeta con destello, anillo completo y
     el ritmo unificado adentro. El anillo conserva el truco pathLength=100
     (el JS del medidor no cambia) y el COLOR sigue siendo el del estado
     (verde/ámbar/rojo) — el degradado decorativo de la maqueta perdería la
     semántica del semáforo. */
  .sect.hero-sect{position:relative;overflow:hidden;
    background:linear-gradient(150deg,#232A55 0%,#33296A 55%,#1E2547 100%);
    border:1px solid rgba(164,140,255,.25);border-radius:var(--r-lg);
    padding:14px 14px 16px;margin-top:0;
    /* Sobre el violeta, los grises de la app quedan apagados: el hero
       REDEFINE los tonos de texto y todo lo de dentro (barras, resets,
       etiquetas) los hereda sin tocar sus reglas. Subidos el 2026-08-05
       a petición de Oscar. */
    --txt-mut:rgba(234,240,255,.90); --txt-dim:rgba(234,240,255,.70)}
  body.light .sect.hero-sect{
    background:linear-gradient(150deg,#E9EBFB 0%,#EFE8FB 55%,#E6EAFA 100%);
    border-color:rgba(91,95,224,.28);
    --txt-mut:#333C63; --txt-dim:#4E5780}
  /* Jerarquía y ritmo vertical CALCADOS de la maqueta (Oscar 2026-08-05):
     nombre en 600 casi blanco, % en mono más tenue, y los datos de abajo
     en un bloque con interlineado 1.5 — sin separación extra entre sus
     líneas, que es lo que da el aire parejo de la maqueta. */
  .hero-sect .bar-row .brow-top{margin-bottom:6px}
  .hero-sect .bar-row .lbl{font-weight:600;color:rgba(234,240,255,.92)}
  .hero-sect .bar-row .rst{font-size:10px;font-weight:400;line-height:1.5;
    color:rgba(234,240,255,.62)}
  .hero-sect .bar-row .rst.pctv{font-size:11.5px;font-weight:500;
    color:rgba(234,240,255,.82)}
  body.light .hero-sect .bar-row .lbl{color:#242C4D}
  body.light .hero-sect .bar-row .rst{color:#5A6488}
  body.light .hero-sect .bar-row .rst.pctv{color:#333C63}
  /* datos de debajo de la barra: uno por línea, TODOS a la izquierda y
     pegados entre sí (el interlineado ya los separa) */
  .bmeta{display:flex;flex-direction:column;align-items:flex-start;
    gap:0;margin-top:5px}
  .bmeta .rst{margin-left:0;white-space:normal;overflow-wrap:anywhere}
  /* misma barra para todas las filas del hero (la maqueta no adelgaza las
     secundarias) y esquinas de cápsula */
  .hero-sect .track,.hero-sect .mini .track{height:8px;border-radius:999px}
  .hero-sect .fill{border-radius:999px}
  .sect.hero-sect::before{content:"";position:absolute;top:-40%;right:-18%;
    width:240px;height:240px;pointer-events:none;
    background:radial-gradient(circle,rgba(164,107,255,.30),transparent 65%)}
  body.light .sect.hero-sect::before{
    background:radial-gradient(circle,rgba(157,92,240,.16),transparent 65%)}
  .hero-sect .eyebrow{position:relative}
  /* chip de estado (remQ): píldora verde "dentro de lo previsto" / ámbar
     "vas por delante del reloj" — la clase la pone renderQuota */
  .hero-sect .eyebrow .q{font-family:var(--font);font-size:10.5px;font-weight:600;
    letter-spacing:0;color:#CDE7B0;background:rgba(63,214,143,.16);
    border:1px solid rgba(63,214,143,.3);padding:3px 9px;border-radius:999px}
  .hero-sect .eyebrow .q.warn{color:#F8DFA9;background:rgba(242,180,67,.16);
    border-color:rgba(242,180,67,.35)}
  body.light .hero-sect .eyebrow .q{color:#1E6E45;background:rgba(31,169,104,.13);
    border-color:rgba(31,169,104,.3)}
  body.light .hero-sect .eyebrow .q.warn{color:#7A5605;background:rgba(181,126,9,.13);
    border-color:rgba(181,126,9,.32)}

  .hero{display:flex;gap:14px;align-items:center;position:relative}
  /* MEDIO anillo, no completo: el círculo entero se encimaba con el reset
     (Oscar 2026-08-05). Se conserva la geometría original del semicírculo
     —y con ella el truco pathLength=100 del JS—, con la tipografía nueva. */
  .gauge{width:132px;flex:0 0 auto;position:relative;text-align:center}
  .gauge svg{width:132px;height:78px;display:block}
  #gFill{transition:stroke-dashoffset .6s,stroke .3s}
  .g-val{position:absolute;left:0;right:0;top:36px;font-family:var(--disp);
    font-weight:800;font-size:26px;letter-spacing:-.5px;line-height:1}
  .g-cap{position:absolute;left:0;right:0;top:64px;font-size:8.5px;font-weight:700;
    letter-spacing:1.1px;text-transform:uppercase;color:var(--txt-dim)}
  .g-reset{font-family:var(--mono);font-size:10px;color:var(--txt-mut);margin-top:3px}

  .stack{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
  .bar-row .brow-top{display:flex;justify-content:space-between;align-items:baseline;
    gap:8px;min-width:0;font-size:11.5px;margin-bottom:5px}
  .bar-row .brow-top.wrap{flex-wrap:wrap;gap:2px 8px}
  .bar-row .brow-top.wrap .rst{white-space:normal;min-width:0;margin-left:0}
  .bar-row .lbl{color:var(--txt-mut);flex:1 1 auto;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar-row .lbl b{color:var(--txt);font-weight:600}
  .bar-row .rst{font-family:var(--mono);font-size:10.5px;color:var(--txt-dim);flex:0 1 auto;margin-left:8px}
  .track{position:relative;height:9px;border-radius:6px;background:var(--track);overflow:hidden}
  .mini .track{height:6px}
  .fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px;transition:width .6s,background .3s}
  .pace{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--txt);opacity:.85}

  .proj{display:flex;gap:11px;align-items:flex-start;border-radius:var(--r-md);padding:11px 13px;
    background:rgba(242,180,67,.13);border:1px solid rgba(242,180,67,.32)}
  .proj.calm{background:rgba(63,214,143,.11);border-color:rgba(63,214,143,.28)}
  /* iconito de estado (maqueta v5): palomita en calma, rayo en aviso */
  .proj .p-ic{flex:0 0 auto;width:28px;height:28px;border-radius:9px;display:grid;place-items:center}
  .proj .p-ic.i-ok{background:rgba(63,214,143,.18);color:var(--ok)}
  .proj .p-ic.i-warn{background:rgba(242,180,67,.2);color:var(--warn)}
  .proj .p-ic.i-warn{display:none}
  .proj:not(.calm) .p-ic.i-ok{display:none}
  .proj:not(.calm) .p-ic.i-warn{display:grid}
  .proj .ptxt{font-size:12px;line-height:1.45}
  .proj .rate{font-family:var(--mono);font-size:10.5px;color:var(--txt-mut);margin-top:3px}

  /* LISTA DE PROYECTOS (rediseño v5, 2026-08-05): cada fila con su avatar
     de iniciales, nombre + chip de origen, barrita debajo y el importe a
     la derecha. El avatar hereda el MISMO color de la paleta que la barra,
     así el color sigue identificando al proyecto. */
  .plist{display:flex;flex-direction:column;gap:2px}
  /* FLEX y no grid: con grid, los hijos que fijan su fila (avatar e
     importe, que ocupan las dos) se colocan ANTES que los automáticos y el
     nombre acababa en la tercera columna — la lista salía descuadrada
     (bug visto por Oscar 2026-08-05). Con flex + envoltorio de texto, el
     orden es el del DOM y no hay sorpresas. */
  .pitem{display:flex;align-items:center;gap:11px;
    padding:8px 6px;border-radius:var(--r-md);transition:background .15s}
  .pitem .ptx{flex:1 1 auto;min-width:0}
  .pitem:hover{background:var(--card-hi)}
  /* El fondo del avatar es el color del proyecto atenuado. Se hace con una
     CAPA a opacidad y no con color-mix(): esa función es reciente y no se
     puede dar por segura en todos los WebView2 (invariante de compatibilidad
     del panel). */
  .pitem .pav{position:relative;isolation:isolate;width:34px;height:34px;border-radius:11px;
    flex:0 0 auto;display:grid;place-items:center;font-family:var(--disp);
    font-weight:700;font-size:12px;letter-spacing:.3px;text-transform:uppercase}
  .pitem .pav i{position:absolute;inset:0;border-radius:inherit;opacity:.16;z-index:-1}
  .pitem .pname{font-size:12.5px;font-weight:600;display:flex;align-items:center;min-width:0}
  .pitem .pname span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pitem .pcost{flex:0 0 auto;font-family:var(--mono);font-size:13px;font-weight:600}
  .pitem .pbar{height:4px;border-radius:99px;background:var(--track);overflow:hidden;
    max-width:180px;margin-top:6px}
  .pitem .pbar i{display:block;height:100%;border-radius:99px}
  /* fila de la cola: enlace, sin avatar ni barra (maqueta v5) */
  .pitem.more{cursor:pointer;padding:7px 6px 2px}
  .pitem.more .pname{font-size:11.5px;font-weight:600;color:var(--accent)}
  .pitem.more:hover{background:transparent}
  .pitem.more:hover .pname{text-decoration:underline}
  .pitem.more .pcost{font-size:12px;color:var(--txt-mut);font-weight:500}

  /* MODELOS (rediseño v5): barra segmentada en cápsula con separación entre
     tramos, y la leyenda en píldoras en vez de texto suelto */
  .split{height:10px;border-radius:999px;overflow:hidden;display:flex;gap:2px}
  .split i{height:100%}
  .legend{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap}
  .legend span{font-size:11px;color:var(--txt-mut);display:flex;align-items:center;gap:6px;
    background:var(--card-hi);border:1px solid var(--stroke-soft);
    padding:5px 10px;border-radius:999px}
  .legend span em{font-style:normal;color:var(--txt);font-weight:600}
  .legend b{width:8px;height:8px;border-radius:3px;display:inline-block;flex:0 0 auto}

  /* pie de totales: tarjeta propia, como el resto del rediseño */
  .p-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;
    margin-top:10px;padding:14px;border-radius:var(--r-lg);
    background:linear-gradient(135deg,var(--card),var(--card-hi));
    border:1px solid var(--stroke-soft)}
  /* ---- filtros de la tarjeta de gasto: fechas y proyectos ---- */
  /* disparadores gemelos en el encabezado */
  .trig{display:inline-flex;align-items:center;gap:6px;cursor:pointer;position:relative;
    white-space:nowrap;
    font-family:var(--mono);font-size:11px;font-weight:600;color:var(--txt);
    background:var(--card-hi);border:1px solid var(--stroke);border-radius:10px;
    padding:4px 8px;transition:.15s;margin-left:6px}
  .trig:first-child{margin-left:0}
  .trig:hover{border-color:var(--accent-line)}
  .trig.on{border-color:var(--accent);background:var(--accent-weak)}
  .trig svg{flex:0 0 auto;color:var(--accent)}
  .trig .chev{color:var(--txt-dim);font-size:9px}
  .trig .tbadge{position:absolute;top:-6px;right:-6px;min-width:15px;height:15px;
    padding:0 4px;border-radius:999px;background:var(--grad);color:#fff;
    font-size:9px;line-height:15px;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.5)}
  /* velo + popover flotante (fixed: el panel tiene scroll propio) */
  .veil{position:fixed;inset:0;background:rgba(6,10,20,.6);z-index:40}
  body.light .veil{background:rgba(20,26,50,.35)}
  .pop{position:fixed;left:14px;right:14px;top:52px;z-index:50;max-height:calc(100vh - 74px);
    overflow-y:auto;background:var(--card-hi);border:1px solid var(--accent-line);
    border-radius:var(--r-lg);padding:14px;box-shadow:0 30px 70px -20px rgba(0,0,0,.85)}
  .pop-x{position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:9px;
    border:1px solid var(--stroke);background:var(--card);color:var(--txt-mut);
    cursor:pointer;font-size:11px;display:grid;place-items:center;transition:.15s}
  .pop-x:hover{color:var(--txt);border-color:rgba(255,107,94,.5)}
  .pop-tt{font-size:10.5px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;
    color:var(--txt-dim);margin-bottom:11px;padding-right:32px}
  .pop-foot{display:flex;gap:8px;margin-top:12px}
  /* visor de copias del /clear (handoff): transcript en mono, scroll propio */
  .hv-body{font-family:var(--mono);font-size:10.5px;line-height:1.55;
    white-space:pre-wrap;word-break:break-word;color:var(--txt-mut);
    background:var(--card);border:1px solid var(--stroke-soft);
    border-radius:11px;padding:10px;max-height:52vh;overflow-y:auto}
  .hv-body b{color:var(--txt)}
  .cbtn{border:0;cursor:pointer;font-family:var(--font);font-size:12px;font-weight:700;
    border-radius:11px;padding:9px 12px;transition:.15s}
  .cbtn.ghost{background:var(--card);color:var(--txt-mut);border:1px solid var(--stroke)}
  .cbtn.ghost:hover{color:var(--txt)}
  .cbtn.go{flex:1;color:#fff;background:var(--grad);
    box-shadow:0 10px 22px -10px rgba(124,140,255,.6)}
  .cbtn.go:hover{filter:brightness(1.1)}
  .cbtn.go:disabled{opacity:.45;cursor:default;filter:none}
  .pop-hint{font-size:10px;color:var(--txt-dim);text-align:center;margin-top:9px;line-height:1.45}
  .pop-hint.warn{color:var(--warn)}
  /* presets de periodo, dentro del calendario */
  .presets{display:flex;gap:6px;margin-bottom:12px;padding-right:32px}
  .preset{flex:1;border:1px solid var(--stroke);background:var(--card);color:var(--txt-mut);
    font-family:var(--mono);font-size:11px;font-weight:600;cursor:pointer;
    padding:7px 0;border-radius:10px;transition:.15s}
  .preset:hover{color:var(--txt);border-color:var(--accent-line)}
  .preset.on{background:var(--grad);border-color:transparent;color:#fff;
    box-shadow:0 8px 16px -8px rgba(124,140,255,.6)}
  /* extremos elegidos */
  .range-io{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .range-io .cell{flex:1;text-align:center;font-family:var(--mono);font-size:11.5px;
    background:var(--card);border:1px solid var(--stroke);border-radius:10px;
    padding:7px 4px;color:var(--txt)}
  .range-io .cell.empty{color:var(--txt-dim)}
  .range-io .arrow{color:var(--txt-dim);flex:0 0 auto;font-size:12px}
  /* cabecera de mes */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .cal-head b{font-family:var(--disp);font-size:13px;font-weight:700;text-transform:capitalize}
  .nav{width:28px;height:28px;border-radius:9px;border:1px solid var(--stroke);
    background:var(--card);color:var(--txt-mut);cursor:pointer;font-size:13px;
    display:grid;place-items:center;transition:.15s}
  .nav:hover{color:var(--txt);border-color:var(--accent-line)}
  /* rejilla del mes */
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
  .cal-grid .dow{font-size:9.5px;font-weight:700;letter-spacing:.5px;color:var(--txt-dim);padding:5px 0}
  .cal-grid .day{position:relative;border:0;background:transparent;color:var(--txt);
    cursor:pointer;font-family:var(--mono);font-size:12px;padding:0;height:32px;
    border-radius:10px;transition:.12s}
  .cal-grid .day:hover:not(:disabled){background:var(--accent-weak)}
  .cal-grid .day:disabled{color:var(--txt-dim);opacity:.4;cursor:default}
  .cal-grid .day.out{color:var(--txt-dim);opacity:.45}
  /* punto del día de hoy */
  .cal-grid .day.today::after{content:"";position:absolute;left:50%;bottom:4px;
    transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--teal)}
  .cal-grid .day.in-range{background:var(--accent-weak);border-radius:0}
  .cal-grid .day.r-start,.cal-grid .day.r-end{background:var(--grad);color:#fff;font-weight:600;
    box-shadow:0 6px 14px -6px rgba(124,140,255,.7)}
  .cal-grid .day.r-start{border-radius:10px 0 0 10px}
  .cal-grid .day.r-end{border-radius:0 10px 10px 0}
  .cal-grid .day.r-start.r-end{border-radius:10px}
  /* buscador y lista del filtro de proyectos */
  .psearch{width:100%;background:var(--card);border:1px solid var(--stroke-soft);
    border-radius:12px;color:var(--txt);font-family:var(--font);font-size:12.5px;
    padding:9px 12px;margin-bottom:10px}
  .psearch::placeholder{color:var(--txt-dim)}
  .psearch:focus{outline:none;border-color:var(--accent-line)}
  .psel{max-height:210px;overflow-y:auto;margin:0 -4px;padding:0 4px}
  .psel .pit{display:flex;align-items:center;gap:10px;padding:8px 6px;border-radius:12px;
    cursor:pointer;transition:.12s;user-select:none}
  .psel .pit:hover{background:var(--card)}
  .psel .pit .pav{width:30px;height:30px;border-radius:10px;font-size:11px}
  .psel .pit .nm{flex:1 1 auto;min-width:0;font-size:12.5px;font-weight:600;
    display:flex;align-items:center;overflow:hidden}
  .psel .pit .nm span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .psel .pit .amt{font-family:var(--mono);font-size:11.5px;color:var(--txt-mut);flex:0 0 auto}
  .ck{width:18px;height:18px;border-radius:6px;border:1.5px solid var(--txt-dim);
    flex:0 0 auto;display:grid;place-items:center;transition:.12s;color:transparent;font-size:11px}
  .psel .pit.sel .ck{background:var(--grad);border-color:transparent;color:#fff}
  .no-match{font-size:12px;color:var(--txt-dim);text-align:center;padding:14px 0}
  /* chips del filtro activo, en la tarjeta */
  .fchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:11px}
  .fchip{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;
    background:var(--accent-weak);border:1px solid var(--accent-line);color:var(--txt);
    padding:4px 9px;border-radius:999px;max-width:100%}
  .fchip em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fchip s{text-decoration:none;color:var(--txt-mut);cursor:pointer;font-size:12px;
    line-height:1;flex:0 0 auto}
  .fchip s:hover{color:var(--bad)}
  .fchip.clear{background:transparent;border-color:var(--stroke);color:var(--txt-dim);cursor:pointer}
  .fchip.clear:hover{color:var(--bad);border-color:rgba(255,107,94,.4)}
  /* aviso de que las máquinas del hub no entran en un rango */
  .hubnote{font-size:10px;color:var(--warn);line-height:1.45;margin-top:8px}

  /* fila de controles del gasto: alineada a la IZQUIERDA y con salto
     limpio si no cabe (antes colgaban del título y se descolocaban) */
  .spendbar{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:11px}
  .spendbar .sb-est{font-family:var(--mono);font-size:11px;color:var(--txt-mut)}
  /* caja del TOTAL del periodo, con la nota de privacidad al lado */
  .spendtot{display:flex;align-items:center;justify-content:space-between;gap:12px;
    background:linear-gradient(135deg,var(--card-hi),var(--card));
    border:1px solid var(--stroke-soft);border-radius:var(--r-md);
    padding:12px 14px;margin-bottom:12px}
  .spendtot .st-l{min-width:0}
  .spendtot .st-lbl{font-size:9.5px;font-weight:700;letter-spacing:1.1px;
    text-transform:uppercase;color:var(--txt-dim);margin-bottom:3px;
    overflow-wrap:anywhere}
  .spendtot b{font-family:var(--disp);font-size:23px;font-weight:800;
    letter-spacing:-.5px;color:var(--txt);display:block}
  .spendtot .foot-note{margin:0;flex:0 1 auto}

  .foot-note{font-size:9.5px;color:var(--txt-dim);max-width:175px;text-align:right;line-height:1.5}
  .errbox{font-size:11.5px;color:var(--warn);line-height:1.4;padding:6px 0}

  /* ajustes (fuentes de datos) */
  .cfg-note{font-size:11px;color:var(--txt-mut);line-height:1.5;margin-bottom:9px}
  .cfg-note b{color:var(--txt);font-weight:600}
  .cfg-form{display:flex;flex-direction:column;gap:11px;margin-top:2px}
  /* campos del rediseño v5: más aire, esquinas suaves y foco en acento */
  .cfg-form input{background:var(--card-hi);border:1px solid var(--stroke);border-radius:12px;
    padding:10px 12px;color:var(--txt);font-family:var(--mono);font-size:12px;outline:none;
    transition:border-color .15s}
  .cfg-form input::placeholder{color:var(--txt-dim)}
  .cfg-form input:focus{border-color:var(--accent-line)}
  /* Un solo aspecto para todos los botones del panel. Los de ajustes
     compartidos quedaron fuera de .cfg-form al moverlos a Fuentes de datos y
     salían sin estilo, con otro color que el resto (2026-07-28). */
  .cfg-form button,.btnrow button{align-self:flex-start;background:var(--grad);
    color:#fff;border:0;border-radius:11px;
    padding:9px 15px;font-size:12px;font-weight:700;cursor:pointer;font-family:var(--font);
    box-shadow:0 10px 22px -10px rgba(124,140,255,.6);transition:filter .15s}
  .cfg-form button:hover,.btnrow button:hover{filter:brightness(1.1)}
  /* secundarios (los de ajustes compartidos y export) en tono apagado */
  /* .sec funciona en CUALQUIER contenedor: atarlo a .btnrow dejó sin
     estilo al "Buscar actualización" de Acerca de (Oscar 2026-08-05) */
  button.sec,#hubSave,#hubLoad,#expCsv,#expJson,#pricesNow{
    background:var(--card-hi);color:var(--txt);border:1px solid var(--stroke);
    box-shadow:none;border-radius:11px;padding:9px 15px;font-size:12px;
    font-weight:700;cursor:pointer;font-family:var(--font);transition:background .15s}
  button.sec:hover,#hubSave:hover,#hubLoad:hover,
  #expCsv:hover,#expJson:hover,#pricesNow:hover{background:var(--surface);filter:none}
  #rMsg{font-size:11px;color:var(--txt-mut);font-family:var(--mono)}
  /* La ruta de exportación era el único mensaje del panel sin estilo:
     heredaba el tamaño del texto normal y cantaba al lado de los demás,
     que van a 10.5-11 px. Salta de línea por caracteres porque una ruta
     larga no tiene espacios donde partir (2026-07-29). */
  #expBox{display:flex;align-items:center;gap:10px;margin-top:8px;
    padding:9px 11px;border-radius:8px;background:var(--surface);
    border-left:3px solid var(--ok)}
  #expBox.bad{border-left-color:var(--bad)}
  .exp-ico{flex:0 0 auto;display:grid;place-items:center;color:var(--ok)}
  #expBox.bad .exp-ico{color:var(--bad)}
  .exp-txt{min-width:0;flex:1 1 auto}
  .exp-t{font-size:12px;color:var(--txt)}
  /* una ruta no tiene espacios donde partir, así que se recorta en una línea
     y la completa vive en el title */
  .exp-p{font-size:10.5px;font-family:var(--mono);color:var(--txt-dim);
    margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .exp-open{flex:0 0 auto;background:none;border:0;color:var(--ok);
    font-size:11.5px;cursor:pointer;padding:0;font-family:var(--font)}
  #expBox.bad .exp-open{display:none}
  /* Sin temporizador, como el resto de avisos de la app: lo cierra el
     usuario. Y se va solo al cambiar de pestaña, porque el mensaje
     pertenece a ese momento y no al panel entero (2026-07-29). */
  .exp-x{flex:0 0 auto;background:none;border:0;color:var(--txt-dim);
    font-size:11px;cursor:pointer;padding:0 2px;line-height:1}
  .exp-x:hover{color:var(--txt)}
  /* el lápiz avisa de que el nombre se puede tocar; sin él nadie
     descubre que es editable (2026-07-29) */
  .srv-name{cursor:text}
  .srv-name:hover{color:var(--accent)}
  .srv-name .pen{margin-left:6px;opacity:.4;vertical-align:-1px}
  .srv-name:hover .pen{opacity:1}
  #remList .pitem{grid-template-columns:1fr auto}
  /* FILA DE AJUSTE (rediseño v5): etiqueta a la izquierda, control a la
     derecha y una línea tenue entre filas — la lista corrida de antes se
     leía como un formulario apretado. */
  .cfg-row{display:flex;align-items:center;justify-content:space-between;gap:12px;
    font-size:12.5px;color:var(--txt);padding:10px 0;
    border-top:1px solid var(--stroke-soft)}
  .cfg-row:first-child{border-top:0;padding-top:2px}
  .cfg-row>span:first-child{min-width:0}
  /* select con colores SÓLIDOS explícitos: el popup nativo de opciones no
     hereda bien — oscuro: fondo oscuro/letra blanca; claro: al revés */
  .cfg-row select{background:var(--card-hi);border:1px solid var(--stroke);border-radius:11px;
    padding:8px 10px;color:var(--txt);font-family:var(--font);font-size:12px;outline:none;
    flex:0 0 auto;max-width:62%}
  .cfg-row select option{background:#1B2748;color:#EAF0FF}
  body.light .cfg-row select option{background:#EDEFF9;color:#1A1F33}
  .cfg-row select:focus{border-color:var(--accent-line)}
  /* casilla como interruptor (maqueta v5): el checkbox nativo desentonaba */
  .cfg-row input[type=checkbox]{appearance:none;-webkit-appearance:none;
    position:relative;width:42px;height:24px;border-radius:999px;flex:0 0 auto;
    background:var(--card-hi);border:1px solid var(--stroke);cursor:pointer;
    margin:0;transition:background .2s,border-color .2s}
  .cfg-row input[type=checkbox]::after{content:"";position:absolute;top:2px;left:2px;
    width:16px;height:16px;border-radius:50%;background:var(--txt-dim);transition:.2s}
  .cfg-row input[type=checkbox]:checked{background:var(--grad);border-color:transparent}
  .cfg-row input[type=checkbox]:checked::after{left:22px;background:#fff}
  /* sublínea explicativa bajo la etiqueta de una fila */
  .cfg-sub{display:block;font-size:10.5px;color:var(--txt-dim);margin-top:2px}
  .cfg-lbl{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;
    color:var(--txt-dim);margin-top:14px}
  .btnrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  button:disabled{opacity:.45;cursor:not-allowed}
  .btnrow button{align-self:auto}
  .rstat{font-size:10px;font-family:var(--mono);margin-left:8px;flex:0 0 auto;color:var(--txt-dim)}
  .rstat.ok{color:var(--ok)} .rstat.bad{color:var(--bad)}

  /* alarmas de uso (chips) */
  /* fila del canal ntfy: el campo manda y los botones se colocan detrás,
     saltando de línea si no caben (antes se encimaban) */
  .ntfy-url{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
  .ntfy-url input{flex:1 1 180px;min-width:0;font-size:11.5px}
  .ntfy-url button{flex:0 0 auto}

  /* Acerca de */
  .about-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .about-name{font-size:13px;font-weight:700}
  .about-ver{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--accent);
    background:var(--accent-weak);padding:2px 8px;border-radius:999px;margin-left:5px}
  .about-sub{font-size:10.5px;color:var(--txt-dim);margin-top:3px}
  .about-link{font-size:11.5px;font-weight:600;color:var(--accent);text-decoration:none}
  .about-link:hover{text-decoration:underline}

  .chips{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--card-hi);
    border:1px solid var(--stroke-soft);border-radius:999px;padding:5px 10px;
    font-family:var(--mono);font-size:11px;color:var(--txt-mut)}
  .chip b{cursor:pointer;color:var(--txt-dim);font-weight:400;font-size:12px;line-height:1}
  .chip b:hover{color:var(--bad)}


  /* selector de periodo (1d/7d/30d) */
  /* Ventana del gasto: lista desplegable en vez de 1d·7d·30d sueltos. Con
     cuatro opciones la fila se llenaba de texto (2026-07-28). */
  /* cajita con borde (maqueta v5): sobre el fondo de tarjeta, el selector
     "plano" de antes se perdía */
  .dsel{font-family:var(--mono);font-size:11px;color:var(--txt);font-weight:500;
    background:var(--card-hi);border:1px solid var(--stroke);border-radius:9px;
    padding:3px 6px;cursor:pointer}
  .dsel:focus{outline:none;border-color:var(--accent-line)}
  /* La lista desplegada hereda el color del control, y el acento sobre el
     fondo del sistema no se leía en oscuro. Se le da el mismo par de
     colores que usan los demás desplegables del panel (2026-07-28). */
  .dsel option{background:var(--card-hi);color:var(--txt);font-weight:500}
  /* (el estilo de .pitem.more vive con la lista de proyectos, arriba) */

  /* etiqueta de origen del proyecto (local / wsl / servidor) */
  .srctag{font-size:9px;font-weight:600;color:var(--txt-dim);background:var(--surface);
    border:1px solid var(--stroke-soft);padding:1px 6px;border-radius:6px;
    margin-left:7px;flex:0 0 auto;letter-spacing:.3px}

  /* TENDENCIA DIARIA (rediseño v5): barras con degradado vertical, esquinas
     redondeadas y el DÍA MÁS ALTO destacado en violeta con halo. Se
     conservan las clases de siempre: `today` (el día en curso) y `zero`
     (día sin actividad, que sigue pintándose como hueco y no como barra
     de valor cero). */
  .tchart{display:flex;align-items:flex-end;gap:3px;height:70px;padding-top:4px}
  .tchart i{flex:1 1 0;border-radius:5px 5px 2px 2px;min-height:3px;cursor:default;
    background:linear-gradient(180deg,var(--accent),#4A57B8);opacity:.75;
    transition:opacity .15s,filter .15s}
  body.light .tchart i{background:linear-gradient(180deg,var(--accent),#8E92F0)}
  .tchart i:hover{opacity:1;filter:brightness(1.15)}
  .tchart i.today{opacity:1}
  .tchart i.top{opacity:1;background:linear-gradient(180deg,#A46BFF,var(--accent));
    box-shadow:0 0 12px rgba(164,107,255,.45)}
  .tchart i.zero{background:var(--track);opacity:1;box-shadow:none}
  .tspan{display:flex;justify-content:space-between;font-size:9.5px;color:var(--txt-dim);
    font-family:var(--mono);margin-top:7px}

  /* bienvenida/guía adaptativa:
     - body.setup   (sin token Y sin datos locales = no hay Claude Code):
       tarjeta completa, oculta el resto de Principal.
     - body.tokenhint (sin token pero CON datos locales = token vencido):
       banner compacto arriba, NO oculta los datos que sí hay. */
  #welcomeBox,.w-new,.w-expired{display:none}
  body.setup #welcomeBox,body.setup .w-new{display:block}
  body.setup #tab-main > .sect:not(#welcomeBox){display:none}
  body.tokenhint #welcomeBox,body.tokenhint .w-expired{display:block}
  body.tokenhint #welcomeBox{padding-bottom:0}
  .setup-p{font-size:12.5px;color:var(--txt-mut);line-height:1.5;margin:0 0 11px}
  .setup-steps{margin:0 0 11px;padding-left:20px;font-size:12.5px;line-height:1.7;color:var(--txt)}
  .setup-url{display:inline-block;font-family:var(--mono);font-size:12px;color:var(--accent);
    background:var(--surface);border:1px solid var(--stroke);border-radius:7px;padding:6px 10px;
    margin-bottom:11px;user-select:text;-webkit-user-select:text;cursor:text}
  .setup-note{font-size:11.5px;color:var(--txt-dim);line-height:1.5;margin:0 0 6px}

  /* fuentes de datos: nota en lista + formulario etiquetado + filas de servidores */
  /* buscador de Consejos, con botón para vaciarlo */
  .tipsearch{position:relative;margin:12px 0 0}
  /* mismo campo que el resto del rediseño (antes heredaba el del sistema y
     desentonaba con todo — lo vio Oscar 2026-08-05) */
  .tipsearch input{width:100%;box-sizing:border-box;padding:10px 34px 10px 12px;
    background:var(--card-hi);border:1px solid var(--stroke);border-radius:12px;
    color:var(--txt);font-family:var(--font);font-size:12.5px;outline:none;
    transition:border-color .15s}
  .tipsearch input::placeholder{color:var(--txt-dim)}
  .tipsearch input:focus{border-color:var(--accent-line)}
  .tipsearch button{position:absolute;top:50%;right:8px;transform:translateY(-50%);
    width:22px;height:22px;border-radius:7px;border:0;background:transparent;
    color:var(--txt-dim);cursor:pointer;font-size:11px;line-height:1;
    display:grid;place-items:center}
  .tipsearch button:hover{color:var(--txt);background:var(--surface)}
  /* "ningún consejo coincide": ocupa el hueco de los resultados, no un pie */
  #tipFoot{display:flex;gap:11px;align-items:center;margin-top:12px;
    background:var(--card);border:1px dashed var(--stroke);
    border-radius:var(--r-md);padding:14px}
  #tipFoot .tf-ico{flex:0 0 auto;width:34px;height:34px;border-radius:11px;
    display:grid;place-items:center;color:var(--txt-dim);background:var(--surface)}
  #tipFoot .tf-tx{min-width:0}
  #tipFoot #tipMissTxt{font-size:12.5px;font-weight:600;overflow-wrap:anywhere}
  #tipFoot a{display:inline-block;font-size:11.5px;font-weight:600;color:var(--accent);
    text-decoration:none;margin-top:3px}
  #tipFoot a:hover{text-decoration:underline}

  /* pie de Hallazgos: el enlace de recuperar arriba y destacado (como
     "Más proyectos"), la nota del "~" debajo en gris */
  .fnd-restore{display:inline-block;font-size:11.5px;font-weight:600;
    color:var(--accent);text-decoration:none;cursor:pointer}
  .fnd-restore:hover{text-decoration:underline}
  .fnd-note{font-size:10px;color:var(--txt-dim);line-height:1.5;margin-top:6px}

  /* las cuatro fuentes, en rejilla de tarjetas (rediseño v5) */
  .srcgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:10px}
  .srccard{background:var(--card);border:1px solid var(--stroke-soft);
    border-radius:var(--r-md);padding:12px}
  .srccard .ic{position:relative;isolation:isolate;width:32px;height:32px;
    border-radius:11px;display:grid;place-items:center;margin-bottom:9px}
  /* el fondo del icono es su color al 14%: misma capa a opacidad que los
     avatares de proyecto (color-mix es demasiado reciente para WebView2) */
  .srccard .ic i{position:absolute;inset:0;border-radius:inherit;
    background:var(--b);opacity:.14;z-index:-1}
  .srccard b{font-size:12px;display:block}
  .srccard p{font-size:10.5px;color:var(--txt-dim);line-height:1.45;margin:4px 0 0;
    overflow-wrap:anywhere}
  .srccard p code{font-family:var(--mono);font-size:9.5px}
  .fld{display:flex;flex-direction:column;gap:6px}
  .fld label{font-size:11px;font-weight:600;color:var(--txt-mut)}
  .fhint{font-size:10px;color:var(--txt-dim);line-height:1.5}
  .cfg-form input.mono{font-family:var(--mono);font-size:11.5px}
  .cfg-form button:disabled{opacity:.5;cursor:default}
  /* servidor guardado: tarjeta con icono, como la maqueta v5 (antes eran
     filas separadas por una línea) */
  .srv-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:11px;
    align-items:center;background:var(--card-hi);border:1px solid var(--stroke-soft);
    border-radius:var(--r-md);padding:11px 12px;margin-bottom:8px}
  .srv-row:last-child{margin-bottom:0}
  .srv-ic{position:relative;isolation:isolate;width:34px;height:34px;border-radius:11px;
    display:grid;place-items:center;color:var(--teal)}
  .srv-ic i{position:absolute;inset:0;border-radius:inherit;background:var(--teal);
    opacity:.14;z-index:-1}
  .srv-name{font-size:12.5px;font-weight:650}
  .srv-meta{font-family:var(--mono);font-size:10.5px;color:var(--txt-dim);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .spill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;
    padding:2px 8px;border-radius:20px;white-space:nowrap}
  .spill i{width:6px;height:6px;border-radius:50%;font-style:normal}
  .spill.ok{background:rgba(64,184,105,.14);color:var(--ok)}
  .spill.ok i{background:var(--ok)}
  .spill.bad{background:rgba(240,90,65,.12);color:var(--bad)}
  .spill.bad i{background:var(--bad)}
  .spill.wait{background:var(--surface);color:var(--txt-dim)}
  .spill.wait i{background:var(--txt-dim)}
  .del-btn{border:0;background:transparent;color:var(--txt-dim);width:28px;height:28px;
    display:grid;place-items:center;border-radius:7px;cursor:pointer;transition:.15s}
  .del-btn:hover{background:rgba(240,90,65,.12);color:var(--bad)}
  .del-btn.arm{width:auto;padding:0 9px;background:rgba(240,90,65,.15);color:var(--bad);
    font-size:10.5px;font-weight:700}
  #srvCount{background:var(--surface);border:1px solid var(--stroke);border-radius:20px;
    padding:2px 9px;font-size:10px}

  /* ---------- pestaña Reporte (mockup A adaptado a la columna) ---------- */
  .repchips{display:flex;gap:7px;margin-bottom:10px}
  .rchip{flex:1;border:1px solid var(--stroke);background:var(--card);color:var(--txt-mut);
    font-family:inherit;font-size:11px;font-weight:600;cursor:pointer;padding:8px 4px;
    border-radius:12px;transition:.15s;display:flex;align-items:center;justify-content:center;gap:4px}
  .rchip:hover{color:var(--txt);border-color:var(--accent)}
  .rchip.on{background:var(--grad);border-color:transparent;color:var(--accent-ink)}
  .rchip .chev{font-size:9px;opacity:.7}
  /* héroe: el número grande con su veredicto en llano */
  .rp-big{font-size:34px;font-weight:800;letter-spacing:-1.2px;line-height:1.05;
    display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:2px}
  .rp-delta{font-size:12px;font-weight:700;padding:3px 11px;border-radius:20px}
  .rp-delta.good{background:rgba(64,184,105,.16);color:var(--ok)}
  .rp-delta.bad{background:rgba(240,90,65,.13);color:var(--bad)}
  .rp-delta.flat{background:var(--surface);color:var(--txt-dim)}
  .rp-nums{font-family:var(--mono);font-size:11.5px;color:var(--txt-mut);margin-top:8px}
  .rp-nums s{color:var(--txt-dim)}
  .rp-plain{font-size:12px;font-weight:600;line-height:1.5;margin-top:10px;
    background:var(--surface);border:1px solid var(--stroke-soft);
    border-radius:12px;padding:9px 12px}
  /* la traducción a $ SIEMPRE pegada al dato de tokens (maqueta de Oscar
     2026-08-06): tokens y dinero son el mismo hecho en dos monedas */
  .as-money{color:var(--teal);font-weight:700;font-family:var(--mono);font-size:.95em}
  .rp-dim{color:var(--txt-dim)}
  /* bloque VOLUMEN, separado del de eficiencia: son dos medidas distintas */
  .rp-vol{margin-top:12px;border-top:1px dashed var(--stroke);padding-top:11px}
  .rp-vol .vt{font-size:9.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;
    color:var(--txt-dim);margin-bottom:8px}
  .vol-row{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;
    font-size:12px;color:var(--txt-mut);line-height:1.55}
  .vol-row + .vol-row{margin-top:5px}
  .vol-row b{font-family:var(--mono);font-weight:700;color:var(--txt)}
  .vpill{font-size:10.5px;font-weight:700;color:var(--txt-dim);
    background:var(--surface);padding:2px 9px;border-radius:20px}
  .vpill.ok{color:var(--ok);background:rgba(64,184,105,.14)}
  .rp-contra{font-size:10.5px;color:var(--txt-dim);line-height:1.55;margin-top:10px}
  .rp-contra b{color:var(--txt-mut)}
  .rp-rule{display:flex;align-items:center;gap:9px;margin-top:11px;
    background:rgba(79,209,224,.10);border:1px solid rgba(79,209,224,.28);
    border-radius:12px;padding:8px 11px;font-size:10.5px;color:var(--txt-mut);line-height:1.5}
  .rp-rule .eq{font-family:var(--mono);font-weight:800;color:var(--teal);white-space:nowrap}
  /* gráfica: conmutador de unidad, leyenda y detalle al tocar */
  .unit-sw{display:flex;gap:3px;background:var(--card-hi);border:1px solid var(--stroke-soft);
    border-radius:11px;padding:3px}
  .usw{border:0;background:transparent;color:var(--txt-mut);cursor:pointer;
    font-family:var(--mono);font-size:9.5px;font-weight:700;padding:4px 9px;
    border-radius:8px;transition:.15s;white-space:nowrap;letter-spacing:0;text-transform:none}
  .usw.on{background:var(--grad);color:var(--accent-ink)}
  .rep-legend{display:flex;gap:12px;font-size:9.5px;color:var(--txt-dim);margin-bottom:2px}
  .rep-legend i{display:inline-block;vertical-align:middle;margin-right:5px}
  .rep-legend .l-line{width:14px;height:3px;border-radius:2px;
    background:linear-gradient(90deg,var(--accent),var(--teal))}
  .rep-legend .l-bar{width:9px;height:9px;border-radius:3px;background:rgba(124,140,255,.25)}
  #repChart .pt{cursor:pointer}
  .rep-det{margin-top:8px;background:var(--card-hi);border:1px solid var(--stroke-soft);
    border-radius:13px;padding:10px 12px;font-size:11.5px;line-height:1.6;color:var(--txt-mut)}
  .rep-det b{color:var(--txt)}
  .rep-det .tap{font-size:9.5px;color:var(--txt-dim);margin-top:3px}
  .rep-det .ok2{color:var(--ok)}.rep-det .wr2{color:var(--warn)}
  /* filas de "¿te duró más o menos?" */
  .rp-row{display:flex;gap:11px;align-items:flex-start;padding:9px 2px}
  .rp-row + .rp-row{border-top:1px solid var(--stroke-soft)}
  .rp-row .ic{position:relative;isolation:isolate;width:30px;height:30px;border-radius:10px;
    flex:0 0 auto;display:grid;place-items:center;color:var(--c)}
  .rp-row .ic i{position:absolute;inset:0;border-radius:inherit;background:var(--c);
    opacity:.14;z-index:-1}
  .rp-row .val{font-size:13px;font-weight:700}
  .rp-row .val em{font-style:normal;color:var(--teal)}
  .rp-row .was{font-family:var(--mono);font-size:9.5px;color:var(--txt-dim);margin-left:6px}
  .rp-row .say{font-size:10.5px;color:var(--txt-dim);line-height:1.5;margin-top:2px}
  .rep-note{font-size:10.5px;color:var(--txt-dim);margin:2px 0 6px}
  /* proyectos con flecha de tendencia (avatar/nombre: espejo de .pitem,
     que vive scoped y no llega hasta aquí) */
  .rp-pj{display:flex;align-items:center;gap:10px;padding:7px 2px}
  .rp-pj .pav{position:relative;isolation:isolate;width:30px;height:30px;border-radius:10px;
    display:grid;place-items:center;font-size:10.5px;font-weight:700;flex:0 0 auto}
  .rp-pj .pav i{position:absolute;inset:0;border-radius:inherit;opacity:.16;z-index:-1}
  .rp-pj .pname{font-size:12px;font-weight:600;display:flex;align-items:center;min-width:0}
  .rp-pj .pname>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rp-pj .ptx{flex:1 1 auto;min-width:0}
  .rp-pj .ptok{font-family:var(--mono);font-size:9.5px;color:var(--txt-dim);flex:0 0 auto}
  .rp-pj .amt{font-family:var(--mono);font-size:12px;font-weight:600;flex:0 0 auto}
  .rp-trend{flex:0 0 auto;min-width:24px;height:24px;border-radius:8px;display:grid;
    place-items:center;font-size:11px;font-weight:800;padding:0 5px}
  .rp-trend.up{color:var(--warn);background:rgba(240,170,60,.14)}
  .rp-trend.down{color:var(--ok);background:rgba(64,184,105,.14)}
  .rp-trend.flat{color:var(--txt-dim);background:var(--surface)}
  .rp-why{margin:0 2px 7px 42px;font-size:10.5px;color:var(--txt-mut);line-height:1.5;
    background:var(--surface);border:1px solid var(--stroke-soft);border-radius:10px;
    padding:7px 10px}
  /* antes/después de las marcas */
  .rp-fix{background:var(--card-hi);border:1px solid var(--stroke-soft);
    border-radius:var(--r-md);padding:12px;margin-bottom:8px}
  .rp-fix:last-child{margin-bottom:0}
  .rp-fix .when{font-family:var(--mono);font-size:9.5px;color:var(--txt-dim)}
  .rp-fix .did{font-size:12px;font-weight:700;line-height:1.4;margin:3px 0 9px}
  .rp-ba{display:flex;align-items:center;gap:8px}
  .rp-ba .cell{flex:1;text-align:center;border-radius:10px;padding:8px 4px;
    background:var(--surface);border:1px solid var(--stroke-soft)}
  .rp-ba .cell .n{font-family:var(--mono);font-size:13.5px;font-weight:700}
  .rp-ba .cell .l{font-size:8.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;
    color:var(--txt-dim);margin-top:2px}
  .rp-ba .after{background:rgba(64,184,105,.10);border-color:rgba(64,184,105,.3)}
  .rp-ba .after .n{color:var(--ok)}
  .rp-ba .arr{color:var(--txt-dim);flex:0 0 auto}
  .rp-fix .est{font-size:10px;color:var(--txt-dim);line-height:1.5;margin-top:8px}
  /* acciones de "para los días que vienen" */
  .rp-act{display:flex;gap:11px;align-items:flex-start;background:var(--surface);
    border:1px solid var(--stroke-soft);border-radius:var(--r-md);
    padding:11px 12px;margin-bottom:8px}
  .rp-act:last-child{margin-bottom:0}
  .rp-act .n{width:22px;height:22px;border-radius:8px;flex:0 0 auto;display:grid;
    place-items:center;background:var(--grad);color:var(--accent-ink);
    font-size:11px;font-weight:800}
  .rp-act .t{font-size:12px;font-weight:650;line-height:1.45}
  .rp-act .t small{display:block;font-size:10.5px;font-weight:500;color:var(--txt-mut);
    margin-top:4px;line-height:1.5}
  .rp-act .t small.meta{font-size:9.5px;color:var(--txt-dim)}
  .rp-empty{font-size:11px;color:var(--txt-dim);line-height:1.55;padding:4px 2px}
  #repChart svg{display:block;width:100%;height:auto}
  /* desperdicio estructural (pestaña Reporte). El "al menos" pequeño y el
     % grande; la barra de proporción con el resto en gris NEUTRO (no es
     "trabajo demostrado", solo lo no señalado). */
  .wst-big{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
  .wst-big .al{font-size:11px;color:var(--txt-mut);font-weight:600}
  .wst-big b{font-family:var(--disp);font-size:26px;letter-spacing:-.8px}
  .wst-cmp{font-size:10.5px;font-family:var(--mono);margin-left:auto}
  .wst-cmp.good{color:var(--teal)}
  .wst-cmp.bad{color:var(--warn)}
  .wst-cmp.flat{color:var(--txt-dim)}
  .wst-sub{font-size:11px;color:var(--txt-mut);line-height:1.5;margin-top:3px}
  .wst-bar{display:flex;height:10px;border-radius:999px;overflow:hidden;gap:2px;margin-top:9px}
  .wst-bar i{height:100%}
  .wst-bar .rest{flex:1;background:var(--track)}
  .wst-money{font-family:var(--mono);font-size:10.5px;color:var(--txt-dim);margin-top:6px}
  .wst-rows{margin-top:9px}
  .wst-row{display:flex;align-items:center;gap:8px;padding:7px 9px;margin-bottom:6px;
    background:var(--surface);border:1px solid var(--stroke-soft);border-radius:var(--r-sm);
    cursor:pointer;font-size:11px}
  .wst-row:hover{border-color:var(--accent-line)}
  .wst-row .dotc{width:8px;height:8px;border-radius:3px;flex:0 0 auto}
  .wst-row .wl{flex:1 1 auto;min-width:0;line-height:1.4}
  .wst-row b{font-family:var(--mono);font-size:11px;flex:0 0 auto}
  .wst-note{font-size:10px;color:var(--txt-dim);line-height:1.5;margin-top:8px;
    border-top:1px dashed var(--stroke-soft);padding-top:8px}
  .wst-none{font-size:11px;line-height:1.55}
  .wst-none b{font-weight:700}
  .wst-none div{color:var(--txt-mut);margin-top:3px}
  .wst-see7{margin-left:6px;font-size:10.5px;color:var(--accent);background:var(--accent-weak);
    border:1px solid var(--accent-line);border-radius:8px;padding:3px 8px;cursor:pointer}
  /* aviso de cobertura (pieza 2): alguien tocó los logs y la comparación
     deja de ser concluyente. Ámbar, discreto y descartable con la vista —
     nunca un modal (regla del ADR). */
  .rp-cov{display:flex;gap:9px;align-items:flex-start;background:rgba(242,180,67,.12);
    border:1px solid rgba(242,180,67,.3);border-radius:var(--r-md);padding:9px 11px;
    margin-bottom:10px;font-size:11px;line-height:1.5}
  .rp-cov .i{flex:0 0 auto;width:16px;height:16px;border-radius:50%;display:grid;
    place-items:center;background:var(--warn);color:#1a1305;font-weight:800;font-size:11px}
  .rp-cov b{color:var(--txt)}
  .rp-cov .s{color:var(--txt-dim);font-size:10px;margin-top:3px}
  /* guía plazo × automático de la purga */
  .prg-guide{width:100%;border-collapse:collapse;font-size:10.5px;margin:6px 0 10px;
    line-height:1.45}
  .prg-guide th{text-align:left;font-weight:700;color:var(--txt-mut);font-size:9.5px;
    letter-spacing:.6px;text-transform:uppercase;padding:4px 6px 5px;
    border-bottom:1px solid var(--stroke)}
  .prg-guide td{padding:6px;vertical-align:top;border-bottom:1px solid var(--stroke-soft);
    color:var(--txt-mut)}
  .prg-guide td:first-child{white-space:nowrap;color:var(--txt);font-weight:600}
  .prg-guide td:nth-child(2){white-space:nowrap;font-family:var(--mono);font-size:10px}
  .prg-guide tr:last-child td{border-bottom:0}
</style>
</head>
<body>
<div class="panel">
  <div class="p-top">
  <!-- Aviso de versión nueva. Va en la cabecera fija para que se vea desde
       cualquier pestaña: enterrado en Preferencias no lo encuentra nadie. -->
  <div id="updBar" hidden style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    background:var(--accent-weak);border:1px solid var(--accent-line);border-radius:8px;
    padding:7px 10px;margin-bottom:9px;font-size:11px">
    <span id="updMsg" style="flex:1 1 auto;min-width:0"></span>
    <button id="updBtn"></button>
  </div>
  <!-- El estado va en su PROPIA línea, a todo el ancho (Oscar 2026-08-05):
       encajado junto al título se recortaba, y los mensajes de error largos
       ("La API limitó las peticiones…") son justo los que hay que leer
       enteros. El id de arrastre pasa al envoltorio para no perder la zona
       de agarre. -->
  <div id="pHead">
    <div class="p-head">
      <span class="avatar"><span class="mark" id="mark"></span></span>
      <div class="p-htext">
        <div class="p-title">MichiClaude</div>
      </div>
      <span class="plan" id="planTag">—</span>
      <button class="xbtn" id="themeBtn">◐</button>
      <button class="xbtn" id="hideBtn">✕</button>
    </div>
    <div class="p-sub" id="syncLine"><span class="live" id="liveDot"></span><span id="syncTxt"></span></div>
  </div>

  <div class="tabs">
    <button class="tab on" data-tab="main" data-i18n="tab_main"></button>
    <button class="tab" data-tab="sources" data-i18n="sources_title"></button>
    <button class="tab" data-tab="findings"><span data-i18n="fnd_tab"></span><span class="tdot" id="fndTabDot" hidden></span></button>
    <button class="tab" data-tab="tips"><span data-i18n="tips_tab"></span><span class="tdot acc" id="tipsTabDot" hidden></span></button>
    <button class="tab" data-tab="report" data-i18n="rep_tab"></button>
    <button class="tab" data-tab="prefs" data-i18n="prefs_title"></button>
  </div>
  </div><!-- /p-top -->

  <div id="tab-main">

  <div class="sect" id="welcomeBox">
    <div class="w-new">
      <div class="eyebrow" data-i18n="setup_title"></div>
      <p class="setup-p" data-i18n="setup_body"></p>
      <ol class="setup-steps">
        <li data-i18n="setup_s1"></li>
        <li data-i18n="setup_s2"></li>
        <li data-i18n="setup_s3"></li>
      </ol>
      <div class="setup-url">claude.com/claude-code</div>
      <p class="setup-note" data-i18n="setup_remote"></p>
      <p class="setup-note" data-i18n="setup_free"></p>
    </div>
    <div class="w-expired">
      <div class="eyebrow" data-i18n="setup_expired_title"></div>
      <p class="setup-p" data-i18n="setup_expired"></p>
    </div>
  </div>

  <div class="sect hero-sect">
    <div class="eyebrow"><span data-i18n="quota_title"></span> <span class="q" id="remQ"></span></div>
    <div class="hero">
      <div class="gauge">
        <svg viewBox="0 0 132 78">
          <path d="M 14 72 A 52 52 0 0 1 118 72" fill="none" stroke="var(--track)" stroke-width="11" stroke-linecap="round"/>
          <path id="gFill" d="M 14 72 A 52 52 0 0 1 118 72" fill="none" stroke="var(--ok)" stroke-width="11"
                stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/>
        </svg>
        <div class="g-val" id="sesVal">–</div>
        <div class="g-cap" data-i18n="session_cap"></div>
        <div class="g-reset" id="sesReset"></div>
      </div>
      <div class="stack" id="weekStack"><!-- barras semanales dinámicas --></div>
    </div>
    <!-- "A este ritmo" UNIFICADO dentro del hero (maqueta v5): el chip de
         arriba resume y esta caja explica — antes eran dos tarjetas
         diciendo lo mismo. Ids y lógica intactos (renderProjection). -->
    <div id="projSect" hidden style="margin-top:13px;position:relative">
      <div class="proj calm" id="proj">
        <span class="p-ic i-ok"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 12.5l3 3L17 9"/></svg></span>
        <span class="p-ic i-warn"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M13 2L4.9 12.5H11L9.5 22 19 10.5h-6L13 2z"/></svg></span>
        <div>
          <div class="ptxt" id="projTxt"></div>
          <div class="rate" id="rateTxt"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="sect">
    <div class="eyebrow"><span data-i18n="spend_title"></span></div>
    <!-- Controles en su PROPIA fila y alineados a la izquierda (Oscar
         2026-08-05): colgados del título se descolocaban al pasar a dos
         líneas y "costo estimado" quedaba flotando a media altura. -->
    <div class="spendbar">
      <button class="trig" id="projBtn" data-i18n-title="pf_title">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/></svg>
        <span class="chev">⌄</span>
        <span class="tbadge" id="projBadge" hidden>0</span>
      </button>
      <button class="trig" id="calBtn" data-i18n-title="cal_open">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        <span id="calLbl">—</span>
        <span class="chev">⌄</span>
      </button>
      <span class="sb-est">· <span data-i18n="spend_q" data-i18n-title="spend_tip" style="cursor:help;border-bottom:1px dotted var(--txt-dim)"></span><span id="priceWarn" hidden style="cursor:pointer;color:var(--warn);margin-left:5px">&#9888;</span></span>
    </div>
    <!-- TOTAL del periodo: caja propia con la nota de privacidad al lado
         (maqueta de Oscar). Sustituye al pie "Hoy" del final del panel,
         que decía lo mismo cuando el periodo ya era hoy. -->
    <div class="spendtot" id="winTot">
      <div class="st-l">
        <div class="st-lbl" id="winLbl"></div>
        <b id="costWeek">–</b>
      </div>
      <div class="foot-note" data-i18n="footnote"></div>
    </div>
    <!-- El filtro activo, desmontable pieza a pieza: quién está dentro se
         ve sin abrir el popover (maqueta de Oscar 2026-08-05). -->
    <div class="fchips" id="fchips" hidden></div>
    <div class="plist" id="plist"></div>
    <div class="cfg-note" style="margin:8px 0 0" data-i18n="spend_only_cc"></div>
    <!-- Con rango, las máquinas del hub quedan fuera (sus fotos son de
         ventanas que terminan hoy). Callarlo sería enseñar un total
         incompleto sin avisar. -->
    <div class="hubnote" id="hubNote" hidden data-i18n="hub_range_note"></div>
  </div>

  <div class="sect" id="modelSect" hidden>
    <div class="eyebrow"><span data-i18n="model_title"></span> <span class="q" id="modelQ"></span></div>
    <div class="split" id="split"></div>
    <div class="legend" id="legend"></div>
  </div>

  <div class="sect" id="trendSect" hidden>
    <div class="eyebrow"><span data-i18n="trend_title"></span> <span class="q" data-i18n="trend_q"></span></div>
    <div class="tchart" id="tchart"></div>
    <div class="tspan"><span id="tFrom"></span><span id="tTo"></span></div>
  </div>

  </div><!-- /tab-main -->

  <div id="tab-sources" hidden>
  <!-- Las cuatro fuentes como TARJETAS con icono (maqueta v5): la lista de
       viñetas se leía como letra pequeña y estas se entienden de un vistazo.
       Los textos salen del diccionario (src1..4), los iconos son fijos. -->
  <div class="srcgrid" id="cfgSect">
    <div class="srccard">
      <span class="ic" style="color:var(--accent);--b:var(--accent)"><i></i>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></span>
      <b data-i18n="src1_t"></b>
      <p data-i18n="src1_d"></p>
    </div>
    <div class="srccard">
      <span class="ic" style="color:var(--teal);--b:var(--teal)"><i></i>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.7 3.8 9S14.5 18.4 12 21c-2.5-2.6-3.8-5.7-3.8-9S9.5 5.6 12 3z"/></svg></span>
      <b data-i18n="src2_t"></b>
      <p data-i18n="src2_d"></p>
    </div>
    <div class="srccard">
      <span class="ic" style="color:var(--warn);--b:var(--warn)"><i></i>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg></span>
      <b data-i18n="src3_t"></b>
      <p data-i18n="src3_d"></p>
    </div>
    <div class="srccard">
      <span class="ic" style="color:var(--ok);--b:var(--ok)"><i></i>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="3" width="20" height="7" rx="2"/><rect x="2" y="14" width="20" height="7" rx="2"/><path d="M6 6.5h.01M6 17.5h.01"/></svg></span>
      <b data-i18n="src4_t"></b>
      <p data-i18n="src4_d"></p>
    </div>
  </div>
  <div class="sect">
    <div class="eyebrow" data-i18n="srv_add_title"></div>
    <div class="cfg-form">
      <div class="fld">
        <label for="rName" data-i18n="lbl_name"></label>
        <input id="rName" data-i18n-ph="ph_name">
        <div class="fhint" data-i18n="hint_name"></div>
      </div>
      <div class="fld">
        <label for="rHost" data-i18n="lbl_host"></label>
        <input id="rHost" class="mono" data-i18n-ph="ph_host">
      </div>
      <!-- El comando propio es la salida de emergencia para un servidor raro
           (otro binario de Python, un contenedor). Nace OCULTO y solo sale si
           la instalación automática falla: enseñárselo a todo el mundo hace
           que un campo que sobra el 99% de las veces parezca obligatorio
           (2026-07-29). -->
      <div class="fld" id="rPyBox" hidden>

<script>
// ---------- helpers ----------
const $=id=>document.getElementById(id);
// ---------- bitácora del flujo (diagnóstico, pedido de Oscar 2026-08-02) ----------
// Registro local con hora de cada activación (pushes, tarjetas del coach,
// escaneos, globos): reconstruir "qué se disparó y cuándo" con datos en vez
// de capturas y memoria. Tope 300 renglones; el botón 📜 (solo dev) la
// copia al portapapeles. No viaja a ningún lado.
function flog(ev){
  try{
    const a=JSON.parse(localStorage.getItem("flowLog")||"[]");
    a.push(new Date().toISOString().slice(5,19).replace("T"," ")+" · "+ev);
    localStorage.setItem("flowLog", JSON.stringify(a.slice(-300)));
  }catch(_){}
}

  rep_foot:"Generated by MichiClaude from your local data. $ amounts are estimates at API-equivalent prices — on a subscription you don't pay per token. Nothing leaves your machine.",

  fnd_intro:"Structural leaks found in your logs, with their measured cost. Nothing is applied automatically — you decide.",
