<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Claude Code Meter</title>
<style>
  :root{
    --font:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
    --mono:"Cascadia Code",ui-monospace,"Consolas",monospace;
    --mica:rgba(30,33,40,.96);
    --surface:rgba(255,255,255,.045);
    --stroke:rgba(255,255,255,.09);
    --stroke-soft:rgba(255,255,255,.055);
    --txt:#e9ebef; --txt-mut:#969ba6; --txt-dim:#6c717c;
    --brand:#d97757; --accent:#56c7d6;
    --ok:#40b869; --warn:#e6a417; --bad:#f05a41;
    --track:rgba(255,255,255,.08);
  }
  body.light{
    --mica:rgba(243,244,247,.98);
    --surface:rgba(0,0,0,.035);
    --stroke:rgba(0,0,0,.1);
    --stroke-soft:rgba(0,0,0,.06);
    --txt:#1b1e24; --txt-mut:#575d68; --txt-dim:#8a909b;
    --track:rgba(0,0,0,.09);
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:transparent;height:100%}
  body{font-family:var(--font);color:var(--txt);padding:8px;overflow:hidden}
  /* si el contenido crece (ajustes abiertos), el panel hace scroll interno */
  .panel{max-height:calc(100vh - 16px);overflow-y:auto;scrollbar-width:thin}

  .panel{
    background:var(--mica);border-radius:14px;
    box-shadow:0 24px 60px -12px rgba(0,0,0,.7),0 0 0 1px var(--stroke);
    padding:15px 15px 13px;
  }
  body.light .panel{box-shadow:0 24px 60px -14px rgba(30,40,60,.35),0 0 0 1px var(--stroke)}
  .p-head{display:flex;align-items:center;gap:10px;margin-bottom:13px;
    cursor:grab;user-select:none;-webkit-user-select:none}
  .p-head:active{cursor:grabbing}
  .p-head button{cursor:pointer}
  .p-head .mark{width:22px;height:22px;flex:0 0 auto}
  .p-htext{min-width:0;flex:1 1 auto}
  .p-title{font-size:13.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .p-sub{font-size:11px;color:var(--txt-dim);font-family:var(--mono);margin-top:1px;
    display:flex;align-items:center;gap:6px;transition:opacity .2s;
    min-width:0;white-space:normal;overflow-wrap:anywhere}
  .p-sub #syncTxt{min-width:0;overflow-wrap:anywhere}
  .p-sub .live{flex:0 0 auto}
  .live{width:7px;height:7px;border-radius:50%;background:var(--ok);
    box-shadow:0 0 0 0 rgba(64,184,105,.6);animation:pulse 2.4s infinite}
  .live.err{background:var(--bad);animation:none}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(64,184,105,.5)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
  .plan{margin-left:auto;flex:0 0 auto;font-size:10.5px;font-weight:650;letter-spacing:.4px;
    color:var(--accent);background:rgba(86,199,214,.14);
    border:1px solid rgba(86,199,214,.35);padding:3px 8px;border-radius:7px}
  .xbtn{margin-left:8px;width:24px;height:24px;border-radius:6px;border:0;cursor:pointer;
    background:transparent;color:var(--txt-mut);font-size:14px;line-height:1}
  .xbtn:hover{background:var(--surface);color:var(--txt)}
  .p-head .xbtn{margin-left:4px}

  .sect{border-top:1px solid var(--stroke-soft);padding-top:11px;margin-top:11px}
  .sect:first-of-type{border-top:0;margin-top:0;padding-top:0}
  .eyebrow{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--txt-dim);
    font-weight:700;margin-bottom:9px;display:flex;justify-content:space-between;align-items:center}
  .eyebrow .q{font-family:var(--mono);letter-spacing:0;text-transform:none;
    color:var(--txt-mut);font-weight:500;font-size:11px}

  .hero{display:flex;gap:14px;align-items:center}
  .gauge{width:132px;flex:0 0 auto;position:relative;text-align:center}
  .gauge svg{width:132px;height:78px;display:block}
  .g-val{position:absolute;left:0;right:0;top:38px;font-family:var(--mono);font-weight:700;
    font-size:23px;letter-spacing:.5px}
  .g-cap{position:absolute;left:0;right:0;top:64px;font-size:10px;color:var(--txt-dim)}
  .g-reset{font-family:var(--mono);font-size:11px;color:var(--txt-mut);margin-top:2px}

  .stack{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
  .bar-row .brow-top{display:flex;justify-content:space-between;align-items:baseline;
    gap:8px;min-width:0;font-size:11.5px;margin-bottom:5px}
  .bar-row .brow-top.wrap{flex-wrap:wrap;gap:2px 8px}
  .bar-row .brow-top.wrap .rst{white-space:normal;min-width:0;margin-left:0}
  .bar-row .lbl{color:var(--txt-mut);flex:1 1 auto;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar-row .lbl b{color:var(--txt);font-weight:600}
  .bar-row .rst{font-family:var(--mono);font-size:10.5px;color:var(--txt-dim);flex:0 1 auto;margin-left:8px}
  .track{position:relative;height:9px;border-radius:6px;background:var(--track);overflow:hidden}
  .mini .track{height:6px}
  .fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px;transition:width .6s,background .3s}
  .pace{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--txt);opacity:.85}

  .proj{display:flex;gap:11px;align-items:flex-start;border-radius:10px;padding:10px 12px;
    background:rgba(230,164,23,.12);border:1px solid rgba(230,164,23,.32)}
  .proj.calm{background:rgba(64,184,105,.11);border-color:rgba(64,184,105,.3)}
  .proj .ptxt{font-size:12px;line-height:1.42}
  .proj .rate{font-family:var(--mono);font-size:10.5px;color:var(--txt-mut);margin-top:3px}

  .plist{display:flex;flex-direction:column;gap:8px}
  .pitem{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
  .pitem .pname{font-size:12px;display:flex;align-items:center;gap:7px;min-width:0}
  .pitem .swatch{width:8px;height:8px;border-radius:2px;flex:0 0 auto}
  .pitem .pname span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pitem .pcost{font-family:var(--mono);font-size:12px;font-weight:600}
  .pitem .pbar{grid-column:1/-1;height:5px;border-radius:4px;background:var(--track);overflow:hidden}
  .pitem .pbar i{display:block;height:100%;border-radius:4px}
  .pitem.other{margin-top:2px;padding-top:8px;border-top:1px dashed var(--stroke-soft);cursor:help}
  .pitem.other .pname span:last-child{color:var(--txt-mut);font-style:italic}
  .pitem.other .pcost{color:var(--txt-mut);font-weight:500}

  .split{height:11px;border-radius:6px;overflow:hidden;display:flex;border:1px solid var(--stroke-soft)}
  .legend{display:flex;gap:14px;margin-top:8px;flex-wrap:wrap}
  .legend span{font-size:11px;color:var(--txt-mut);display:flex;align-items:center;gap:6px}
  .legend b{width:8px;height:8px;border-radius:2px;display:inline-block}

  .p-foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;
    padding-top:10px;border-top:1px solid var(--stroke-soft)}
  .totals{display:flex;gap:16px}
  .totals .t{font-size:10px;color:var(--txt-dim);text-transform:uppercase;letter-spacing:.6px}
  .totals .t b{display:block;font-family:var(--mono);font-size:15px;color:var(--txt);margin-top:2px}
  .foot-note{font-size:10px;color:var(--txt-dim);max-width:160px;text-align:right;line-height:1.35}
  .errbox{font-size:11.5px;color:var(--warn);line-height:1.4;padding:6px 0}

  /* ajustes (fuentes de datos) */
  .cfg-note{font-size:11px;color:var(--txt-mut);line-height:1.5;margin-bottom:9px}
  .cfg-note b{color:var(--txt);font-weight:600}
  .cfg-form{display:flex;flex-direction:column;gap:6px;margin-top:9px}
  .cfg-form input{background:var(--surface);border:1px solid var(--stroke);border-radius:7px;
    padding:6px 9px;color:var(--txt);font-family:var(--mono);font-size:11px;outline:none}
  .cfg-form input:focus{border-color:var(--accent)}
  .cfg-form button{align-self:flex-start;background:rgba(86,199,214,.14);color:var(--accent);
    border:1px solid rgba(86,199,214,.35);border-radius:7px;padding:6px 12px;
    font-size:11.5px;cursor:pointer;font-family:var(--font)}
  .cfg-form button:hover{background:rgba(86,199,214,.22)}
  #rMsg{font-size:11px;color:var(--txt-mut);font-family:var(--mono)}
  #remList .pitem{grid-template-columns:1fr auto}
  .cfg-row{display:flex;align-items:center;gap:8px;margin-top:11px;padding-top:10px;
    border-top:1px dashed var(--stroke-soft);font-size:11px;color:var(--txt-mut)}
  .cfg-row select{background:var(--surface);border:1px solid var(--stroke);border-radius:7px;
    padding:4px 8px;color:var(--txt);font-family:var(--font);font-size:11.5px;outline:none}
</style>
</head>
<body>
<div class="panel">
  <div class="p-head" id="pHead">
    <span class="mark" id="mark"></span>
    <div class="p-htext">
      <div class="p-title">Claude Code Meter</div>
      <div class="p-sub" id="syncLine"><span class="live" id="liveDot"></span><span id="syncTxt"></span></div>
    </div>
    <span class="plan" id="planTag">—</span>
    <button class="xbtn" id="themeBtn">◐</button>
    <button class="xbtn" id="cfgBtn">⚙</button>
    <button class="xbtn" id="hideBtn">✕</button>
  </div>

  <div class="sect">
    <div class="eyebrow"><span data-i18n="quota_title"></span> <span class="q" id="remQ"></span></div>
    <div class="hero">
      <div class="gauge">
        <svg viewBox="0 0 132 78">
          <path d="M 14 72 A 52 52 0 0 1 118 72" fill="none" stroke="var(--track)" stroke-width="11" stroke-linecap="round"/>
          <path id="gFill" d="M 14 72 A 52 52 0 0 1 118 72" fill="none" stroke="var(--ok)" stroke-width="11"
                stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/>
        </svg>
        <div class="g-val" id="sesVal">–</div>
        <div class="g-cap" data-i18n="session_cap"></div>
        <div class="g-reset" id="sesReset"></div>
      </div>
      <div class="stack" id="weekStack"><!-- barras semanales dinámicas --></div>
    </div>
  </div>

  <div class="sect" id="projSect" hidden>
    <div class="eyebrow" data-i18n="at_this_rate"></div>
    <div class="proj calm" id="proj">
      <div>
        <div class="ptxt" id="projTxt"></div>
        <div class="rate" id="rateTxt"></div>
      </div>
    </div>
  </div>

  <div class="sect">
    <div class="eyebrow"><span data-i18n="spend_title"></span> <span class="q" data-i18n="spend_q"></span></div>
    <div class="plist" id="plist"></div>
  </div>

  <div class="sect" id="modelSect" hidden>
    <div class="eyebrow"><span data-i18n="model_title"></span> <span class="q" id="modelQ"></span></div>
    <div class="split" id="split"></div>
    <div class="legend" id="legend"></div>
  </div>

  <div class="sect" id="cfgSect" hidden>
    <div class="eyebrow" data-i18n="sources_title"></div>
    <div class="cfg-note" data-i18n-html="cfg_note"></div>
    <div class="plist" id="remList"></div>
    <div class="cfg-form">
      <input id="rName" data-i18n-ph="ph_name">
      <input id="rHost" data-i18n-ph="ph_host">
      <input id="rCmd" value="python3 /opt/projects/claude-code-meter/scripts/meter-export.py">
      <button id="rAdd" data-i18n="btn_test"></button>
      <span id="rMsg"></span>
    </div>
    <div class="cfg-row">
      <span data-i18n="lang_label"></span>
      <select id="langSel">
        <option value="en">English</option>
        <option value="es">Español</option>
      </select>
    </div>
  </div>

  <div class="p-foot">
    <div class="totals">
      <div class="t"><span data-i18n="today"></span><b id="costToday">–</b></div>
      <div class="t"><span data-i18n="week"></span><b id="costWeek">–</b></div>
    </div>
    <div class="foot-note" data-i18n="footnote"></div>
  </div>
</div>

<script>
// ---------- helpers ----------
const $=id=>document.getElementById(id);
function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>(
  {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

// ---------- i18n (default: English; Spanish included) ----------
const I18N={
en:{
  connecting:"connecting…",
  live_ago:s=>`live · updated ${s}s ago`,
  quota_title:"How much you have left",
  session_cap:"SESSION · 5 H",
  reset_now:"resets now",
  reset_in:(h,m)=>h?`resets in ${h} h ${m} min`:`resets in ${m} min`,
  on_track:"on track",
  ahead_clock:"you're outpacing the clock",
  session_label:"Session · 5 h",
  weekly_all:"Weekly · all models",
  weekly_x:m=>`Weekly · ${m}`,
  pace_ok:"pace under the clock · cruising",
  pace_watch:"watch your pace",
  no_buckets:"No weekly buckets in the response.",
  at_this_rate:"At this rate",
  proj_hit:(d,r)=>`You'll hit <b>100% of the session in ~${d}</b>, before the reset (${r}). Slow down or switch models.`,
  proj_ok_rate:"You're fine. At the current rate <b>you'll reach the reset without running out</b>.",
  proj_ahead:"Your usage is <b>ahead of the clock</b>: slow down or you may hit the limit.",
  proj_behind:"You're fine. Your usage is <b>behind the clock</b> for this period.",
  burn:r=>`current burn · ${r}%/min`,
  spend_title:"Spend by project",
  spend_q:"7 days · API-equiv.",
  reading:"reading ~/.claude…",
  no_activity:"No Claude Code activity in the last 7 days.",
  others:n=>`others (${n})`,
  claudeai_row:"claude.ai / others",
  pct_quota:p=>`${p}% quota`,
  claudeai_tip:"Estimate. claude.ai chats and usage on other devices leave no local logs on this machine. This row shows the % of your global weekly limit consumed across all surfaces; the per-project spend above only covers Claude Code here. Not converted to dollars because the endpoint does not expose the cap in $.",
  model_title:"Top model",
  model_leads:m=>`${m} leads`,
  unknown_model:"unknown",
  today:"Today", week:"Week",
  footnote:"Local data + real quota. Nothing leaves your machine except to api.anthropic.com",
  sources_title:"Data sources",
  cfg_note:"<b>This PC</b>: automatic (Claude Code logs). · <b>claude.ai</b>: automatic via your account quota. · <b>Servers</b>: add them here over SSH (same key you use to connect); their projects show up as \"name · server\".",
  ph_name:"short name (e.g. vps)",
  ph_host:"SSH host (~/.ssh/config alias or user@ip)",
  btn_test:"Test & add",
  msg_no_host:"missing SSH host",
  msg_testing:"testing connection…",
  msg_added:"✓ connected & saved",
  no_servers:"No servers added.",
  remove_server:"Remove this server",
  hide_title:"Hide to tray",
  cfg_title:"Data sources (SSH servers)",
  theme_title:"Light/dark theme",
  lang_label:"Language",
  plan_sub:"Subscription",
  notif_hi:p=>`Session at ${p}% — almost exhausted. Consider pausing or switching models.`,
  notif_lo:p=>`Session at ${p}% of your 5 h limit.`,
  tray_tip:(s,r,w)=>`Session ${s}%${r?` · ${r}`:""}${w!=null?` · Weekly ${w}%`:""}`,
  tray_no_data:"Claude Code Meter — no quota data",
  demo_mode:"demo mode (no Tauri)",
  err_no_token:"No valid token. Use Claude Code on this PC (any prompt) or on a server from your data sources to refresh it.",
  err_expired:"Token expired. Open Claude Code (any prompt) to refresh it.",
  err_rate:m=>`API rate-limited (429). Retrying in ${m} min — your quota is not affected.`,
  err_net:"No connection to the API.",
  err_api:s=>`The API returned ${s}.`,
  err_bad:"Unreadable API response."
},
es:{
  connecting:"conectando…",
  live_ago:s=>`en vivo · actualizado hace ${s}s`,
  quota_title:"Cuánto te queda",
  session_cap:"SESIÓN · 5 H",
  reset_now:"reset ya",
  reset_in:(h,m)=>h?`reset en ${h} h ${m} min`:`reset en ${m} min`,
  on_track:"dentro de lo previsto",
  ahead_clock:"vas más rápido que el reloj",
  session_label:"Sesión · 5 h",
  weekly_all:"Semanal · todos los modelos",
  weekly_x:m=>`Semanal · ${m}`,
  pace_ok:"ritmo bajo el reloj · vas holgado",
  pace_watch:"ojo al ritmo",
  no_buckets:"Sin buckets semanales en la respuesta.",
  at_this_rate:"A este ritmo",
  proj_hit:(d,r)=>`Llegas al <b>100% de la sesión en ~${d}</b>, antes del reset (${r}). Baja el ritmo o cambia de modelo.`,
  proj_ok_rate:"Vas al día. Al ritmo actual <b>llegas al reset sin agotar</b> la sesión.",
  proj_ahead:"Tu uso va <b>por delante del reloj</b>: consume más lento o podrías toparte con el límite.",
  proj_behind:"Vas al día. Tu consumo va <b>por detrás del reloj</b> del periodo.",
  burn:r=>`quema actual · ${r}%/min`,
  spend_title:"Gasto por proyecto",
  spend_q:"7 días · equiv. API",
  reading:"leyendo ~/.claude…",
  no_activity:"Sin actividad de Claude Code en los últimos 7 días.",
  others:n=>`otros (${n})`,
  claudeai_row:"claude.ai / otros",
  pct_quota:p=>`${p}% cuota`,
  claudeai_tip:"Estimación. Los chats de claude.ai y el uso en otros dispositivos no dejan registro local en este equipo. Esta fila muestra el % de tu límite semanal consumido en total (todas las superficies); el gasto por proyecto de arriba solo cubre Claude Code aquí. No se convierte a dólares porque el endpoint no expone el tope en $.",
  model_title:"Modelo más usado",
  model_leads:m=>`${m} lidera`,
  unknown_model:"desconocido",
  today:"Hoy", week:"Semana",
  footnote:"Datos locales + cuota real. Nada sale de tu equipo salvo hacia api.anthropic.com",
  sources_title:"Fuentes de datos",
  cfg_note:"<b>Este PC</b>: automático (logs de Claude Code). · <b>claude.ai</b>: automático vía la cuota de tu cuenta. · <b>Servidores</b>: agrégalos aquí por SSH (misma llave que usas para conectarte); sus proyectos aparecen como \"nombre · servidor\".",
  ph_name:"nombre corto (ej. vps)",
  ph_host:"host SSH (alias de ~/.ssh/config o usuario@ip)",
  btn_test:"Probar y agregar",
  msg_no_host:"falta el host SSH",
  msg_testing:"probando conexión…",
  msg_added:"✓ conectado y guardado",
  no_servers:"Sin servidores agregados.",
  remove_server:"Quitar este servidor",
  hide_title:"Ocultar a la bandeja",
  cfg_title:"Fuentes de datos (servidores SSH)",
  theme_title:"Tema claro/oscuro",
  lang_label:"Idioma",
  plan_sub:"Suscripción",
  notif_hi:p=>`Sesión al ${p}% — casi agotada. Considera parar o cambiar de modelo.`,
  notif_lo:p=>`Sesión al ${p}% de tu límite de 5 h.`,
  tray_tip:(s,r,w)=>`Sesión ${s}%${r?` · ${r}`:""}${w!=null?` · Semanal ${w}%`:""}`,
  tray_no_data:"Claude Code Meter — sin datos de cuota",
  demo_mode:"modo demo (sin Tauri)",
  err_no_token:"Sin token vigente. Usa Claude Code en este PC (cualquier consulta) o en un servidor de tus fuentes para refrescarlo.",
  err_expired:"Token expirado. Abre Claude Code (cualquier consulta) para refrescarlo.",
  err_rate:m=>`La API limitó las peticiones (429). Reintento en ${m} min — tu cuota no se ve afectada.`,
  err_net:"Sin conexión con la API.",
  err_api:s=>`La API respondió ${s}.`,
  err_bad:"Respuesta de la API ilegible."
}};

let lang = localStorage.getItem("lang") || (String(navigator.language||"").toLowerCase().startsWith("es")?"es":"en");
if(!I18N[lang]) lang="en";
function t(key,...a){
  const v=(I18N[lang]&&I18N[lang][key])??I18N.en[key];
  return typeof v==="function"?v(...a):(v??key);
}
function applyI18n(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-i18n]").forEach(el=>{ el.textContent=t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-html]").forEach(el=>{ el.innerHTML=t(el.dataset.i18nHtml); });
  document.querySelectorAll("[data-i18n-ph]").forEach(el=>{ el.placeholder=t(el.dataset.i18nPh); });
  $("hideBtn").title=t("hide_title"); $("cfgBtn").title=t("cfg_title"); $("themeBtn").title=t("theme_title");
  $("langSel").value=lang;
}

// Traducción de códigos de error del backend (ERR_*)
function errText(code){
  code=String(code);
  if(code.startsWith("ERR_RATE_LIMITED")) return t("err_rate", +code.split(":")[1]||3);
  if(code.startsWith("ERR_API")) return t("err_api", code.split(":")[1]||"?");
  const map={ERR_NO_TOKEN:"err_no_token",ERR_TOKEN_EXPIRED:"err_expired",
             ERR_NET:"err_net",ERR_BAD_RESPONSE:"err_bad"};
  return map[code]?t(map[code]):code;
}

// ---------- tema (persistido) ----------
if(localStorage.getItem("theme")==="light") document.body.classList.add("light");
$("themeBtn").addEventListener("click",()=>{
  const light=document.body.classList.toggle("light");
  localStorage.setItem("theme", light?"light":"dark");
});

// ---------- marca ----------
function sunburst(size){
  const S=64,cx=32,cy=32,rays=11;let p=`<svg width="${size}" height="${size}" viewBox="0 0 ${S} ${S}">`;
  for(let i=0;i<rays;i++){const a=Math.PI*2*i/rays-Math.PI/2;
    const ux=Math.cos(a),uy=Math.sin(a),px=-uy,py=ux;
    const base=S*.04,tip=S*.46,mid=S*.26,hw=S*.055;
    const pts=[[cx+ux*base,cy+uy*base],[cx+ux*mid+px*hw,cy+uy*mid+py*hw],
      [cx+ux*tip,cy+uy*tip],[cx+ux*mid-px*hw,cy+uy*mid-py*hw]]
      .map(q=>q.map(n=>n.toFixed(2)).join(",")).join(" ");
    p+=`<polygon points="${pts}" fill="var(--brand)"/>`}
  return p+`<circle cx="${cx}" cy="${cy}" r="${S*.07}" fill="var(--brand)"/></svg>`;
}
$("mark").innerHTML=sunburst(22);

// ---------- entorno ----------
const TAURI = window.__TAURI__?.core;
const invoke = TAURI ? TAURI.invoke : null;
const PALETTE = ["var(--accent)","var(--brand)","var(--ok)","var(--warn)","var(--txt-dim)"];
let lastQuotaData=null, lastLocalData=null;   // caché para re-render al cambiar idioma

// ---------- icono de bandeja dinámico ----------
// El % de sesión vive junto al reloj, como los medidores de batería/CPU: se
// dibuja en un canvas y el backend lo aplica como icono del tray (update_tray).
// (Windows 11 no permite incrustar ventanas en la barra; esta es la vía nativa.)
const HEX={ok:"#40b869",warn:"#e6a417",bad:"#f05a41",dim:"#9aa0aa"};
function colorHex(pct,pace){ if(pct>=95) return HEX.bad;
  if(pace!=null && pct>pace+8) return pct>85?HEX.bad:HEX.warn;
  if(pct>=80) return HEX.warn; return HEX.ok; }

function updateTray(ses, weekPct){
  if(!invoke) return;
  const S=32, cv=document.createElement("canvas"); cv.width=cv.height=S;
  const ctx=cv.getContext("2d");
  const label = ses ? String(Math.round(ses.pct)) : "–";
  const c = ses ? colorHex(ses.pct, ses.pace) : HEX.dim;
  ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillStyle=c;
  ctx.font=`bold ${label.length>2?15:20}px "Segoe UI",sans-serif`;
  ctx.fillText(label, S/2, S/2 - (weekPct!=null?2:0));
  if(weekPct!=null){                      // barrita semanal al pie del icono
    ctx.fillStyle="rgba(128,128,128,.45)"; ctx.fillRect(4,S-5,S-8,3);
    ctx.fillStyle=colorHex(weekPct,null);
    ctx.fillRect(4,S-5,Math.round((S-8)*Math.min(100,weekPct)/100),3);
  }
  const tip = ses
    ? t("tray_tip", Math.round(ses.pct), fmtReset(ses.resets), weekPct!=null?Math.round(weekPct):null)
    : t("tray_no_data");
  invoke("update_tray",{rgba:Array.from(ctx.getImageData(0,0,S,S).data),
    width:S, height:S, tooltip:tip}).catch(()=>{});
}

// ---------- helpers de cuota ----------
function col(pct,pace){ if(pct>=95) return "var(--bad)";
  if(pace!=null && pct>pace+8) return pct>85?"var(--bad)":"var(--warn)";
  if(pct>=80) return "var(--warn)"; return "var(--ok)"; }
function fmtReset(iso){ if(!iso) return "";
  const ms=new Date(iso)-Date.now(); if(ms<=0) return t("reset_now");
  const h=Math.floor(ms/3.6e6),m=Math.floor(ms%3.6e6/6e4);
  return t("reset_in",h,m); }

function prettyBucket(k){
  return k.replace(/seven_day|7d/gi,"Weekly").replace(/five_hour|5h/gi,"Session")
          .replace(/[_-]/g," ").replace(/\b\w/g,c=>c.toUpperCase());
}

// Nombre bonito de modelo: "claude-opus-4-8" -> "Opus 4.8"
function prettyModel(id){
  if(!id) return t("unknown_model");
  const s=id.replace(/^claude-/,"").replace(/-\d{8}$/,"");
  const fam=(s.match(/opus|sonnet|haiku|fable|mythos|cowork/i)||[])[0];
  const ver=s.match(/(\d+)[-.](\d+)/);
  const name=fam?fam[0].toUpperCase()+fam.slice(1).toLowerCase():s;
  return ver?`${name} ${ver[1]}.${ver[2]}`:name;
}

// ---------- cuota real (dinámica por plan) ----------
// Fuente principal: el array `limits` del endpoint. Fallback: búsqueda
// recursiva de objetos con { utilization } por si el endpoint cambia de forma.
function extractBuckets(node, path, out){
  if(!node || typeof node!=="object") return;
  const u = node.utilization ?? node.used_percent ?? node.percent_used;
  if(typeof u==="number"){
    const key=path.join("."), isSes=/five|5h|session/i.test(key);
    out.push({
      kind: isSes?"session":(/seven_day$|week/i.test(key)?"weekly_all":"weekly_scoped"),
      label: isSes?t("session_label"):prettyBucket(key),
      pct:Math.round(u<=1?u*100:u),
      resets:node.resets_at ?? node.reset_at ?? null}); return;
  }
  for(const [k,v] of Object.entries(node)) extractBuckets(v,[...path,k],out);
}

function parseQuota(data){
  const out=[];
  if(Array.isArray(data?.limits) && data.limits.length){
    for(const l of data.limits){
      const pct=Math.round(l.percent ?? l.utilization ?? 0);
      const resets=l.resets_at ?? null;
      let kind,label;
      if(l.kind==="session" || l.group==="session"){ kind="session"; label=t("session_label"); }
      else if(l.kind==="weekly_all"){ kind="weekly_all"; label=t("weekly_all"); }
      else if(l.kind==="weekly_scoped"){
        const m=l.scope?.model?.display_name || l.scope?.surface || "?";
        kind="weekly_scoped"; label=t("weekly_x", m);
      } else { kind=l.kind||l.group||"otro"; label=prettyBucket(l.kind||l.group||"otro"); }
      out.push({kind,label,pct,resets});
    }
  } else {
    extractBuckets(data,[],out);         // fallback recursivo
  }
  return out;
}

const WRANK={session:0,weekly_all:1,weekly_scoped:2};
let weeklyAllPct=null;   // lo usa la fila "claude.ai / otros" en renderLocal

// marcador de ritmo: % del periodo ya transcurrido
function elapsedPct(resets,hours){ if(!resets) return null;
  const left=(new Date(resets)-Date.now())/3.6e6;
  return Math.round(Math.min(100,Math.max(0,(1-left/hours)*100))); }

function renderQuota(data){
  lastQuotaData=data;
  $("planTag").textContent = data?.plan?.name || data?.subscription?.plan || data?.plan_name || t("plan_sub");

  const buckets=parseQuota(data);
  const ses=buckets.find(b=>b.kind==="session");
  const weekly=buckets.filter(b=>b.kind!=="session")
    .sort((a,b)=>(WRANK[a.kind]??9)-(WRANK[b.kind]??9));
  weeklyAllPct = (weekly.find(b=>b.kind==="weekly_all") || weekly[0] || {}).pct ?? null;

  if(ses){
    const pace=elapsedPct(ses.resets,5);
    const c=col(ses.pct,pace);
    $("gFill").setAttribute("stroke-dashoffset",(100-ses.pct));
    $("gFill").setAttribute("stroke",c);
    $("sesVal").textContent=ses.pct+"%"; $("sesVal").style.color=c;
    $("sesReset").textContent=fmtReset(ses.resets);
    $("remQ").textContent = pace!=null && ses.pct>pace+8 ? t("ahead_clock") : t("on_track");
    renderProjection(ses.pct,pace,ses.resets);
    maybeNotify(ses.pct,ses.resets);
  }

  $("weekStack").innerHTML = weekly.map((b)=>{
    const hero=b.kind==="weekly_all";
    const pace=elapsedPct(b.resets,168), c=col(b.pct,pace);
    return `<div class="bar-row ${hero?'':'mini'}">
      <div class="brow-top"><span class="lbl">${escapeHtml(b.label)}</span>
        <span class="rst">${b.pct}%</span></div>
      <div class="track"><div class="fill" style="width:${b.pct}%;background:${c}"></div>
        ${pace!=null?`<div class="pace" style="left:${pace}%"></div>`:""}</div>
      ${hero?`<div class="brow-top wrap" style="margin-top:4px;margin-bottom:0">
        <span class="rst">${pace!=null&&b.pct<=pace?t("pace_ok"):t("pace_watch")}</span>
        <span class="rst">${fmtReset(b.resets)}</span></div>`
       :`<div class="brow-top" style="margin-top:3px;margin-bottom:0">
        <span class="rst" style="margin-left:auto">${fmtReset(b.resets)}</span></div>`}
    </div>`;
  }).join("") || `<div class="errbox">${t("no_buckets")}</div>`;

  updateTray(ses ? {pct:ses.pct, resets:ses.resets, pace:elapsedPct(ses.resets,5)} : null,
             weeklyAllPct);
}

// ---------- avisos de sesión (una vez por umbral por ventana de sesión) ----------
function maybeNotify(pct,resets){
  const notif=window.__TAURI__?.notification;
  if(!notif) return;
  const win=resets||"sesion";                 // clave = ventana de sesión actual
  for(const thr of [95,80]){                  // el umbral más alto primero
    if(pct>=thr){
      const key=`notif:${thr}:${win}`;
      if(!localStorage.getItem(key)){
        localStorage.setItem(key,"1");        // anti-spam: uno por umbral y ventana
        Promise.resolve(notif.isPermissionGranted())
          .then(g=> g ? true : notif.requestPermission().then(p=>p==="granted"))
          .then(ok=>{ if(ok) notif.sendNotification({
            title:"Claude Code Meter",
            body: thr>=95 ? t("notif_hi",pct) : t("notif_lo",pct) }); })
          .catch(()=>{});
      }
      break;
    }
  }
}

// proyección simple: burn rate de la sesión vs tiempo restante
let lastSes=null, lastTs=null;
function renderProjection(pct,pace,resets){
  $("projSect").hidden=false;
  const now=Date.now();
  let txt, calm=true, rate="";
  if(lastSes!=null && pct>lastSes && now>lastTs){
    const perMin=(pct-lastSes)/((now-lastTs)/6e4);      // %/min
    const minsLeft=resets?(new Date(resets)-now)/6e4:null;
    const minsTo100=perMin>0?(100-pct)/perMin:Infinity;
    rate=t("burn", perMin.toFixed(2));
    if(minsLeft!=null && minsTo100<minsLeft){
      calm=false;
      txt=t("proj_hit", fmtDur(minsTo100), fmtDur(minsLeft));
    }else{
      txt=t("proj_ok_rate");
    }
  }else{
    txt = pace!=null && pct>pace+8 ? t("proj_ahead") : t("proj_behind");
    calm = !(pace!=null && pct>pace+8);
  }
  lastSes=pct; lastTs=now;
  $("proj").classList.toggle("calm",calm);
  $("projTxt").innerHTML=txt; $("rateTxt").textContent=rate;
}
function fmtDur(m){m=Math.round(m);const h=Math.floor(m/60);return h?`${h} h ${m%60} min`:`${m} min`;}

// ---------- detalle local ----------
function renderLocal(s){
  lastLocalData=s;
  const projs=s.projects.slice(0,4);
  const others=s.projects.slice(4);
  if(others.length) projs.push({name:t("others",others.length),cost:others.reduce((a,p)=>a+p.cost,0)});
  const max=Math.max(...projs.map(p=>p.cost),0.01);

  let rows = projs.map((p,i)=>`
    <div class="pitem">
      <div class="pname"><span class="swatch" style="background:${PALETTE[i%PALETTE.length]}"></span><span>${escapeHtml(p.name)}</span></div>
      <div class="pcost">$${p.cost.toFixed(2)}</div>
      <div class="pbar"><i style="width:${Math.round(p.cost/max*100)}%;background:${PALETTE[i%PALETTE.length]}"></i></div>
    </div>`).join("");
  if(!rows) rows = `<div class="errbox" style="color:var(--txt-dim)">${t("no_activity")}</div>`;

  // Fila estimada de otras superficies (claude.ai / IDE): solo si hay dato
  // fiable, en % de cuota (nunca convertido a dólares).
  if(weeklyAllPct!=null){
    rows += `<div class="pitem other" title="${escapeHtml(t("claudeai_tip"))}">
      <div class="pname"><span class="swatch" style="background:var(--txt-dim);border-radius:50%"></span><span>${t("claudeai_row")}</span></div>
      <div class="pcost">${t("pct_quota", weeklyAllPct)}</div>
      <div class="pbar"><i style="width:${weeklyAllPct}%;background:var(--txt-dim)"></i></div>
    </div>`;
  }
  $("plist").innerHTML = rows;

  const models=Object.entries(s.models).map(([m,a])=>({m,t:a.input+a.output+a.cache_write}))
    .filter(x=>x.t>0)                       // fuera modelos sin trabajo real
    .sort((a,b)=>b.t-a.t);
  const tot=models.reduce((a,x)=>a+x.t,0);
  if(tot>0){
    $("modelSect").hidden=false;
    $("split").innerHTML=models.map((x,i)=>`<i style="width:${(x.t/tot*100).toFixed(1)}%;background:${PALETTE[i%PALETTE.length]}"></i>`).join("");
    $("legend").innerHTML=models.slice(0,4).map((x,i)=>`<span><b style="background:${PALETTE[i%PALETTE.length]}"></b>${escapeHtml(prettyModel(x.m))} ${Math.round(x.t/tot*100)}%</span>`).join("");
    $("modelQ").textContent=t("model_leads", prettyModel(models[0].m));
  }
  $("costToday").textContent="$"+s.cost_today.toFixed(2);
  $("costWeek").textContent="$"+s.cost_week.toFixed(2);
}

// ---------- ciclo de refresco (auto-programado, con backoff ante fallos) ----------
// El endpoint de cuota tiene rate-limit estricto: cadencia normal de 3 min.
const REFRESH_MS=180000, STALE_MS=15*60000;
let lastSync=Date.now(), fails=0, rateLimited=false, rateWaitMs=REFRESH_MS,
    hadQuota=false, refreshTimer=null, lastErrCode=null;

function onQuotaFail(reason){
  lastErrCode=String(reason);
  $("liveDot").classList.add("err"); $("syncTxt").textContent=errText(reason); fails++;
  rateLimited=lastErrCode.startsWith("ERR_RATE_LIMITED");
  // respeta el Retry-After del servidor, con piso de 3 min
  rateWaitMs=Math.max(REFRESH_MS, (+lastErrCode.split(":")[1]||3)*60000);
  // el gauge y el icono CONSERVAN el último dato bueno reciente; solo se
  // ponen en gris si nunca hubo dato o si el último tiene más de 15 min.
  if(!hadQuota || Date.now()-lastSync>STALE_MS) updateTray(null,null);
}

async function refresh(){
  if(!invoke){ demo(); return; }
  try{
    const [quota, local] = await Promise.allSettled([invoke("get_quota"), invoke("get_local_stats")]);
    if(quota.status==="fulfilled"){
      renderQuota(quota.value); $("liveDot").classList.remove("err");
      lastSync=Date.now(); fails=0; rateLimited=false; hadQuota=true; lastErrCode=null;
    }else{
      onQuotaFail(quota.reason);
    }
    if(local.status==="fulfilled") renderLocal(local.value);
  }catch(e){ onQuotaFail(e); }
  finally{ scheduleNext(); }
}
function scheduleNext(){
  // 3 min en régimen normal; errores de red: backoff 5→10→20→40 s (máx 60 s);
  // 429: lo que pida el servidor, mínimo 3 min (reintentar rápido lo empeora).
  const delay = rateLimited ? rateWaitMs
    : fails>0 ? Math.min(60000, 5000*2**(fails-1)) : REFRESH_MS;
  clearTimeout(refreshTimer); refreshTimer=setTimeout(refresh, delay);
}
setInterval(()=>{ if(!$("liveDot").classList.contains("err"))
  $("syncTxt").textContent=t("live_ago", Math.round((Date.now()-lastSync)/1000)); },1000);

// arrastrar la ventana desde el encabezado (ventana sin decoraciones)
const APPWIN = window.__TAURI__?.window ? window.__TAURI__.window.getCurrentWindow() : null;
let dragging=false;
$("pHead").addEventListener("mousedown",(e)=>{
  if(e.button!==0) return;               // solo clic izquierdo
  if(e.target.closest("button")) return; // no arrastrar desde los botones
  dragging=true;
  APPWIN?.startDragging();
  setTimeout(()=>{ dragging=false; },500); // el arrastre nativo se traga el mouseup
});

// flyout: el panel se oculta al perder el foco, EXCEPTO mientras se arrastra
window.addEventListener("focus",()=>{ dragging=false; });
window.addEventListener("blur",()=>{ if(!dragging) APPWIN?.hide(); });

// ocultar a bandeja
$("hideBtn").addEventListener("click",()=>{ APPWIN?.hide(); });

// ---------- ajustes: fuentes remotas (servidores por SSH) ----------
let remotes=[];
async function loadRemotes(){
  if(!invoke) return;
  try{ remotes=await invoke("get_remotes"); }catch(e){ remotes=[]; }
  renderRemotes();
}
function renderRemotes(){
  $("remList").innerHTML = remotes.map((r,i)=>`
    <div class="pitem">
      <div class="pname"><span class="swatch" style="background:var(--accent)"></span>
        <span>${escapeHtml(r.name)} — ${escapeHtml(r.host)}</span></div>
      <button class="xbtn" data-i="${i}" title="${escapeHtml(t("remove_server"))}">✕</button>
    </div>`).join("")
    || `<div class="errbox" style="color:var(--txt-dim)">${t("no_servers")}</div>`;
  document.querySelectorAll("#remList .xbtn").forEach(b=>{
    b.onclick=async()=>{
      remotes.splice(+b.dataset.i,1);
      try{ await invoke("save_remotes",{remotes}); }catch(e){}
      renderRemotes(); refresh();
    };
  });
}
$("cfgBtn").addEventListener("click",()=>{
  $("cfgSect").hidden=!$("cfgSect").hidden;
  if(!$("cfgSect").hidden){ loadRemotes(); $("cfgSect").scrollIntoView({behavior:"smooth"}); }
});
$("rAdd").addEventListener("click",async()=>{
  const name=$("rName").value.trim()||"server";
  const host=$("rHost").value.trim();
  const command=$("rCmd").value.trim();
  if(!host){ $("rMsg").textContent=t("msg_no_host"); return; }
  $("rMsg").textContent=t("msg_testing");
  try{
    await invoke("test_remote",{host});
    remotes.push({name,host,command});
    await invoke("save_remotes",{remotes});
    $("rMsg").textContent=t("msg_added");
    $("rName").value=""; $("rHost").value="";
    renderRemotes(); refresh();
  }catch(e){ $("rMsg").textContent="✗ "+e; }
});

// ---------- idioma (persistido; re-render en caliente) ----------
$("langSel").addEventListener("change",()=>{
  lang=$("langSel").value; localStorage.setItem("lang",lang);
  applyI18n();
  if(lastQuotaData) renderQuota(lastQuotaData);
  if(lastLocalData) renderLocal(lastLocalData);
  if(lastErrCode) $("syncTxt").textContent=errText(lastErrCode);
  renderRemotes();
});

// ---------- modo demo (SOLO al abrir index.html suelto en un navegador, sin Tauri) ----------
// Nunca se ejecuta dentro de la app real (allí window.__TAURI__ existe -> invoke).

      {kind:"session",group:"session",percent:68,resets_at:new Date(Date.now()+2.2*3.6e6).toISOString()},

    ]});
  renderLocal({projects:[{name:"vps-infra",cost:18.4},{name:"edge-gallery",cost:12.1},
    {name:"rocket-code-prep",cost:8.9}],

}

applyI18n();
$("syncTxt").textContent=t("connecting");
$("plist").innerHTML=`<div class="errbox" style="color:var(--txt-dim)">${t("reading")}</div>`;
refresh();
</script>
