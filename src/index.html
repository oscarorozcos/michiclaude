      }
    }
    // Las fichas calientes miden algo VIVO (minutos de pausa, contexto,
    // relecturas) y hasta 2026-08-17 nacían y se CONGELABAN: la de caché
    // seguía diciendo "6 min de pausa" cuando ya llevabas veinte — o cuando
    // habías vuelto a trabajar y esa pausa era historia. Con "Ahora:"
    // delante, eso no es una foto vieja: es una mentira. Se refrescan con la
    // medición nueva SIN RENACER (conservan born/min/v, como la de
    // intención): poner al día un número no es un aviso nuevo y no debe
    // reencender el post-it. `ts` = cuándo se midió por última vez; se
    // persiste como mucho una vez por minuto, y cuando la regla deja de
    // dispararse deja de moverse — que es justo la señal de que el dato
    // envejeció (la ficha lo dirá con "medido hace X min").
    // Fuera: `sum` y `acomp`, que SÍ son fotos de algo terminado.
    const REFRESCA=new Set(["cache","compact","attach","shots"]);
    for(const h of hits){
      if(!REFRESCA.has(h.rule)) continue;
      const c=cards.find(x=>x.h.rule===h.rule&&x.h.session===h.session);
      if(!c) continue;                       // otra sesión, o despachada: no tocar
      if(JSON.stringify(c.h)!==JSON.stringify(h)){ c.h=h; dirty=true; }
      if(!c.ts||Date.now()-c.ts>60000){ c.ts=Date.now(); dirty=true; }
    }
    // la tarjeta de intención VIVA se refresca con la medición de cada
    // sondeo (%, pendientes, señales) sin renacer: conserva born/min/v — y
    // si el usuario la despachó con ✕ o "Ahora no", NO se resucita (tipSeen
    // ya la tiene y aquí solo se actualiza la que sigue en el almacén).
    if(intentHit){
      const ic=cards.find(c=>c.h.rule==="intent"&&c.h.session===intentHit.session);
      if(ic&&JSON.stringify(ic.h)!==JSON.stringify(intentHit)){
        ic.h=intentHit; dirty=true;
      }
    }
    localStorage.setItem("tipSeen",JSON.stringify([...seen].slice(-300)));
    localStorage.setItem("tipDay",JSON.stringify(day));
    if(dirty) saveCoachCards(cards);
    maybeAiIntent(pr);   // análisis local: solo si el veredicto quedó unsure
    // El automático va DESPUÉS de guardar tarjetas y lanzar el análisis
    // (2026-08-13): llamado antes, en el primer sondeo caliente la tarjeta
    // de intención aún no existía, aiPending decía "no hay análisis" y la
    // cuenta de /compact arrancaba SIN esperar el veredicto — carrera vista
    // en vivo (18:32: /compact y "ai: analizando" el mismo segundo, el
    // "clear·tema_nuevo" llegó 10 s tarde a una cuenta ya corriendo).
    relayAutoCheck(pr);            // ¿toca aplicar /compact solo? (3c-2)
    renderTipsDot();
    if(lastPillArgs) emitPill(...lastPillArgs);   // el widget lo ve al instante
    if(!$("tab-tips").hidden && !relayBusy) renderTips();
    // sesión local terminada = el momento en que nacen hallazgos: pasada
    // ligera para encender la campana/post-it el MISMO día (Oscar
    // 2026-08-04; el freno de 15 min vive dentro de fndEventScan)
    if(sumBorn) fndEventScan();
  }catch(_){/* sin backend o sin logs: el siguiente ciclo reintenta */}
  coachSched();                      // el compás siguiente sale de lo visto
}
coachTimer=setTimeout(coachPoll,60*1000);  // el primer sondeo, tras la carga

// ---------- análisis local (IA) en la tarjeta de intención ----------
// docs/analisis-local.md — LEERLO antes de tocar. SOLO llena el hueco
// `unsure` del clasificador determinista (los hechos mandan), UNA invocación
// por sesión aunque falle (reintentar cada sondeo sería arrancar un servidor
// de 1.3 GB en bucle) y solo pinta una insignia en la tarjeta MANUAL: las
// compuertas del automático ni se enteran. La evidencia (msgs) viaja en el
// hit press y NO se persiste: en el almacén solo queda el veredicto.
function maybeAiIntent(pr){
  try{
    if(!invoke||!aiCfg||!aiCfg.enabled) return;
    if(!pr||!(pr.msgs||[]).length) return;   // sin evidencia (exportador viejo)
    if(simRunning||simFnd) return;           // los simuladores no analizan
    const cards=coachCardsStore();
    const c=cards.find(x=>x.h.rule==="intent"&&x.h.session===(pr.session||""));
    if(!c||c.ai||c.aiTried) return;
    if(intentVerdict(c.h)!=="unsure") return;
    c.aiTried=true; saveCoachCards(cards);
    flog("ai: analizando "+(pr.session||""));
    invoke("ai_intent",{title:pr.title||"",msgs:pr.msgs||[],cont:pr.cont||0})
      .then(vd=>{
        const cs=coachCardsStore();
        const c2=cs.find(x=>x.h.rule==="intent"&&x.h.session===(pr.session||""));
        if(!c2) return;                      // la despacharon mientras tanto
        c2.ai={rec:vd.rec||"unsure",reason:vd.reason||"na"};
        saveCoachCards(cs);
        // qué peldaño decidió (etapa 2): "embeddings 0.38" o "modelo". Es
        // EL dato de la auditoría — al rastro, no a la tarjeta persistida.
        // "(modelo · sim 0.52)" = el emb midió banda media y decidió el 2B;
        // "(modelo)" a secas = el peldaño emb no pudo medir (falta el GGUF
        // o falló en silencio) — la diferencia ES el diagnóstico.
        const simTx=(vd.sim||0)>0?" · sim "+Math.round(vd.sim*100)/100:"";
        flog("ai: veredicto "+c2.ai.rec+" · "+c2.ai.reason
          +(vd.via==="emb"?" (embeddings"+simTx+")"
            :vd.via==="llm"?" (modelo"+simTx+")":""));
        // El automático no espera al siguiente sondeo (2026-08-13): si la
        // cuenta estaba aguantando por este veredicto (aiPending), el
        // momento es AHORA. El pr del último sondeo (≤10 s bajo presión)
        // sigue fresco y relayAutoCheck re-verifica TODAS sus compuertas.
        relayAutoCheck(pr);
        if(!$("tab-tips").hidden && !relayBusy) renderTips();
      })
      .catch(e=>{
        // se marca el FALLO: sin esto el automático por inferencia se
        // quedaría esperando un veredicto que no va a llegar
        try{
          const cs=coachCardsStore();
          const c2=cs.find(x=>x.h.rule==="intent"&&x.h.session===(pr.session||""));
          if(c2){ c2.aiErr=true; saveCoachCards(cs); }
        }catch(_){}
        flog("ai: "+String(e));
        // simétrico del veredicto: con el análisis muerto, el automático
        // decide AHORA con lo determinista en vez de esperar otro sondeo
        relayAutoCheck(pr);
      });
  }catch(_){/* el análisis jamás tumba el sondeo */}
}

// ---------- pestaña Reporte (docs/presion-y-rendimiento.md) ----------
// El "cómo voy" en llano. TODO sale de datos ya medidos: get_local_stats
// (con uturns), get_quota_history, get_findings y las marcas de arreglo
// (fndMarks). REGLAS DE ORO: nunca dividir con uturns=0 ("sin datos"),
// nunca inventar la causa de un gasto (solo detectores reales), y toda
// estimación se dice ("estimado, con N días"). Invariante #8 en todo.
let repDays=+(localStorage.getItem("repDays")||7);
if(![7,30].includes(repDays)) repDays=7;
let repRange=null;
try{ const r=JSON.parse(localStorage.getItem("repRange")||"null");
  if(r&&r.from&&r.to) repRange=r; }catch(_){}
let repStamp=0, repData=null;

function repArgs(){

                  : {days:repDays};
}
function repWidth(){ return repRange ? rangeDays(repRange) : repDays; }

function repPeriodLabel(){

// Sin candado de "ocupado": cada petición lleva su sello y la que llegue
// TARDE se descarta — así cambiar de periodo a media carga nunca se traba
// ni pinta datos del periodo anterior. VELOCIDAD (Oscar 2026-08-06):
// (1) caché en memoria POR PERIODO — volver a un chip ya visitado es
// instantáneo; (2) render PROGRESIVO — las estadísticas (rápidas) pintan
// primero y los hallazgos (SSH incluido) llegan después y solo re-pintan
// sus dos secciones, sin bloquear el resto.
const repCache={};
async function loadReport(force){
  if(!invoke) return;
  const key=JSON.stringify(repArgs());
  const hit=repCache[key];
  if(hit && !force && Date.now()-hit.at<5*60*1000){
    repData=hit; renderReport(); return;
  }
  const stamp=++repStamp;
  markRepChips();
  const wait=`<div class="rp-empty">${t("fnd_scanning")}</div>`;
  for(const id of ["repHero","repWaste","repLast","repProj","repFix","repNext","repRuteo"]) $(id).innerHTML=wait;
  const W=repWidth(), endE=repEnd();
  // la medición del ruteo arranca YA y pinta sola al llegar (SSH incluido):
  // no bloquea el resto del reporte
  invoke("get_ruteo_report",repArgs()).then(rows=>{
    if(stamp!==repStamp) return;
    repData && (repData.ruteo=rows||[]);
    renderRepRuteo(rows||[]);
  }).catch(()=>{ if(stamp===repStamp) renderRepRuteo(null); });
  // los hallazgos arrancan YA, en paralelo, pero no se les espera aún.
  // get_findings devuelve {findings, waste} desde 2026-08-14: la misma
  // pasada trae las tarjetas y el % de desperdicio estructural. El del
  // periodo ANTERIOR (misma anchura terminando donde empieza este) es solo
  // para la línea "antes: X%" — si falla, la tarjeta sale sin comparación.
  const pFnd=invoke("get_findings",repArgs()).catch(()=>null);
  const pWstPrev=(W>=7)
    ? invoke("get_findings",{days:W,end:endE-W*86400}).catch(()=>null)
    : Promise.resolve(null);
  // el periodo ANTERIOR es la misma anchura terminando donde empieza este:
  // así "¿mejoré?" compara peras con peras aunque el periodo sea un rango
  const [cur,prev,hist,intg,dhist]=await Promise.allSettled([
    invoke("get_local_stats",repArgs()),
    invoke("get_local_stats",{days:W, end:endE-W*86400}),
    invoke("get_quota_history",{days:90}),
    // PIEZA 2: hechos de integridad (¿alguien recortó los logs?) y
    // PIEZA 3: el cuadernito diario, para saber qué días DEJARON de verse
    invoke("get_integrity",{days:400}),
    invoke("get_daily_history",{days:60}),
  ]);
  if(stamp!==repStamp) return;
  repData={
    cur: cur.status==="fulfilled"?cur.value:null,
    prev:prev.status==="fulfilled"?prev.value:null,
    hist:hist.status==="fulfilled"?hist.value:[],
    intg:intg.status==="fulfilled"?(intg.value||[]):[],
    dhist:dhist.status==="fulfilled"?(dhist.value||[]):[],
    fnd: null,   // null = "analizando"; [] = "sin fugas" — no es lo mismo
    waste:null, wastePrev:null,   // ídem: null = aún analizando
    W, endE, at:Date.now(),
  };
  renderReport();
  const pack=await pFnd;
  if(stamp!==repStamp) return;
  repData.fnd=pack?pack.findings||[]:[];
  repData.waste=pack?pack.waste:{err:1};   // err: la tarjeta dice "falló"
  repData.at=Date.now();
  repCache[key]=repData;
  renderRepProj(repData);
  renderRepNext(repData);
  renderRepWaste(repData);
  const prevPack=await pWstPrev;
  if(stamp!==repStamp) return;
  repData.wastePrev=prevPack?prevPack.waste:null;
  renderRepWaste(repData);
}
function repPerfOf(s){ return s && s.uturns_week>0 ? s.tokens_week/s.uturns_week : null; }
function repFmtN(n){ return Math.round(n).toLocaleString(lang); }

// ---------- PIEZA 2 · cobertura honesta (adr-multiharness-y-persistencia.md)
// Los .jsonl no son nuestros: un limpiador o el usuario pueden recortarlos.
// Si eso pasó, "mejoraste 40%" puede ser solo un borrado — y decirlo sería
// justo la mentira que prohíbe el invariante #8. Dos señales, ninguna
// inventada: (a) los hechos que anotó el detector de integridad; (b) días
// que el cuadernito vio con trabajo y que el escaneo YA NO ve.
// Regla: si cualquiera de los dos periodos comparados está tocado, el
// resultado sale NO CONCLUYENTE — nunca como mejora.
function repDaysMissing(d,fromTs,toTs){
  const live={}; for(const x of ((d.cur&&d.cur.daily)||[])) live[x.date]=x;
  let n=0;
  for(const h of (d.dhist||[])){
    if(!(h.tokens>0)) continue;
    const ts=Math.floor(fromYmd(h.date).getTime()/1000);
    if(ts<fromTs||ts>=toTs) continue;
    const l=live[h.date];
    if(!l||!(l.tokens>0)) n++;   // lo vimos con trabajo y hoy no está
  }
  return n;
}
// Un recorte se DETECTA en una fecha, pero los bytes perdidos pueden ser de
// cualquier día: no se puede atribuir a un periodo. Por eso cualquier hecho
// desde el arranque del periodo MÁS VIEJO ensucia la comparación entera.
function repIntgSince(d,fromTs){
  return (d.intg||[]).filter(e=>e.t>=fromTs);
}
function repCoverage(d){
  const curFrom=d.endE-d.W*86400, prevFrom=curFrom-d.W*86400;
  const ev=repIntgSince(d,prevFrom);
  const miss=repDaysMissing(d,prevFrom,d.endE);
  return {ok:!ev.length&&!miss, ev, miss,
          last:ev.length?ev[ev.length-1]:null};
}
function repCovBanner(d){
  const c=repCoverage(d);
  if(c.ok) return "";
  let det="";
  if(c.last){
    const when=new Date(c.last.t*1000).toLocaleDateString(lang,{day:"2-digit",month:"short"});
    const org=c.last.o?` · ${escapeHtml(c.last.o)}`:"";
    det=escapeHtml(c.last.kind==="vanished"
      ? t("cov_gone",c.last.n,when) : t("cov_cut",when))+org;
  }else{
    det=escapeHtml(t("cov_missing",c.miss));
  }
  return `<div class="rp-cov"><span class="i">!</span><div><b>${escapeHtml(t("cov_title"))}</b>
    <div>${det}</div><div class="s">${escapeHtml(t("cov_note"))}</div></div></div>`;
}

function renderReport(){
  const d=repData; if(!d) return;
  markRepChips();
  renderRepHero(d); renderRepWaste(d); renderRepLast(d); renderRepChart(d);
  renderRepProj(d); renderRepFix(d); renderRepNext(d);
  // la del ruteo llega aparte (SSH); si el periodo viene de caché ya la trae
  if(d.ruteo) renderRepRuteo(d.ruteo);
}

// ---------- la medición del ruteo (ruteo-inteligente.md etapa 3) ----------
// Suma las tres máquinas. Regla dura (invariante #8): el $ solo sale de
// subagentes CASADOS con su transcript (matched); los ruteados sin casar se
// cuentan pero no se facturan. El ahorro es una RESTA de tarifas reales
// sobre tokens reales, no un % contra una línea base hipotética. El
// contexto inyectado se muestra como coste PROPIO, con «~» (estimado).
function renderRepRuteo(rows){
  const el=$("repRuteo"); if(!el) return;
  if(rows===null){ el.innerHTML=`<div class="rp-empty">${t("fnd_err")}</div>`; return; }
  const s={routed:0,haiku:0,sonnet:0,matched:0,up:0,tok:0,cost:0,cost_base:0,saved:0,
    blocks:0,insist:0,ctx:0,ctx_tok:0,skip:0,esc:0,estimated:false};
  for(const r of rows){ for(const k in s){ if(k==="estimated") s.estimated=s.estimated||!!r.estimated; else s[k]+=(+r[k]||0); } }
  if(!s.routed && !s.blocks && !s.ctx){
    el.innerHTML=`<div class="rp-empty">${escapeHtml(t("rt_rep_none"))}</div>`; return;
  }
  const tld=s.estimated?"~":"";
  const money=v=>(v<0?"−":"")+wstMoney(Math.abs(v));
  const rowsHtml=[];
  rowsHtml.push(`<div class="wst-row"><span class="wl">${escapeHtml(t("rt_rep_routed",s.routed,s.haiku,s.sonnet))}</span></div>`);
  if(s.matched){
    rowsHtml.push(`<div class="wst-row"><span class="wl">${escapeHtml(t("rt_rep_cost",s.matched,repFmtN(s.tok)))}</span>
      <b>${tld}${money(s.cost)} <span class="was">${escapeHtml(t("rt_rep_was",tld+money(s.cost_base)))}</span></b></div>`);
    if(s.up) rowsHtml.push(`<div class="wst-row"><span class="wl">${escapeHtml(t("rt_rep_up",s.up))}</span></div>`);
  }
  if(s.routed>s.matched) rowsHtml.push(`<div class="wst-row"><span class="wl">${escapeHtml(t("rt_rep_unmatched",s.routed-s.matched))}</span></div>`);
  if(s.blocks) rowsHtml.push(`<div class="wst-row"><span class="wl">${escapeHtml(t("rt_rep_blocks",s.blocks,s.insist))}</span></div>`);
  if(s.esc) rowsHtml.push(`<div class="wst-row"><span class="wl">${escapeHtml(t("rt_rep_esc",s.esc))}</span></div>`);
  if(s.skip) rowsHtml.push(`<div class="wst-row"><span class="wl">${escapeHtml(t("rt_rep_skip",s.skip))}</span></div>`);
  // autoconsumo: lo ÚNICO que gasta el sistema, dicho en su propia fila
  rowsHtml.push(`<div class="wst-row"><span class="wl">${escapeHtml(s.ctx?t("rt_rep_ctx",s.ctx,repFmtN(s.ctx_tok)):t("rt_rep_ctx0"))}</span></div>`);
  const big=s.matched
    ? `<div class="wst-big"><span class="al">${escapeHtml(t("rt_rep_saved"))}</span> <b>${tld}${money(s.saved)}</b></div>
       <div class="wst-sub">${escapeHtml(t("rt_rep_sub"))}</div>`
    : `<div class="wst-none"><b>${escapeHtml(t("rt_rep_nomatch_t"))}</b><div>${escapeHtml(t("rt_rep_nomatch_b"))}</div></div>`;
  el.innerHTML=big+`<div class="wst-rows">${rowsHtml.join("")}</div>
    <div class="wst-note">${escapeHtml(t("rt_rep_note"))}</div>`;
}

// 1 · héroe: EL número con su veredicto en llano
function renderRepHero(d){
  if(!d.cur){ $("repHero").innerHTML=`<div class="rp-empty">${t("fnd_err")}</div>`; return; }
  const p=repPerfOf(d.cur);
  if(p==null){ $("repHero").innerHTML=`<div class="rp-empty">${t("rep_nodata")}</div>`; return; }
  const q=repPerfOf(d.prev);
  // PIEZA 2: con los logs tocados, el "antes" no es comparable — se dice, no
  // se disfraza de mejora (invariante #8).
  const cov=repCoverage(d);
  let delta="", plain=t("rep_verd_first");
  if(q!=null&&!cov.ok){
    plain=t("rep_verd_unsure");
    delta=`<span class="rp-delta flat">${escapeHtml(t("cov_nocomp"))}</span>`;
  }else if(q!=null){
    const ch=(p-q)/q*100;      // + = más tokens por mensaje = peor
    if(ch<=-3){ plain=t("rep_verd_good");
      delta=`<span class="rp-delta good">↓ ${t("rep_better")} ${Math.abs(Math.round(ch))}%</span>`; }
    else if(ch>=3){ plain=t("rep_verd_bad");
      delta=`<span class="rp-delta bad">↑ ${t("rep_worse")} ${Math.round(ch)}%</span>`; }
    else{ plain=t("rep_verd_flat");
      delta=`<span class="rp-delta flat">= ${t("rep_flat")}</span>`; }
  }
  // EFICIENCIA arriba, VOLUMEN abajo, separados a propósito (maqueta de
  // Oscar 2026-08-06): "cuánto me cuesta cada mensaje" y "cuánto trabajé"
  // son medidas distintas y mezclarlas confundía. La traducción a $ va
  // SIEMPRE pegada a su dato de tokens, y sale de lo MEDIDO del periodo
  // (cost/uturns y cost del día), nunca de una tarifa inventada.
  const pm=d.cur.uturns_week>0?d.cur.cost_week/d.cur.uturns_week:null;
  const qm=(d.prev&&d.prev.uturns_week>0)?d.prev.cost_week/d.prev.uturns_week:null;
  let unitLine=escapeHtml(t("rep_perf_unit"));
  if(pm!=null) unitLine+=` <span class="as-money">${escapeHtml(t("rep_money_msg","$"+pm.toFixed(2)))}</span>`;
  if(q!=null&&cov.ok){
    unitLine+=` · ${escapeHtml(t("rep_before"))} <s>${repFmtN(q)}</s>`;
    if(qm!=null) unitLine+=` <span class="rp-dim">(≈ $${qm.toFixed(2)})</span>`;
  }
  const tk=d.cur.tokens_week, ck=d.cur.cost_week, qtk=d.prev?d.prev.tokens_week:0;
  let vol="";
  if(tk>0){
    let pill="";
    if(qtk>0&&cov.ok){
      const ch=Math.round((tk-qtk)/qtk*100);
      pill = ch<=-3?`<span class="vpill ok">${escapeHtml(t("rep_vol_less",Math.abs(ch)))}</span>`
           : ch>=3?`<span class="vpill">${escapeHtml(t("rep_vol_more",ch))}</span>`
           : `<span class="vpill">${escapeHtml(t("rep_vol_flat"))}</span>`;
    }
    // el día más pesado, si la serie diaria cubre el periodo
    const from=d.endE-d.W*86400;
    const inP=(d.cur.daily||[]).filter(x=>{
      const ts=Math.floor(fromYmd(x.date).getTime()/1000);
      return ts>=from&&ts<d.endE&&(x.tokens||0)>0; });
    let top="";
    if(inP.length){
      const mx=inP.reduce((a,x)=>x.tokens>a.tokens?x:a);
      top=`<div class="vol-row">${t("rep_topday",escapeHtml(fmtDate(mx.date,false)),fmtTok(mx.tokens),"$"+mx.cost.toFixed(0))}</div>`;
    }
    // "no es contradicción": SOLO cuando volumen y costo/mensaje van en
    // direcciones opuestas — es justo el caso que confunde
    let contra="";
    if(q!=null&&qtk>0&&cov.ok){
      const chV=(tk-qtk)/qtk, chP=(p-q)/q;
      if(chV<-0.03&&chP>0.03) contra=`<div class="rp-contra">${withCmds(t("rep_contra_a"))}</div>`;
      else if(chV>0.03&&chP<-0.03) contra=`<div class="rp-contra">${withCmds(t("rep_contra_b"))}</div>`;
    }
    // la regla que conecta tokens con $ de una vez: tarifa REAL del
    // periodo (su propio costo ÷ sus propios tokens), redondeada
    const rate=ck>0?ck/(tk/1e6):0;
    const rule=rate>0?`<div class="rp-rule"><span class="eq">1M tok ≈ $${Math.round(rate)}</span><span>${withCmds(t("rep_rule"))}</span></div>`:"";
    vol=`<div class="rp-vol">
      <div class="vt">${escapeHtml(t("rep_vol_t"))}</div>
      <div class="vol-row"><b>${fmtTok(tk)} tokens</b>${ck>0?` <span class="as-money">≈ $${Math.round(ck)} ${escapeHtml(t("rep_est_word"))}</span>`:""} ${pill}</div>
      ${top}${contra}${rule}</div>`;
  }
  $("repHero").innerHTML=`
    ${repCovBanner(d)}
    <div class="rp-big">${repFmtN(p)} ${delta}</div>
    <div class="rp-nums">${unitLine}</div>
    <div class="rp-plain">${withCmds(plain)}</div>
    ${vol}
    ${d.prev&&d.prev.hub_skipped?`<div class="rep-note" style="margin-top:7px">${escapeHtml(t("hub_range_note"))}</div>`:""}`;
}

// 2 · ¿te duró más o menos? — del histórico de cuota (quota_history.json)
function repHistStats(hist,from,to){
  const snaps=(hist||[]).filter(x=>x.t>=from&&x.t<to);
  if(!snaps.length) return null;
  // ventanas de sesión agrupadas por su reset CON TOLERANCIA (el resets_at
  // trae jitter — mismo criterio de 10 min que windowChanged)
  const wins=[];
  for(const x of snaps){
    if(x.s==null||x.sr==null) continue;
    const w=wins[wins.length-1];
    if(w && Math.abs(x.sr-w.sr)<=600){ w.max=Math.max(w.max,x.s); w.sr=x.sr; }
    else wins.push({sr:x.sr,max:x.s});
  }
  const wkHit=snaps.find(x=>(x.w??0)>=100);
  return {n:snaps.length, hits:wins.filter(w=>w.max>=100).length,
          wkHit:wkHit?wkHit.t:null};
}
// 1bis · desperdicio estructural: de cada $100 gastados, cuántos se fueron
// en cómo está MONTADO el entorno (CLAUDE.md sin uso + hooks + caché
// reescrita) y no en el trabajo. REGLAS (presion-y-rendimiento.md
// §fórmula): numerador y denominador nacen de la MISMA pasada y viajan
// juntos en waste; Ignorar descuenta con el conjunto de HOY en los dos
// periodos; es un PISO y el copy dice "al menos" (invariante #8); las
// compuertas van antes que el número; y el resto de la barra NO se llama
// "trabajo real" — no está demostrado, solo "sin señalar".
function wstNum(w,ign){
  const items=(w.items||[]).filter(f=>!ign.has(fndKey(f)));
  return {items, num:items.reduce((a,f)=>a+f.cost,0)};
}
function wstMoney(v){ return v>=10?"$"+Math.round(v):"$"+v.toFixed(2); }
function renderRepWaste(d){
  const el=$("repWaste"); if(!el) return;
  if(d.W<7){
    // ventana corta: los detectores de configuración ni corren (<7d)
    el.innerHTML=`<div class="rp-empty">${escapeHtml(t("wst_short"))}
      <button class="wst-see7" id="wstSee7">${escapeHtml(t("wst_see7"))}</button></div>`;
    $("wstSee7")?.addEventListener("click",()=>{
      document.querySelector('.rchip[data-rep="7"]')?.click(); });
    return;
  }
  const w=d.waste;
  if(!w){ el.innerHTML=`<div class="rp-empty">${t("fnd_scanning")}</div>`; return; }
  if(w.err){ el.innerHTML=`<div class="rp-empty">${t("fnd_err")}</div>`; return; }
  const ign=fndIgnored();
  const {items,num}=wstNum(w,ign);
  const den=w.total_cost||0;
  if(den<1||(w.sessions||0)<10){
    el.innerHTML=`<div class="rp-empty">${escapeHtml(t("wst_gather",w.sessions||0))}</div>`;
    return;
  }
  // los de costo 0 (mcp/skills) no suman: van a la nota de "no contamos"
  const agg={};
  for(const f of items){
    if(f.cost>0){
      const a=agg[f.kind]=agg[f.kind]||{c:0,n:0,e:false};
      a.c+=f.cost; a.n+=f.count||1; a.e=a.e||!!f.estimated;
    }
  }
  const mcpN=items.filter(f=>f.kind==="mcp_unused").length;
  const skN=items.filter(f=>f.kind==="skills_unused").reduce((a,f)=>a+(f.count||0),0);
  const noteTail=(mcpN||skN)?" ("+[mcpN?mcpN+" MCP":"",skN?skN+" skills":""]
    .filter(Boolean).join(" · ")+")":"";
  const note=`<div class="wst-note">${escapeHtml(t("wst_note"))}${escapeHtml(noteTail)}</div>`;
  if(num<=0){
    // sin desperdicio DETECTADO: tono seco, sin celebrar (nada llegó a
    // los umbrales ≠ cero)
    el.innerHTML=`<div class="wst-none"><b>${escapeHtml(t("wst_none_t"))}</b>
      <div>${escapeHtml(t("wst_none_b"))}</div></div>${note}`;
    return;
  }
  const est=items.some(f=>f.estimated&&f.cost>0), tld=est?"~":"";
  const pctI=Math.round(num/den*100);
  const pctTxt=pctI<1?t("wst_lt1"):tld+pctI+"%";
  // comparación con el periodo anterior: mismas compuertas, mismo Ignorar
  // y la misma cobertura (pieza 2) — con los logs tocados no se compara.
  let cmp="";
  const p=d.wastePrev, cov=repCoverage(d);
  if(!cov.ok){
    cmp=`<div class="wst-cmp flat">${escapeHtml(t("cov_nocomp"))}</div>`;
  }else if(p&&!p.err&&(p.total_cost||0)>=1&&(p.sessions||0)>=10){
    const q=Math.round(wstNum(p,ign).num/p.total_cost*100);
    const diff=pctI-q;
    const cls=diff<=-1?"good":diff>=1?"bad":"flat";
    const lbl=diff<=-1?t("wst_pts_down",Math.abs(diff))
             :diff>=1?t("wst_pts_up",diff):t("wst_pts_flat");
    cmp=`<div class="wst-cmp ${cls}">${escapeHtml(t("wst_before",q))} · ${escapeHtml(lbl)}</div>`;
  }
  const COLORS={claudemd:"var(--accent)",hooks_noise:"var(--teal)",cachebreak:"var(--warn)"};
  const kinds=["claudemd","hooks_noise","cachebreak"].filter(k=>agg[k])
    .sort((a,b)=>agg[b].c-agg[a].c);
  const segs=kinds.map(k=>
    `<i style="width:${Math.max(1,agg[k].c/den*100)}%;background:${COLORS[k]}"></i>`).join("");
  const rows=kinds.map(k=>
    `<div class="wst-row"><span class="dotc" style="background:${COLORS[k]}"></span>
      <span class="wl">${escapeHtml(t("wst_k_"+k,agg[k].n))}</span>
      <b>${agg[k].e?"~":""}${wstMoney(agg[k].c)}</b></div>`).join("");
  el.innerHTML=`
    <div class="wst-big"><span class="al">${escapeHtml(t("wst_atleast"))}</span> <b>${escapeHtml(pctTxt)}</b>${cmp}</div>
    <div class="wst-sub">${escapeHtml(t("wst_sub"))}</div>
    <div class="wst-bar">${segs}<i class="rest"></i></div>
    <div class="wst-money">${escapeHtml(t("wst_money",tld+wstMoney(num),wstMoney(den)))}</div>
    <div class="wst-rows">${rows}</div>${note}`;
  // cada punto del porcentaje tiene tarjeta: las filas llevan a Hallazgos
  el.querySelectorAll(".wst-row").forEach(r=>
    r.addEventListener("click",()=>showTab("findings")));
}
function renderRepLast(d){
  const from=d.endE-d.W*86400;
  const cur=repHistStats(d.hist,from,d.endE);
  const prev=repHistStats(d.hist,from-d.W*86400,from);
  // cobertura mínima: ~1 h de fotos (20 a ciclo de 3 min). Sin eso, la
  // sección lo dice tal cual en vez de enseñar ceros que parecen datos.
  if(!cur || cur.n<20){
    $("repLast").innerHTML=`<div class="rp-empty">${escapeHtml(t("rep_gathering"))}</div>`;
    return;
  }
  const was=v=>v!=null?`<span class="was">${escapeHtml(t("rep_before"))}: ${v}</span>`:"";
  const wkFmt=ts=>new Date(ts*1000).toLocaleString(lang,
    {weekday:"long",hour:"2-digit",minute:"2-digit"});
  const rows=[];
  rows.push({c:"var(--bad)",
    ic:`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M13 2L4.9 12.5H11L9.5 22 19 10.5h-6L13 2z"/></svg>`,
    val:t("rep_hits_v",cur.hits)+(prev?was(prev.hits):""),

  rows.push({c:"var(--accent)",

    val:(cur.wkHit?t("rep_wk_yes",wkFmt(cur.wkHit)):t("rep_wk_no"))
        +(prev?was(prev.wkHit?wkFmt(prev.wkHit):t("rep_wk_no_short")):""),
    say:t("rep_wk_say")});
  // mensajes por día trabajado: de la serie diaria (solo si cubre el periodo)
  const days=(d.cur&&d.cur.daily||[]).filter(x=>{

    return ts>=from&&ts<d.endE&&x.uturns>0; });
  if(days.length){
    const avg=Math.round(days.reduce((a,x)=>a+x.uturns,0)/days.length);
    rows.push({c:"var(--ok)",
      ic:`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 11.5a8.38 8.38 0 0 1-8.5 8.5 8.5 8.5 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 8.5-8.5 8.38 8.38 0 0 1 8.5 8.5z"/></svg>`,

  }
  $("repLast").innerHTML=rows.map(r=>`<div class="rp-row" style="--c:${r.c}">
    <span class="ic"><i></i>${r.ic}</span>
    <div><div class="val">${r.val}</div><div class="say">${escapeHtml(r.say)}</div></div>
  </div>`).join("");
}

// 3 · rendimiento semanal (4 semanas de la serie diaria, anclada a HOY).
// Rediseño 2026-08-06 sobre maqueta de Oscar: gráfica GRANDE con píldoras
// de valor legibles, barras de volumen abajo (contexto), conmutador
// tokens/$ (misma curva en dos monedas — el $ es el costo REAL medido de
// cada semana, no una tarifa fija) y detalle al tocar punto o barra.
let repUnit=localStorage.getItem("repUnit")||"tok";
let repSel=3;
function repWeeks(d){
  const map=Object.fromEntries(((d.cur&&d.cur.daily)||[]).map(x=>[x.date,x]));
  const weeks=[];
  for(let b=3;b>=0;b--){
    let tok=0,ut=0,cost=0;
    for(let i=0;i<7;i++){
      const dt=new Date(Date.now()-(b*7+i)*864e5);
      const c=map[dt.toISOString().slice(0,10)];
      if(c){ tok+=c.tokens||0; ut+=c.uturns||0; cost+=c.cost||0; }
    }
    weeks.push({tok,ut,cost, pm:ut>0?tok/ut:null, pmu:ut>0?cost/ut:null});
  }
  return weeks;
}
function markRepUnit(){
  document.querySelectorAll(".usw").forEach(x=>x.classList.toggle("on",x.dataset.u===repUnit));
}
$("repUnitSw").addEventListener("click",e=>{
  const b=e.target.closest(".usw"); if(!b) return;
  repUnit=b.dataset.u; localStorage.setItem("repUnit",repUnit); markRepUnit();
  if(repData){ renderRepChart(repData); }
});
function renderRepChart(d){
  const weeks=repWeeks(d);
  if(weeks.filter(w=>w.pm!=null).length<2){ $("repChartSect").hidden=true; return; }
  $("repChartSect").hidden=false;
  markRepUnit();
  if(weeks[repSel]&&weeks[repSel].pm==null) repSel=3;
  const lab=w=> repUnit==="tok"?repFmtN(w.pm):"$"+w.pmu.toFixed(2);
  const MONO="ui-monospace,'Cascadia Code',Consolas,monospace";
  const W=430,H=252, topPad=42, lineBase=160, barTop=170, barBase=206;
  const xs=weeks.map((_,i)=>32+i*(W-64)/3);
  const nums=weeks.filter(w=>w.pm!=null).map(w=>w.pm);
  const vmax=Math.max(...nums), vmin=Math.min(...nums);
  const span=Math.max(vmax-vmin, vmax*0.15, 1);
  const Y=v=>topPad+(vmax-v)/span*(lineBase-topPad);
  const volMax=Math.max(...weeks.map(w=>w.tok),1);
  const names=[t("rep_w3"),t("rep_w2"),t("rep_w1"),t("rep_w0")];
  let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="rpArea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--accent)" stop-opacity=".24"/>
      <stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient>
    <linearGradient id="rpStk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="var(--accent)"/><stop offset="1" stop-color="var(--teal)"/></linearGradient></defs>`;
  // barras de volumen (contexto, abajo)
  weeks.forEach((w,i)=>{
    const h=Math.max(3,(w.tok/volMax)*(barBase-barTop));
    const hot=i===repSel;
    s+=`<g class="pt" data-i="${i}">
      <rect x="${xs[i]-15}" y="${barBase-h}" width="30" height="${h}" rx="7"
        fill="${hot?"rgba(124,140,255,.42)":"rgba(124,140,255,.18)"}"/>
      <text x="${xs[i]}" y="${barBase+14}" text-anchor="middle" font-size="10"
        font-family="${MONO}" fill="${hot?"var(--txt)":"var(--txt-dim)"}"
        font-weight="${hot?"700":"400"}">${fmtTok(w.tok)}</text>
      <text x="${xs[i]}" y="${barBase+28}" text-anchor="middle" font-size="10"
        fill="${hot?"var(--txt)":"var(--txt-dim)"}" font-weight="${hot?"800":"500"}">${escapeHtml(names[i])}</text>
    </g>`;
  });
  // área + línea de eficiencia (solo semanas con datos)
  const pts=weeks.map((w,i)=>w.pm==null?null:[xs[i],Y(w.pm),i]).filter(Boolean);
  const line=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  s+=`<path d="${line} L ${pts[pts.length-1][0].toFixed(1)} ${lineBase} L ${pts[0][0].toFixed(1)} ${lineBase} Z" fill="url(#rpArea)"/>
      <path d="${line}" fill="none" stroke="url(#rpStk)" stroke-width="3.5"
        stroke-linecap="round" stroke-linejoin="round"/>`;
  // puntos + píldoras de valor GRANDES, nunca sobre la línea
  pts.forEach(p=>{
    const i=p[2], w=weeks[i], hot=i===repSel, tx=lab(w);
    const tw=tx.length*8.2+18, cy=p[1];
    s+=`<g class="pt" data-i="${i}">
      <rect x="${(p[0]-tw/2).toFixed(1)}" y="${(cy-34).toFixed(1)}" width="${tw.toFixed(1)}" height="22" rx="11"
        fill="${hot?"var(--teal)":"var(--card-hi)"}" stroke="${hot?"rgba(79,209,224,.4)":"var(--stroke)"}"/>
      <text x="${p[0].toFixed(1)}" y="${(cy-19).toFixed(1)}" text-anchor="middle" font-size="12.5" font-weight="800"
        font-family="${MONO}" fill="${hot?"var(--accent-ink)":"var(--txt-mut)"}">${tx}</text>
      <circle cx="${p[0].toFixed(1)}" cy="${cy.toFixed(1)}" r="${hot?6.5:4.5}"
        fill="${hot?"var(--teal)":"var(--card)"}" stroke="${hot?"rgba(79,209,224,.35)":"var(--accent)"}"
        stroke-width="${hot?7:2.5}"/>
    </g>`;
  });
  s+="</svg>";
  $("repChart").innerHTML=s;
  $("repChart").querySelectorAll(".pt").forEach(el=>el.addEventListener("click",()=>{
    repSel=+el.dataset.i;
    renderRepChart(d); // re-pinta resaltado + detalle
  }));
  renderRepDet(weeks);
}
function renderRepDet(weeks){
  const w=weeks[repSel];
  const det=$("repDet");
  if(!w||w.pm==null){ det.hidden=true; return; }
  det.hidden=false;
  const prev=weeks[repSel-1];
  let cmp;
  if(!prev||prev.pm==null) cmp=escapeHtml(t("rep_det_first"));
  else{
    const ch=Math.round((w.pm-prev.pm)/prev.pm*100);
    cmp = ch===0?escapeHtml(t("rep_det_same"))
        : ch>0?`<span class="wr2">${escapeHtml(t("rep_det_dearer",ch))}</span>`
              :`<span class="ok2">${escapeHtml(t("rep_det_cheaper",-ch))}</span>`;
  }
  const names=[t("rep_w3"),t("rep_w2"),t("rep_w1"),t("rep_w0")];
  det.innerHTML=t("rep_det", escapeHtml(names[repSel]), repFmtN(w.pm),
      `<span class="as-money">$${w.pmu.toFixed(2)}</span>`, fmtTok(w.tok),
      `<span class="as-money">$${Math.round(w.cost)} ${escapeHtml(t("rep_est_word"))}</span>`)
    +` · ${cmp}<div class="tap">${escapeHtml(t("rep_det_tap"))}</div>`;
}

// 4 · proyectos con su delta y su "por qué" (SOLO de detectores reales)
function renderRepProj(d){
  if(!d.cur){ $("repProj").innerHTML=`<div class="rp-empty">${t("fnd_err")}</div>`; return; }
  const projs=(d.cur.projects||[]).slice(0,6).map(p=>({...p,...splitSrc(p.name)}));
  if(!projs.length){ $("repProj").innerHTML=`<div class="rp-empty">${escapeHtml(t("no_activity"))}</div>`; return; }
  const prevMap={}; ((d.prev&&d.prev.projects)||[]).forEach(p=>prevMap[p.name]=p);
  // el hallazgo MÁS CARO de cada proyecto explica "qué lo encareció";
  // sin hallazgo no se inventa causa (invariante #8: mejor callar)
  const ign=fndIgnored(), worst={};
  for(const f of d.fnd||[]){
    if(ign.has(fndKey(f))) continue;
    const k=fndProj(f.project||"");
    if(!worst[k]||f.cost>worst[k].cost) worst[k]=f;
  }
  $("repProj").innerHTML=projs.map((p,i)=>{
    const q=prevMap[p.name];
    let cls="flat",sym="=",tip=t("rep_t_flat");
    if(q){
      const dd=p.cost-q.cost, thr=Math.max(q.cost*0.1,0.5);
      if(dd<=-thr){ cls="down"; sym="↓"; tip=t("rep_t_down"); }
      else if(dd>=thr){ cls="up"; sym="↑"; tip=t("rep_t_up"); }
    }else if(p.cost>=0.5){ cls="up"; sym="↑"; tip=t("rep_t_new"); }
    const c=PALETTE[i%PALETTE.length];
    const w=worst[p.base];
    return `<div class="rp-pj">
      <div class="pav" style="color:${c}"><i style="background:${c}"></i>${escapeHtml(projInitials(p.base))}</div>
      <div class="ptx"><div class="pname"><span>${escapeHtml(p.base)}</span>${p.src?`<span class="srctag">${escapeHtml(p.src)}</span>`:""}</div></div>
      <span class="ptok">${fmtTok(p.tokens)} tok</span>
      <span class="amt">$${p.cost.toFixed(2)}</span>
      <span class="rp-trend ${cls}" title="${escapeHtml(tip)}">${sym}</span>
    </div>${w?`<div class="rp-why"><b>${escapeHtml(t("rep_why"))}</b> ${withCmds(fndTitle(w))}</div>`:""}`;
  }).join("");
}

// 5 · lo que arreglaste (marcas de fndTrackHist) con su efecto medido
function renderRepFix(d){
  let marks=[]; try{ marks=JSON.parse(localStorage.getItem("fndMarks")||"[]"); }catch(_){}
  if(!marks.length){
    $("repFix").innerHTML=`<div class="rp-empty">${withCmds(t("rep_fix_none"))}</div>`;
    return;
  }
  const daily=(d.cur&&d.cur.daily)||[];
  const perfBetween=(a,b)=>{ // [a,b) en ms; null si no hay turnos
    let tok=0,ut=0;
    for(const x of daily){
      const ts=fromYmd(x.date).getTime();
      if(ts>=a&&ts<b){ tok+=x.tokens||0; ut+=x.uturns||0; }
    }
    return ut>0?{p:tok/ut,days:new Set(daily.filter(x=>{const ts=fromYmd(x.date).getTime();
      return ts>=a&&ts<b&&x.uturns>0;}).map(x=>x.date)).size}:null;
  };
  const MIN_AFTER=5; // días de datos antes de afirmar nada (regla del doc)
  $("repFix").innerHTML=marks.slice(-4).reverse().map(m=>{
    // PIEZA 4: manda la foto CONGELADA al clavar la marca (m.b); solo si no
    // la hay (marcas nacidas antes de esta pieza) se recalcula desde los
    // logs vivos, que es lo que puede haber desaparecido.
    const before=m.b&&m.b.p>0 ? m.b : perfBetween(m.date-14*864e5, m.date);
    const after=perfBetween(m.date, Date.now());
    const when=new Date(m.date).toLocaleDateString(lang,{day:"2-digit",month:"short"});
    let body;
    if(before&&after&&after.days>=MIN_AFTER){
      body=`<div class="rp-ba">
        <div class="cell"><div class="n">${repFmtN(before.p)}</div><div class="l">${escapeHtml(t("rep_ba_before"))}</div></div>
        <span class="arr">→</span>
        <div class="cell after"><div class="n">${repFmtN(after.p)}</div><div class="l">${escapeHtml(t("rep_ba_after"))}</div></div>
      </div>
      <div class="est">${escapeHtml(t("rep_est_days",after.days))}</div>`;
    }else{
      body=`<div class="est">${escapeHtml(t("rep_fix_wait",MIN_AFTER))}</div>`;
    }
    return `<div class="rp-fix">
      <div class="when">${escapeHtml(when)}</div>
      <div class="did">${withCmds(m.t||m.kind)}</div>
      ${body}</div>`;
  }).join("");
}

// skills, claudemd) no llevan `ts` y no enseñan nada — no describen un
// momento, sino una configuración.
function fmtWhen(ts){
  if(!ts) return "";
  const d=new Date(ts*1000), now=new Date();
  const min=Math.floor((now-d)/6e4);   // floor: 30 s son "ahora", no "1 min"
  if(min<1) return t("when_now");
  if(min<60) return t("when_min",min);
  const hoy=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const hora=d.toLocaleTimeString(lang,{hour:"2-digit",minute:"2-digit"});
  if(d>=hoy){
    const h=Math.round(min/60);
    return h<6 ? t("when_hour",h) : hora;
  }
  const ayer=new Date(hoy); ayer.setDate(ayer.getDate()-1);
  if(d>=ayer) return t("when_yday")+" "+hora;
  return d.toLocaleDateString(lang,{day:"2-digit",month:"short"})+" "+hora;
}

// "-opt-projects-michiclaude" o "C--Users-oscar-mi-proyecto"
// Nombre de proyecto para enseñar. Desde 2026-08-01 el backend lo manda YA
// RESUELTO (del `cwd` de la sesión), así que aquí solo se limpia lo que
// venga codificado —un exportador viejo, o un log sin cwd—: la carpeta de
// logs es la ruta entera con los separadores cambiados por guiones
// ("-opt-projects-michiclaude", "C--Users-oscar-Claude-test-agente").
// Un nombre ya resuelto se devuelve TAL CUAL: recortarlo por el último
// guion partía los nombres compuestos ("test-agente" -> "agente").
function fndProj(raw){
  const s=String(raw);
  const m=s.match(/projects-(.+)$/);
  if(m) return m[1];
  if(!s.startsWith("-") && !s.includes("--")) return s;   // ya viene limpio
  return s.replace(/^-+/,"").split("-").pop() || s;
}

  const fresh=saved.filter(x=>!seen.has(x.k)&&!ign.has(x.k));

// Automático out-of-band, SOLO LOCAL: cerrar MCPs zombies y archivar
// JSONL ≥365 días. El backend ejecuta y registra; AQUÍ vive el desbloqueo
// progresivo: la primera vez de cada acción SIEMPRE la aplica el usuario
// con su clic — sin esa primera manual el interruptor automático no
// tiene efecto ("Michi no automatiza lo que no entiendes").
//   remCfg   {zombie:bool, archive:bool} — interruptores (zombie ON por
//            defecto: riesgo bajo real; archive OFF por defecto)
//   remFirst {zombie:ts, archive:ts} — sello de la primera manual
function remCfg(){ try{ return JSON.parse(localStorage.getItem("remCfg")||"{}"); }catch(_){ return {}; } }
function remOn(k){ const c=remCfg(); return k in c ? !!c[k] : k==="zombie"; }
function remFirstSet(){ try{ return JSON.parse(localStorage.getItem("remFirst")||"{}"); }catch(_){ return {}; } }
function remUnlocked(k){ return !!remFirstSet()[k]; }
function remMarkManual(k){
  const f=remFirstSet();
  if(!f[k]){ f[k]=Date.now(); localStorage.setItem("remFirst",JSON.stringify(f));
    flog("rem: primera manual de "+k+" — automático desbloqueado"); remUi(); }
}
function remUi(){
  $("remZombieChk").checked=remOn("zombie");
  $("remArchChk").checked=remOn("archive");
  // el candado solo se enseña cuando el automático está pedido pero aún
  // no ganado — con el interruptor apagado no hay nada que explicar
  $("remZombieLock").hidden=!(remOn("zombie")&&!remUnlocked("zombie"));
  $("remArchLock").hidden=!(remOn("archive")&&!remUnlocked("archive"));
  // Desbloqueo progresivo del relevo (etapa 3c): se enseña el marcador para
  // que el usuario vea que va acumulando, en vez de un automático que
  // aparece de la nada un día.

    c["/compact"]||0, RELAY_UNLOCK["/compact"], c["/clear"]||0, RELAY_UNLOCK["/clear"]);

  // el candado solo se explica cuando el automático está PEDIDO y aún no
  // ganado; con el interruptor apagado no hay nada que aclarar

  $("rlyAutoLock").hidden=!(remOn("relay")&&falta>0);
  $("rlyAutoLock").textContent=t("rly_auto_lock",falta);

  // compactar) y su propio candado de 3 manuales

  const faltaC=Math.max(0,RELAY_UNLOCK["/clear"]-(c["/clear"]||0));
  $("rlyClearLock").hidden=!(remOn("relayClear")&&faltaC>0);
  $("rlyClearLock").textContent=t("rly_auto_lock",faltaC);
  // camino por INFERENCIA: solo tiene sentido con el /clear automático ya
  // pedido, y sin el análisis local encendido no dispararía nunca — se dice
  // en vez de dejar un interruptor que no haría nada (invariante #8)
  $("rlyClearAiChk").checked=remOn("relayClearAi");

// ---------- visor de copias del /clear (2026-08-13) ----------
// Enseña el CONTENIDO de la copia en el propio panel. Las .jsonl (la copia
// que hace el relevo del chat) se pintan como transcript legible — quién
// dijo qué y qué herramientas corrieron; las .md (el /export de la
// terminal) tal cual. El texto pasa por escapeHtml SIEMPRE: la copia es
// contenido del usuario, no HTML.
// Envoltorios que Claude Code o el IDE inyectan con rol user: un /comando,
// la salida de un comando local, el <ide_…> de la extensión, un recordatorio
// del sistema. No los dijiste tú, así que no se pintan — MISMA lista que
// `user_turn_text` del backend (lib.rs), que ya los descarta para contar
// turnos humanos. Sin esto la primera línea del visor era el propio
// "<command-name>/clear</command-name>" en crudo (captura de Oscar,
// 2026-08-17).
const HAND_WRAP=["<command-","<local-command","<ide_","<system-reminder",
  "[Request interrupted"];
function handRender(name,txt){
  if(!name.endsWith(".jsonl")) return escapeHtml(txt);
  const out=[];
  for(const ln of txt.split("\n")){
    const s=ln.trim(); if(!s) continue;
    let v; try{ v=JSON.parse(s); }catch(_){ continue; }
    if(v.isMeta) continue;
    const m=v.message||{};
    if(v.type==="user"){
      const arr=Array.isArray(m.content)?m.content:[];
      // bloque a bloque: un recordatorio del sistema viaja PEGADO al mensaje
      // de verdad (bloque aparte o cola del mismo), y unirlo todo antes de
      // mirar dejaría las tripas dentro
      const tx=(typeof m.content==="string"?[m.content]
        :arr.filter(b=>b&&b.type==="text").map(b=>String(b.text||"")))
        .map(x=>x.replace(/<system-reminder>[\s\S]*?<\/system-reminder>/g,"").trim())
        .filter(x=>x&&!HAND_WRAP.some(p=>x.startsWith(p))).join("\n");
      // una captura pegada no tiene texto: que se vea que hubo algo
      const img="🖼".repeat(arr.filter(b=>b&&b.type==="image").length);
      const body=[tx&&escapeHtml(tx),img].filter(Boolean).join("\n");
      if(body) out.push("<b>· "+t("hand_you")+"</b>\n"+body);
    }else if(v.type==="assistant"){
      for(const b of (m.content||[])){
        if(!b) continue;
        if(b.type==="text"&&b.text) out.push("<b>· Claude</b>\n"+escapeHtml(b.text));
        else if(b.type==="tool_use") out.push("<b>· ⚙ "+escapeHtml(b.name||"tool")+"</b>");
      }
    }
  }
  return out.join("\n\n")||escapeHtml(txt);
}

// La tarjeta de zombies entra al pipeline normal de Consejos (leído estilo
// Gmail, ✕, TTL) como la de intención. La clave incluye el arranque del
// zombie más nuevo: un LOTE nuevo re-avisa aunque el anterior se haya
// despachado; el mismo lote despachado no resucita (tipSeen).
function zombieCardSynth(){
  if(!lastZombies.length) return;
  const sess=String(Math.max(...lastZombies.map(z=>z.start||0)));
  const k="zombie|"+sess;
  const mem=lastZombies.reduce((a,z)=>a+(z.mem||0),0);
  const h={rule:"zombie",session:sess,value:lastZombies.length,mem,
    list:lastZombies.map(z=>({pid:z.pid,name:z.name,server:z.server,start:z.start,mins:z.mins,mem:z.mem}))};
  const seen=tipSeenSet(), cards=coachCardsStore();
  const c=cards.find(x=>x.h.rule==="zombie");
  if(seen.has(k)){
    // la viva se refresca con la medición nueva sin renacer (como intent)
    if(c&&c.h.session===sess&&JSON.stringify(c.h)!==JSON.stringify(h)){
      c.h=h; saveCoachCards(cards);
      if(!$("tab-tips").hidden) renderTips();
    }
    return;
  }
  seen.add(k); localStorage.setItem("tipSeen",JSON.stringify([...seen].slice(-300)));
  const i=cards.findIndex(x=>x.h.rule==="zombie"); if(i>=0) cards.splice(i,1);
  cards.push({h,born:Date.now()});
  saveCoachCards(cards);
  flog("rem: nace tarjeta zombie ×"+lastZombies.length);
  renderTipsDot();
  if(lastPillArgs) emitPill(...lastPillArgs);
  if(!$("tab-tips").hidden) renderTips();
}

// ---------- relevo: descubrimiento (docs/remediacion.md etapa 3b) ----------
// `michi claude` (crate aparte, binario michi.exe) envuelve Claude Code en una
// ConPTY y deja su estado en un archivo por sesión; get_relays devuelve las
// VIVAS (estado de menos de 15 s). ESTA ETAPA SOLO MIRA: enseñar quién tiene
// relevo y si aceptaría un comando ahora mismo. Pedirlo es la 3c — y quien
// decide sigue siendo el relevo, que re-verifica R1-R3 al escribir.
let relays=[];
// Identidad para casar una sesión de los logs con un relevo: la ruta completa
// normalizada. En Windows conviven las dos barras y da igual mayúsculas.
function cwdKey(p){ return String(p||"").replace(/\\/g,"/").replace(/\/+$/,"").toLowerCase(); }
// El relevo de una sesión, o null. FAIL-CLOSED en la ambigüedad: si dos
// relevos comparten carpeta no hay forma de saber cuál es esta sesión, y
// adivinar sería teclear en la terminal equivocada.
function relayFor(h){
  if(!h) return null;
  // La MÁQUINA tiene que ser la misma: un hit del VPS solo puede casar con un
  // relevo del VPS. `origin` vacío = esta máquina, en los dos lados.
  const mismos=relays.filter(r=>(r.origin||"")===(h.origin||""));
  // 1) por session_id: EXACTO, sin heurística. Solo lo trae el modo chat,
  //    donde el protocolo lo regala. Es el casado bueno.
  const porSid=mismos.filter(r=>r.sid && h.session &&
    r.sid.slice(0,8)===String(h.session).slice(0,8));
  if(porSid.length===1) return porSid[0];
  // 2) por carpeta: lo de siempre, fail-closed ante ambigüedad
  const k=cwdKey(h.scwd);
  if(!k) return null;
  const c=mismos.filter(r=>cwdKey(r.cwd)===k);
  return c.length===1?c[0]:null;
}
// Motivo del "no" en llano. El backend manda códigos y el panel traduce
// (invariante #10); un código que no conozcamos se enseña tal cual antes que
// mentir con una frase bonita.
function rlyWhy(code){
  const k="rly_e_"+String(code||"").replace("ERR_RELAY_","").toLowerCase();
  return I18N.en[k]?t(k):(code||"");
}
// La sesión de los logs que corresponde a un relevo — el mismo emparejamiento
// que relayFor(), leído al revés y con la misma regla fail-closed. Sirve para
// enseñar en la fila cuánto contexto lleva esa sesión: es la prueba visible de
// que el casado funciona sin tener que esperar a una sesión al 80%.
function pressForRelay(r){
  const mismos=pressAll.filter(h=>(h.origin||"")===(r.origin||""));
  const porSid=mismos.filter(h=>r.sid && h.session &&
    r.sid.slice(0,8)===String(h.session).slice(0,8));
  if(porSid.length===1) return porSid[0];
  const k=cwdKey(r.cwd); if(!k) return null;
  const c=mismos.filter(h=>cwdKey(h.scwd)===k);
  return c.length===1?c[0]:null;
}
function rlyRows(){
  const el=$("rlyList"); if(!el) return;

    const s=r.ready?`<span class="rly-s ok">${t("rly_ready")}</span>`

      pressPct(p)}%</span>`:"";

    // decisión necesita el contexto de la tarjeta de intención —el veredicto
    // y el aviso de pendientes—, no una fila suelta en Ajustes.
    // de qué máquina y por qué vía: "vps · chat" dice más que un pid suelto
    const donde=[r.origin||t("src_local"), r.mode==="chat"?t("rly_chat"):null]

// Sondeo CORTO (5 s) y solo con Ajustes a la vista: el estado del relevo
// caduca en 15 s, así que enseñarlo viejo sería peor que no enseñarlo. Fuera
// de esa pestaña basta el ritmo del coach, que es quien necesita saber si la
// sesión bajo presión tiene relevo.
// `remote` cuesta una conexión SSH por servidor (y una lectura de
// \\wsl.localhost por distro), así que solo se pide en el compás del coach
// (adaptativo: 3 min en reposo, hasta 10 s bajo presión — coachSched). El
// sondeo de 5 s de la pestaña mira solo lo local y conserva
// lo de fuera que ya había —SSH y WSL llevan `origin`, lo local no—: mejor un
// dato de hace un par de minutos que una pestaña que congela cada 5 segundos.
async function rlyPoll(remote){
  if(!invoke) return;
  const previas=relays.filter(r=>r.origin);
  try{
    const v=await invoke("get_relays",{remote:!!remote})||[];
    relays = remote ? v : v.concat(previas);
  }catch(_){ relays=[]; }             // sin backend: como si no hubiera relevo
  relayUserCmds();
}
// Un /compact o /clear que TECLEAS TÚ cuenta para el desbloqueo igual que el
// botón — más aún: es la aplicación manual por antonomasia, y el candado
// dice "aplícalo tú una vez", no "pulsa mi botón una vez". El relevo ve pasar
// el comando y lo publica en `user_cmd`; hasta ahora el panel lo tiraba
// (lo cazó Oscar: aplicó un /clear a mano y el contador no se movió,
// 2026-08-08).
//
// Se cuenta una sola vez por (pid, momento): el sello vive en localStorage,
// así que ni un sondeo repetido ni un reinicio de la app lo cuentan dos veces.
// NO va al registro de acciones — ese es de lo que aplica MICHI, no tú.
function relayUserCmds(){
  let seen={}; try{ seen=JSON.parse(localStorage.getItem("relayUserSeen")||"{}"); }catch(_){}
  let dirty=false, nuevoClear=false;
  for(const r of relays){
    if(!r.user_cmd||!r.user_cmd_ts) continue;
    // La clave lleva el ORIGEN desde 2026-08-16: el pid solo es único DENTRO
    // de una máquina, y con WSL y el VPS en la lista dos sesiones distintas
    // podían compartirlo — la segunda se daba por vista y su globo no salía.
    // Se acepta el sello viejo (pid a secas) para no reabrir lo ya contado
    // al actualizar.
    const k=(r.origin||"")+"#"+r.pid;
    if(seen[k]===r.user_cmd_ts||seen[String(r.pid)]===r.user_cmd_ts) continue;
    seen[k]=r.user_cmd_ts; dirty=true;
    flog("relevo: "+r.user_cmd+" tecleado por el usuario en pid "+r.pid);
    relayMark(r.user_cmd);
    // GLOBO POST-/CLEAR (docs/remediacion.md §"El globo post-/clear"): el
    // /clear que tecleas tú no deja copia handoff, pero el .jsonl de la
    // sesión sigue en disco — el globo guarda las señas (sid del chat, o
    // cwd+momento en terminal) para que el visor lo encuentre al clic.
    if(r.user_cmd==="/clear"){
      clearedRemember({sid:r.sid||"", cwd:r.cwd||"", ts:r.user_cmd_ts||0,
        origin:r.origin||"", proj:r.project||"", file:"", you:true});
      nuevoClear=true;
    }
  }
  // El registro de acciones solo se pinta al ENTRAR en Ajustes, y su fila
  // nueva nace AQUÍ: si estabas mirando esa pestaña cuando tecleaste el
  // /clear, la lista se quedaba tal cual y parecía que la fila no existía
  // (lo vio Oscar 2026-08-17, con la pestaña abierta esperándola). Se
  // repinta en el sitio; fuera de Ajustes no hay nada que repintar.
  if(nuevoClear && !$("tab-prefs").hidden) remLogLoad();
  if(dirty){
    // solo las sesiones vivas: el sello no tiene por qué crecer para siempre
    // (las claves viejas —pid a secas— caducan solas por aquí)
    const vivos=new Set(relays.map(r=>(r.origin||"")+"#"+r.pid));
    for(const k of Object.keys(seen)) if(!vivos.has(k)) delete seen[k];
    localStorage.setItem("relayUserSeen",JSON.stringify(seen));
  }
}
// ---------- relevo: aplicar desde la interfaz (etapa 3c) ----------
// Segundos de countdown antes de teclear. Es la única ventana que tiene el
// usuario para parar a Michi, así que existe SIEMPRE, aunque acabe de pulsar
// él mismo. Corto en el manual (acaba de pedirlo y sabe qué va a pasar).
const RELAY_WAIT=5;
// Cuántas veces tiene que aplicarlo el usuario A MANO antes de que el
// automático se desbloquee. Mismo principio que los zombies de la etapa 2:
// Michi no automatiza lo que no has visto hacer. /clear pide una más porque
// borra la memoria de la conversación y eso no se deshace.
const RELAY_UNLOCK={"/compact":2,"/clear":3};
// Cuentas atrás en marcha. Mientras haya una, NADIE repinta las superficies
// que la contienen: un re-render se llevaría el botón por delante, el
// temporizador seguiría vivo sobre un nodo huérfano y la orden se aplicaría
// sin que el usuario viera nada. El countdown es su única ventana para
// pararlo; si desaparece de la pantalla, deja de ser una ventana.
let relayBusy=0;
function relayCount(){ try{ return JSON.parse(localStorage.getItem("relayDone")||"{}"); }catch(_){ return {}; } }
function relayUnlocked(cmd){ return (relayCount()[cmd]||0) >= (RELAY_UNLOCK[cmd]||99); }
function relayMark(cmd){
  const c=relayCount(); c[cmd]=(c[cmd]||0)+1;
  localStorage.setItem("relayDone",JSON.stringify(c));
  flog("relevo: "+cmd+" aplicado a mano ("+c[cmd]+"/"+(RELAY_UNLOCK[cmd]||"?")+")");
  if(!$("tab-prefs").hidden) remUi();
}
// Traduce el veredicto del relevo. Los códigos vienen crudos del backend
// (invariante #10) y rlyWhy ya sabe convertirlos; aquí solo se enmarca.
function relayFail(code){ return t("rly_failed", rlyWhy(code)); }
// Tras un /clear aplicado DESDE una tarjeta, el enlace a la conversación
// guardada se pone en la propia fila (2026-08-17). El nombre de la copia lo
// pone el registro de acciones —relay_inject lo anota ANTES de responder,
// así que la acción más reciente es la nuestra—; se guarda además en
// tipCopies para que un repintado no se lo lleve. Si algo falla, silencio:
// la copia sigue en el registro y esto es un atajo, no la única puerta.
async function relayCopyHint(btn, origin){
  let a=null;
  try{ a=((await invoke("get_action_log"))||[])[0]; }catch(_){ return; }
  if(!a||a.kind!=="relay"||!a.ok||!a.file) return;
  const cp={file:a.file, origin:a.origin||origin||""};
  const ck=btn.closest(".tip")?.dataset.ck||"";
  if(ck) tipCopies.set(ck,cp);
  const row=btn.closest(".int-row");
  if(!row||row.querySelector(".hnd-open")) return;
  const b=document.createElement("button");
  b.className="lnk hnd-open"; b.textContent=t("rem_log_copy");
  b.dataset.f=cp.file; b.dataset.o=cp.origin;
  b.addEventListener("click",e=>{ e.stopPropagation(); handView(cp.file,cp.origin); });
  row.appendChild(b);
}
// El motivo del rechazo va a su propia línea dentro de la fila, NUNCA dentro
// del botón: ahí lo estiraba hasta salirse del panel. Se crea al vuelo y se
// borra sola; `.int-msg:empty` la esconde para no dejar un hueco.
function relayMsg(btn,txt){
  const row=btn.closest(".int-row,.rly-r")||btn.parentElement;
  if(!row) return;
  let m=row.querySelector(".int-msg");
  if(!m){ m=document.createElement("span"); m.className="int-msg"; row.appendChild(m); }
  m.textContent=txt||"";
}
// Cuenta atrás sobre el propio botón y, al llegar a cero, la orden. Mientras
// corre, el botón ES el botón de cancelar: un solo control, imposible
// confundirse. Si el usuario cancela, no se escribe nada en ningún sitio.
function relayApply(btn){
  const label=btn.dataset.label||btn.textContent;
  btn.dataset.label=label;
  if(btn.dataset.running){                 // segundo clic = parar
    clearInterval(+btn.dataset.timer);
    delete btn.dataset.running;
    relayBusy=Math.max(0,relayBusy-1);
    btn.textContent=label;
    flog("relevo: cancelado por el usuario");
    return;
  }
  const cmd=btn.dataset.cmd||"", pid=+btn.dataset.pid||0;
  let left=RELAY_WAIT;
  relayBusy++;
  btn.dataset.running="1";
  btn.textContent=t("rly_applying",left);
  const tick=setInterval(async ()=>{
    left--;
    if(left>0){ btn.textContent=t("rly_applying",left); return; }
    clearInterval(tick);
    delete btn.dataset.running;
    btn.textContent="…";
    relayBusy=Math.max(0,relayBusy-1);
    // R4: que el countdown termine NO es un permiso. El relevo vuelve a
    // comprobar el candado en el instante de escribir y puede negarse — por
    // ejemplo si el usuario se puso a teclear durante la cuenta atrás.
    // Con /clear va SIEMPRE la red (/export verificado antes de borrar) si
    // el relevo la sabe hacer (v2); a uno viejo no se le pide — ignoraría
    // la marca y borraría sin copia.
    const rlyV=relays.find(r=>r.pid===pid&&(r.origin||"")===(btn.dataset.origin||""));
    const exp=cmd==="/clear"&&!!rlyV&&(rlyV.v||1)>=2;
    try{
      await invoke("relay_inject",{pid,text:cmd,auto:false,origin:btn.dataset.origin||"",export:exp});
      btn.textContent=t("rly_applied");
      relayMsg(btn,"");
      relayMark(cmd);
      flog("relevo: aplicado "+cmd+" en pid "+pid);
      remLogLoad();
      if(cmd==="/clear") relayCopyHint(btn, btn.dataset.origin||"");
      setTimeout(()=>{ btn.textContent=label; },4000);
    }catch(err){
      // el botón recupera su etiqueta corta y el porqué baja a su línea
      btn.textContent=label;
      relayMsg(btn,relayFail(String(err)));
      flog("relevo: NO aplicado "+cmd+" — "+err);
      setTimeout(()=>{ relayMsg(btn,""); },6000);
    }
  },1000);
  btn.dataset.timer=String(tick);
}

// ---------- el automático (etapa 3c-2) ----------
// Michi aplica /compact sin que pulses. Cuatro condiciones, todas duras:
// interruptor encendido, desbloqueo ganado a mano, relevo casado sin
// ambigüedad, y WIDGET A LA VISTA — porque la cuenta atrás vive en la
// cápsula y una cuenta atrás que nadie puede ver no es una cuenta atrás,
// es Michi tecleando a tus espaldas con un adorno.
//
// `/clear` en automático (lo pidió Oscar, 2026-08-09) SOLO con todo esto
// además: su PROPIO interruptor (nace apagado), sus 3 manuales ganadas,
// veredicto Boundary del clasificador (tarea CERRADA: todos al 100% o
// commit limpio — en la duda, /compact), y un relevo v2 que sepa hacer la
// red: /export VERIFICADO antes de borrar; sin copia no hay /clear
// (ERR_RELAY_EXPORT, fail-closed). La copia queda en <datos>/handoff/.
const RELAY_AUTO_WAIT=15;   // más larga que la manual: esto no lo pediste tú
// Cuenta atrás del /clear disparado por el ANÁLISIS LOCAL: el DOBLE que la
// del automático normal. La proporción es deliberada y sigue la escalera que
// ya usa el resto: 5 s cuando lo pides tú, 15 cuando lo decide un HECHO, 30
// cuando lo decide una INFERENCIA. Cuanto más blanda la razón, más tiempo
// para pararlo (docs/analisis-local.md §"El automático por inferencia").
const RELAY_AUTO_WAIT_AI=30;
let autoRun=null;           // {cmd,pid,timer} mientras corre la cuenta
// Memoria del automático por sesión: "done" = ya se aplicó y no se vuelve a
// tocar; un número = momento del último INTENTO fallido. Un rechazo del
// candado (Claude generando, texto sin enviar) es TRANSITORIO — quemar el
// único disparo por eso dejaba la sesión sin automático para siempre, que fue
// justo lo que le pasó a Oscar en la primera prueba real (2026-08-08).
const AUTO_RETRY_MIN=10;
function autoMap(){ try{ return JSON.parse(localStorage.getItem("relayAuto")||"{}"); }catch(_){ return {}; } }
function autoSave(m){
  // solo las 100 últimas: es una memoria, no un archivo histórico
  const ks=Object.keys(m).slice(-100), out={};
  for(const k of ks) out[k]=m[k];
  localStorage.setItem("relayAuto",JSON.stringify(out));
}
function autoBlocked(sid){
  const v=autoMap()[sid];
  if(v==="done") return true;                       // aplicado: no insistir
  if(typeof v==="number") return (Date.now()-v) < AUTO_RETRY_MIN*60000;
  return false;
}
function autoStamp(sid,val){ const m=autoMap(); m[sid]=val; autoSave(m); }
// El veredicto del ANÁLISIS LOCAL de esa sesión, tal como lo dejó
// maybeAiIntent en la tarjeta de intención. null = todavía no hay.
function aiVerdictFor(sid){
  try{
    const c=coachCardsStore().find(x=>x.h.rule==="intent"&&x.h.session===sid);
    return c&&c.ai&&c.ai.rec ? c.ai : null;
  }catch(_){ return null; }
}
// ¿El análisis está EN CAMINO para esa sesión? Sirve para que el automático
// espere el veredicto en vez de aplicar /compact antes de que el modelo
// alcance a hablar (si no, el camino nuevo no serviría de nada). Acotado en
// el tiempo: pasados AI_WAIT_MIN desde que nació la tarjeta se deja de
// esperar y el automático sigue su curso de siempre.
const AI_WAIT_MIN=10;
function aiPending(sid){
  try{
    const c=coachCardsStore().find(x=>x.h.rule==="intent"&&x.h.session===sid);
    // aiTried lo sella maybeAiIntent AL LANZAR: sin él no hay análisis en
    // camino (IA apagada, sin evidencia del exportador viejo, veredicto no
    // unsure) y esperar sería un plantón de 10 min — se sigue de largo.
    if(!c||!c.aiTried||c.ai||c.aiErr) return false; // sin lanzar, contestó o falló
    return (Date.now()-(c.born||0)) < AI_WAIT_MIN*60000;
  }catch(_){ return false; }
}
// Le dice al widget qué pintar. `mark` cierra la cuenta con ✓ o ✕: una cuenta
// atrás que termina en silencio no dice si actuó o no — y el usuario se queda
// adivinando, que es peor que no haber avisado.
function autoBeam(left,cmd,mark){
  EVENT?.emit("relay:auto", (left==null&&!mark)?null:{left,cmd,mark:mark||"",
    msg:mark?"":t("rly_auto_msg",cmd,left)});
}
function autoStop(why){
  if(!autoRun) return;
  clearInterval(autoRun.timer);
  flog("relevo auto: cancelado ("+why+")");
  autoRun=null;
  autoBeam(null);
}
// El widget manda parar (un toque en la cápsula). También lo paran las manos
// del usuario: si teclea, el relevo rechaza la orden al re-verificar R1.
EVENT?.listen("relay:stop",()=>autoStop("el usuario"));
async function relayAutoCheck(pr){
  if(autoRun||simFnd||!invoke||!pr) return;
  if(!remOn("relay")) return;                // interruptor maestro del automático
  if(pressPct(pr)<INTENT_PCT) return;
  const sid=pr.session||"";
  if(!sid||autoBlocked(sid)) return;         // aplicado, o intento reciente
  const rly=relayFor(pr);
  if(!rly) return;                           // sin pareja inequívoca, nada
  // El candado en verde ANTES de arrancar (2026-08-13): con Claude generando
  // o texto sin enviar, la inyección nacía muerta al final de la cuenta — y
  // el rechazo costaba el reintento de 10 min, que en una rampa es perder la
  // carrera contra el auto-compact del ~94%. Ocupado es TRANSITORIO: no se
  // sella nada y el próximo sondeo (rápido bajo presión) vuelve a mirar.
  if(!rly.ready) return;
  if(!pillOn) return;                        // sin widget no hay cuenta atrás
  // ¿/clear con red o /compact? /clear SOLO con: su interruptor propio, sus
  // 3 manuales, un relevo v2 que sepa exportar antes, y una razón que lo
  // justifique. El hit "press" trae las señales del clasificador, así que
  // intentVerdict lee directo de él.
  //
  // DOS razones posibles, y la segunda es nueva (2026-08-12, pedida por
  // Oscar para probarla unos días — docs/analisis-local.md §"El automático
  // por inferencia"):
  //   a) HECHO: veredicto Boundary (lista de tareas cerrada o commit limpio).
  //   b) INFERENCIA: los hechos NO deciden (`unsure`) y el análisis local
  //      dice `clear` por `tema_nuevo`. Lleva interruptor APARTE porque
  //      cambia la naturaleza de la decisión, y encima exige que NO haya
  //      tareas abiertas: un hecho no se sobreescribe con una opinión —
  //      aunque `unsure` ya lo implica, se comprueba igual (defensa en
  //      profundidad: si mañana cambia intentVerdict, esto sigue en pie).
  const det=intentVerdict(pr);
  const aiv=aiVerdictFor(sid);
  const aiClear=remOn("relayClearAi")&&det==="unsure"&&(pr.topen||0)===0
    &&!!aiv&&aiv.rec==="clear"&&aiv.reason==="tema_nuevo";
  // Con el camino (b) armado y el veredicto aún en camino se ESPERA un ciclo:
  // el automático aplicaría /compact antes de que el modelo alcance a decir
  // "tema nuevo", y el camino nuevo nunca llegaría a usarse. La presión solo
  // sube, así que esperar no cuesta nada; aiPending está acotado en tiempo.
  if(remOn("relayClearAi")&&det==="unsure"&&aiPending(sid)) return;
  const clearOk=remOn("relayClear")&&relayUnlocked("/clear")&&(rly.v||1)>=2
    &&(det==="boundary"||aiClear);
  const cmd=clearOk?"/clear":"/compact";
  if(!clearOk&&!relayUnlocked("/compact")) return;
  // Se sella el INTENTO antes de empezar: si algo revienta a medias, el
  // sello impide un bucle que teclee en la terminal. Solo pasa a "done"
  // cuando de verdad se aplicó.
  autoStamp(sid, Date.now());
  // por INFERENCIA la cuenta es el doble: la razón es más blanda, el tiempo
  // para pararla más largo
  const byAi=clearOk&&det!=="boundary";
  let left=byAi?RELAY_AUTO_WAIT_AI:RELAY_AUTO_WAIT;
  flog("relevo auto: cuenta atrás para "+cmd+" en pid "+rly.pid
    +(clearOk?" (con red /export)":"")+(byAi?" [IA: tema_nuevo]":""));
  autoBeam(left,cmd);
  autoRun={cmd,pid:rly.pid,timer:setInterval(async ()=>{
    left--;
    if(left>0){ autoBeam(left,cmd); return; }
    clearInterval(autoRun.timer);
    autoRun=null;
    autoBeam(null);
    // R4: el relevo vuelve a comprobar R1-R3 al escribir. Si el usuario se
    // puso a teclear durante la cuenta, esto se rechaza — y está bien.
    try{
      await invoke("relay_inject",{pid:rly.pid,text:cmd,auto:true,origin:rly.origin||"",export:clearOk});
      autoStamp(sid,"done");                 // hecho: esta sesión ya está
      autoBeam(null,null,"ok");
      // quién lo decidió va al rastro: es EL dato de la prueba de unos días
      flog("relevo auto: aplicado "+cmd+(byAi?" por IA (tema_nuevo)":" por hecho"));
      // GLOBO POST-/CLEAR: el usuario puede no haber visto la cuenta (se
      // exige widget a la vista, no usuario delante). La copia acaba de
      // quedar en el registro — relay_inject la anota ANTES de responder,
      // así que la acción más reciente es esta. El sid del relevo va
      // completo (chat) o vacío (terminal): el corto del hit no sirve para
      // buscar archivos.
      if(cmd==="/clear"){
        let file="";
        try{
          const log=await invoke("get_action_log")||[];
          const a=log[0];
          if(a&&a.kind==="relay"&&a.ok&&a.file&&String(a.d1||"").startsWith("/clear")) file=a.file;
        }catch(_){}
        clearedRemember({sid:rly.sid||"", cwd:rly.cwd||"", ts:Math.floor(Date.now()/1000),
          origin:rly.origin||"", proj:rly.project||"", file});
      }
    }catch(e){
      // el candado se negó (Claude generando, texto sin enviar, copia que
      // no apareció: ERR_RELAY_EXPORT…). Es transitorio: NO se quema la
      // sesión, se reintenta en AUTO_RETRY_MIN.
      autoBeam(null,null,"err");
      flog("relevo auto: NO aplicado "+cmd+" — "+e+" (reintento en "+AUTO_RETRY_MIN+" min)");
    }
    setTimeout(()=>autoBeam(null),4000);     // el ✓/✕ no se queda a vivir ahí
    remLogLoad();
  },1000)};
}

function rtRowTxt(r){
  if(r.ev==="route") return t("rt_ev_route", r.type||"?", rtModelName(r.after));

function rtRender(rows){
  const beat=$("rtBeat"), el=$("rtLog"); if(!beat||!el) return;
  const day=Math.floor(Date.now()/1000)-86400;
  const hoy=rows.filter(r=>r.ts>=day);
  const routed=hoy.filter(r=>r.ev==="route");
  const h=routed.filter(r=>r.after==="haiku").length, sn=routed.filter(r=>r.after==="sonnet").length;
  const b=hoy.filter(r=>r.ev==="block"||r.ev==="escalate").length;
  if(!routed.length && !b) beat.textContent=t("rt_beat_none");
  else{
    const last=hoy[0];
    beat.textContent=t("rt_beat_today",routed.length,h,sn,b)
      +(last?" · "+t("rt_beat_last",fmtWhen(last.ts),rtWhere(last)):"");
  }
  const filas=rows.slice(0,15);
  if(!filas.length){ el.innerHTML=t("rt_log_empty"); return; }
  el.innerHTML=filas.map(r=>{

// solo si cabe en el límite de 3 días de ntfy.sh (el semanal puede no caber:
// entonces el inmediato ya dice el día y no se promete nada). +2 min de
// colchón por el jitter del resets_at.
function ntfyLimit(body, resets, kind){
  if(!ntfyOn()) return;
  const ms=resets ? new Date(resets)-Date.now() : 0;
  const fits=ms>6e4 && ms<(3*86400-3600)*1000;
  ntfyPush(body+(fits?" "+t("ntfy_promise"):""), 4, null);
  if(fits)

             Math.floor(new Date(resets).getTime()/1000)+120);

// El QR llega como matriz de módulos y se pinta aquí: sin PNG, sin librerías.
// Siempre negro sobre blanco, en los dos temas: un QR invertido no lo leen
// todas las cámaras.
function ntfyPaintQr(q){
  const cv=$("ntfyQr"), n=q.size, ctx=cv.getContext("2d");
  const px=Math.max(1, Math.floor(cv.width/(n+8)));   // 4 módulos de zona quieta
  const off=Math.floor((cv.width-px*n)/2);
  ctx.fillStyle="#ffffff"; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.fillStyle="#000000";
  for(let y=0;y<n;y++)for(let x=0;x<n;x++)
    if(q.cells[y*n+x]==="1") ctx.fillRect(off+x*px, off+y*px, px, px);
}

// ---- marcas de arreglo (motor del reporte) ----
// Historial de hallazgos "de estado": si uno llevaba días saliendo y deja
// de salir, el usuario lo arregló — se clava la fecha como MARCA para el
// antes/después del reporte. Solo con escaneos completos que terminan HOY
// (ventana ≥7 días, sin rango al pasado) y NUNCA con el simulador. Los de
// sesión (reread/inflate/cachebreak) quedan fuera a propósito: van y
// vienen con cada sesión y las marcas serían puro ruido.
const FND_MARK_KINDS=new Set(["mcp_unused","skills_unused","claudemd",
  "claudemdsize","hooks_noise","mech","subagents","acompact","paste"]);
const FND_MARK_MIN_SEEN=3*864e5;  // visto al menos 3 días…
const FND_MARK_GONE=2*864e5;      // …y desaparecido hace 2+ = arreglado
// PIEZA 4 · la FOTO DEL ANTES. Para decir "antes 8,400 → ahora 6,100" hoy
// habría que releer los logs de antes del arreglo… que pueden no existir
// mañana (un limpiador, el usuario, una máquina nueva). Así que en el
// momento EXACTO de clavar la marca se congela el rendimiento de los 14
// días previos, sacado del cuadernito (pieza 3, que sí sobrevive).
// La comparación futura es congelado-vs-hoy y ya no depende de nada.
async function fndFreezeBefore(until){
  try{
    const h=await invoke("get_daily_history",{days:60})||[];
    let tok=0,ut=0,days=0;
    for(const x of h){
      const ts=fromYmd(x.date).getTime();
      if(ts>=until-14*864e5&&ts<until&&(x.uturns||0)>0){
        tok+=x.tokens||0; ut+=x.uturns||0; days++;
      }
    }
    return ut>0?{p:tok/ut,days}:null;
  }catch(_){ return null; }
}
async function fndTrackHist(list){
  if(simFnd || fndRange || fndDays<7) return;
  let hist,marks;
  try{ hist=JSON.parse(localStorage.getItem("fndHist")||"{}"); }catch(_){ hist={}; }
  try{ marks=JSON.parse(localStorage.getItem("fndMarks")||"[]"); }catch(_){ marks=[]; }
  const now=Date.now(), cur=new Set();
  for(const f of list||[]){
    if(!FND_MARK_KINDS.has(f.kind)) continue;
    const k=fndKey(f); cur.add(k);
    const h=hist[k]||(hist[k]={f:now,kind:f.kind});
    h.l=now; h.t=fndTitle(f);   // el título (ya traducido) es solo para ENSEÑAR la marca
  }
  const nuevas=[];
  for(const [k,h] of Object.entries(hist)){
    if(cur.has(k)) continue;
    if((h.l-h.f)>=FND_MARK_MIN_SEEN && (now-h.l)>=FND_MARK_GONE){
      if(!marks.some(m=>m.k===k)){
        const m={k, kind:h.kind||k.split("|")[0], t:h.t||"", date:h.l};
        marks.push(m); nuevas.push(m);
        flog("marca: hallazgo arreglado — "+(h.t||k));
      }
      delete hist[k];
    }else if((now-h.l)>=30*864e5){ delete hist[k]; } // fantasma: ni marca ni ruido
  }
  while(marks.length>20) marks.shift();
  try{ localStorage.setItem("fndHist",JSON.stringify(hist));
       localStorage.setItem("fndMarks",JSON.stringify(marks)); }catch(_){}
  // la foto del antes se congela DESPUÉS de guardar (si el cuadernito falla,
  // la marca ya existe: se degrada a la vieja cuenta desde los logs)
  for(const m of nuevas){
    const b=await fndFreezeBefore(m.date);
    if(!b) continue;
    try{
      const ms=JSON.parse(localStorage.getItem("fndMarks")||"[]");
      const hit=ms.find(x=>x.k===m.k);
      if(hit&&!hit.b){ hit.b=b; localStorage.setItem("fndMarks",JSON.stringify(ms)); }
    }catch(_){}
  }
}

async function loadFindings(force){
  if(!invoke) return;
  if(fndBusy) return;
  if(fndCache && !force){ renderFindings(); return; }
  fndBusy=true;
  flog("fnd: escaneo "+fndPeriodLabel()+"…");
  // el primer escaneo de la sesión tarda segundos (SSH incluido): mientras
  // llega, se enseña el ÚLTIMO resultado disponible, con el "Analizando…"
  // en el pie para no vender lo viejo como fresco
  let warm=false;
  if(fndCache){
    // refresco de un reporte que ya está en pantalla (envejeció): lo viejo
    // se queda a la vista mientras el escaneo fresco corre detrás
    renderFindings();
    $("fndFoot").textContent=t("fnd_scanning");
    warm=true;
  }else{
    try{
      const s=JSON.parse(localStorage.getItem("fndCacheSaved")||"null");
      if(s && s.days===fndDays && Array.isArray(s.list)){
        fndCache=s.list; warm=true; renderFindings();
        $("fndFoot").textContent=t("fnd_scanning");
      }
    }catch(_){}
  }
  if(!warm){
    $("fndList").innerHTML=`<div style="font-size:11px;color:var(--txt-dim);margin-top:8px">${t("fnd_scanning")}</div>`;
    $("fndFoot").textContent="";
  }
  try{
    fndCache=(await invoke("get_findings",fndArgs())).findings||[];
    fndCacheAt=Date.now();
    fndTrackHist(fndCache);   // marcas de arreglo: solo con resultado FRESCO
    flog("fnd: escaneo ok, "+fndCache.length+" tarjetas ("+fndDays+"d)");
    try{ localStorage.setItem("fndCacheSaved",
      JSON.stringify({days:fndDays,list:fndCache})); }catch(_){}
    renderFindings();
  }
  catch(_){
    // con datos viejos ya en pantalla se quedan; el pie dice que falló
    if(warm) $("fndFoot").textContent=t("fnd_err");
    else $("fndList").innerHTML=`<div style="font-size:11px;color:var(--bad);margin-top:8px">${t("fnd_err")}</div>`;
  }
  finally{ fndBusy=false; }
}
function renderFindings(){
  const ign=fndIgnored();
  const list=(fndCache||[]).filter(f=>!ign.has(fndKey(f)));
  // los MÁS RECIENTES arriba (Oscar 2026-08-02: su hallazgo fresco quedaba
  // hasta abajo por ser barato). Los de sesión traen la hora de su última
  // actividad; los "de estado" (mcp, skills, claudemd, mech) no tienen hora
  // y quedan abajo ordenados por costo. El TOPE de 12 sigue cortando por
  // costo en el backend: esto solo cambia el orden de lectura.
  list.sort((a,b)=>(b.ts||0)-(a.ts||0) || b.cost-a.cost);
  const hid=(fndCache||[]).length-list.length;
  if(!list.length){
    $("fndList").innerHTML=`<div style="font-size:11.5px;margin-top:10px">${t("fnd_none")}</div>`;
  }else{
    const mins=fndMins();
    $("fndList").innerHTML=list.map(f=>{
      // severidad por costo, como los avisos: rojo duele, ámbar avisa
      const sev=f.cost>=10?"bad":f.cost>=1||f.kind==="mcp_unused"?"warn":"";
      const est=f.estimated?"~":"";
      const title=fndTitle(f);
      const k=fndKey(f).replace(/"/g,"&quot;");
      const meta=[f.file?f.file.split(/[\\/]/).pop():"",
        f.project?fndProj(f.project):"", f.origin||t("src_local")]
        .filter(Boolean).join(" · ");
      const cost=f.cost>0?`${est}$${f.cost.toFixed(2)} · ${est}${fmtTok(f.tokens)} tok`
        :f.tokens>0?`${est}${fmtTok(f.tokens)} tok`:"";
      // el importe destacado y las unidades apagadas: el dinero es lo que
      // ordena la lista, los tokens son el detalle
      const costHtml=f.cost>0
        ? `<b>${est}$${f.cost.toFixed(2)}</b> <span>· ${est}${fmtTok(f.tokens)} tok</span>`
        : f.tokens>0 ? `<b>${est}${fmtTok(f.tokens)} tok</b>` : "";
      return `<div class="fnd ${sev}${mins.has(fndKey(f))?" min":""}" data-k="${k}">
        <button class="fnd-x" data-k="${k}">${t("fnd_ignore")} ✕</button>
        <div class="fnd-top">
          <span class="fnd-sev"><i></i>${FND_ICON[f.kind]||FND_ICON._}</span>
          <div class="fnd-body">
            <div class="fnd-t">${title}</div>
            <div class="fnd-m"><span>${meta}</span>${
              f.ts?`<em class="fnd-when">${escapeHtml(fmtWhen(f.ts))}</em>`:""}</div>
            ${costHtml?`<div class="fnd-c">${costHtml}</div>`:""}
          </div>
        </div>
        <div class="fnd-f">${withCmds(t("fnd_"+f.kind.split("_")[0]+"_f")||"")}</div>
      </div>`;
    }).join("");
    // contraer/expandir con clic, como las fichas de Consejos (Oscar
    // 2026-08-04): se queda título+datos, se pliega la recomendación. La
    // pose se recuerda por hallazgo (fndMin) — salvo en simulador, que no
    // toca localStorage. El MISMO clic marca la tarjeta LEÍDA — estilo Gmail
    // (Oscar 2026-08-07): el contador y el post-it rojo descuentan una por
    // una según las tocas, no por abrir la pestaña. fndKey es independiente
    // de la ventana: el clic en la vista 7/30d apaga la entrada del aviso
    // (que nace del escaneo 1d).
    $("fndList").querySelectorAll(".fnd").forEach(el=>
      el.addEventListener("click",()=>{
        el.classList.toggle("min");
        if(!simFnd){
          const m=fndMins();
          if(el.classList.contains("min")) m.add(el.dataset.k);
          else m.delete(el.dataset.k);
          localStorage.setItem("fndMin",JSON.stringify([...m].slice(-300)));
          const seen=fndSeen();
          if(!seen.has(el.dataset.k)){
            seen.add(el.dataset.k);
            localStorage.setItem("fndSeen",JSON.stringify([...seen].slice(-300)));
            flog("fnd: leída con clic "+el.dataset.k);
            fndBadgeCalc();          // recalcula contador, post-it y campana
          }
        }
      }));
    // Ignorar no debe plegar la tarjeta al mismo tiempo: se detiene aquí.
    // Ignorada también apaga SU aviso (fndBadgeCalc excluye fndIgnore) —
    // antes lo hacía el marcado masivo del render, que ya no existe.
    $("fndList").querySelectorAll(".fnd-x").forEach(b=>b.addEventListener("click",e=>{
      e.stopPropagation();
      const ign2=fndIgnored(); ign2.add(b.dataset.k);
      localStorage.setItem("fndIgnore",JSON.stringify([...ign2]));
      renderFindings();
      fndBadgeCalc();
    }));
  }
  // Pie en DOS piezas (Oscar 2026-08-05): arriba el enlace para recuperar
  // lo ignorado —destacado, como "Más proyectos"— y debajo la nota del "~".
  // Antes iba todo en una línea gris y el enlace se perdía dentro.
  $("fndFoot").innerHTML =
    (hid>0 ? `<a href="#" id="fndRestore" class="fnd-restore">${t("fnd_restore",hid)}</a>` : "")
    + `<div class="fnd-note">${t("fnd_est_note")}</div>`;
  const r=$("fndRestore");
  if(r) r.addEventListener("click",e=>{ e.preventDefault();
    localStorage.removeItem("fndIgnore"); renderFindings();
    fndBadgeCalc(); });   // lo restaurado no leído vuelve a contar en el aviso
  // Pintar la lista ya NO marca nada como visto (Oscar 2026-08-07, estilo
  // Gmail): cada tarjeta se marca leída con SU clic (arriba, junto a fndMin)
  // o con su Ignorar. Abrir la pestaña —aunque sea sin querer— deja el
  // contador y el post-it intactos; se van descontando tarjeta por tarjeta.
  // Esto también entierra la TRAMPA DEL VIGILANTE (4 mordidas): ya no existe
  // "nace vista por estar mirando la pestaña".
}

$("rAdd").addEventListener("click",async()=>{

    // escribió y se usa esa; el comando lo arma siempre la app.
