// severidad para enseñar el mismo aviso en ámbar y en rojo)
function simBalloon(o){

// Usa los datos REALES cuando existen (tu propio reset, tu propia alarma) y
// solo inventa la fecha si aún no hay lectura de cuota.
function simReset(which, fallbackMs){
  const r = which==="session" ? lastPill?.session?.resets : lastPill?.weekly?.resets;
  return r || new Date(Date.now()+fallbackMs).toISOString();
}
function simAlarmBody(){
  const thr=[...getAlarms()].sort((a,b)=>b-a)[0]||80;
  return thr>=95 ? t("notif_hi",thr) : t("notif_lo",thr);
}
const SIM_CAT=[
  {m:"normal"},                                                        // sin globo
  {m:"fire",   b:()=>({kind:"alarm",   body:simAlarmBody()})},
  {m:"break",  b:()=>({kind:"break",   body:breakBody(simReset("session",8*60000))})},
  {m:"zzz",    b:()=>({kind:"zzz",     body:weekBody(simReset("weekly",3*24*3.6e6))})},
  {m:"normal", b:()=>({kind:"session", body:balloonBody("session")})}, // vuelve la cuota
];
// Guion de la PASTILLA: no hay mascota que cambiar, así que recorre los
// AVISOS — uno por cada severidad e icono del popover. La alarma sale dos
// veces a propósito: por debajo del 95% es ámbar y por encima es roja, y ver
// las dos seguidas es la única forma de comparar.
function simPillSeq(){
  const low=[...getAlarms()].sort((a,b)=>a-b)[0]||80;
  const seq=[
    {b:()=>({kind:"alarm", body:t("notif_lo",low), sev:"warn"})},
    {b:()=>({kind:"alarm", body:t("notif_hi",95),  sev:"danger"})},
    {b:()=>({kind:"break", body:breakBody(simReset("session",8*60000))})},
    {b:()=>({kind:"zzz",   body:weekBody(simReset("weekly",3*24*3.6e6))})},
  ];
  // el del presupuesto solo si el usuario puso uno: sin cifra real no se
  // inventa un importe (invariante: nada de datos de demo en la app real)
  const bg=+localStorage.getItem("budgetWeek")||0;
  if(bg>0) seq.push({b:()=>({kind:"budget", body:t("notif_budget", bg.toFixed(2), bg)})});
  seq.push({b:()=>({kind:"session", body:balloonBody("session")})});
  return seq;
}
let simSeq=SIM_CAT;
// minutos por estado, ajustables (admite decimales: 0.5 = 30 s). Se lee en
// cada paso, así que cambiarlo a media simulación afecta al siguiente estado.
function simMs(){ return Math.max(5, (parseFloat($("simMin").value)||1)*60)*1000; }
const simLeft=ms=> ms>=60000 ? Math.ceil(ms/60000)+" min" : Math.ceil(ms/1000)+" s";
function simPush(){
  if(lastPill){
    lastPill.mascot=mascotState(lastPill.session, lastPill.weekly?lastPill.weekly.pct:null);
    EVENT?.emit("quota:update", lastPill);

    EVENT?.emit("quota:update",{ok:false, mascot:simMascot||"normal",
      theme:document.body.classList.contains("light")?"light":"dark"});

function simLabel(){

function simStop(msg){
  clearTimeout(simTimer); clearInterval(simTick); simTimer=null; simTick=null;
  simRunning=false; simMascot=null; simB=null; simPush();
  invoke?.("set_notif_visible",{visible:false});
  processAcks();          // si había un aviso REAL pendiente, vuelve a salir
  $("simBtn").textContent=simLabel();
  $("simMsg").textContent=msg||"";
}
function simStep(i){
  if(i>=simSeq.length){ simStop("listo · de vuelta al estado real"); return; }
  const step=simSeq[i];
  simMascot=step.m||null; simPush();
  // el globo se queda entre pasos y solo cambia de texto (así no parpadea);
  // si al paso no le toca globo, se cierra
  simB = step.b ? step.b() : null;
  if(simB) simBalloon(simB);
  else invoke?.("set_notif_visible",{visible:false});
  let left=simMs();
  const paint=()=>{ $("simMsg").textContent=
    `${i+1}/${simSeq.length} · ${simB?(simB.sev||simB.kind):step.m} · ${simLeft(left)}`; };
  paint();
  clearInterval(simTick);
  simTick=setInterval(()=>{ left-=1000; if(left>0) paint(); },1000);
  simTimer=setTimeout(()=>simStep(i+1), left);
}

// Qué viaja: lo que define CÓMO usas la app. Fuera se quedan la posición del

function hubCfgSnapshot(srv){
  return {

    alarms: getAlarms(),

    // secreto, es una libreta de direcciones, y con varios servidores es lo
    // más pesado de rehacer a mano. Las LLAVES no viajan nunca: MichiClaude
    // no las tiene ni las lee — de eso se encarga el SSH del sistema.
    // Se pasa desde fuera y no se lee la variable `remotes`: esa solo se
    // rellena al abrir Fuentes de datos, así que guardar sin haber pasado por
    // esa pestaña dejaba la lista vacía sin decir nada (visto 2026-07-28).
    remotes: srv,
    // ntfy NO viaja, a propósito (2026-08-01, duda de Oscar): el topic ES
    // la contraseña del canal y esta pantalla promete "no guarda llaves ni
    // contraseñas". Tampoco hace falta —activarlo en otra PC son 30 s con
    // su propio QR— y tener un canal por máquina permite silenciar una sin
    // la otra desde la app ntfy. Si algún día se compartiera, serían los
    // booleanos (enabled/alarms), jamás el topic.
  };
}
// Se aplica sobre el almacén y luego se recarga el panel: hay ajustes que se
// leen al arrancar, y repintarlos uno a uno sería fácil de olvidar al añadir
// el siguiente.
function hubCfgApply(c){
  if(!c || typeof c!=="object") return false;
  const set=(k,v)=>{ if(v==null||v==="") localStorage.removeItem(k); else localStorage.setItem(k,String(v)); };
  if(c.lang && I18N[c.lang]) set("lang", c.lang);
  if(c.theme==="light"||c.theme==="dark") set("theme", c.theme);
  if(Array.isArray(c.alarms)) set("alarms", JSON.stringify(c.alarms));
  if(c.budgetWeek!=null) set("budgetWeek", c.budgetWeek);
  if([1,7,15,30].includes(+c.days)) set("days", +c.days);
  set("catArt",  c.catArt ==="auto" ? null : c.catArt);
  set("catSkin", c.catSkin==="auto" ? null : c.catSkin);
  // estos dos los guarda el backend, no el almacén del panel
  if(c.pillStyle) invoke?.("set_pill_style",{style:c.pillStyle==="cat"?"cat":"plain"});
  if(c.pillLayer) invoke?.("set_pill_layer",{layer:c.pillLayer});
  // Los servidores se FUSIONAN por host, no se reemplazan: si esta máquina
  // tiene uno que la otra no conocía, quitárselo la dejaría sin acceso, y
  // recuperar un servidor cuesta mucho más que borrar una fila de sobra.
  if(Array.isArray(c.remotes) && c.remotes.length){
    const byHost=new Map(remotes.map(r=>[r.host, r]));
    for(const r of c.remotes){
      if(r && typeof r.host==="string" && r.host.trim()) byHost.set(r.host, r);
    }
    invoke?.("save_remotes",{remotes:[...byHost.values()]});
  }
  return true;
}

// ---------- icono de bandeja dinámico ----------
// El % de sesión vive junto al reloj, como los medidores de batería/CPU: se
// dibuja en un canvas y el backend lo aplica como icono del tray (update_tray).
// (Windows 11 no permite incrustar ventanas en la barra; esta es la vía nativa.)
const HEX={ok:"#40b869",warn:"#e6a417",bad:"#f05a41",dim:"#9aa0aa"};
function colorHex(pct,pace){ if(pct>=95) return HEX.bad;
  if(pace!=null && pct>pace+8) return pct>85?HEX.bad:HEX.warn;
  if(pct>=80) return HEX.warn; return HEX.ok; }

function updateTray(ses, weekPct){
  if(!invoke) return;
  const S=32, cv=document.createElement("canvas"); cv.width=cv.height=S;
  const ctx=cv.getContext("2d");
  const label = ses ? String(Math.round(ses.pct)) : "–";
  const c = ses ? colorHex(ses.pct, ses.pace) : HEX.dim;
  ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.font=`bold ${label.length>2?18:24}px "Segoe UI",sans-serif`;
  const y = S/2 - (weekPct!=null?2:0);
  // Contorno oscuro antes del relleno: la barra de tareas puede ser clara,
  // oscura o de un color de acento, y el verde/ámbar sobre blanco se lava.
  // Con el contorno el número se lee sobre cualquier fondo sin tener que
  // detectar el tema de Windows (que además no cubre fondos personalizados).
  ctx.lineWidth=4; ctx.lineJoin="round"; ctx.strokeStyle="rgba(0,0,0,.85)";
  ctx.strokeText(label, S/2, y);
  ctx.fillStyle=c;
  ctx.fillText(label, S/2, y);
  if(weekPct!=null){                      // barrita semanal al pie del icono
    ctx.fillStyle="rgba(0,0,0,.55)"; ctx.fillRect(3,S-6,S-6,5);   // marco
    ctx.fillStyle="rgba(160,160,160,.55)"; ctx.fillRect(4,S-5,S-8,3);
    ctx.fillStyle=colorHex(weekPct,null);
    ctx.fillRect(4,S-5,Math.round((S-8)*Math.min(100,weekPct)/100),3);
  }
  // Sin datos, el tooltip dice POR QUÉ ("token vencido…"), no solo que no hay.
  // OJO (visto 2026-08-01 al volver de hibernar): Windows CORTA el tooltip de
  // la bandeja a 128 caracteres, y los motivos largos —los que traen
  // diagnóstico Y qué hacer— se quedaban a media frase ("…Usa Claude"), que
  // se lee como un error de la app. Si no cabe entero, se deja SOLO la
  // primera frase, que es el diagnóstico; la instrucción completa está en el
  // panel y en el globo del widget.
  let tip;
  if(ses) tip = t("tray_tip", Math.round(ses.pct), fmtReset(ses.resets),
                  weekPct!=null?Math.round(weekPct):null);
  else{
    const base=t("tray_no_data");
    let why=lastErrCode ? errText(lastErrCode) : "";
    if(why && (base.length+why.length+3)>120) why=firstSentence(why);
    tip = base + (why ? " · " + why : "");
  }
  invoke("update_tray",{rgba:Array.from(ctx.getImageData(0,0,S,S).data),
    width:S, height:S, tooltip:tip}).catch(()=>{});
}

// ---------- helpers de cuota ----------
function col(pct,pace){ if(pct>=95) return "var(--bad)";
  if(pace!=null && pct>pace+8) return pct>85?"var(--bad)":"var(--warn)";
  if(pct>=80) return "var(--warn)"; return "var(--ok)"; }
function fmtReset(iso){ if(!iso) return "";
  const ms=new Date(iso)-Date.now(); if(ms<=0) return t("reset_now");
  const h=Math.floor(ms/3.6e6),m=Math.floor(ms%3.6e6/6e4);
  return t("reset_in",h,m); }

function prettyBucket(k){
  return k.replace(/seven_day|7d/gi,"Weekly").replace(/five_hour|5h/gi,"Session")
          .replace(/[_-]/g," ").replace(/\b\w/g,c=>c.toUpperCase());
}

// Nombre bonito de modelo. GENÉRICO a propósito: sin lista de familias ni
// de versiones, para que los modelos que Anthropic saque mañana se
// identifiquen solos (mismo criterio que los buckets de cuota). Separa el
// id en palabras (familia) y números (versión), en cualquier orden:
//   claude-opus-4-5-20250929 -> Opus 4.5      claude-opus-5 -> Opus 5
//   claude-3-5-sonnet-latest -> Sonnet 3.5    claude-fable-5 -> Fable 5
function prettyModel(id){
  if(!id) return t("unknown_model");
  const s=String(id)
    .replace(/^claude-/i,"")        // prefijo de marca
    .replace(/\[[^\]]*\]/g,"")      // variantes entre corchetes: [1m]
    .replace(/-\d{8}$/,"");         // fecha del snapshot
  const words=[], nums=[];
  for(const tok of s.split(/[-_.]+/)){
    if(!tok || /^latest$/i.test(tok)) continue;
    if(/^\d+$/.test(tok)) nums.push(tok);
    else if(/^[a-z]+$/i.test(tok)) words.push(tok);
    // tokens mixtos (p. ej. "1m") se ignoran: no son familia ni versión
  }
  if(!words.length) return s || t("unknown_model");
  const name=words.map(w=>w[0].toUpperCase()+w.slice(1).toLowerCase()).join(" ");
  return nums.length ? `${name} ${nums.join(".")}` : name;
}

// ---------- cuota real (dinámica por plan) ----------
// Fuente principal: el array `limits` del endpoint. Fallback: búsqueda
// recursiva de objetos con { utilization } por si el endpoint cambia de forma.
function extractBuckets(node, path, out){
  if(!node || typeof node!=="object") return;
  const u = node.utilization ?? node.used_percent ?? node.percent_used;
  if(typeof u==="number"){
    const key=path.join("."), isSes=/five|5h|session/i.test(key);
    out.push({
      kind: isSes?"session":(/seven_day$|week/i.test(key)?"weekly_all":"weekly_scoped"),
      label: isSes?t("session_label"):prettyBucket(key),
      pct:Math.round(u<=1?u*100:u),
      resets:node.resets_at ?? node.reset_at ?? null}); return;
  }
  for(const [k,v] of Object.entries(node)) extractBuckets(v,[...path,k],out);
}

function parseQuota(data){
  const out=[];
  if(Array.isArray(data?.limits) && data.limits.length){
    for(const l of data.limits){
      const pct=Math.round(l.percent ?? l.utilization ?? 0);
      const resets=l.resets_at ?? null;
      let kind,label;
      if(l.kind==="session" || l.group==="session"){ kind="session"; label=t("session_label"); }
      else if(l.kind==="weekly_all"){ kind="weekly_all"; label=t("weekly_all"); }
      else if(l.kind==="weekly_scoped"){
        const m=l.scope?.model?.display_name || l.scope?.surface || "?";
        kind="weekly_scoped"; label=t("weekly_x", m);
      } else { kind=l.kind||l.group||"otro"; label=prettyBucket(l.kind||l.group||"otro"); }
      out.push({kind,label,pct,resets});
    }
  } else {
    extractBuckets(data,[],out);         // fallback recursivo
  }
  return out;
}

const WRANK={session:0,weekly_all:1,weekly_scoped:2};
let weeklyAllPct=null;   // % semanal global: lo usa la barrita del icono de bandeja

// marcador de ritmo: % del periodo ya transcurrido
function elapsedPct(resets,hours){ if(!resets) return null;
  const left=(new Date(resets)-Date.now())/3.6e6;
  return Math.round(Math.min(100,Math.max(0,(1-left/hours)*100))); }

function renderQuota(data){
  lastQuotaData=data;
  $("planTag").textContent = data?.plan?.name || data?.subscription?.plan || data?.plan_name || t("plan_sub");

  const buckets=parseQuota(data);
  const ses=buckets.find(b=>b.kind==="session");
  const weekly=buckets.filter(b=>b.kind!=="session")
    .sort((a,b)=>(WRANK[a.kind]??9)-(WRANK[b.kind]??9));
  const wkAll = weekly.find(b=>b.kind==="weekly_all") || weekly[0] || null;
  weeklyAllPct = wkAll ? wkAll.pct : null;
  trackResets(ses, weekly.find(b=>b.kind==="weekly_all"));

  if(ses){
    const pace=elapsedPct(ses.resets,5);
    const c=col(ses.pct,pace);
    $("gFill").setAttribute("stroke-dashoffset",(100-ses.pct));
    $("gFill").setAttribute("stroke",c);
    $("sesVal").textContent=ses.pct+"%"; $("sesVal").style.color=c;
    $("sesReset").textContent=fmtReset(ses.resets);
    const ahead = pace!=null && ses.pct>pace+8;
    $("remQ").textContent = ahead ? t("ahead_clock") : t("on_track");
    $("remQ").classList.toggle("warn", ahead);   // píldora verde/ámbar del hero
    renderProjection(ses.pct,pace,ses.resets);
    maybeNotify(ses.pct,ses.resets);
  }

  $("weekStack").innerHTML = weekly.map((b)=>{
    const hero=b.kind==="weekly_all";
    const pace=elapsedPct(b.resets,168), c=col(b.pct,pace);
    // Nombre + % en UNA línea (% pegado a la derecha); debajo, cada dato en
    // su propia línea y TODOS alineados a la izquierda — antes el reset de
    // las filas mini se iba a la derecha y quedaba desalineado con el resto
    // (Oscar 2026-08-05).
    return `<div class="bar-row ${hero?'':'mini'}">
      <div class="brow-top"><span class="lbl">${escapeHtml(b.label)}</span>
        <span class="rst pctv">${b.pct}%</span></div>
      <div class="track"><div class="fill" style="width:${b.pct}%;background:${c}"></div>
        ${pace!=null?`<div class="pace" style="left:${pace}%"></div>`:""}</div>
      <div class="bmeta">
        ${hero?`<span class="rst">${pace!=null&&b.pct<=pace?t("pace_ok"):t("pace_watch")}</span>`:""}
        <span class="rst">${fmtReset(b.resets)}</span>
      </div>
    </div>`;
  }).join("") || `<div class="errbox">${t("no_buckets")}</div>`;

  const sesInfo = ses ? {pct:ses.pct, resets:ses.resets, pace:elapsedPct(ses.resets,5)} : null;
  updateTray(sesInfo, weeklyAllPct);
  // buckets semanales por modelo (todos menos el "hero"), para el globo
  const wkExtras = weekly.filter(b=>b!==wkAll)
    .map(b=>({label:b.label, pct:b.pct, resets:b.resets?fmtReset(b.resets):""}));
  emitPill(sesInfo, wkAll?{pct:wkAll.pct, resets:wkAll.resets}:null, wkExtras);
}

// ---------- notificaciones ----------
function toast(body){
  const notif=window.__TAURI__?.notification;
  if(!notif) return;
  Promise.resolve(notif.isPermissionGranted())
    .then(g=> g ? true : notif.requestPermission().then(p=>p==="granted"))
    .then(ok=>{ if(ok) notif.sendNotification({title:"MichiClaude", body}); })
    .catch(()=>{});
}

// Alarmas de sesión configurables (como alarmas del celular, pero en % usado).
function getAlarms(){
  try{ const a=JSON.parse(localStorage.getItem("alarms")||"[80,95]");
    return Array.isArray(a)?a.filter(x=>x>=1&&x<=100):[80,95]; }
  catch(e){ return [80,95]; }
}
function saveAlarms(a){ localStorage.setItem("alarms", JSON.stringify(a.sort((x,y)=>x-y))); }

// ¿Cambió la ventana (sesión/semana)? Con TOLERANCIA: el resets_at del
// endpoint trae pequeñas variaciones entre consultas; solo un salto grande
// significa ventana nueva (si no, las alarmas se re-dispararían cada ciclo).
function windowChanged(storeKey, curIso, tolMin){
  const prev=localStorage.getItem(storeKey);
  localStorage.setItem(storeKey, curIso);
  if(!prev) return false;
  return Math.abs(new Date(curIso)-new Date(prev)) > tolMin*60000;
}

// Alarma de umbral: al cruzar un % configurado arranca un recordatorio que se
// REPITE cada 5 min hasta que el usuario abra el panel ("enterado"). Después,
// silencio hasta el siguiente umbral o la siguiente ventana de sesión.
function maybeNotify(pct,resets){
  if(resets && windowChanged("alarmWin", resets, 10)){
    localStorage.setItem("alarmFired","[]");          // ventana nueva: rearmar todo
    localStorage.removeItem("ackPending:alarm");
    localStorage.removeItem("ackLastToast:alarm");
  }
  let fired=[]; try{ fired=JSON.parse(localStorage.getItem("alarmFired")||"[]"); }catch(e){}
  const alarms=[...getAlarms()].sort((a,b)=>b-a);     // el más alto primero
  for(const thr of alarms){
    if(pct>=thr){
      if(!fired.includes(thr)){
        // marca este umbral y los menores como disparados (sin ráfagas)
        fired=Array.from(new Set([...fired, ...alarms.filter(x=>x<=thr)]));
        localStorage.setItem("alarmFired", JSON.stringify(fired));
        localStorage.setItem("ackBody:alarm",
          thr>=95 ? t("notif_hi",Math.round(pct)) : t("notif_lo",Math.round(pct)));
        localStorage.setItem("ackSev:alarm", thr>=95 ? "danger" : "warn");
        localStorage.setItem("ackPending:alarm","1");
        localStorage.removeItem("ackLastToast:alarm"); // dispara ya, no en 5 min
        // al celular solo con su casilla propia: frente a la PC ya tienes el
        // globo; esto es para cuando no estás
        if(ntfyCfg&&ntfyCfg.alarms)
          ntfyPush(thr>=95?t("notif_hi",Math.round(pct)):t("notif_lo",Math.round(pct)),
                   thr>=95?4:3, null);
      }
      break;
    }
  }
}

// Límite alcanzado (100%) y restablecimiento, sesión y semanal.
function trackResets(ses, wk){
  if(ses && ses.resets){
    if(windowChanged("lastRes:session", ses.resets, 10)){
      if(localStorage.getItem("hit:session")==="1"){
        localStorage.setItem("ackPending:session","1");
        localStorage.removeItem("ackLastToast:session");
      }
      localStorage.removeItem("hit:session");
      localStorage.removeItem("notifS");
    }
    if(ses.pct>=100){
      localStorage.setItem("hit:session","1");
      // Globo de descanso: UNA vez por ventana y solo en modo gatito. Se
      // queda hasta que el usuario lo cierre, pero cerrarlo NO levanta al
      // gatito: la sesión sigue agotada hasta su reset.
      if(!localStorage.getItem("notifS")){
        localStorage.setItem("notifS","1");
        showBalloon(breakBody(ses.resets), "break");
        // al celular: mismo texto + promesa, y el "ya volvió" programado
        // que llega con la PC apagada (banderín notifS = un push por ventana)
        ntfyLimit(breakBody(ses.resets), ses.resets, "session");
      }
    }
  }
  if(wk && wk.resets){
    if(windowChanged("lastRes:week", wk.resets, 360)){
      if(localStorage.getItem("hit:week")==="1"){
        localStorage.setItem("ackPending:week","1");
        localStorage.removeItem("ackLastToast:week");
      }
      localStorage.removeItem("hit:week");
      localStorage.removeItem("notifW");
    }
    if(wk.pct>=100){
      localStorage.setItem("hit:week","1");
      if(!localStorage.getItem("notifW")){
        localStorage.setItem("notifW","1");
        // Un aviso, un canal: el globo SUSTITUYE al toast de Windows, con
        // gatito y con pastilla.
        showBalloon(weekBody(wk.resets), "zzz");
        // al celular: si el reset semanal no cabe en los 3 días de ntfy.sh,
        // ntfyLimit no programa nada y el inmediato ya dice el día
        ntfyLimit(weekBody(wk.resets), wk.resets, "week");
      }
    }
  }
}

// ---------- globo del gatito ----------
// UNA SOLA REGLA para los cuatro avisos: el globo se queda hasta que el
// usuario le dé ✕ o abra el panel, y no vuelve. Nada de temporizadores: un
// reloj no sabe si estabas frente a la pantalla.
// Lo que NO se toca al cerrarlo es el dibujo del gatito, que refleja siempre
// el estado REAL. Cerrar el globo de descanso no devuelve la cuota, así que
// el gato sigue de break hasta el reset de verdad; solo el de la alarma lo
// calma, porque ahí el estado ERA "hay un aviso sin ver".
// El `kind` viaja al globo y vuelve con la ✕ para saber qué dar por cerrado.
// Severidad, icono y segunda línea de cada aviso. La severidad es lo que
// permite entenderlo sin leerlo (acento = informativo, ámbar = ojo, rojo =
// crítico); solo la pinta el popover de la pastilla, el cómic del gatito la
// ignora. La línea secundaria solo se pone donde aporta: en la alarma de %,
// donde saber cuánto falta para el reset cambia lo que decides hacer.
function balloonMeta(kind){
  const ses=lastPill&&lastPill.session;
  if(kind==="alarm") return {sev:localStorage.getItem("ackSev:alarm")||"warn",
    icon:"bolt", sub:ses&&ses.resets?fmtReset(ses.resets):""};
  if(kind==="break")  return {sev:"danger", icon:"bolt", sub:""};
  if(kind==="zzz")    return {sev:"danger", icon:"week", sub:""};
  if(kind==="budget") return {sev:"warn",   icon:"warn", sub:""};
  // (el globo del día de hallazgos se ELIMINÓ el 2026-08-04 — su trabajo lo
  // hace el post-it/campana, que ahora enciende al cierre de cada sesión)
  return {sev:"ok", icon:"ok", sub:""};      // sesión/semana restablecidas
}
function showBalloon(body, kind){
  flog("globo "+kind+": "+String(body).slice(0,50));
  // Sin widget en pantalla no hay dónde colgar el globo: ahí sí toca el toast
  // de Windows, con su repetición cada 5 min (que es lo que lo salva de ser
  // efímero). Es el ÚNICO caso en que se sigue usando.
  if(!pillOn){
    const last=+localStorage.getItem("ackLastToast:"+kind)||0;
    if(Date.now()-last>5*60000){
      localStorage.setItem("ackLastToast:"+kind, String(Date.now()));
      if(body) toast(body);
    }
    return;
  }
  if(!ACK_KINDS.includes(kind))          // break/zzz: no esperan confirmación,
    localStorage.setItem("infoBalloon", JSON.stringify({body, kind}));  // pero sí sobreviven a un hover
  EVENT?.emit("notif:update",{body, kind, ...balloonMeta(kind)});
  invoke?.("set_notif_visible",{visible:true});
}
function infoBalloon(){
  try{ return JSON.parse(localStorage.getItem("infoBalloon")||"null"); }catch(e){ return null; }
}
// "Sin cuota de sesión. Vuelvo en 8 min." — el tiempo sale del resets_at real
function breakBody(resets){
  const ms=resets ? new Date(resets)-Date.now() : 0;
  const h=Math.max(0,Math.floor(ms/3.6e6)), m=Math.max(0,Math.floor(ms%3.6e6/6e4));
  return t("notif_break",h,m);
}
// "Semana agotada. Vuelvo el lunes." — el reset semanal suele caer a días
// vista, y "vuelvo en 52 h 10 min" no se lee. El día lo da el sistema en el
// idioma activo (nada que traducir); a menos de 24 h sí se dicen las horas.
function weekBody(resets){
  const ms=resets ? new Date(resets)-Date.now() : 0;
  if(ms>=24*3.6e6)
    return t("notif_zzz_day", new Date(resets).toLocaleDateString(lang,{weekday:"long"}));
  const h=Math.max(0,Math.floor(ms/3.6e6)), m=Math.max(0,Math.floor(ms%3.6e6/6e4));
  return t("notif_zzz_soon",h,m);
}

// Recordatorios pendientes (alarma de %, sesión restablecida, semana
// restablecida): SOLO notificaciones de Windows, repetidas cada 5 min hasta
// que el usuario abra el panel (eso cuenta como "enterado").
const ACK_KINDS=["alarm","session","week"];
function ackBody(k){
  if(k==="alarm") return localStorage.getItem("ackBody:alarm")||"";
  return t(k==="session"?"notif_reset_session":"notif_reset_week");
}
// El mismo aviso, más corto, para el globo del gatito: el toast tiene que
// explicar cómo dejar de recibirlo, el globo lleva su ✕ a la vista.
function balloonBody(k){
  if(k==="alarm") return localStorage.getItem("ackBody:alarm")||"";
  return t(k==="session"?"notif_back_session":"notif_back_week");
}
function processAcks(){
  if(simRunning) return;         // simulación en curso: no la pises
  for(const k of ACK_KINDS){
    if(localStorage.getItem("ackPending:"+k)!=="1") continue;
    // NINGÚN aviso va ya a Windows: todos salen como globo sobre el widget
    // —gatito o pastilla—, que solo cierra el usuario (✕ o abrir el panel).
    // El toast de Windows se iba a los segundos y quien no estuviera delante
    // no se enteraba; el globo espera. Como no se va solo, tampoco hace
    // falta repetirlo cada 5 min. Un globo a la vez: gana el primero de la
    // lista, que es el más urgente.
    showBalloon(balloonBody(k), k); return;
  }
}

// El globo se comunica por eventos. Pide lo pendiente al cargar y también
// cada vez que termina un hover (el hover lo oculta para dejar salir el globo
// de información, y tiene que volver: pasar el mouse no es haberlo leído).
EVENT?.listen("notif:ready",()=>{
  if(simRunning){ if(simB) simBalloon(simB); return; }
  for(const k of ACK_KINDS)
    if(localStorage.getItem("ackPending:"+k)==="1"){ showBalloon(balloonBody(k), k); return; }
  const info=infoBalloon();
  if(info) showBalloon(info.body, info.kind);
});
// La ✕ cierra el globo y da por visto SU aviso, sea del tipo que sea.
EVENT?.listen("notif:ack",(e)=>{
  const kind=e?.payload?.kind||"alarm";
  invoke?.("set_notif_visible",{visible:false});
  // Globo simulado: cerrarlo no confirma nada real, pero sí debe QUEDARSE
  // cerrado. Sin borrar simB, el `notif:ready` que emite el gatito al salir
  // el mouse lo volvía a levantar y no había forma de quitárselo de encima.
  if(simRunning){ simB=null; return; }
  if(ACK_KINDS.includes(kind)){
    localStorage.removeItem("ackPending:"+kind);
    localStorage.removeItem("ackLastToast:"+kind);
  }else{
    localStorage.removeItem("infoBalloon");
  }
  // Recalcula el gatito: la alarma confirmada lo calma, pero break y zzz
  // siguen igual — el dibujo va con el estado real, no con si leíste el aviso.
  if(lastPill){
    lastPill.mascot=mascotState(lastPill.session, lastPill.weekly?lastPill.weekly.pct:null);
    EVENT.emit("quota:update", lastPill);
  }
});

// proyección simple: burn rate de la sesión vs tiempo restante
let lastSes=null, lastTs=null;
function renderProjection(pct,pace,resets){
  $("projSect").hidden=false;
  const now=Date.now();
  let txt, calm=true, rate="";
  if(lastSes!=null && pct>lastSes && now>lastTs){
    const perMin=(pct-lastSes)/((now-lastTs)/6e4);      // %/min
    const minsLeft=resets?(new Date(resets)-now)/6e4:null;
    const minsTo100=perMin>0?(100-pct)/perMin:Infinity;
    rate=t("burn", perMin.toFixed(2));
    if(minsLeft!=null && minsTo100<minsLeft){
      calm=false;
      txt=t("proj_hit", fmtDur(minsTo100), fmtDur(minsLeft));
    }else{
      txt=t("proj_ok_rate");
    }
  }else{
    txt = pace!=null && pct>pace+8 ? t("proj_ahead") : t("proj_behind");
    calm = !(pace!=null && pct>pace+8);
  }
  lastSes=pct; lastTs=now;
  $("proj").classList.toggle("calm",calm);
  $("projTxt").innerHTML=txt; $("rateTxt").textContent=rate;
}
function fmtDur(m){m=Math.round(m);const h=Math.floor(m/60);return h?`${h} h ${m%60} min`:`${m} min`;}

// Fecha corta legible: "21/Jul/26" (mes abreviado en el idioma activo)
function fmtDate(iso, withYear=true){
  const d=new Date(iso+"T00:00:00");
  let mon=d.toLocaleDateString(lang,{month:"short"}).replace(".","");
  mon=mon.charAt(0).toUpperCase()+mon.slice(1);
  const dd=String(d.getDate()).padStart(2,"0");
  return withYear ? `${dd}/${mon}/${String(d.getFullYear()).slice(2)}` : `${dd}/${mon}`;
}

// ---------- detalle local ----------
// Separa "nombre · origen" que arma el backend (local no lleva sufijo).
function splitSrc(name){
  const i=name.lastIndexOf(" · ");
  return i>0?{base:name.slice(0,i),src:name.slice(i+3)}:{base:name,src:t("src_local")};
}
// Tooltip con el desglose por modelo del proyecto ("Fable: $75.65 · Opus 4.8: $0.15")
function modelTip(p){
  const e=Object.entries(p.by_model||{}).sort((a,b)=>b[1]-a[1]);
  return e.length?e.map(([m,c])=>`${prettyModel(m)}: $${c.toFixed(2)}`).join(" · "):"";
}

// ¿está desplegada la cola de proyectos? Vive fuera de renderLocal para
// sobrevivir a los refrescos automáticos: si no, se plegaría sola cada ciclo.
let projOpen=false;
const PROJ_TOP=4;

// Iniciales para el avatar de la fila (rediseño v5): primera letra de la
// primera palabra + primera de la última ("claude-code-meter" -> CM,
// "MichiClaude" -> MC). Con una sola palabra, sus dos primeras letras.
// Sirve para cualquier alfabeto: si no hay letras latinas devuelve los dos
// primeros caracteres tal cual, que es lo mejor que se puede hacer.
function projInitials(name){
  const parts=String(name).replace(/([a-z\d])([A-Z])/g,"$1 $2")
    .split(/[\s._\-/\\]+/).filter(Boolean);
  if(!parts.length) return "··";
  if(parts.length===1) return parts[0].slice(0,2);
  return parts[0][0]+parts[parts.length-1][0];
}

function renderLocal(s){
  lastLocalData=s;
  const every=s.projects.map(p=>({...p, ...splitSrc(p.name)}));
  // FILTRO DE PROYECTOS (2026-08-05): conjunto vacío = todos. Con filtro se
  // enseñan TODOS los elegidos aunque vinieran de la cola plegada, y el
  // total de arriba pasa a ser la suma de SOLO esos — por eso lleva su
  // propia etiqueta ("2 de 8 proyectos"): una cifra sin decir de qué es
  // sería justo lo que prohíbe el invariante #8.
  const filt=projFilter.size>0;
  const all=filt?every.filter(p=>projFilter.has(p.name)):every;
  const rest=filt?[]:every.slice(PROJ_TOP);
  const projs=(filt||projOpen)?all:all.slice(0,PROJ_TOP);
  const max=Math.max(...all.map(p=>p.cost),0.01);
  renderFchips(every);

  let rows = projs.map((p,i)=>{
    const c=PALETTE[i%PALETTE.length];
    return `<div class="pitem" title="${escapeHtml(modelTip(p))}">
      <div class="pav" style="color:${c}"><i style="background:${c}"></i>${escapeHtml(projInitials(p.base))}</div>
      <div class="ptx">
        <div class="pname"><span>${escapeHtml(p.base)}</span>${p.src?`<span class="srctag">${escapeHtml(p.src)}</span>`:""}</div>
        <div class="pbar"><i style="width:${Math.round(p.cost/max*100)}%;background:${c}"></i></div>
      </div>
      <div class="pcost">$${p.cost.toFixed(2)}</div>
    </div>`;}).join("");
  // La cola se resume en una fila que se despliega al hacer clic: saber que
  // hay $39 repartidos no sirve de nada si no puedes ver en qué.
  if(rest.length) rows += `
    <div class="pitem more" id="plistMore">
      <div class="ptx"><div class="pname"><span>${escapeHtml(projOpen?t("others_less"):t("others",rest.length))}</span></div></div>
      <div class="pcost">${projOpen?"":"$"+rest.reduce((a,p)=>a+p.cost,0).toFixed(2)}</div>
    </div>`;
  if(!rows) rows = `<div class="errbox" style="color:var(--txt-dim)">${t("no_activity")}</div>`;

  // Aquí vivía una fila "claude.ai / otros" con el % semanal. Se quitó el
  // 2026-07-28: su etiqueta prometía un desglose de claude.ai y el número era
  // el consumo TOTAL de la semana, el mismo que ya sale en el medidor de
  // arriba. No se puede calcular lo que prometía —el gasto local está en
  // dólares y la cuota en porcentaje, y el endpoint nunca dice cuánto vale el
  // tope en dinero—, así que en su lugar va una nota que sí es cierta.
  $("plist").innerHTML = rows;
  const more=$("plistMore");
  if(more) more.addEventListener("click",()=>{ projOpen=!projOpen; renderLocal(s); });

  // Todos los modelos usados, por pequeño que sea su %, con su color fijo.
  const models=Object.entries(s.models).map(([m,a])=>({m,t:a.input+a.output+a.cache_write,est:!!a.estimated}))
    .filter(x=>x.t>0)                       // fuera modelos sin trabajo real
    .sort((a,b)=>b.t-a.t);
  const tot=models.reduce((a,x)=>a+x.t,0);
  if(tot>0){
    $("modelSect").hidden=false;
    $("split").innerHTML=models.map((x,i)=>`<i style="width:${(x.t/tot*100).toFixed(1)}%;background:${PALETTE[i%PALETTE.length]}" title="${escapeHtml(prettyModel(x.m))} ${(x.t/tot*100).toFixed(1)}%"></i>`).join("");
    $("legend").innerHTML=models.map((x,i)=>{
      const pct=x.t/tot*100;
      // "~" = el modelo no está en ninguna tabla de precios: su coste sale de
      // la tarifa por defecto, así que se avisa en vez de darlo por firme.
      const est=x.est?` <span title="${escapeHtml(t("est_tip"))}" style="cursor:help">~</span>`:"";
      return `<span><b style="background:${PALETTE[i%PALETTE.length]}"></b><em>${escapeHtml(prettyModel(x.m))}</em> ${pct<1?"<1":Math.round(pct)}%${est}</span>`;
    }).join("");
    $("modelQ").textContent=t("model_leads", prettyModel(models[0].m));
  }
  // con filtro de proyectos el total es la suma de los ELEGIDOS, no el de
  // la ventana entera: enseñar el total completo junto a una lista
  // recortada sería mentir por omisión
  $("costWeek").textContent="$"+(filt
    ? all.reduce((a,p)=>a+p.cost,0) : s.cost_week).toFixed(2);
  // La etiqueta NO repite el periodo ni los proyectos: el botón de fechas
  // y los chips, justo encima, ya lo dicen (Oscar 2026-08-05). Solo avisa
  // cuando la cifra está recortada por el filtro — ahí callarlo sí sería
  // enseñar un total que no es el del periodo (invariante #8).
  $("winLbl").textContent = filt
    ? `${t("total_lbl")} · ${t("pf_of", all.length, every.length)}`
    : t("total_lbl");
  // el backend avisa cuando dejó fuera resúmenes del hub por haber pedido
  // un rango: sus fotos son de ventanas que terminan hoy y no se recortan
  $("hubNote").hidden=!s.hub_skipped;

  renderTrend(s.daily||[]);
  checkBudget(s.daily||[]);
}

// ---------- tendencia diaria (30 días, una sola serie, un solo tono) ----------
function renderTrend(daily){
  if(!daily.length){ $("trendSect").hidden=true; return; }
  $("trendSect").hidden=false;
  const map=Object.fromEntries(daily.map(d=>[d.date,d.cost]));
  const days=[];
  for(let i=29;i>=0;i--){
    const d=new Date(Date.now()-i*864e5);
    const key=d.toISOString().slice(0,10);
    days.push({key, cost:map[key]||0});
  }
  const max=Math.max(...days.map(d=>d.cost),0.01);
  $("tchart").innerHTML=days.map((d,i)=>{
    const h=Math.max(3,Math.round(d.cost/max*66));
    // el día MÁS CARO se destaca (maqueta v5); si todo está a cero no hay
    // pico que señalar y ninguna barra se marca
    const cls=(i===days.length-1?"today":"")+(d.cost===0?" zero":"")
      +(d.cost>0&&d.cost===max?" top":"");
    return `<i class="${cls.trim()}" style="height:${h}px" title="${fmtDate(d.key)} · $${d.cost.toFixed(2)}"></i>`;
  }).join("");
  $("tFrom").textContent=fmtDate(days[0].key);
  $("tTo").textContent=fmtDate(days[days.length-1].key);
}

// ---------- presupuesto semanal (toast aunque el panel esté oculto) ----------
function checkBudget(daily){
  const budget=+(localStorage.getItem("budgetWeek")||0);
  if(!(budget>0)) return;
  // gasto de los últimos 7 días desde la serie diaria (independiente del
  // periodo seleccionado en "gasto por proyecto")
  const cut=new Date(Date.now()-7*864e5).toISOString().slice(0,10);
  const spent=daily.filter(d=>d.date>=cut).reduce((a,d)=>a+d.cost,0);
  if(spent<=budget) return;
  const week=Math.floor(Date.now()/(7*864e5));       // anti-spam: 1 aviso/semana/valor
  const key=`notifBudget:${budget}:${week}`;
  if(localStorage.getItem(key)) return;
  localStorage.setItem(key,"1");
  showBalloon(t("notif_budget", spent.toFixed(2), budget), "budget");
}

// ---------- ciclo de refresco (auto-programado, con backoff ante fallos) ----------
// El endpoint de cuota tiene rate-limit estricto: cadencia normal de 3 min.
const REFRESH_MS=180000, STALE_MS=15*60000;
let lastSync=Date.now(), fails=0, rateLimited=false, rateWaitMs=REFRESH_MS,
    hadQuota=false, refreshTimer=null, lastErrCode=null;

function onQuotaFail(reason){
  lastErrCode=String(reason);
  $("liveDot").classList.add("err"); $("syncTxt").textContent=errText(reason); fails++;
  rateLimited=lastErrCode.startsWith("ERR_RATE_LIMITED");
  // respeta el Retry-After del servidor, con piso de 3 min
  rateWaitMs=Math.max(REFRESH_MS, (+lastErrCode.split(":")[1]||3)*60000);
  // el gauge, el icono y el widget CONSERVAN el último dato bueno reciente;
  // solo pasan a gris si nunca hubo dato o si el último tiene más de 15 min.
  if(!hadQuota || Date.now()-lastSync>STALE_MS){
    updateTray(null,null);
    // el globo del widget enseña el MOTIVO y qué hacer (petición de Oscar
    // 2026-07-31: "Session —" a secas no dice si es normal o hay que actuar)
    EVENT?.emit("quota:update",{ok:false, reason:errText(reason)});
  }
}

// periodo del gasto por proyecto (1/7/30 días), persistido
let curDays=+(localStorage.getItem("days")||7);
if(![1,7,15,30].includes(curDays)) curDays=7;

// ---------- filtro de FECHAS: presets + rango (Oscar 2026-08-05) ----------
// El backend NO habla de fechas: entiende "ancho en días" + "final". Un rango
// [A,B] se traduce a days=(B-A)+1 y end=fin del día B, así que los presets
// (Hoy/7/15/30) y el rango libre son la MISMA consulta con distintos números.
// Tope 90 días, que es el clamp del escáner.
const CAL_MAX_DAYS=90;
let curRange=null;      // {from:"YYYY-MM-DD", to:"YYYY-MM-DD"} o null (= preset)
try{ const r=JSON.parse(localStorage.getItem("spendRange")||"null");
  if(r&&r.from&&r.to) curRange=r; }catch(_){}
let calTarget="spend";  // "spend" (gasto) o "fnd" (hallazgos): el popover
                        // es uno solo y sirve a las dos pestañas
let calView=null;       // primer día del mes visible
let calA=null, calB=null;   // extremos en edición (Date)
let calPreset=null;     // preset activo dentro del popover
let calSnap=null;       // foto para revertir con Cancelar

const d0=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const fromYmd=s2=>{const[y,m,d]=s2.split("-").map(Number);return new Date(y,m-1,d);};
const fmtCalDay=x=>{
  const d = typeof x==="string" ? fromYmd(x) : x;
  return d ? d.toLocaleDateString(lang,{day:"2-digit",month:"short"}) : "—";
};
function rangeDays(r){ return Math.round((fromYmd(r.to)-fromYmd(r.from))/864e5)+1; }
// epoch del ÚLTIMO instante del día final: el backend corta con "ts <= end",
// así que sin esto se perdería el día elegido como fin
function rangeEnd(r){ const d=fromYmd(r.to); d.setHours(23,59,59,999); return Math.floor(d.getTime()/1000); }
// lo que se manda al backend
function statsArgs(){
  return curRange ? {days:rangeDays(curRange), end:rangeEnd(curRange)}
                  : {days:curDays};
}
// etiqueta corta para el disparador y para el total
function periodLabel(){
  if(!curRange) return curDays===1 ? t("cal_today") : curDays+" d";
  if(curRange.from===curRange.to) return fmtCalDay(curRange.from);
  return `${fmtCalDay(curRange.from)} – ${fmtCalDay(curRange.to)}`;
}
function calHint(msg,warn){
  const h=$("calHint"); h.textContent=msg; h.classList.toggle("warn",!!warn);
}
function renderCal(){
  const today=d0(new Date());
  if(!calView) calView=new Date(today.getFullYear(),today.getMonth(),1);
  $("calTitle").textContent=calView.toLocaleDateString(lang,{month:"long",year:"numeric"});
  $("calPresets").querySelectorAll(".preset").forEach(p=>
    p.classList.toggle("on", calPreset!=null && +p.dataset.d===calPreset));
  $("calFrom").textContent=calA?fmtCalDay(calA):"—";
  $("calFrom").classList.toggle("empty",!calA);
  $("calTo").textContent=calB?fmtCalDay(calB):"—";
  $("calTo").classList.toggle("empty",!calB);
  $("calApply").disabled=!(calA&&calB);
  // primer día de la semana: lunes salvo en los idiomas que empiezan en
  // domingo. Los nombres salen de Intl, así que no hay que traducirlos.
  const wkStart=["en","ja","ko","zh"].includes(lang)?0:1;
  const dowFmt=new Intl.DateTimeFormat(lang,{weekday:"narrow"});
  let html="";
  for(let i=0;i<7;i++){
    const d=new Date(2024,0,7+((wkStart+i)%7));    // 7/1/2024 fue domingo
    html+=`<span class="dow">${escapeHtml(dowFmt.format(d))}</span>`;
  }
  const first=new Date(calView.getFullYear(),calView.getMonth(),1);
  const start=(first.getDay()-wkStart+7)%7;
  const daysIn=new Date(calView.getFullYear(),calView.getMonth()+1,0).getDate();
  const prevDays=new Date(calView.getFullYear(),calView.getMonth(),0).getDate();
  const minDay=new Date(today); minDay.setDate(minDay.getDate()-(CAL_MAX_DAYS-1));
  // 42 celdas: el mes siempre ocupa lo mismo y la ventana no da saltos
  for(let i=0;i<42;i++){
    let n,dt,out=false;
    if(i<start){ n=prevDays-start+1+i; dt=new Date(calView.getFullYear(),calView.getMonth()-1,n); out=true; }
    else if(i<start+daysIn){ n=i-start+1; dt=new Date(calView.getFullYear(),calView.getMonth(),n); }
    else{ n=i-start-daysIn+1; dt=new Date(calView.getFullYear(),calView.getMonth()+1,n); out=true; }
    const tt=dt.getTime();
    const off = tt>today.getTime() || tt<minDay.getTime();   // futuro o sin historial
    const cls=["day",out?"out":"",tt===today.getTime()?"today":""];
    if(calA&&calB){
      const a=d0(calA).getTime(), z=d0(calB).getTime();
      if(tt>a&&tt<z) cls.push("in-range");
      if(tt===a) cls.push("r-start");
      if(tt===z) cls.push("r-end");
    }else if(calA&&d0(calA).getTime()===tt) cls.push("r-start","r-end");
    html+=`<button class="${cls.filter(Boolean).join(" ")}" data-t="${tt}"${off?" disabled":""}>${n}</button>`;
  }
  $("calGrid").innerHTML=html;
  $("calGrid").querySelectorAll("button[data-t]").forEach(b2=>
    b2.addEventListener("click",()=>calPick(new Date(+b2.dataset.t))));
}
// primer toque = inicio, segundo = fin (si va al revés, se ordena solo)
function calPick(dt){
  calPreset=null;
  if(!calA||(calA&&calB)){ calA=d0(dt); calB=null; calHint(t("cal_pick_end")); }
  else{
    calB=d0(dt);
    if(calB<calA){ const x=calA; calA=calB; calB=x; }
    const n=Math.round((calB-calA)/864e5)+1;
    if(n>CAL_MAX_DAYS){ calB=null; calHint(t("cal_max"),true); }
    else calHint(t("cal_ready"));
  }
  renderCal();
}
function calSetPreset(n){
  calPreset=n;
  calB=d0(new Date());
  calA=new Date(calB); calA.setDate(calA.getDate()-(n-1));
  calView=new Date(calB.getFullYear(),calB.getMonth(),1);
  calHint(t("cal_ready"));
  renderCal();
}
function openCal(target){
  calTarget=target||"spend";
  calSnap={a:calA,b:calB,p:calPreset,v:calView};
  // el popover abre reflejando lo que se está viendo ahora mismo
  const R=calTarget==="fnd"?fndRange:curRange, D=calTarget==="fnd"?fndDays:curDays;
  if(R){ calA=fromYmd(R.from); calB=fromYmd(R.to); calPreset=null; }
  else calSetPreset(D);
  calView=new Date((calB||new Date()).getFullYear(),(calB||new Date()).getMonth(),1);
  calHint(curRange||curDays?t("cal_ready"):t("cal_pick_start"));
  showPop("calPop");
  renderCal();
}
function closeCal(revert){
  if(revert&&calSnap){ calA=calSnap.a; calB=calSnap.b; calPreset=calSnap.p; calView=calSnap.v; }
  hidePop("calPop");
}
function applyCal(){
  if(!(calA&&calB)) return;
  const preset=calPreset, rng={from:ymd(calA),to:ymd(calB)};
  if(calTarget==="fnd"){
    if(preset){ fndDays=preset; fndRange=null;
      localStorage.setItem("fndDays",String(fndDays));
      localStorage.removeItem("fndRange");
    }else{ fndRange=rng; localStorage.setItem("fndRange",JSON.stringify(rng)); }
    hidePop("calPop"); markFndPeriod(); loadFindings(true);
    return;
  }
  if(preset){                       // preset = ventana que termina hoy
    curDays=preset; curRange=null;
    localStorage.setItem("days",curDays);
    localStorage.removeItem("spendRange");
  }else{
    curRange=rng;
    localStorage.setItem("spendRange",JSON.stringify(curRange));
  }
  hidePop("calPop"); markDays(); spendBusy(); refresh();
}
// Borrar = volver al valor por DEFECTO (hoy) y cerrar (Oscar 2026-08-05):
// dejar el calendario vacío obligaba a elegir algo para poder salir, y si
// cerrabas se quedaba el periodo anterior — justo lo que querías borrar.
function clearCal(){
  calPreset=1; calA=calB=d0(new Date());
  if(calTarget==="fnd"){
    fndDays=1; fndRange=null;
    localStorage.setItem("fndDays","1");
    localStorage.removeItem("fndRange");
    hidePop("calPop"); markFndPeriod(); loadFindings(true);
    return;
  }
  curDays=1; curRange=null;
  localStorage.setItem("days","1");
  localStorage.removeItem("spendRange");
  hidePop("calPop"); markDays(); spendBusy(); refresh();
}
// ---------- filtro de PROYECTOS (misma familia que el de fechas) ----------
// Vive SOLO en el frontend: la lista ya viene agregada del backend, así que
// filtrar es quedarse con unos cuantos y volver a sumar. Conjunto vacío =

let projFilter=new Set();

// chips del filtro activo: uno por proyecto elegido + "quitar filtros"
function renderFchips(every){
  const box=$("fchips");
  if(!projFilter.size){ box.hidden=true; box.innerHTML=""; return; }
  const byKey=new Map(every.map(p=>[p.name,p]));
  box.hidden=false;
  box.innerHTML=[...projFilter].map(k=>{
    const p=byKey.get(k);
    return `<span class="fchip"><em>${escapeHtml(p?p.base:k)}</em><s data-k="${escapeHtml(k)}">✕</s></span>`;
  }).join("")+`<span class="fchip clear" id="fchipClear">${t("pf_clear")} ✕</span>`;
  box.querySelectorAll("s[data-k]").forEach(x=>x.addEventListener("click",()=>{
    projFilter.delete(x.dataset.k); saveProjFilter(); markDays();
    if(lastLocalData) renderLocal(lastLocalData);
  }));
  const c=$("fchipClear");
  if(c) c.addEventListener("click",()=>{
    projFilter.clear(); saveProjFilter(); markDays();
    if(lastLocalData) renderLocal(lastLocalData);
  });
}

async function refresh(){
  if(!invoke){ demo(); return; }
  try{
    const [quota, local] = await Promise.allSettled([invoke("get_quota"), invoke("get_local_stats",statsArgs())]);
    if(quota.status==="fulfilled"){
      renderQuota(quota.value); $("liveDot").classList.remove("err");
      lastSync=Date.now(); fails=0; rateLimited=false; hadQuota=true; lastErrCode=null;
    }else{
      onQuotaFail(quota.reason);
    }
    if(local.status==="fulfilled") renderLocal(local.value);
    // Modo setup: sin token vigente Y sin ningún proyecto local = no hay
    // Claude Code en juego (usuario gratuito, o aún sin iniciar sesión, o
    // sin fuentes remotas). Mostramos la bienvenida en vez del gauge vacío.
    // Con datos locales (Claude Code sí, solo token vencido) NO se activa.
    const noToken = quota.status==="rejected" && String(quota.reason).startsWith("ERR_NO_TOKEN");
    const hasLocal = local.status==="fulfilled" && local.value.projects && local.value.projects.length>0;
    document.body.classList.toggle("setup", noToken && !hasLocal);      // no hay Claude Code
    document.body.classList.toggle("tokenhint", noToken && hasLocal);   // token vencido
    if(noToken){ $("liveDot").classList.remove("err");
      $("syncTxt").textContent = t(hasLocal ? "setup_expired_title" : "setup_sub"); }
  }catch(e){ onQuotaFail(e); }
  finally{ processAcks(); scheduleNext(); }
}
function scheduleNext(){
  // 3 min en régimen normal; errores de red: backoff 5→10→20→40 s (máx 60 s);
  // 429: lo que pida el servidor, mínimo 3 min (reintentar rápido lo empeora).
  const delay = rateLimited ? rateWaitMs
    : fails>0 ? Math.min(60000, 5000*2**(fails-1)) : REFRESH_MS;
  clearTimeout(refreshTimer); refreshTimer=setTimeout(refresh, delay);
}
setInterval(()=>{ const b=document.body.classList;
  if(!$("liveDot").classList.contains("err") && !b.contains("setup") && !b.contains("tokenhint"))
    $("syncTxt").textContent=t("live_ago", Math.round((Date.now()-lastSync)/1000)); },1000);

function syncHubButtons(){
  const on = remotes.length > 0;
  $("hubSave").disabled = !on;
  $("hubLoad").disabled = !on;
  if(!on) $("hubMsg").textContent = t("hub_cfg_needs");
  else if($("hubMsg").textContent === t("hub_cfg_needs")) $("hubMsg").textContent = "";

const PENCIL='<svg class="pen" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L18.5 9.5a2.1 2.1 0 0 0-3-3L5 17v3z"/><path d="M13.5 6.5l4 4"/></svg>';
const TRASH='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M10 11v6M14 11v6"/></svg>';
function renderRemotes(){
  $("srvCount").textContent = t("srv_count", remotes.length);
  // los ajustes compartidos viven en Ajustes pero DEPENDEN de un servidor:
  // sin ninguno, se avisa ahí en vez de dejar que los botones fallen solos
  const ns=$("hubNoSrv"); if(ns) ns.hidden = remotes.length>0;
  $("remList").innerHTML = remotes.map((r,i)=>`
    <div class="srv-row">
      <span class="srv-ic"><i></i><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="3" width="20" height="7" rx="2"/><rect x="2" y="14" width="20" height="7" rx="2"/><path d="M6 6.5h.01M6 17.5h.01"/></svg></span>
      <div style="min-width:0">
        <div class="srv-name" data-i="${i}" title="${escapeHtml(t("rename_server"))}">${escapeHtml(r.name)}${PENCIL}</div>
        <div class="srv-meta" title="${escapeHtml(r.host)} · ${escapeHtml(r.command||"")}">${escapeHtml(r.host)} · ${escapeHtml(r.command||"")}</div>
      </div>
      <span class="spill wait" id="rstat-${i}"><i></i>…</span>
      <button class="del-btn" data-i="${i}" title="${escapeHtml(t("remove_server"))}">${TRASH}</button>
    </div>`).join("")
    || `<div class="errbox" style="color:var(--txt-dim)">${t("no_servers")}</div>`;
  // Renombrar sin tener que borrar y volver a agregar: equivocarse al
  // escribir el nombre es lo más fácil del mundo, y rehacer el alta por una
  // letra es desproporcionado. El nombre es también el sufijo que llevan los
  // proyectos de ese servidor, así que al cambiarlo se recarga el panel.
  document.querySelectorAll("#remList .srv-name").forEach(el=>{
    el.addEventListener("click",()=>{
      const i=+el.dataset.i, before=remotes[i].name;
      const inp=document.createElement("input");
      inp.className="mono"; inp.value=before;
      inp.style.cssText="width:100%;font:inherit;font-size:12px;font-weight:650";
      el.replaceWith(inp); inp.focus(); inp.select();
      let done=false;
      const close=async(save)=>{
        if(done) return;                 // Enter dispara también el blur
        done=true;
        const v=inp.value.trim();
        if(save && v && v!==before){
          remotes[i].name=v;
          await invoke("save_remotes",{remotes});
          refresh();                     // los proyectos llevan ese sufijo
        }
        renderRemotes();
      };
      inp.addEventListener("keydown",e=>{
        if(e.key==="Enter") close(true);
        if(e.key==="Escape") close(false);
      });
      inp.addEventListener("blur",()=>close(true));
    });
  });
  document.querySelectorAll("#remList .del-btn").forEach(b=>{
    b.onclick=async()=>{
      // confirmación en dos pasos: el primer clic pregunta, el segundo
      // elimina; si no confirmas en 4 s, el botón vuelve a la normalidad
      if(!b.classList.contains("arm")){
        b.classList.add("arm"); b.textContent=t("confirm_delete");
        b._t=setTimeout(()=>{ b.classList.remove("arm"); b.innerHTML=TRASH; },4000);
        return;
      }
      clearTimeout(b._t);
      remotes.splice(+b.dataset.i,1);
      try{ await invoke("save_remotes",{remotes}); }catch(e){}
      renderRemotes(); refresh();
    };
  });
  // estado de conexión de cada servidor (pastilla: conectado / sin conexión)
  remotes.forEach((r,i)=>{
    invoke("test_remote",{host:r.host}).then(()=>{
      const el=$("rstat-"+i); if(el){ el.className="spill ok"; el.innerHTML="<i></i>"+escapeHtml(t("status_active")); }
    }).catch(()=>{
      const el=$("rstat-"+i); if(el){ el.className="spill bad"; el.innerHTML="<i></i>"+escapeHtml(t("status_fail")); }
    });
  });
}
// ---------- Consejos: el coach 100% estático ----------
// Catálogo de fichas curadas (docs/consejos-coach.md). El contenido vive en
// I18N como todo texto visible; aquí solo van los ids, en el orden en que
// se muestran. Acordeón + filtro del lado del cliente — cero red, cero IA.
const TIPS=["clear","compact","cache","attach","ask","model"];
function renderTips(){
  const q=($("tipFilter").value||"").toLowerCase();
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  // Tarjetas VIVAS del coach al estilo Hallazgos (Oscar 2026-08-03): salen
  // del almacén coachCards — cada una con su ✕, contraíbles (se recuerda),
  // y caducan solas a las 24 h. Ver la pestaña apaga el aviso pero NO las
  // despacha. En simulador se leen de coachHits: el sim no toca disco.
  const cards=simFnd?coachHits.map(h=>({h})):coachCardsStore();
  const sums=q?[]:cards.filter(c=>c.h.rule==="sum");
  // mini-auditoría del cierre: el costo medido de la sesión y, si algún
  // detector disparó sobre ELLA, la fuga con su hecho medido. El dinero y el
  // detalle viven AQUÍ — por ntfy solo viajó el conteo.
  // BLINDADO: un recibo con datos inesperados no puede dejar la pestaña en
  // blanco — las 6 fichas estáticas se pintan pase lo que pase.
  // Las VIVAS (recibos y fichas calientes) van en UNA sola corriente
  // ordenada por nacimiento, la más reciente ARRIBA (Oscar 2026-08-04:
  // "conforme vayan saliendo"); las fichas frías del catálogo, abajo.
  const live=[];
  for(const c of sums){
    try{
      const h=c.h;
      live.push({born:c.born||0, html:`<div class="fnd tip${c.min?"":" open"}" data-ck="${esc(h.rule+"|"+h.session)}">
      <button class="tip-x" aria-label="✕">✕</button>
      <div class="fnd-t">«${esc(h.title||h.project)}»</div>
      <div class="fnd-m">${t("tip_sum_t")} — ${esc(h.project)} · ${esc(h.origin||t("src_local"))}</div>
      <div class="fnd-f">${t("tip_sum_line",h.value,h.cmds,h.edits)}${
        h.cost>0.005?` · ~$${(+h.cost).toFixed(2)}`:""}</div>
      ${(h.leaks||[]).map(l=>`<div class="fnd-f">⚠ ${tipLeak(l)}</div>`).join("")}
    </div>`});
    }catch(_){/* un recibo malformado no tumba a los demás */}
  }
  // fichas disparadas por el motor de reglas: abiertas (salvo que el
  // usuario las haya contraído) y con su línea "Ahora: <dato medido>"
  const hot={}; cards.forEach(c=>{ if(c.h.rule!=="sum"&&!(c.h.rule in hot)) hot[c.h.rule]=c; });
  const ids=[...TIPS].filter(id=>!q ||
    (t("tip_"+id+"_t")+" "+t("tip_"+id+"_b")).toLowerCase().includes(q));
  const tipHtml=id=>{
    const c=hot[id], h=c&&c.h;
    // la ficha disparada dice A QUÉ sesión aplicar el consejo: proyecto +
    // "local" — el coach solo mira esta máquina, y con el VPS abierto al
    // lado la duda era real (Oscar, 2026-07-31)
    const donde=h?[h.project||"", h.origin||t("src_local")]
      .filter(Boolean).join(" · "):"";
    return `<div class="fnd tip${h&&!c.min?" open":""}" data-tip="${id}"${
        h?` data-ck="${esc(h.rule+"|"+h.session)}"`:""}>
      ${h?`<button class="tip-x" aria-label="✕">✕</button>`:""}
      <div class="fnd-t">${t("tip_"+id+"_t")}</div>
      ${h?`<div class="fnd-m">${t("tip_now_"+id,h.value)} — ${donde}</div>`:""}
      <div class="fnd-f">${withCmds(t("tip_"+id+"_b"))}</div>
    </div>`;};
  for(const id of ids){ if(id in hot) live.push({born:hot[id].born||0, html:tipHtml(id)}); }
  live.sort((a,b)=>b.born-a.born);
  $("tipList").innerHTML=(live.map(x=>x.html).join("") +
    ids.filter(id=>!(id in hot)).map(tipHtml).join(""))
    || `<div style="font-size:11.5px;margin-top:10px;color:var(--txt-dim)">${t("tips_none")}</div>`;
  // clic en la tarjeta = contraer/expandir; si es una tarjeta viva, la pose
  // se RECUERDA (min) para poder "leerla más tarde"
  $("tipList").querySelectorAll(".tip").forEach(el=>
    el.addEventListener("click",()=>{
      el.classList.toggle("open");
      const k=el.dataset.ck;
      if(k&&!simFnd){
        const a=coachCardsStore();
        const c=a.find(x=>x.h.rule+"|"+x.h.session===k);
        if(c){ c.min=!el.classList.contains("open"); saveCoachCards(a); }
      }
    }));
  // ✕ = despachar ESA tarjeta (el recibo se va; la ficha "Ahora" vuelve a
  // ser ficha normal del catálogo)
  $("tipList").querySelectorAll(".tip-x").forEach(x=>
    x.addEventListener("click",e=>{
      e.stopPropagation();
      const k=x.parentElement.dataset.ck;
      flog("tips: ✕ despacha "+k);
      if(simFnd) coachHits=coachHits.filter(h=>h.rule+"|"+h.session!==k);
      else saveCoachCards(coachCardsStore().filter(c=>c.h.rule+"|"+c.h.session!==k));
      renderTips(); renderTipsDot();
      if(lastPillArgs) emitPill(...lastPillArgs);
    }));
  // ver la pestaña APAGA el aviso (contador + post-it del widget) pero no
  // despacha nada: las tarjetas esperan su ✕ o sus 24 h — como Hallazgos.
  // document.hasFocus() OBLIGATORIO: el panel al cerrarse solo se OCULTA y
  // la pestaña sigue activa por dentro — sin el foco, el sondeo pintaba el
  // recibo recién nacido en una ventana invisible y lo marcaba visto sin
  // que nadie lo viera (el post-it nunca se encendía; Oscar 2026-08-02).
  if(!$("tab-tips").hidden && document.hasFocus() && !simFnd){
    const a=coachCardsStore();
    let ch=false;
    a.forEach(c=>{ if(!c.v){ c.v=true; ch=true; } });
    if(ch){
      saveCoachCards(a);
      flog("tips: vistas con foco ("+a.length+" tarjetas) — aviso apagado");
      renderTipsDot();
      if(lastPillArgs) emitPill(...lastPillArgs);
    }
  }
}

// ---------- faqMisses: la cola larga, sin telemetría (doc §9) ----------
// Una búsqueda de 4+ letras que no enciende NINGUNA ficha se apunta LOCAL
// (dedup, tope 50); la pestaña dice cuántas van este mes y el botón abre un
// issue de GitHub PRE-LLENADO que el usuario revisa y envía él mismo. Nada
// viaja solo — así se juntan, a la vista, las 20-30 preguntas de la
// compuerta del modelo-lector.
function tipMisses(){ try{ return JSON.parse(localStorage.getItem("faqMisses")||"[]"); }catch(_){ return []; } }
const tipMes=()=>new Date().toISOString().slice(0,7);
// El ofrecimiento de proponer aparece cuando la búsqueda EN CURSO no
// encuentra nada — el momento exacto en que al usuario le falta algo — y no
// como pie permanente (Oscar 2026-08-05). El registro de búsquedas fallidas
// del mes se mantiene: es lo que se manda en el issue, para que la propuesta
// lleve todo lo que buscaste y no solo lo último.
function renderTipFoot(){
  const q=($("tipFilter").value||"").trim();
  const ql=q.toLowerCase();
  const hay = !q || TIPS.some(id=>(t("tip_"+id+"_t")+" "+t("tip_"+id+"_b")).toLowerCase().includes(ql));
  $("tipFoot").hidden = hay;
  if(!hay) $("tipMissTxt").textContent=t("tips_miss", q);
}
let missT=null;
$("tipClear").addEventListener("click",()=>{
  $("tipFilter").value=""; $("tipClear").hidden=true;
  renderTips(); renderTipFoot(); $("tipFilter").focus();
});
$("tipFilter").addEventListener("input",()=>{
  $("tipClear").hidden = !$("tipFilter").value;
  renderTipFoot();
  clearTimeout(missT);

// ---------- motor de reglas de sesión activa (nivel 2 del doc) ----------
// El backend sondea la COLA de los logs vivos (lectura incremental) y
// devuelve hechos medidos; aquí vive el anti-spam: una vez por sesión por
// regla (tipSeen) y tope diario global (tipDay). Nada de esto va al globo:
// el globo es del umbral en dólares. Consejo = pestaña + punto en acento.
let coachHits=[];

// Tarjetas VIVAS del coach (recibos "sum" y mediciones "Ahora"), al estilo
// Hallazgos (pedido de Oscar 2026-08-03): sobreviven sondeos y reinicios,
// cada una lleva su ✕, contraerlas se recuerda (`min`), ver la pestaña solo
// apaga el aviso (`v`) sin despacharlas, y caducan SOLAS a las 24 h de
// nacer — no a medianoche: un recibo de las 11 pm debe llegar a la mañana.
const TIP_TTL=24*3600*1000;
function coachCardsStore(){
  let a=[]; try{ a=JSON.parse(localStorage.getItem("coachCards")||"[]"); }catch(_){}
  const now=Date.now();
  return a.filter(c=>c&&c.h&&(now-(c.born||0))<TIP_TTL);

// "Tu agente terminó": la sesión que estuvo trabajando lleva 5 min callada.
// Es el caso de dejar a Claude con una tarea larga e irse — por eso va al

// Dedup PROPIO además del de Rust: el estado del coach vive en memoria, así
// que al reiniciar la app una sesión recién callada volvería a reportarse.
// El nombre del proyecto solo viaja si el usuario activó la casilla: los
// canales de ntfy son públicos y la regla general es no mandar nombres.
// Texto de una fuga de la mini-auditoría: hecho medido, en el idioma activo.
// El remedio no se repite aquí — su ficha del catálogo está en la misma

function tipLeak(l){

  if(l.kind==="reread") return t("tip_leak_reread", escapeHtml(l.file), l.n);

function ntfyDone(list){
  if(!list.length||!ntfyOn()||!ntfyCfg.done) return;
  let sent=[]; try{ sent=JSON.parse(localStorage.getItem("ntfyDone")||"[]"); }catch(_){}
  let n=0;
  for(const h of list){
    if(sent.includes(h.session)) continue;
    sent.push(h.session);
    if(n++>=3) continue;               // varias a la vez: avisa, no ametralla
    const mins=h.value||1, turns=h.turns||0;
    // el sufijo de la mini-auditoría: SOLO el conteo — ni dólares, ni
    // archivos, ni qué regla disparó (los topics de ntfy son públicos);
    // el desglose espera en la tarjeta del panel
    const extra=(h.leaks&&h.leaks.length)?" · "+t("ntfy_done_save",h.leaks.length):"";
    const dnde=(h.project||"?")+(h.origin?" · "+h.origin:"");
    ntfyPush((ntfyCfg.names
      ? t("ntfy_done_body_p", dnde, mins, turns)
      : t("ntfy_done_body", mins, turns))+extra, 3, null);
  }
  localStorage.setItem("ntfyDone", JSON.stringify(sent.slice(-100)));
}
// "Claude está esperando tu aprobación": el atasco que la prueba de Oscar
// confundía con un final. Comparte la casilla de "sesión larga" (es el mismo
// caso de uso: dejar a Claude solo y llevarse el celular). Prioridad alta:
// a diferencia del "terminó", aquí cada minuto que pasa es tiempo perdido.
// Dedup por sesión+turno del atasco: el mismo atasco no se repite tras un
// reinicio, pero un atasco NUEVO de la misma sesión sí avisa.
function ntfyAsk(list){
  if(!list.length||!ntfyOn()||!ntfyCfg.done) return;
  let sent=[]; try{ sent=JSON.parse(localStorage.getItem("ntfyAsked")||"[]"); }catch(_){}
  for(const h of list){
    const k=h.session+"|"+(h.turns||0);
    if(sent.includes(k)) continue;
    sent.push(k);
    ntfyPush(ntfyCfg.names
      ? t("ntfy_ask_body_p", (h.project||"?")+(h.origin?" · "+h.origin:""), h.value||1)
      : t("ntfy_ask_body", h.value||1), 4, null);
  }
  localStorage.setItem("ntfyAsked", JSON.stringify(sent.slice(-100)));
}
async function coachPoll(){
  if(!invoke) return;
  if(simFnd) return;               // simulación en curso: no la pises
  try{
    const all=await invoke("get_coach")||[];
    // "tu agente terminó" y "te está esperando" NO son fichas: son avisos al
    // celular. Se apartan antes del filtro para que no gasten el tope diario
    // del coach ni aparezcan como consejo en el panel.
    const hits=all.filter(h=>h.rule!=="done"&&h.rule!=="ask");
    ntfyDone(all.filter(h=>h.rule==="done"));
    ntfyAsk(all.filter(h=>h.rule==="ask"));
    const seen=tipSeenSet();
    let day={}; try{ day=JSON.parse(localStorage.getItem("tipDay")||"{}"); }catch(_){ day={}; }
    const hoy=new Date().toISOString().slice(0,10);
    if(day.d!==hoy||!Array.isArray(day.keys)) day={d:hoy,keys:[]};
    const cards=coachCardsStore();
    let dirty=false, sumBorn=false;
    for(const h of hits){
      const k=h.rule+"|"+h.session;
      if(seen.has(k)) continue;         // una vez por sesión y regla
      if(!day.keys.includes(k)){
        // tope diario SUBIDO a 10 (2026-08-03: con varios proyectos, 5 se
        // quedaba corto). El RESUMEN sigue exento — es el recibo de la
        // sesión, una vez por sesión.
        if(h.rule!=="sum" && day.keys.length>=10) continue;
        day.keys.push(k);
      }
      seen.add(k);                      // se marca al ENTRAR, no al verse
      flog("coach: nace tarjeta "+k+(h.project?" ("+h.project+")":""));
      if(h.rule==="sum"){
        if(!cards.some(c=>c.h.rule==="sum"&&c.h.session===h.session)){
          cards.push({h, born:Date.now()}); dirty=true; sumBorn=true;
        }
      }else{
        // UNA tarjeta viva por regla: el "Ahora" es una foto del momento y
        // la medición más nueva reemplaza a la vieja (la ficha ya dice a
        // qué proyecto aplica)
        const i=cards.findIndex(c=>c.h.rule===h.rule);
        if(i>=0) cards.splice(i,1);
        cards.push({h, born:Date.now()}); dirty=true;
      }
    }
    localStorage.setItem("tipSeen",JSON.stringify([...seen].slice(-300)));
    localStorage.setItem("tipDay",JSON.stringify(day));
    if(dirty) saveCoachCards(cards);
    renderTipsDot();
    if(lastPillArgs) emitPill(...lastPillArgs);   // el widget lo ve al instante
    if(!$("tab-tips").hidden) renderTips();
    // sesión local terminada = el momento en que nacen hallazgos: pasada
    // ligera para encender la campana/post-it el MISMO día (Oscar
    // 2026-08-04; el freno de 15 min vive dentro de fndEventScan)
    if(sumBorn) fndEventScan();
  }catch(_){/* sin backend o sin logs: el siguiente ciclo reintenta */}
}

// ("hace 20 min") y a partir de ahí con su día, para no perder de vista cuál
// es de cuándo cuando hay varios. Los detectores de ESTADO PURO (mcp,
// skills, claudemd) no llevan `ts` y no enseñan nada — no describen un
// momento, sino una configuración.
function fmtWhen(ts){
  if(!ts) return "";
  const d=new Date(ts*1000), now=new Date();
  const min=Math.floor((now-d)/6e4);   // floor: 30 s son "ahora", no "1 min"
  if(min<1) return t("when_now");
  if(min<60) return t("when_min",min);
  const hoy=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const hora=d.toLocaleTimeString(lang,{hour:"2-digit",minute:"2-digit"});
  if(d>=hoy){
    const h=Math.round(min/60);
    return h<6 ? t("when_hour",h) : hora;
  }
  const ayer=new Date(hoy); ayer.setDate(ayer.getDate()-1);
  if(d>=ayer) return t("when_yday")+" "+hora;
  return d.toLocaleDateString(lang,{day:"2-digit",month:"short"})+" "+hora;

    :f.kind==="hooks_noise"?t("fnd_hooks_t",f.count)
    :f.kind==="claudemd"?t("fnd_claudemd_t",f.count)
    :f.kind==="claudemdsize"?t("fnd_claudemdsize_t",f.count)
    :t("fnd_mcp_t",f.server);
}
function fndIgnored(){ try{ return new Set(JSON.parse(localStorage.getItem("fndIgnore")||"[]")); }catch(_){ return new Set(); } }
// tarjetas contraídas a mano (clic, como las fichas de Consejos) — la pose
// se recuerda por hallazgo, igual que `min` en coachCards (Oscar 2026-08-04)
function fndMins(){ try{ return new Set(JSON.parse(localStorage.getItem("fndMin")||"[]")); }catch(_){ return new Set(); } }
function fmtTok(n){ return n>=1e6 ? (n/1e6).toFixed(1)+"M" : n>=1e3 ? Math.round(n/1e3)+"k" : String(n); }
// nombre legible del proyecto: la carpeta cruda viene tipo
// "-opt-projects-michiclaude" o "C--Users-oscar-mi-proyecto"
// Nombre de proyecto para enseñar. Desde 2026-08-01 el backend lo manda YA
// RESUELTO (del `cwd` de la sesión), así que aquí solo se limpia lo que
// venga codificado —un exportador viejo, o un log sin cwd—: la carpeta de
// logs es la ruta entera con los separadores cambiados por guiones
// ("-opt-projects-michiclaude", "C--Users-oscar-Claude-test-agente").
// Un nombre ya resuelto se devuelve TAL CUAL: recortarlo por el último
// guion partía los nombres compuestos ("test-agente" -> "agente").
function fndProj(raw){
  const s=String(raw);
  const m=s.match(/projects-(.+)$/);
  if(m) return m[1];
  if(!s.startsWith("-") && !s.includes("--")) return s;   // ya viene limpio
  return s.replace(/^-+/,"").split("-").pop() || s;
}
// ---------- aviso de hallazgos nuevos (contador + sticker del widget) ----------
// El panel es el ÚNICO que escanea: una pasada ligera de 1 día, como mucho una
// vez cada FND_SCAN_MS. Los widgets solo reciben {n, sev, tip} dentro de
// quota:update y pintan. "Visto" = la tarjeta llegó a pintarse en la pestaña;
// su clave se guarda y el aviso se apaga — mismo espíritu que el globo: se
// despacha una vez, no persigue. El resultado de la pasada se guarda
// (fndAuto) para que reiniciar la app no apague un aviso que nadie vio.
const FND_SCAN_MS=20*3600*1000;   // ~diaria, con margen para no ir derivando
let fndBadge=null;                // {n, sev} o null
function fndSeen(){ try{ return new Set(JSON.parse(localStorage.getItem("fndSeen")||"[]")); }catch(_){ return new Set(); } }
function fndBadgeOn(){ return localStorage.getItem("fndBadgeOff")!=="1"; }
function fndBadgeCalc(){
  let saved=[]; try{ saved=JSON.parse(localStorage.getItem("fndAuto")||"[]"); }catch(_){ saved=[]; }
  const seen=fndSeen(), ign=fndIgnored();
  const fresh=saved.filter(x=>!seen.has(x.k)&&!ign.has(x.k));
  // misma escala de severidad que las tarjetas: rojo duele, ámbar avisa
  const antes = fndBadge ? fndBadge.n : 0;
  fndBadge = fresh.length ? {n:fresh.length,
    sev: fresh.some(x=>x.c>=10)?"bad":fresh.some(x=>x.c>=1||x.mcp)?"warn":"acc"} : null;
  // Rastro del AVISO en la bitácora (Oscar 2026-08-05: "no sé si funciona
  // o si nunca se dan las condiciones"). Sin esto, el post-it y la campana
  // eran los únicos avisos sin dejar huella y no había forma de saber si
  // se encendieron mientras nadie miraba. Solo se anota el CAMBIO.
  const ahora = fndBadge ? fndBadge.n : 0;
  if(ahora!==antes){
    flog(ahora ? `fnd: AVISO ENCENDIDO (${ahora} sin ver, de ${saved.length})`
               : `fnd: aviso apagado (todo visto o ignorado)`);
  }else if(!ahora && saved.length){
    flog(`fnd: sin aviso — las ${saved.length} tarjetas ya estaban vistas`);
  }
  renderFndDot();
  if(lastPillArgs) emitPill(...lastPillArgs);   // el widget lo ve al instante
}
function renderFndDot(){
  const d=$("fndTabDot");
  d.hidden=!fndBadge;
  // rojo fijo, como el post-it y la campana (maqueta de Oscar): el rojo ES
  // la señal de "hay algo nuevo"; la severidad se ve en las tarjetas
  if(fndBadge) d.textContent=fndBadge.n>9?"9+":String(fndBadge.n);
}
// La pasada ligera es COMPARTIDA: la diaria (respaldo, cubre hallazgos que
// nacen sin cerrar sesiones locales — p. ej. del VPS) y la de CIERRE DE
// SESIÓN (2026-08-04, decisión de Oscar: los hallazgos avisan el mismo día
// por post-it/campana, como Consejos; el GLOBO del día se ELIMINÓ — era más
// intrusivo y su trabajo lo hace el indicador pasivo).
async function fndPass(tag){
  if(!invoke) return;
  if(simFnd) return;               // simulación en curso: no la pises
  try{
    const list=await invoke("get_findings",{days:1});
    flog("fnd: pasada "+tag+" ok, "+(list||[]).length+" tarjetas (1d)");
    localStorage.setItem("fndAutoLast",String(Date.now()));
    // se guarda lo justo para el badge entre reinicios
    localStorage.setItem("fndAuto",JSON.stringify(
      (list||[]).map(f=>({k:fndKey(f),c:f.cost,mcp:f.kind==="mcp_unused",
        kind:f.kind,n:f.count||f.turns,sv:f.server}))));
    fndBadgeCalc();
  }catch(_){/* sin datos o sin red: el siguiente tic reintenta */}
}

let ntfyCfg=null;

  ntfyUi();

// Fire-and-forget: un fallo de red JAMÁS bloquea nada local (queda en
// ntfy_debug.json). simRunning: el simulador nunca manda pushes de verdad.
function ntfyPush(body, priority, at){
  if(!ntfyOn()||simRunning||!invoke) return;
  invoke("ntfy_push",{title:"MichiClaude", body, priority:priority||3, at:at??null})
    .then(()=>flog("push ok"+(at?" (programado)":"")+": "+body.slice(0,60)))
    .catch(e=>flog("push ERROR "+e+": "+body.slice(0,40)));
}
// Límite al 100%: aviso INMEDIATO + el PROGRAMADO de "ya volvió", que ntfy
// retiene y entrega a la hora del reset AUNQUE la PC esté apagada — por eso
// el inmediato puede prometer "puedes apagar, yo te aviso". El programado
// solo si cabe en el límite de 3 días de ntfy.sh (el semanal puede no caber:
// entonces el inmediato ya dice el día y no se promete nada). +2 min de
// colchón por el jitter del resets_at.
function ntfyLimit(body, resets, kind){
  if(!ntfyOn()) return;
  const ms=resets ? new Date(resets)-Date.now() : 0;
  const fits=ms>6e4 && ms<(3*86400-3600)*1000;
  ntfyPush(body+(fits?" "+t("ntfy_promise"):""), 4, null);
  if(fits)
    ntfyPush(t(kind==="session"?"notif_back_session":"notif_back_week"), 3,
             Math.floor(new Date(resets).getTime()/1000)+120);
}

// El QR llega como matriz de módulos y se pinta aquí: sin PNG, sin librerías.
// Siempre negro sobre blanco, en los dos temas: un QR invertido no lo leen
// todas las cámaras.
function ntfyPaintQr(q){
  const cv=$("ntfyQr"), n=q.size, ctx=cv.getContext("2d");
  const px=Math.max(1, Math.floor(cv.width/(n+8)));   // 4 módulos de zona quieta
  const off=Math.floor((cv.width-px*n)/2);
  ctx.fillStyle="#ffffff"; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.fillStyle="#000000";
  for(let y=0;y<n;y++)for(let x=0;x<n;x++)
    if(q.cells[y*n+x]==="1") ctx.fillRect(off+x*px, off+y*px, px, px);
}
