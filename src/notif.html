<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MichiClaude — notif</title>
<style>
  /* Notificación cómic del gatito (modo mascota): sustituye al toast de
     Windows para las alarmas de % de sesión. NO desaparece sola: la cierra
     el usuario (✕) o abrir el panel. El PANEL decide cuándo mostrarla.
     La pose (arriba/abajo del gato) y la posición de la cola llegan del
     backend por el evento balloon:pose, igual que el globo de información. */
  :root{
    --font:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
    --mono:"Cascadia Code",ui-monospace,"Consolas",monospace;
    --ink:#111; --paper:#FDFCF9; --accent:#C15F3C;
  }
  /* Tema oscuro: el cómic se invierte —relleno oscuro, trazo y texto claros—
     en vez de quedarse en papel blanco, que era lo único del widget que no
     seguía al tema. Mismos tonos que el panel para que se lean como la misma
     app; el coral sube a #d97757 porque el #C15F3C se apaga sobre oscuro. */
  body.dark{--ink:#e9ebef; --paper:#20242c; --accent:#d97757}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:transparent;overflow:hidden}
  body{font-family:var(--font);color:var(--ink);user-select:none;-webkit-user-select:none;
    --tailx:188px}
  .box{position:absolute;left:0;right:0;top:0;bottom:32px;
    background:var(--paper);border:3px solid var(--ink);border-radius:16px;
    padding:11px 34px 10px 14px;display:flex;align-items:center;cursor:pointer}
  body.down .box{top:32px;bottom:0}
  .msg{font-size:12px;font-weight:700;line-height:1.35}
  .pico,.psub,.arrow{display:none}   /* solo existen en modo cápsula */
  .ptext{min-width:0}
  .x{position:absolute;right:6px;top:6px;width:20px;height:20px;border-radius:50%;
    border:2px solid var(--ink);background:var(--paper);color:var(--ink);
    font-size:11px;font-weight:800;line-height:1;display:grid;place-items:center;
    cursor:pointer;padding:0}
  .x:hover{background:var(--accent);color:var(--paper);border-color:var(--accent)}
  /* Con la PASTILLA el globo NO es un globo de cómic: es el popover de la
     maqueta de Oscar (2026-07-28) — esquina de 16, icono en pastilla de
     color, título + línea secundaria, ✕ redonda arriba a la derecha y una
     FLECHA pequeña (cuadrado girado 45°) en vez del pico grande del gatito.
     La severidad se ve sin leer: --sev tiñe borde, resplandor e icono
     (acento = informativo, ámbar = ojo, rojo = crítico).
     Fondo OPACO a propósito: con alfa, sobre una ventana transparente se lee
     el escritorio a través del aviso y no se entiende nada (2026-07-28).
     Nada de color-mix ni de heredar el fondo: cada valor va explícito, que
     esto tiene que pintarse igual en cualquier WebView2. */
  body.cap{--paper:#f7f9fb; --ink:#132029; --sub:#5c6773;
    --sev:#0b7c8c; --sevbg:rgba(11,124,140,.13);
    --xbg:rgba(15,27,38,.07); --xfg:#67727c}
  body.cap.dark{--paper:#171b22; --ink:#eef3f8; --sub:#98a3af;
    --sev:#56c7d6; --sevbg:rgba(86,199,214,.16);
    --xbg:rgba(255,255,255,.09); --xfg:#aab4be}
  body.cap.warn{--sev:#e6a417; --sevbg:rgba(230,164,23,.16)}
  body.cap.danger{--sev:#f05a41; --sevbg:rgba(240,90,65,.16)}
  body.cap .box{display:flex;align-items:flex-start;gap:11px;
    top:auto;bottom:14px;background:var(--paper);
    border:1px solid var(--sev);border-radius:16px;
    padding:13px 38px 13px 13px;
    box-shadow:0 0 16px -3px var(--sev), 0 8px 22px rgba(0,0,0,.35)}
  body.cap.down .box{top:14px;bottom:auto}
  body.cap .pico{display:flex;width:30px;height:30px;flex:0 0 auto;border-radius:9px;
    align-items:center;justify-content:center;color:var(--sev);background:var(--sevbg)}
  body.cap .pico svg{width:18px;height:18px}
  body.cap .ptext{flex:1 1 auto;min-width:0}
  body.cap .msg{display:block;font-size:12.5px;font-weight:600;line-height:1.35;
    color:var(--ink)}
  body.cap .psub{display:block;font-size:11px;margin-top:3px;color:var(--sub)}
  body.cap .psub:empty{display:none}
  /* la ✕ se queda arriba a la derecha, como en el cómic */
  body.cap .x{border:0;background:var(--xbg);color:var(--xfg);
    font-size:11px;font-weight:600;right:9px;top:9px}
  body.cap .x:hover{background:var(--sev);color:var(--paper)}
  /* flecha: cuadrado girado 45° con sus dos caras exteriores en el borde. El
     relleno es el MISMO opaco de la caja, para que la costura no se vea. */
  body.cap .tail-b,body.cap .tail-w{display:none}
  body.cap .arrow{display:block;position:absolute;width:14px;height:14px;
    left:calc(var(--tailx) - 7px);bottom:8px;transform:rotate(45deg);
    background:var(--paper);border-right:1px solid var(--sev);
    border-bottom:1px solid var(--sev)}
  body.cap.down .arrow{bottom:auto;top:8px;
    border:0;border-left:1px solid var(--sev);border-top:1px solid var(--sev)}
  /* cola: vértice en var(--tailx), hacia abajo por defecto; volteada en "down" */
  .tail-b{position:absolute;left:calc(var(--tailx) - 21px);bottom:0;width:0;height:0;
    border-style:solid;border-width:38px 12px 0 21px;
    border-color:var(--ink) transparent transparent transparent}
  .tail-w{position:absolute;left:calc(var(--tailx) - 17px);bottom:6px;width:0;height:0;
    border-style:solid;border-width:30px 8px 0 15px;
    border-color:var(--paper) transparent transparent transparent}
  body.down .tail-b{bottom:auto;top:0;border-width:0 12px 38px 21px;
    border-color:transparent transparent var(--ink) transparent}
  body.down .tail-w{bottom:auto;top:6px;border-width:0 8px 30px 15px;
    border-color:transparent transparent var(--paper) transparent}
</style>
</head>
<body>
<div class="box" id="box">
  <span class="pico" id="pico" hidden></span>
  <span class="ptext"><span class="msg" id="msg"></span><span class="psub" id="psub"></span></span>
  <button class="x" id="x">✕</button>
</div>
<div class="tail-b"></div><div class="tail-w"></div><div class="arrow" id="arrow"></div>

<script>
// El panel manda el texto (ya localizado) por evento; el ✕ avisa de vuelta
// y el panel confirma la alarma ("enterado") y oculta esta ventana.
const $=id=>document.getElementById(id);
const TAURI=window.__TAURI__;
const invoke=TAURI?.core?.invoke;
const EVENT=TAURI?.event;

// Qué aviso se está mostrando: la ✕ lo devuelve para que el panel sepa cuál
// dar por visto. El globo NUNCA se cierra solo — un reloj no sabe si el
// usuario estaba frente a la pantalla.
let kind="alarm";
// Iconos del popover (SVG aquí dentro; nada se descarga de fuera). El nombre
// lo manda el panel, así que el conjunto es cerrado — no entra HTML ajeno.
const SVG=(d)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
  stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const ICON={
  bolt: SVG(`<path d="M13 3v7h6l-8 11v-7H5l8-11z"/>`),
  week: SVG(`<rect x="4" y="5" width="16" height="16" rx="2"/><path d="M16 3v4M8 3v4M4 11h16"/>`),
  ok:   SVG(`<path d="M5 12.5 10 17.5 19 7"/><circle cx="12" cy="12" r="10"/>`),
  warn: SVG(`<path d="M12 9v4M12 17h.01M10.3 4.3 2.6 18a2 2 0 0 0 1.7 3h15.4a2 2 0 0 0 1.7-3L13.7 4.3a2 2 0 0 0-3.4 0z"/>`),
};
if(EVENT){
  EVENT.listen("notif:update", e=>{
    const p=e.payload||{};
    $("msg").textContent=p.body||"";
    $("psub").textContent=p.sub||"";
    kind=p.kind||"alarm";
    // severidad: tiñe borde, resplandor e icono. Se comunica sin leer.
    document.body.classList.remove("warn","danger");
    if(p.sev==="warn"||p.sev==="danger") document.body.classList.add(p.sev);
    const ic=ICON[p.icon]||ICON.bolt;
    $("pico").innerHTML=ic; $("pico").hidden=false;
  });
  // vestido según el widget: cómic con el gatito, cápsula con la pastilla
  EVENT.listen("quota:update", e=>{
    document.body.classList.toggle("cap", e.payload?.style!=="cat");
  });
  // el tema llega en el resumen que el panel emite para el widget; este globo
  // no lo usa para nada más, solo para pintarse claro u oscuro
  EVENT.listen("quota:update", e=>{
    const th=e.payload?.skinTheme||e.payload?.theme;
    if(th) document.body.classList.toggle("dark", th!=="light");
  });
  EVENT.listen("balloon:pose", e=>{
    const p=e.payload||{};
    document.body.classList.toggle("down", p.pose==="down");
    if(p.tailx!=null) document.body.style.setProperty("--tailx", p.tailx+"px");
  });
  EVENT.emit("notif:ready");   // por si la alarma quedó pendiente de antes
}else{
  $("msg").textContent="Sesión al 80% de tu límite de 5 h.";  // preview
}

$("x").addEventListener("click",e=>{ e.stopPropagation(); EVENT?.emit("notif:ack",{kind}); });
// clic en el globo abre el panel (enfocarlo también confirma la alarma)
$("box").addEventListener("click",()=>invoke?.("show_panel"));
window.addEventListener("contextmenu",e=>e.preventDefault());
</script>
</body>
</html>
