<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Claude Code Meter — widget</title>
<style>
  :root{
    --font:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
    --mono:"Cascadia Code",ui-monospace,"Consolas",monospace;
    --txt:#e9ebef; --txt-mut:#aab0ba; --txt-dim:#7b818c;
    --brand:#d97757;
    --track:rgba(255,255,255,.16);
    --ok:#40b869; --warn:#e6a417; --bad:#f05a41;
  }
  *{box-sizing:border-box}
  /* Fondo transparente: la franja se pinta SOBRE la barra de tareas (aspecto integrado). */
  html,body{margin:0;height:100%;background:transparent;overflow:hidden}
  body{font-family:var(--font);color:var(--txt);cursor:pointer;
    user-select:none;-webkit-user-select:none}

  .wrap{display:flex;align-items:center;gap:7px;height:100vh;padding:0 9px;
    border-radius:8px;transition:background .15s}
  .wrap:hover{background:rgba(255,255,255,.09)}   /* realce tipo botón de la barra */

  .mk{width:15px;height:15px;flex:0 0 auto;display:block}
  .ses{font-family:var(--mono);font-weight:700;font-size:13px;letter-spacing:.3px;
    white-space:nowrap}
  .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;background:var(--txt-dim)}

  .grp{display:flex;align-items:center;gap:4px;flex:0 0 auto}
  .grp .tag{font-size:9px;font-weight:700;color:var(--txt-dim)}
  .grp .track{position:relative;width:30px;height:5px;border-radius:3px;
    background:var(--track);overflow:hidden}
  .grp .fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:3px;
    background:var(--ok);transition:width .5s,background .3s}

  /* estados */
  body.loading .ses,body.stale .ses{color:var(--txt-dim)}
  body.loading .wrap{opacity:.75}
  body.stale .dot{background:var(--bad)}
</style>
</head>
<body class="loading" title="Claude Code Meter — clic: abrir panel · clic derecho: opciones">
<div class="wrap" id="wrap">
  <span class="mk" id="mk"></span>
  <span class="ses" id="ses">…</span>
  <span class="dot" id="dot"></span>
  <div class="grp"><span class="tag">S</span><div class="track"><div class="fill" id="sFill"></div></div></div>
  <div class="grp"><span class="tag">W</span><div class="track"><div class="fill" id="wFill"></div></div></div>
</div>

<script>
const $=id=>document.getElementById(id);

// marca (mini sunburst, igual que el panel)
(function(){
  const S=64,cx=32,cy=32,rays=11;let p=`<svg width="15" height="15" viewBox="0 0 ${S} ${S}">`;
  for(let i=0;i<rays;i++){const a=Math.PI*2*i/rays-Math.PI/2;
    const ux=Math.cos(a),uy=Math.sin(a),px=-uy,py=ux;
    const base=S*.04,tip=S*.46,mid=S*.26,hw=S*.055;
    const pts=[[cx+ux*base,cy+uy*base],[cx+ux*mid+px*hw,cy+uy*mid+py*hw],
      [cx+ux*tip,cy+uy*tip],[cx+ux*mid-px*hw,cy+uy*mid-py*hw]]
      .map(q=>q.map(n=>n.toFixed(2)).join(",")).join(" ");
    p+=`<polygon points="${pts}" fill="var(--brand)"/>`}
  $("mk").innerHTML=p+`<circle cx="${cx}" cy="${cy}" r="${S*.07}" fill="var(--brand)"/></svg>`;
})();

// mismo código de color que el panel (pct vs ritmo)
function col(p,pace){ if(p>=95) return "var(--bad)";
  if(pace!=null && p>pace+8) return p>85?"var(--bad)":"var(--warn)";
  if(p>=80) return "var(--warn)"; return "var(--ok)"; }

function setFill(el,pct,pace){
  if(pct==null){ el.style.width="0"; return; }
  el.style.width=Math.min(100,pct)+"%"; el.style.background=col(pct,pace);
}

// Renderiza desde el resumen que emite el panel (nunca llama al endpoint).
function render(d){
  document.body.classList.remove("loading");
  if(!d || d.ok===false){ // sin datos / error: no inventamos, marcamos "stale"
    document.body.classList.add("stale");
    $("ses").textContent="—"; $("dot").style.background="";
    setFill($("sFill"),null); setFill($("wFill"),null); return;
  }
  document.body.classList.remove("stale");
  const s=d.session, w=d.weekly;
  $("ses").textContent = s ? Math.round(s.pct)+"%" : "—";       // siempre entero
  $("dot").style.background = s ? col(s.pct, s.pace) : "var(--txt-dim)";
  setFill($("sFill"), s?s.pct:null, s?s.pace:null);
  setFill($("wFill"), w?w.pct:null, null);
}

const TAURI = window.__TAURI__;
if(TAURI?.event){
  TAURI.event.listen("quota:update", e=>render(e.payload));
  TAURI.event.emit("bar:ready");     // pide el último dato conocido al panel
  // por si el panel tarda: red de seguridad, seguimos en "cargando" hasta el 1er evento
}else{
  // Navegador suelto (sin Tauri): placeholder neutro para previsualizar el layout.
  render({ok:true, session:{pct:24,pace:30}, weekly:{pct:10}});
}

// clic izquierdo: abrir/enfocar el panel completo
$("wrap").addEventListener("click", ()=>{ TAURI?.core?.invoke("show_panel"); });
// clic derecho: menú nativo (Ocultar franja / Salir)
window.addEventListener("contextmenu", e=>{ e.preventDefault(); TAURI?.core?.invoke("open_bar_menu"); });
</script>
</body>
</html>
